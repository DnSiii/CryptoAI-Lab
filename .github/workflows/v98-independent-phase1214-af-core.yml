name: V98 Independent Phase1214 AF Long Only Growth Core
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1214_af_dual_ewma_core.py'
      - 'research/v98_independent/test_phase1214_af_dual_ewma_core.py'
      - '.github/workflows/v98-independent-phase1214-af-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  af-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Test independent long-only growth participation and future invariance
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1214_af_dual_ewma_core.py' -v
