name: V98 Independent AM Preregistered 90-Cell Historical Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-am-90cell-training.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [AM_core_only, AM_full, AM_minus_opportunity, AM_minus_RV, AM_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: AM causal-source, allocator and syntax gates
        working-directory: research/v98_independent
        run: |
          python -m py_compile am_rotation_sources.py am_growth_allocator.py am_90cell_training.py am_90cell_reconcile.py
          python am_rotation_sources.py
          python am_growth_allocator.py
      - name: Retrieve pinned vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_officiam_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute AM complete actual-open funded chronological path x18
        working-directory: research/v98_independent
        run: |
          python am_90cell_training.py \
            --path ${{ matrix.path }} \
            --output am90_${{ matrix.path }}.json || echo 'AM_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/am90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Check complete 18-cell receipt, without suppressing failed gates
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('am90_AM_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('AM_PATH_MECHANICAM',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: am90-ubuntu-*
          path: receipts
      - name: Independent two-OS numeric and 90-cell economic reconciliation
        run: python research/v98_independent/am_90cell_reconcile.py --root receipts --output am90_officiam_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am90-official-economic-summary
          path: am90_officiam_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
