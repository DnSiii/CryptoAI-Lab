name: V98 Independent MC Read-Only 30-Cell Economic Rejection Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mc-audit.yml'
      - 'research/v98_independent/mc_independent_receipt_arithmetic_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mc-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original immutable MC 30-cell receipt
        uses: actions/download-artifact@v4
        with:
          name: v98-mc-physical-40952206298
          run-id: 40952206298
          github-token: ${{ github.token }}
          path: mc-receipt
      - name: Independently reconcile 30 cells, marginal economics and rejection
        run: python research/v98_independent/mc_independent_receipt_arithmetic_audit.py --receipt mc-receipt/mc_30cell_training_receipt.json
