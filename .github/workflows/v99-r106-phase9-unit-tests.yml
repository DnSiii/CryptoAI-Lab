name: CryptoAI V99 R106 phase 9 side-aware unit tests
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - "tests/test_v99_r106_phase9_sideaware_hedge.py"
      - ".github/workflows/v99-r106-phase9-unit-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "." pytest
      - run: python -m pytest -q tests/test_v99_r106_phase9_sideaware_hedge.py
