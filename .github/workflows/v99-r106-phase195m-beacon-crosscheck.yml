name: V99 Phase195-M Beacon Payload Cross-Check (DATA_ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase195m_*.py'
      - 'research/tests/test_phase195m_*.py'
      - '.github/workflows/v99-r106-phase195m-beacon-crosscheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beacon:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Keccak backend and Ethereum libraries
        run: python -m pip install 'trie==3.1.0' 'rlp==4.1.0' 'eth-utils==5.3.1' 'pycryptodome==3.23.0'
      - name: Adversarial synthetic beacon payload controls
        run: python research/tests/test_phase195m_beacon_core.py
      - name: Fixed TRAIN beacon payload check
        run: |
          python research/tools/v99_phase195m_run.py | tee phase195m.json
          python -c "import json; x=json.load(open('phase195m.json')); assert x['decision'] in ('HOLD_BEACON_TRANSPORT_OR_MISMATCH','PROVISIONAL_BEACON_PAYLOAD_PARITY_UNANCHORED') and x['economic_trials']==0 and not x['promotion_authorized'] and not x['independent_consensus_anchor']"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v99-phase195m-beacon
          path: phase195m.json
          retention-days: 30
