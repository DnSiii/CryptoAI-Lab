name: V98 Independent Phase1126-1127 Y Complete Synthetic Survival
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1127-y-synthetic.yml'
      - 'research/v98_independent/phase1126_y_hourly_ledger.py'
      - 'research/v98_independent/test_phase1126_y_hourly_ledger.py'
      - 'research/v98_independent/phase1127_y_synthetic_integration.py'
      - 'research/v98_independent/test_phase1127_y_synthetic_integration.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  y-complete-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
      - name: Test Y ledger, causal accounting and deterministic integrated receipt
        run: python -m unittest -v test_phase1126_y_hourly_ledger.py test_phase1127_y_synthetic_integration.py
      - name: Execute preregistered three-seed five-path complete synthetic gate
        run: python phase1127_y_synthetic_integration.py
      - name: Preserve immutable first-failure synthetic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-phase1127-y-synthetic-receipt
          path: research/v98_independent/phase1127_y_synthetic_receipt.json
          if-no-files-found: warn
