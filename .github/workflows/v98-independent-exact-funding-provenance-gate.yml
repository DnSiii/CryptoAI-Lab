name: V98 Independent Exact Funding Provenance Contract Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/v98_exact_funding_full_history_ingest.py'
      - 'research/v98_independent/v98_exact_funding_full_history_capture_audit.py'
      - 'research/v98_independent/v98_exact_funding_full_history_capture.py'
      - '.github/workflows/v98-independent-exact-funding-provenance-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-funding-contract:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Verify source-only code compiles
        working-directory: research/v98_independent
        run: python -m py_compile v98_exact_funding_full_history_capture.py v98_exact_funding_full_history_capture_audit.py v98_exact_funding_full_history_ingest.py
      - name: Full-history official capture contract (synthetic only)
        working-directory: research/v98_independent
        run: python v98_exact_funding_full_history_capture.py --self-test
      - name: Independent raw HTTP page chain, headers and chronology (synthetic only)
        working-directory: research/v98_independent
        run: python v98_exact_funding_full_history_capture_audit.py --self-test
      - name: Exact native funding importer, timestamp and bounded URL tamper gate (synthetic only)
        working-directory: research/v98_independent
        run: python v98_exact_funding_full_history_ingest.py --self-test
      - name: State the actual external source blocker
        run: |
          echo 'CONTRACT_ONLY: 0 official markPrice events acquired in this job.'
          echo 'REQUIRED: 13524 official Binance fundingRate event objects with raw HTTP bodies, headers, SHA256, lawful transport and independent origin attestation.'
          echo 'No historical PnL, 2026+ data, external benchmark, holdout, paper or live authorization.'
