name: V98 Independent Phase1218 AF Funding Breadth Router
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1218_af_breadth_router.py'
      - 'research/v98_independent/test_phase1218_af_breadth_router.py'
      - '.github/workflows/v98-independent-phase1218-af-router.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  af-router:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Validate causal AF funding breadth and six-hour hysteresis
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1218_af_breadth_router.py' -v
