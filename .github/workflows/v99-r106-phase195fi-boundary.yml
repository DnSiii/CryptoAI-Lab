name: V99 Phase195-FI atomic boundary regression

on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_phase195fi_atomic_boundary_witness.py'
      - 'research/tests/test_phase195fi_atomic_boundary_witness.py'
      - '.github/workflows/v99-r106-phase195fi-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v99-phase195fi-safety
  cancel-in-progress: false

jobs:
  offline-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch, never Frozen or paper-results
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run fail-closed Phase195-FI adversarial checks
        run: python -m unittest discover -s research/tests -p 'test_phase195fi_atomic_boundary_witness.py' -v
