name: V98 Independent Native OI Full 2022-24 Source Integrity
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-native-oi-full-source.yml'
      - 'research/v98_independent/v98_oi_full_history_source_prereg_20261027.md'
      - 'research/v98_independent/v98_oi_full_history_source_20261027.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit exact 2022-12 through 2024-12 Clean4 OI daily vendor checksums and 5min continuity
        shell: bash
        run: |
          python -m py_compile research/v98_independent/v98_oi_full_history_source_20261027.py
          set +e
          python research/v98_independent/v98_oi_full_history_source_20261027.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s research/v98_independent/v98_oi_full_history_source_report_20261027.json
          test -s research/v98_independent/v98_oi_full_history_verified_hourly_20261027.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-oi-clean4-2022-2024-full-source-only
          path: |
            research/v98_independent/v98_oi_full_history_source_report_20261027.json
            research/v98_independent/v98_oi_full_history_verified_hourly_20261027.csv
          retention-days: 30
          if-no-files-found: warn
