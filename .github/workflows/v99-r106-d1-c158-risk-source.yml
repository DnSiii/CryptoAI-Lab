name: V99 R106 D1 C158 five-fold six-regime scorecard (SOURCE ONLY)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/verification/independent_d1_c148_risk_fold_scorecard.py'
      - 'research/tests/test_v99_r106_d1_c158_risk_folds.py'
      - '.github/workflows/v99-r106-d1-c158-risk-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full synthetic TRAIN risk and independent accounting source regression
        run: |
          python -m unittest research.tests.test_v99_r106_d1_c158_risk_folds research.tests.test_v99_r106_d1_c157_accounting_cold_start research.tests.test_v99_r106_d1_c156_native_lot_smoke research.tests.test_v99_r106_d1_c153_pair_lattice research.tests.test_v99_r106_d1_c155_prereg_source research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Economic promotion is forbidden
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p=report_permissions()
          assert not any(p[k] for k in ('historical_train_economics_run',
              'validation_opened','final_holdout_opened','promotion_authorized',
              'real_orders_enabled','paper_publication_authorized'))
          print('SOURCE-ONLY 15,864-hour synthetic fixtures; NO PROMOTION')
          PY
