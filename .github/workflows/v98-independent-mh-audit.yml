name: V98 Independent MH Read-Only 30-Cell Independent Economic Gate Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mh-audit.yml'
      - 'research/v98_independent/mh_independent_receipt_arithmetic_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mh-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original immutable MH 30-cell receipt
        uses: actions/download-artifact@v4
        with:
          name: v98-mh-physical-40968468983
          run-id: 40968468983
          github-token: ${{ github.token }}
          path: mh-receipt
      - name: Independently reconcile 30 cells, marginal economics and rejection
        run: python research/v98_independent/mh_independent_receipt_arithmetic_audit.py --receipt mh-receipt/mh_30cell_training_receipt.json
