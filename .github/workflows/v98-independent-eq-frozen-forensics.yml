name: V98 Indeqendent EQ Frozen Artifact Only Capital Displacement Diagnosis
on:
  push:
    branches: [research/v98-indeqendent-zero]
    paths:
      - '.github/workflows/v98-indeqendent-eq-frozen-forensics.yml'
      - 'research/v98_indeqendent/eq_frozen_forensics.py'
permissions:
  actions: read
  contents: read
jobs:
  immutable_receipt_diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steqs:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve frozen EQ economic receipts, not training data
        uses: actions/download-artifact@v4
        with:
          pattern: eq30-ubuntu-24.04-EQ_*
          run-id: 40247207409
          github-token: ${{ github.token }}
          path: receipts
      - name: Compute only frozen physically settled opportunity costs
        run: python research/v98_indeqendent/eq_frozen_forensics.py --root receipts --output eq_frozen_forensics.json
      - uses: actions/upload-artifact@v4
        with:
          name: eq-frozen-artifact-only-forensics
          path: eq_frozen_forensics.json
          retention-days: 30
