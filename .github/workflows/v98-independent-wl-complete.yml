name: V98 Independent WL Seven-Slot Exposed Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-wl-complete.yml'
      - 'research/v98_independent/wl_funding_buffer_compound.py'
      - 'research/v98_independent/wl_funding_buffer_physical.py'
      - 'research/v98_independent/wl_independent_ledger_replay.py'
      - 'research/v98_independent/wl_governor_synthetic_stress_test.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wl-exposed-complete:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Preregistered WL syntax and causal future-mutation test
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/wl_funding_buffer_compound.py research/v98_independent/wl_funding_buffer_physical.py research/v98_independent/wl_independent_ledger_replay.py
          python research/v98_independent/wl_funding_buffer_physical.py --self-test
      - name: Synthetic hourly governor trim and adverse margin proof (NOT market PnL)
        run: |
          set -euo pipefail
          python research/v98_independent/wl_governor_synthetic_stress_test.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: Execute all 30 physical 2023-2025 WL cells
        run: |
          set -euo pipefail
          python research/v98_independent/wl_funding_buffer_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir wl-training
      - name: Independent hourly accounting and tamper oracle
        run: |
          set -euo pipefail
          python research/v98_independent/wl_independent_ledger_replay.py --out-dir wl-training
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-wl-exposed-training-not-validated
          path: wl-training/
          retention-days: 30
          if-no-files-found: warn
      - name: Print measured decision without approving trading
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('wl-training/wl_exposed_physical.json').read_text())
          print('WL_EXPOSED_DECISION',r['decision'])
          for tier in ('base','severe','supersevere'):
              for order in ('carried_before_fill','new_after_fill'):
                  c=next(x for x in r['cells'] if x['book']=='WL_full' and x['tier']==tier and x['order']==order)
                  print('WL_FULL',tier,order,json.dumps({k:c.get(k) for k in ('passed','reason','hour','cagr','max_dd','annual_returns','governor_trims','signed_funding','fees_spread_impact')},sort_keys=True))
          print('WL_NOT_VALIDATED_NOT_PAPER_NOT_LIVE')
          PY
