name: V98 Independent WK Serial-Dependence Full-History Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-wk-serial-dependence.yml'
      - 'research/v98_independent/wk_serial_dependence.py'
      - 'research/v98_independent/wk_serial_dependence_physical.py'
      - 'research/v98_independent/wk_serial_dependence_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wk-2023-25-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: WK causal future-mutation and syntax tests
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/wk_serial_dependence.py research/v98_independent/wk_serial_dependence_physical.py
          python research/v98_independent/wk_serial_dependence.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: WK full 30-cell exposed training
        run: |
          set -euo pipefail
          python research/v98_independent/wk_serial_dependence_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir wk-physical
      - name: Independent WK signal and cash/funding oracle with tamper detection
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/wk_serial_dependence_oracle.py
          if [ -f wk-physical/wk_base_full_hourly_ledger.csv ]; then
            python research/v98_independent/wk_serial_dependence_oracle.py \
              --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
              --new-root new --corrected-root corrected --out-dir wk-physical
          else
            echo 'WK_PRE_PNL_REJECTED_NO_PHYSICAL_LEDGER'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-wk-serial-dependence-exposed-not-validated
          path: wk-physical/
          retention-days: 30
          if-no-files-found: warn
      - name: Explicit reject or unvalidated training-only status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('wk-physical/wk_source.json').read_text())
          if s['decision'].startswith('REJECT'):raise SystemExit('WK_PRE_PNL_REJECTED')
          r=json.loads(Path('wk-physical/wk_exposed_physical.json').read_text())
          for tier in ('base','severe','supersevere'):
              x=next(v for v in r['cells'] if v['book']=='WK_full' and v['tier']==tier and v['order']=='carried_before_fill')
              print('WK_FULL',tier,json.dumps({k:x.get(k) for k in ('passed','reason','cagr','max_dd','annual_returns','final_equity')},sort_keys=True),flush=True)
          print('WK_FAILURES',json.dumps(r['failures']),flush=True)
          if r['decision'].startswith('REJECT'):raise SystemExit('WK_REJECTED_NO_ENGINE')
          assert r['decision']=='PASS_WK_EXPOSED_TRAINING_ONLY_NOT_VALIDATED'
          print('WK_EXPOSED_TRAINING_ONLY_INDEPENDENT_AUDIT_PENDING')
          PY
