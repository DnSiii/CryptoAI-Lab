name: V99 I1 REAL Sunday original fixed-entry books (SOURCE ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_public_sunday_entry_probe.py
      - research/tests/test_v99_r106_i1_public_sunday_entry_probe.py
      - .github/workflows/v99-r106-i1-public-sunday-entry.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v99-i1-real-sunday-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-sunday-fixed-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce original preregistration before first code
        run: |
          git merge-base --is-ancestor ed38c7a2b833b68fa19ad1b8bb65e4d7c49884f6 HEAD
          test -s research/V99_R106_I1_REAL_SUNDAY_FULLDAY_ENTRY_PREREG_20261028.md
      - name: Adversarial original-shaped offline controls (not real evidence)
        run: python -m unittest -v research.tests.test_v99_r106_i1_public_sunday_entry_probe
      - name: Restore archived original TRAIN-only 182 causal signals
        run: |
          mkdir -p research_evidence/i1_original_causal
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
          test -s research_evidence/i1_original_causal/i1_causal_signal.json
      - name: Download REAL original 2022-05-01 full day and independently reparse both fixed books
        run: |
          python -m research.tools.v99_r106_i1_public_sunday_entry_probe \
            research_evidence/i1_original_causal/i1_causal_signal.json \
            | tee real_sunday_entry_summary.json
      - name: Enforce source-only status and no economic promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("real_sunday_entry_summary.json").read_text())
          assert r["source_day"]=="2022-05-01" and r["decision_day"]=="2022-05-02"
          assert r["source_fixture"] is False
          assert not any(r[k] for k in ("economic_train_executed", "native_terms_authenticated",
               "roi_calculated", "validation_opened", "holdout_opened",
               "orders_enabled", "promotion_authorized", "original_complete_option_lifecycles_certified"))
          if r["status"]!="REAL_ORIGINAL_SUNDAY_ENTRY_BOOK_REPLAY_PASS_SOURCE_ONLY":
              raise AssertionError("REAL_SOURCE_UNAVAILABLE_OR_REPLAY_FAILED:"+r["status"])
          assert r["real_original_day_verified"] is True
          assert r["independent_original_byte_entry_replay"] is True
          assert r["hourly_qualifying_put_coverage"]=={"BTC":24,"ETH":24}
          assert all(r["original_books_by_asset"][a]>0 for a in ("BTC","ETH"))
          print("REAL ONE-MONDAY ORIGINAL BOOK REPLAY VERIFIED; 0 ECONOMIC LIFECYCLES; NO PROMOTION")
          PY
      - name: Upload only redacted aggregate status; never vendor gzip or original signal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-i1-real-sunday-entry-summary-${{ github.run_id }}
          path: real_sunday_entry_summary.json
          if-no-files-found: warn
          retention-days: 14
