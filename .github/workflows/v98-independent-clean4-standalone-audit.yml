name: V98 Independent Clean4 Self-Contained Source Reproducibility
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-clean4-standalone-audit.yml'
      - 'research/v98_independent/v98_clean4_training_reader.py'
      - 'research/v98_independent/lj_sources.py'
      - 'research/v98_independent/lj_independent_source_gate.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  authenticated-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned Clean4 training-only artifact
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: \${{ github.token }}
          path: official-input
      - name: Authenticate original byte-level training source and native funding
        run: |
          python research/v98_independent/v98_clean4_training_reader.py --root official-input
      - name: Independently replay frozen LJ source without PnL or promotion
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_clean4_training_reader.py lj_sources.py lj_independent_source_gate.py
          python lj_independent_source_gate.py --root ../../official-input --output lj_source_ci_receipt.json
      - name: Tamper test original OHLC and funding SHA256 contracts
        run: |
          python - <<'PY'
          import sys,tempfile,shutil
          from pathlib import Path
          sys.path.insert(0,'research/v98_independent')
          from v98_clean4_training_reader import load
          source=Path('official-input')
          with tempfile.TemporaryDirectory() as tmp:
              target=Path(tmp)
              for p in source.iterdir():
                  if p.is_file():shutil.copy2(p,target/p.name)
              p=target/'BTCUSDT_1h.csv'
              raw=p.read_bytes();p.write_bytes(raw+b'\n')
              try:load(target)
              except ValueError as e:assert 'SHA_MISMATCH' in str(e)
              else:raise AssertionError('V98_OHLC_TAMPER_NOT_REJECTED')
              p.write_bytes(raw)
              p=target/'phase1000_four_asset_conservative_bounds_source_only.csv'
              raw=p.read_bytes();p.write_bytes(raw+b'\n')
              try:load(target)
              except ValueError as e:assert 'FUNDING_SHA_MISMATCH' in str(e)
              else:raise AssertionError('V98_FUNDING_TAMPER_NOT_REJECTED')
          print('V98_TAMPER_FAIL_CLOSED_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-clean4-standalone-source-audit-\${{ github.run_id }}
          path: research/v98_independent/lj_source_ci_receipt.json
          retention-days: 30
          if-no-files-found: warn
