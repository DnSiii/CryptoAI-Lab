name: V99 R106 original Deribit 2022 target-day paginated TRADE feasibility (NOT QUOTES/ROI)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_deribit_paginated_trade_day.py'
      - 'research/verification/independent_v99_r106_deribit_paginated_trade_day_oracle.py'
      - 'research/tests/test_v99_r106_deribit_paginated_trade_day.py'
      - '.github/workflows/v99-r106-deribit-paginated-trade-day.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v99-deribit-original-trade-pagination-${{ github.ref }}
  cancel-in-progress: false
jobs:
  target-day-original-trade-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preregistered fixed source scope is an ancestor of this implementation
        run: |
          git merge-base --is-ancestor 6d141152db82f41c836ca7d8ee9fcd154ff4d373 HEAD
          test -s research/V99_R106_DERIBIT_TARGET_DAY_PAGINATED_TRADE_FEASIBILITY_PREREG_20261030.md
      - name: Adversarial offline source and independent evidence tests
        run: python -m unittest -v research.tests.test_v99_r106_deribit_paginated_trade_day
      - name: Query ONLY original 2022-01-23 BTC/ETH Deribit historical option TRADE prints
        run: python -m research.tools.v99_r106_deribit_paginated_trade_day research_evidence/deribit_paginated_day
      - name: Independently reparse every original JSON response and verify source status
        run: python -m research.verification.independent_v99_r106_deribit_paginated_trade_day_oracle research_evidence/deribit_paginated_day
      - name: Fail closed on any false economic/promotion claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_evidence/deribit_paginated_day')
          r=json.loads((root/'original_paginated_trade_day_source_only.json').read_text())
          o=json.loads((root/'independent_original_paginated_trade_day_oracle.json').read_text())
          assert o['status']=='INDEPENDENT_ORIGINAL_PAGINATED_TRADE_BYTES_REPLAY_PASS'
          assert o['source_status']==r['status']
          assert r['certified_option_lifecycles']==0
          assert r['trade_prints_are_not_executable_quotes'] is True
          assert not r['original_661_day_quote_archive_delivered']
          for key in ('native_quotes_authenticated','historical_fills_authenticated',
              'native_fee_tier_authenticated','full_lifecycle_authenticated',
              'economic_trial_run','validation_opened','final_holdout_opened',
              'promotion_authorized','paper_publication_authorized','orders_enabled'):
              assert r[key] is False
          print('SOURCE ONLY',r['status'],'NO QUOTES / NO ECONOMICS / NO PROMOTION')
          PY
      - name: Remove original trade JSON bytes even on failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('research_evidence/deribit_paginated_day/raw_ephemeral')
          if root.exists(): shutil.rmtree(root)
          print('EPHEMERAL ORIGINAL TRADE JSON REMOVED')
          PY
      - name: Archive only redacted source metadata and independent verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-deribit-paginated-original-trade-source-${{ github.run_id }}
          path: |
            research_evidence/deribit_paginated_day/original_paginated_trade_day_source_only.json
            research_evidence/deribit_paginated_day/independent_original_paginated_trade_day_oracle.json
          retention-days: 30
          if-no-files-found: warn
