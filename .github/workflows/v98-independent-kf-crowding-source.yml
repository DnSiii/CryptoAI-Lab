name: V98 Independent KF Native Crowding Source Integrity Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kf-crowding-source.yml'
      - 'research/v98_independent/kf_crowding_metrics_source_gate.py'
      - 'research/v98_independent/kf_crowding_metrics_source_prereg_20261028.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile, run 20 fixed publisher provenance and full-day tests, no PnL
        run: |
          python -m py_compile research/v98_independent/kf_crowding_metrics_source_gate.py
          python research/v98_independent/kf_crowding_metrics_source_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-kf-crowding-source-only-20-fixed-days
          path: research/v98_independent/kf_crowding_metrics_source_gate.json
          retention-days: 30
          if-no-files-found: warn
