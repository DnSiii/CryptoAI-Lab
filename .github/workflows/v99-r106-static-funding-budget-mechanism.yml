name: V99 R106 original Binance funding static mechanism budget fivefold (NOT ROI)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_static_funding_budget.py
      - research/verification/independent_v99_r106_static_funding_budget_oracle.py
      - research/tests/test_v99_r106_static_funding_budget.py
      - .github/workflows/v99-r106-static-funding-budget-mechanism.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v99-r106-static-funding-budget-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-shot-original-mechanism-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce mechanism scope preregistered before code and original rates
        run: |
          git merge-base --is-ancestor baaaf2daa0253d32270ddf2e92dcb2ae4cfa77cb HEAD
          test -s research/V99_R106_BINANCE_STATIC_FUNDING_BUDGET_MECHANISM_PREREG_20261030.md
          test -s research/V99_R106_D1_ACTUAL_OKX_FUNDING_SIGNAL_REJECTION_20261023.md
          echo 'FIXED FIVE FOLDS AND COST BUDGET; NO STRATEGY OR RETUNE'
      - name: Run adversarial original event clock and missing-source tests
        run: python -m unittest -v research.tests.test_v99_r106_static_funding_budget
      - name: Fetch 44 original publisher-verified Binance ZIPs and compute fixed fivefold rate budget
        run: |
          python -m research.tools.v99_r106_static_funding_budget research_evidence/static_funding_budget
      - name: Independently reparse all original ZIP/CHECKSUM bytes and recompute 5 fold budgets
        run: |
          python -m research.verification.independent_v99_r106_static_funding_budget_oracle research_evidence/static_funding_budget
      - name: Fail closed on provenance, independent agreement and no ROI or promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_evidence/static_funding_budget')
          p=json.loads((root/'static_funding_budget_source_only.json').read_text())
          v=json.loads((root/'static_funding_budget_independent_oracle.json').read_text())
          assert v['original_files']==44 and v['events_per_asset']==1983
          assert v['status']=='INDEPENDENT_44_ORIGINAL_PUBLISHER_ZIPS_FIVEFOLD_BUDGET_REEXECUTED'
          assert p['status']==v['mechanism_status']
          assert p['positive_budget_folds']==v['positive_illustrative_budget_folds']
          assert p['rate_budget_is_not_nav_or_roi'] and p['public_funding_is_not_account_settlement']
          assert not p['economic_train_executed'] and not p['promotion_authorized']
          assert not p['validation_opened'] and not p['holdout_opened']
          assert not p['paper_modified'] and not p['frozen_modified'] and not p['orders_enabled']
          print('MECHANISM SCREEN ONLY:',p['status'],'FOLDS',p['positive_budget_folds'])
          print('NOT NAV / NOT ROI / NOT PRIVATE FUNDING / NO PROMOTION / NO ORDERS')
          PY
      - name: Destroy ephemeral original ZIP/CHECKSUM bytes, even if a prior step fails
        if: always()
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          p=Path('research_evidence/static_funding_budget/raw_ephemeral')
          if p.exists(): shutil.rmtree(p)
          print('NO ORIGINAL MARKET BYTES PUBLISHED')
          PY
      - name: Preserve redacted mechanism budget and independent original-byte verdict only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-static-funding-budget-source-only-${{ github.run_id }}
          path: |
            research_evidence/static_funding_budget/static_funding_budget_source_only.json
            research_evidence/static_funding_budget/static_funding_budget_independent_oracle.json
          retention-days: 30
          if-no-files-found: warn
