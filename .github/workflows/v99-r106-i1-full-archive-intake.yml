name: V99 I1 full TRAIN original option archive intake (SOURCE ONLY / NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_full_archive_intake.py
      - research/verification/independent_v99_r106_i1_full_archive_intake.py
      - research/tests/test_v99_r106_i1_full_archive_intake.py
      - .github/workflows/v99-r106-i1-full-archive-intake.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run 91-week synthetic input contract and independent original-byte oracle
        run: python -m unittest discover -s research/tests -p test_v99_r106_i1_full_archive_intake.py -v
      - name: Enforce synthetic-only status; no economic promotion
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from research.tests.test_v99_r106_i1_full_archive_intake import make_fixture
          from research.tools.v99_r106_i1_full_archive_intake import evaluate
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              make_fixture(root)
              r=evaluate(root)
              assert r['fixture'] and r['two_strike_asset_weeks']==182
              assert r['status']=='SYNTHETIC_FIXTURE_ONLY_NO_ECONOMICS'
              assert not any(r[k] for k in (
                  'economic_train_executed','native_fee_authenticated',
                  'native_margin_authenticated','fills_authenticated',
                  'validation_opened','holdout_opened','orders_enabled',
                  'promotion_authorized'))
          print('ARCHIVE INTAKE CODE VERIFIED / REAL ARCHIVE STILL MISSING / NO PROMOTION')
          PY
