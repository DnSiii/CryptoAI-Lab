name: V98 Independent Phase1075 S Frozen Code Preflight
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1075-s-freeze-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s-frozen-code-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Enforce immutable S source, ledger, target and 90-cell grid freeze
        run: python -c 'from phase1075_s_training_path import verify_freeze; m=verify_freeze(); print("FROZEN_S_PRE_ECONOMIC",m["source_run_id"],m["cell_count"])'
      - name: Run S 58 synthetic source, signed funding, execution and receipt tests
        run: python -m unittest -q test_phase1069_s_sevenslot_source.py test_phase1070_s_typed_native_mark.py test_phase1071_s_authenticated_source.py test_phase1072_s_crossrunner_compare.py test_phase1073_s_signed_execution.py test_phase1074_s_funded_ledger.py test_phase1075_s_training_path.py test_phase1076_s_90cell_audit.py
