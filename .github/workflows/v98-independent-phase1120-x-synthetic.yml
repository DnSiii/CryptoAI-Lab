name: V98 Independent Phase1120 X Complete Synthetic Survival
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1120-x-synthetic.yml'
      - 'research/v98_independent/phase1116_x_basket_shock_oracle.py'
      - 'research/v98_independent/phase1117_x_contingent_governor.py'
      - 'research/v98_independent/phase1118_x_sevenslot_source.py'
      - 'research/v98_independent/phase1119_x_hourly_ledger.py'
      - 'research/v98_independent/phase1120_x_synthetic_integration.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x-full-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
      - name: X 15 full portfolio paths over three synthetic 2200h universes
        run: python phase1120_x_synthetic_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-x-phase1120-synthetic-receipt
          path: research/v98_independent/phase1120_x_synthetic_receipt.json
          if-no-files-found: warn
