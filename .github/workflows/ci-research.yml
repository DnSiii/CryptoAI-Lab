name: CryptoAI CI + research

on:
  push:
    branches: ["agent/v13-adversarial-rebuild"]
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "Maximum USD-M contracts for the full replay"
        required: false
        default: "48"
      bootstrap_samples:
        description: "Bootstrap paths for the full replay"
        required: false
        default: "5000"

concurrency:
  group: cryptoai-v13-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  execution-hysteresis-discovery:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache Binance public archives
        uses: actions/cache@v4
        with:
          path: .cache/cryptoai
          key: cryptoai-binance-v1-${{ runner.os }}
      - run: python -m pip install -e .
      - name: Search cost-aware execution hysteresis without holdout access
        run: >-
          python scripts/search_execution_hysteresis.py
          --max-symbols 12
          --bootstrap-samples 2000
          --report reports/execution_hysteresis.json
      - name: Upload execution hysteresis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-hysteresis-report
          path: reports/execution_hysteresis.json
          if-no-files-found: warn

  adversarial-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache Binance public archives
        uses: actions/cache@v4
        with:
          path: .cache/cryptoai
          key: cryptoai-binance-v1-${{ runner.os }}
      - run: python -m pip install -e .
      - name: Run full causal adversarial replay
        run: >-
          python scripts/run_v13_adversarial.py
          --start 2020-01-01
          --end 2026-08-10
          --max-symbols ${{ github.event.inputs.max_symbols || '48' }}
          --bootstrap-samples ${{ github.event.inputs.bootstrap_samples || '5000' }}
          --report reports/v13_adversarial_full.json
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-adversarial-full-report
          path: reports/v13_adversarial_full.json
          if-no-files-found: warn
