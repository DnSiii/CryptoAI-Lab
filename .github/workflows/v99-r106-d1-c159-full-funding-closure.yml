name: V99 R106 D1 C159 full TRAIN funding closure (SOURCE ONLY)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/verification/independent_d1_funding_schedule_cycle132.py'
      - 'research/verification/independent_d1_full_train_schedule_gate_cycle133.py'
      - 'research/tests/test_v99_r106_d1_c159_full_funding_closure.py'
      - '.github/workflows/v99-r106-d1-c159-full-funding-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent complete TRAIN funding calendar plus prior D1 source checks
        run: |
          python -m unittest research.tests.test_v99_r106_d1_c159_full_funding_closure research.tests.test_v99_r106_d1_c158_risk_folds research.tests.test_v99_r106_d1_c157_accounting_cold_start research.tests.test_v99_r106_d1_c156_native_lot_smoke research.tests.test_v99_r106_d1_c153_pair_lattice research.tests.test_v99_r106_d1_c155_prereg_source research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Assert fail-closed historical economic permissions
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p = report_permissions()
          assert not any(p[k] for k in ('historical_train_economics_run',
              'validation_opened', 'final_holdout_opened',
              'promotion_authorized', 'real_orders_enabled',
              'paper_publication_authorized'))
          print('SOURCE ONLY: 15,864 synthetic TRAIN hours, 1,983 funding fixes per asset; NO ECONOMICS / NO PROMOTION')
          PY
