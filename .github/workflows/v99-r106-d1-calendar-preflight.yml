name: V99 R106 D1 calendar synthetic preflight
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_d1_full_train_guard.py'
      - 'research/tests/test_v99_r106_d1_full_train_guard.py'
      - '.github/workflows/v99-r106-d1-calendar-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-calendar-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject incomplete or unauthenticated TRAIN calendar
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_d1_full_train_guard.py' -v
      - name: Explicit synthetic-only prohibition
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_full_train_guard import HOURS, EXPECTED_FUNDING_FIXES
          assert (HOURS,EXPECTED_FUNDING_FIXES)==(15864,1983)
          print('STRUCTURAL_ONLY / DATA_ONLY HOLD / NO PROMOTION / NO HISTORICAL ROI')
          PY
