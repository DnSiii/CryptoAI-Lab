name: V13 historical generator lineage (read-only)
on:
  workflow_dispatch:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - .github/workflows/v13-historical-lineage.yml
jobs:
  trace-lineage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture original paper and generator provenance without modifying either
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/lineage
          git fetch --no-tags origin paper-results
          git rev-parse refs/remotes/origin/paper-results > reports/lineage/paper_results_sha.txt
          git show refs/remotes/origin/paper-results:reports/paper_v13_ledger.json > reports/lineage/original_ledger.json
          sha256sum reports/lineage/original_ledger.json > reports/lineage/ledger_sha256.txt
          git log --all --format='%H %aI %s' -- scripts/paper_once_v13.py > reports/lineage/generator_history.txt
          git log refs/remotes/origin/paper-results -20 --format='%H %aI %s' > reports/lineage/paper_history.txt
          git log --all --format='%H %aI %s' -- reports/paper_v13_ledger.json > reports/lineage/ledger_history.txt
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          ledger=json.loads(Path("reports/lineage/original_ledger.json").read_text())
          decisions=ledger.get("decisions",[])
          adjustments=[(d.get("timestamp"),a) for d in decisions for a in d.get("adjustments",[])]
          summary={"decision_count":len(decisions),"adjustment_count":len(adjustments),
            "first_decision":decisions[0].get("timestamp") if decisions else None,
            "last_decision":decisions[-1].get("timestamp") if decisions else None,
            "missing_raw":sum(a.get("order_value_brl_unrounded") is None for _,a in adjustments)}
          from datetime import datetime, timezone
          from collections import Counter
          # 2026-11-05T17:51:47Z is the generator commit adding raw notional.
          boundary=datetime.fromisoformat("2026-11-05T17:51:47+00:00")
          by_era={}
          samples=[]
          for ts,a in adjustments:
            try:
              moment=datetime.fromisoformat(str(ts).replace("Z","+00:00"))
              era="before_raw_generator_commit" if moment < boundary else "after_raw_generator_commit"
            except (TypeError,ValueError):
              era="timestamp_unparseable"
            bucket=by_era.setdefault(era,Counter())
            bucket["total"]+=1
            raw=a.get("order_value_brl_unrounded")
            if raw is None:
              bucket["missing_raw"]+=1
            else:
              try:
                precise=float(raw)
                displayed=float(a.get("order_value_brl"))
                if not (math.isfinite(precise) and precise>0 and math.isfinite(displayed) and round(precise,2)==displayed):
                  bucket["raw_display_mismatch"]+=1
                  if len(samples)<25:
                    samples.append({"timestamp":ts,"symbol":a.get("symbol"),"raw":raw,"displayed":a.get("order_value_brl")})
              except (TypeError,ValueError,OverflowError):
                bucket["invalid_numeric"]+=1
          summary["generator_raw_commit"]="dc17b44794b747ea8b43c5d36c340ad7a800c0c7"
          summary["generator_raw_commit_timestamp"]=boundary.isoformat()
          summary["by_era"]={key:dict(value) for key,value in by_era.items()}
          Path("reports/lineage/era_mismatch_samples.json").write_text(json.dumps(samples,indent=2)+"\\n")
          Path("reports/lineage/summary.json").write_text(json.dumps(summary,indent=2)+"\\n")
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload immutable lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-historical-generator-lineage
          path: reports/lineage/
          retention-days: 30
