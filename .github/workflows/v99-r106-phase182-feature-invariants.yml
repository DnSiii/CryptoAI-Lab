name: V99 R106 Phase182 Feature Invariants
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_phase182_feature_builder.py'
      - 'research/tools/v99_r106_phase182_pair_integrity.py'
      - 'research/tests/test_v99_r106_phase182_feature_builder.py'
      - '.github/workflows/v99-r106-phase182-feature-invariants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariant:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q research/tests/test_v99_r106_phase182_pair_integrity.py research/tests/test_v99_r106_phase182_feature_builder.py
