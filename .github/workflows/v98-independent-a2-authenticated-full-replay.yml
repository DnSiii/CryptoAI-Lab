name: V98 Independent A2 Authenticated Full Economic Replay
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-a2-authenticated-full-replay.yml'
      - 'research/v98_independent/v98_a0_economic_diagnostics.py'
      - 'research/v98_independent/v98_sevenslot_preregistered_a2.py'
      - 'research/v98_independent/v98_a2_chronological_gate.py'
      - 'research/v98_independent/v98_authenticated_compound_integration.py'
      - 'research/v98_independent/v98_compound_scenario_replay.py'
      - 'research/v98_independent/v98_causal_compound_sizing.py'
      - 'research/v98_independent/v98_phase243_training_reader.py'
      - 'research/v98_independent/phase243_native_funding_cashflow.py'
      - 'research/v98_independent/test_phase243_native_funding_cashflow.py'
permissions:
  contents: read
  actions: read
jobs:
  v98-a2-full-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V98-only full replay dependency chain
        run: |
          python -m compileall -q research/v98_independent/v98_sevenslot_preregistered_a2.py research/v98_independent/v98_authenticated_compound_integration.py research/v98_independent/v98_compound_scenario_replay.py research/v98_independent/v98_causal_compound_sizing.py research/v98_independent/v98_phase243_training_reader.py research/v98_independent/v98_a0_economic_diagnostics.py
      - name: Verify native funding settlement contract before artifact acquisition
        run: python -m unittest discover -s research/v98_independent -p test_phase243_native_funding_cashflow.py -v
      # Pinned Phase243 artifacts: native action downloads avoid the broken gh API JSON path.
      # Artifact IDs are immutable; never fall back to latest or other branches.
      - name: Download pinned Clean-4 price artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 13444665313
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/v98_independent/artifacts/prices
      - name: Download pinned native funding artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 13464271018
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/v98_independent/artifacts/funding
      - name: Verify pinned source manifest presence before processing
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('/tmp/v98_independent/artifacts')
          for label,manifest in [('prices','source_manifest.json'),('funding','funding_manifest.json')]:
              matches=list((base/label).rglob(manifest))
              if len(matches)!=1:
                  raise SystemExit(f'PINNED_SOURCE_MANIFEST_MISSING_OR_AMBIGUOUS {label}: {len(matches)}')
              print(label, matches[0])
          PY
      - name: Resolve canonical sources and verify authenticated manifests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          base=Path('/tmp/v98_independent/artifacts')
          prices=list((base/'prices').rglob('source_manifest.json'))
          funds=list((base/'funding').rglob('funding_manifest.json'))
          if len(prices)!=1 or len(funds)!=1:
              raise SystemExit(f'AMBIGUOUS_CANONICAL_SOURCES price={len(prices)} funding={len(funds)}')
          (base/'paths.env').write_text('PRICES='+str(prices[0].parent)+'\nPRICE_MANIFEST='+str(prices[0])+'\nFUNDING='+str(funds[0].parent)+'\n')
          PY
          cat /tmp/v98_independent/artifacts/paths.env >> "$GITHUB_ENV"
          set -a
          source /tmp/v98_independent/artifacts/paths.env
          set +a
          python -m research.v98_independent.v98_phase243_training_reader --prices "$PRICES" --price-manifest "$PRICE_MANIFEST" --funding "$FUNDING"
      - name: Generate preregistered causal seven-slot A2 decisions
        run: |
          mkdir -p /tmp/v98_independent/a2
          python -m research.v98_independent.v98_sevenslot_preregistered_a2 --prices "$PRICES" --manifest "$PRICE_MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/a2/slots.csv
      - name: Run full authenticated compound replay across three costs
        run: |
          python -m research.v98_independent.v98_authenticated_compound_integration --slots /tmp/v98_independent/a2/slots.csv --prices "$PRICES" --price-manifest "$PRICE_MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/a2/replay --capital 10000 --fee-bps 4 --slippage-bps 2
      - name: Compute chronological economics and stress diagnostics (no promotion)
        run: |
          python -m research.v98_independent.v98_a0_economic_diagnostics --replay /tmp/v98_independent/a2/replay --output /tmp/v98_independent/a2/replay/diagnostics.json
      - name: Audit retrospective chronological folds without false OOS claims
        run: |
          python -m research.v98_independent.v98_a2_chronological_gate --replay /tmp/v98_independent/a2/replay --output /tmp/v98_independent/a2/replay/chronological_gate.json
      - name: Upload unapproved research-only economic ledgers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-a2-unvalidated-full-replay-${{ github.run_id }}
          path: |
            /tmp/v98_independent/a2/slots.csv
            /tmp/v98_independent/a2/replay/
          retention-days: 30
          if-no-files-found: error
