name: CryptoAI V99 R106 Phase32 Cross Sectional Skew Alpha
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - "scripts/run_v99_r106_phase32_cross_sectional_skew_alpha_audit.py"
      - ".github/workflows/v99-r106-phase32-cross-sectional-skew-alpha.yml"
permissions:
  contents: write
jobs:
  phase32:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve UTC cache date
        id: cache_date
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: Linux-paper-v15-market-v1-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Restore frozen published V15 research snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v15.json; do
            git cat-file -e "FETCH_HEAD:$path"
            mkdir -p "$(dirname "$path")"
            git show "FETCH_HEAD:$path" > "$path"
          done
      - name: Prepare V15 dynamic research runtime
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Run phase32 skew audit
        run: python scripts/run_v99_r106_phase32_cross_sectional_skew_alpha_audit.py
      - name: Verify report contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase32_cross_sectional_skew_alpha_audit.json').read_text())
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['precommitment']['selection_uses_train_only'] and r['precommitment']['holdout_cannot_change_selected_family']
          assert r['precommitment']['no_parameter_grid'] and r['precommitment']['all_features_causal_t_minus_1']
          assert r['precommitment']['strategy_change_in_phase32'] is False
          print(json.dumps({'selected_train_only':r['selected_train_only'],'selected_holdout_pass':r['selected_holdout_pass'],'actionable_for_phase33':r['actionable_for_phase33']},indent=2))
          PY
      - name: Publish phase32 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase32_cross_sectional_skew_alpha_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 phase32 skew evidence"
          git push origin HEAD:${RESEARCH_BRANCH}
