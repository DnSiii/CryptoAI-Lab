name: V99 I1 one preselected paid source day (SOURCE ONLY, NO PNL)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_one_day_procurement.py
      - research/verification/independent_v99_r106_i1_one_day_procurement.py
      - .github/workflows/v99-r106-i1-one-day-procurement.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preregistered-source-target:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require source-selection preregistration before implementation
        run: |
          git merge-base --is-ancestor 37754ce0a04b4ac7aa879a147f8ad74491694ac2 HEAD
          test -s research/V99_R106_I1_ONE_DAY_CALENDAR_ELIGIBLE_PROCUREMENT_PREREG_20261029.md
      - name: Restore ORIGINAL TRAIN-only Deribit registry and causal signal artifacts
        run: |
          mkdir -p research_evidence/i1_native_instruments research_evidence/i1_original_causal
          gh run download 40148052668 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-firstparty-native-instruments-40148052668 \
            --dir research_evidence/i1_native_instruments
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
          test -s research_evidence/i1_native_instruments/native_instrument_registry.json
          test -s research_evidence/i1_original_causal/i1_causal_signal.json
      - name: Independently authenticate original Deribit registry bytes
        run: python -m research.verification.independent_v99_r106_i1_historical_instruments research_evidence/i1_native_instruments
      - name: Select exactly ONE source-feasible calendar-eligible paid day
        run: |
          python -m research.tools.v99_r106_i1_one_day_procurement \
            research_evidence/i1_native_instruments \
            research_evidence/i1_original_causal/i1_causal_signal.json \
            one_day_original_source_procurement.json
      - name: Independent raw Deribit gzip and original causal signal oracle
        run: |
          python -m research.verification.independent_v99_r106_i1_one_day_procurement \
            research_evidence/i1_native_instruments \
            research_evidence/i1_original_causal/i1_causal_signal.json \
            one_day_original_source_procurement.json
      - name: Adversarial target forgery and certification veto
        run: |
          python - <<'PY'
          import copy, json, tempfile
          from pathlib import Path
          from research.verification.independent_v99_r106_i1_one_day_procurement import verify
          r=json.loads(Path('one_day_original_source_procurement.json').read_text())
          assert r['historical_option_lifecycles_certified']==0
          assert all(r[k] is False for k in ('economic_train_executed',
              'roi_calculated','promotion_authorized','validation_opened',
              'holdout_opened','orders_enabled','source_license_received'))
          assert r['target'] is not None, 'NO_CALENDAR_ELIGIBLE_POSITIVE_LISTED_TARGET'
          with tempfile.TemporaryDirectory() as td:
              for mutation in ('date','asset','license'):
                  forged=copy.deepcopy(r)
                  if mutation=='date':
                      forged['target']['sunday_source_date_utc']='2022-06-15'
                  elif mutation=='asset':
                      forged['target']['assets'][0]['asset']='FORGED'
                  else:
                      forged['source_license_received']=True
                  path=Path(td)/'forged.json'
                  path.write_text(json.dumps(forged))
                  try:
                      verify('research_evidence/i1_native_instruments',
                             'research_evidence/i1_original_causal/i1_causal_signal.json',path)
                  except ValueError:
                      print('REJECTED_FALSIFICATION',mutation)
                  else:
                      raise AssertionError('FORGED_PROCUREMENT_TARGET_ACCEPTED:'+mutation)
          print('ONE PRESELECTED PAID SOURCE DAY; NOT AN ECONOMIC TRADE OR PNL')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-i1-single-paid-source-target-${{ github.run_id }}
          path: one_day_original_source_procurement.json
          retention-days: 30
          if-no-files-found: warn
