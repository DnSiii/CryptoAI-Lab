name: CryptoAI dashboard refresh

on:
  workflow_run:
    workflows: ["CryptoAI multi-engine paper refresh"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/build_cryptoai_dashboard.py"
      - "scripts/augment_dashboard_v13.py"
      - "scripts/prepare_dashboard_v15_replay.py"
      - ".github/workflows/cryptoai-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/build_cryptoai_dashboard.py"
      - "scripts/augment_dashboard_v13.py"
      - "scripts/prepare_dashboard_v15_replay.py"
      - ".github/workflows/cryptoai-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: cryptoai-dashboard-refresh
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out dashboard code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Restore exact published paper snapshot
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin paper-results >/dev/null 2>&1; then
            echo "paper-results branch is required"
            exit 1
          fi
          git fetch --no-tags origin paper-results
          for path in \
            state/paper_v15_universe.json \
            state/paper_v99_state.json \
            reports/paper_data_sync_v13.json \
            reports/paper_data_sync_v15.json \
            reports/paper_runtime_status.json \
            reports/paper_v13_snapshot.json \
            reports/paper_v13_ledger.json \
            reports/paper_v14_snapshot.json \
            reports/paper_v14_ledger.json \
            reports/paper_v15_snapshot.json \
            reports/paper_v15_ledger.json \
            reports/paper_v16_snapshot.json \
            reports/paper_v16_ledger.json \
            reports/paper_v99_snapshot.json \
            reports/paper_v99_ledger.json; do
            if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "FETCH_HEAD:$path" > "$path"
            fi
          done
      - name: Validate frozen V99 and JavaScript
        run: |
          python scripts/verify_v99_cycle.py
          python -m pytest tests/test_v99_paper.py
          node --check dashboard/app_v2.js
          node --check dashboard/layout_fix.js
          node --check dashboard/backtest_only.js
          node --check dashboard/paper_classic.js
      - name: Prepare V15 historical replay boundary
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Build five-engine dashboard snapshot
        run: |
          python scripts/build_cryptoai_dashboard.py
          python scripts/augment_dashboard_v13.py
      - name: Validate five-engine snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('dashboard/dashboard_data.json'))
          expected={'v13','v14','v15','v16','v99'}
          assert expected <= set(p['backtest']['engines']), p['backtest']['engines'].keys()
          assert expected <= set(p['paper']['engines']), p['paper']['engines'].keys()
          print('five-engine snapshot ok')
          PY
      - name: Upload dashboard snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performer-dashboard-${{ github.run_id }}
          retention-days: 30
          path: dashboard/dashboard_data.json
      - name: Publish frontend and data to paper-results
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          results_dir="$RUNNER_TEMP/paper-results-dashboard"
          git fetch --no-tags origin paper-results
          git worktree add --detach "$results_dir" FETCH_HEAD
          git -C "$results_dir" switch -C paper-results
          mkdir -p "$results_dir/dashboard"
          cp dashboard/dashboard_data.json "$results_dir/dashboard/dashboard_data.json"
          cp dashboard/index.html "$results_dir/dashboard/index.html"
          cp dashboard/app_v2.js "$results_dir/dashboard/app_v2.js"
          cp dashboard/nevryn.css "$results_dir/dashboard/nevryn.css"
          cp dashboard/layout_fix.css "$results_dir/dashboard/layout_fix.css"
          cp dashboard/layout_fix.js "$results_dir/dashboard/layout_fix.js"
          cp dashboard/backtest_only.js "$results_dir/dashboard/backtest_only.js"
          cp dashboard/paper_classic.css "$results_dir/dashboard/paper_classic.css"
          cp dashboard/paper_classic.js "$results_dir/dashboard/paper_classic.js"
          cp dashboard/app_v2.js "$results_dir/dashboard/app.js"
          cp dashboard/nevryn.css "$results_dir/dashboard/styles.css"
          git -C "$results_dir" add dashboard
          if ! git -C "$results_dir" diff --cached --quiet; then
            git -C "$results_dir" commit -m "Update Performer dashboard ${{ steps.utc.outputs.date }}"
            git -C "$results_dir" push origin HEAD:paper-results
          fi
