name: CryptoAI dashboard refresh

on:
  workflow_run:
    workflows: ["CryptoAI multi-engine paper refresh"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/build_cryptoai_dashboard.py"
      - "scripts/prepare_dashboard_v15_replay.py"
      - ".github/workflows/cryptoai-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/build_cryptoai_dashboard.py"
      - "scripts/prepare_dashboard_v15_replay.py"
      - "scripts/paper_once_v99.py"
      - "scripts/verify_v99_cycle.py"
      - "src/cryptoai_v13/v99_frozen.py"
      - "config/candidate_v99_asymmetric.json"
      - ".github/workflows/cryptoai-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: cryptoai-dashboard-refresh
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out dashboard code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Restore exact published paper snapshot
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin paper-results >/dev/null 2>&1; then
            echo "paper-results branch is required"
            exit 1
          fi
          git fetch --no-tags origin paper-results
          for path in \
            state/paper_v15_universe.json \
            state/paper_v99_state.json \
            reports/paper_data_sync_v13.json \
            reports/paper_data_sync_v15.json \
            reports/paper_runtime_status.json \
            reports/paper_v14_snapshot.json \
            reports/paper_v14_ledger.json \
            reports/paper_v15_snapshot.json \
            reports/paper_v15_ledger.json \
            reports/paper_v16_snapshot.json \
            reports/paper_v16_ledger.json \
            reports/paper_v99_snapshot.json \
            reports/paper_v99_ledger.json; do
            if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "FETCH_HEAD:$path" > "$path"
            fi
          done

      - name: Validate published frozen V99 boundary
        run: python scripts/verify_v99_cycle.py

      - name: Validate dashboard contracts and JavaScript
        run: |
          python -m pytest tests/test_v99_paper.py
          node --check dashboard/app_v2.js

      - name: Prepare V15 historical replay boundary
        run: python scripts/prepare_dashboard_v15_replay.py

      - name: Build paper plus historical simulator snapshot
        run: python scripts/build_cryptoai_dashboard.py

      - name: Upload dashboard snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cryptoai-dashboard-${{ github.run_id }}
          retention-days: 30
          path: dashboard/dashboard_data.json

      - name: Publish dashboard frontend and data to paper-results
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          results_dir="$RUNNER_TEMP/paper-results-dashboard"
          git fetch --no-tags origin paper-results
          git worktree add --detach "$results_dir" FETCH_HEAD
          git -C "$results_dir" switch -C paper-results
          mkdir -p "$results_dir/dashboard"
          cp dashboard/dashboard_data.json "$results_dir/dashboard/dashboard_data.json"
          cp dashboard/index.html "$results_dir/dashboard/index.html"
          cp dashboard/app_v2.js "$results_dir/dashboard/app_v2.js"
          cp dashboard/styles_v2.css "$results_dir/dashboard/styles_v2.css"
          # Backward-compatible aliases for any existing site binding that still
          # requests the legacy asset names.
          cp dashboard/app_v2.js "$results_dir/dashboard/app.js"
          cp dashboard/styles_v2.css "$results_dir/dashboard/styles.css"
          git -C "$results_dir" add \
            dashboard/dashboard_data.json \
            dashboard/index.html \
            dashboard/app_v2.js \
            dashboard/styles_v2.css \
            dashboard/app.js \
            dashboard/styles.css
          if ! git -C "$results_dir" diff --cached --quiet; then
            git -C "$results_dir" commit -m "Update CryptoAI dashboard with V99 ${{ steps.utc.outputs.date }}"
            git -C "$results_dir" push origin HEAD:paper-results
          fi
