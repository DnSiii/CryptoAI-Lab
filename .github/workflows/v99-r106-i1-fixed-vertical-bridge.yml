name: V99 I1 fixed causal vertical native-coin integration gate (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_fixed_vertical_bridge.py
      - research/verification/independent_v99_r106_i1_fixed_vertical_oracle.py
      - research/tests/test_v99_r106_i1_fixed_vertical_bridge.py
      - .github/workflows/v99-r106-i1-fixed-vertical-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-vertical-source-and-account-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0  # Full ancestry required for fixed preregistration commit gate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ex ante rule preregistration is ancestor of implementation
        run: |
          git merge-base --is-ancestor 69dbc33f67b58cb28c1ab3e1c295a7d4307daa34 HEAD
          test -s research/V99_R106_I1_FIXED_VERTICAL_INTEGRATION_PREREG_20261026.md
      - name: Execute fixed selector, native scenario coin cash, independent oracle and adversarial veto
        run: python -m unittest -v research.tests.test_v99_r106_i1_fixed_vertical_bridge
      - name: Restore ORIGINAL source receipts (not fixture) for independent economic source veto
        run: |
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
          gh run download 40079775009 --repo "$GITHUB_REPOSITORY" \
            --name v99-tardis-partial-quote-samples-not-train \
            --dir research_evidence/i1_original_partial
      - name: Reexecute original signal-to-options source intersection and independent byte oracle
        run: |
          python -m research.tools.v99_r106_i1_original_signal_option_join \
            research_evidence/i1_original_causal/i1_causal_signal.json \
            research_evidence/i1_original_partial \
            research_evidence/i1_fixed_bridge_original_source_join.json
          python -m research.verification.independent_v99_r106_i1_original_signal_option_oracle \
            research_evidence/i1_original_causal/i1_causal_signal.json \
            research_evidence/i1_original_partial \
            research_evidence/i1_fixed_bridge_original_source_join.json
      - name: Enforce original-source block despite successful fixture accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research_evidence/i1_fixed_bridge_original_source_join.json").read_text())
          assert r["original_signal_observations"] == 182
          assert r["positive_original_causal_signals"] == 132
          assert r["signal_source_intersections"] == 0
          assert r["certified_complete_option_lifecycles"] == 0
          assert not r["economic_train_executed"] and not r["promotion_authorized"]
          print("ORIGINAL SOURCE: 182 signal decisions; 0 synchronized tradable pairs; 0 certified lifecycles")
          print("FIXTURE COIN REPLAY != HISTORICAL TRAIN; SOURCE_ONLY/HOLD — NO PROMOTION")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-i1-fixed-vertical-original-veto-${{ github.run_id }}
          path: research_evidence/i1_fixed_bridge_original_source_join.json
          retention-days: 60
          if-no-files-found: warn
