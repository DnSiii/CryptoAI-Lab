name: V99 D1 causal leakage regression (synthetic only)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'scripts/v99_r106_d1_train_only.py'
      - 'scripts/test_v99_r106_d1_causality.py'
      - '.github/workflows/v99-r106-d1-causality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic regression (NOT economic validation)
        run: python scripts/test_v99_r106_d1_causality.py
