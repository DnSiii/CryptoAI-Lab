name: V98 Independent Phase1247 AI Four Source Router Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1247_ai_four_signed_sources.py'
      - 'research/v98_independent/test_phase1247_ai_four_signed_sources.py'
      - '.github/workflows/v98-independent-phase1247-ai-sources.yml'
  workflow_dispatch:
jobs:
  ai-sources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Causal growth opportunity RV stress and four-regime tests
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1247_ai_four_signed_sources
      - name: Raw source digest
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import numpy as np,hashlib
          from phase1247_ai_four_signed_sources import source_bundle
          t=np.arange(330)[:,None]
          c=100*np.exp(t*np.array([.001,-.001,.0005,-.0005])+
              .008*np.sin(t/np.array([9.,11.,13.,15.])))
          z=np.zeros_like(c)
          s=source_bundle(c,c*1.0001,c*.9999,z,z)
          for i in range(4):
              print('AI1247_SOURCE',i,hashlib.sha256(
                  np.asarray(s[i],dtype='<f8').tobytes()).hexdigest())
          print('AI1247_ROUTER',hashlib.sha256(
              '|'.join(s[4]['state']).encode()).hexdigest())
          PY
