name: V98 Independent Phase1001 N Four-Gap Authenticated 90-Cell Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - .github/workflows/v98-independent-phase1001-n-four-gap-90cell.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v98-independent-phase1000-four-asset-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  complete-n-training:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical research runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1' 'pytest==8.3.5'
      - name: Pre-economic source and frozen engine fail-closed regressions
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1000_four_asset_source_policy.py test_phase1001_n_four_gap_90cell.py test_phase935_hourly_drawdown_integrity.py
      - name: Fresh 100 OHLC plus 100 mark plus 100 funding plus 112 daily ZIPs then 90 frozen N cells
        working-directory: research/v98_independent
        run: python phase1001_n_four_gap_90cell.py
      - name: Preserve complete source and economic evidence even on rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase1001-n-four-gap-90cell
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1000_four_asset_source_policy_receipt.json
            research/v98_independent/phase1000_four_asset_conservative_bounds_source_only.csv
            research/v98_independent/phase1001_n_four_gap_90cell_result.json
