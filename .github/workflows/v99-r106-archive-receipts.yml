name: V99 R106 Binance Vision prospective archive receipts

on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_r106_archive_asof_receipt.py'
      - 'research/tests/test_v99_r106_archive_asof_receipt.py'
      - '.github/workflows/v99-r106-archive-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v99-r106-archive-receipt-source-only
  cancel-in-progress: false

jobs:
  receive-and-audit-official-daily-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout research branch without write permission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Python 3.12 without exchange/API credentials
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source-only acquisition invariants
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_archive_asof_receipt.py' -v
      - name: Fetch published official daily OHLCV with native checksum
        run: |
          python -m research.tools.v99_r106_archive_asof_receipt \
            --out research_evidence/v99_r106_archive_receipt
      - name: Independently rehash raw ZIPs in the runner
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research_evidence/v99_r106_archive_receipt')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['status']=='PROSPECTIVE_ARCHIVE_OBSERVED_DATA_ONLY'
          assert manifest['paper_publication_authorized'] is False
          assert manifest['promotion_authorized'] is False
          assert manifest['historical_first_seen_authenticated'] is False
          assert manifest['holdout_accessed'] is False
          for name,asset in sorted(manifest['assets'].items()):
              archive=root/(asset['archive_response']['source_url'].split('/')[-1])
              actual=hashlib.sha256(archive.read_bytes()).hexdigest()
              assert actual==asset['verified_archive_sha256']
              print(name,archive.name,actual)
          print('SOURCE-ONLY archival receipts: all 3 SHA256 checks PASS; not venue-signed')
          PY
      - name: Preserve raw first-party checksum and manifest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-firstparty-archive-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: research_evidence/v99_r106_archive_receipt/
