name: V98 Independent Phase1163 AB Seven-Slot Intents Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1163_ab_sevenslot_intents.py'
      - 'research/v98_independent/test_phase1163_ab_sevenslot_intents.py'
      - '.github/workflows/v98-independent-phase1163-ab-intents.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab-source-intents:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Test complete AB source-only seven-slot intents
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1163_ab_sevenslot_intents.py' -v
      - name: Assert no economic evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research/v98_independent/phase1163_ab_sevenslot_intents.py').read_text()
          assert "'historical_pnl_computed':False" in s
          assert "'stateful_nav_execution_required':True" in s
          print('AB_SOURCE_ONLY_NOT_FROZEN')
          PY
