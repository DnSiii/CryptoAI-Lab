name: CryptoAI V99 R106 Phase53 Serial Dependence Alpha
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths: ["scripts/run_v99_r106_phase53_serial_dependence_alpha_audit.py", ".github/workflows/v99-r106-phase53-serial-dependence-alpha.yml"]
permissions: {contents: write}
jobs:
  phase53:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1", RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - id: cache_date
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: Linux-paper-v15-market-v1-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - run: python -m pip install -e ".[dev]"
      - shell: bash
        run: |
          set -euo pipefail; git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v15.json; do git cat-file -e "FETCH_HEAD:$path"; mkdir -p "$(dirname "$path")"; git show "FETCH_HEAD:$path" > "$path"; done
      - run: python scripts/prepare_dashboard_v15_replay.py
      - run: python scripts/run_v99_r106_phase53_serial_dependence_alpha_audit.py
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase53_serial_dependence_alpha_audit.json').read_text()); assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']; assert r['precommitment']['selection_uses_train_only'] and r['precommitment']['holdout_cannot_change_selected_family']; assert r['precommitment']['no_parameter_grid'] and r['precommitment']['all_features_causal_t_minus_1']; assert r['precommitment']['strategy_change_in_phase53'] is False
          PY
      - shell: bash
        run: |
          set -euo pipefail; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add reports/candidate_v99_r106_phase53_serial_dependence_alpha_audit.json; if git diff --cached --quiet; then exit 0; fi; git commit -m "Record V99 R106 phase53 serial-dependence evidence"; git push origin HEAD:${RESEARCH_BRANCH}
