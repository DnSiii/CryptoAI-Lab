name: V99 R106 C2 preregistered complete engine TRAIN
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_c2_engine.py
      - research/tools/v99_r106_c2_oracle.py
      - research/tests/test_v99_r106_c2_engine.py
      - .github/workflows/v99-r106-c2-complete-engine-train.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preregistered-one-shot-train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preregistered spec and adversarial pre-economic invariants
        run: |
          test -s research/V99_R106_C2_STRUCTURAL_BETA_RELATIVE_INVENTORY_PREREG_20261016.md
          python -m unittest discover -s research/tests -p 'test_v99_r106_c2_engine.py' -v
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: v99-r106-canonical-market
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - name: Fail closed on absent canonical sources
        run: |
          test -s data/canonical/BTCUSDT_1h.csv
          test -s data/canonical/ETHUSDT_1h.csv
      - name: C2 complete TRAIN economics and deterministic replay
        run: |
          python -m research.tools.v99_r106_c2_engine
          cp reports/candidate_v99_r106_c2_complete_train.json /tmp/c2-first.json
          cp research_evidence/v99_r106_c2_severe.csv /tmp/c2-first-severe.csv
          python -m research.tools.v99_r106_c2_engine
          cmp /tmp/c2-first.json reports/candidate_v99_r106_c2_complete_train.json
          cmp /tmp/c2-first-severe.csv research_evidence/v99_r106_c2_severe.csv
          python - <<'PY'
          import json
          r=json.load(open('/tmp/c2-first.json'))
          assert r['economic_trials']==1
          assert not r['validation_market_values_parsed'] and not r['holdout_market_values_parsed']
          assert not r['promotion_authorized'] and not r['paper_publication_authorized']
          print('C2_STATUS',r['status'])
          print('C2_SEVERE_FOLDS',r['severe']['fold_returns'])
          print('C2_SUPERSEVERE_FOLDS',r['supersevere']['fold_returns'])
          print('C2_FAILED_GATES',[k for k,v in r['gates'].items() if not v])
          PY
      - name: Independent original-open accounting and cost-path oracle
        run: |
          python -m research.tools.v99_r106_c2_oracle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-r106-c2-one-shot-train-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            reports/candidate_v99_r106_c2_complete_train.json
            research_evidence/v99_r106_c2_severe.csv
            research_evidence/v99_r106_c2_supersevere.csv
            research_evidence/v99_r106_c2_oracle.json
