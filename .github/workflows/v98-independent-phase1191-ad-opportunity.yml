name: V98 Independent Phase1191 AD Funding Event Opportunity Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1191_ad_funding_event_opportunity.py'
      - 'research/v98_independent/test_phase1191_ad_funding_event_opportunity.py'
      - '.github/workflows/v98-independent-phase1191-ad-opportunity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ad-opportunity-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Validate signed funding-event dislocation and no lookahead
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1191_ad_funding_event_opportunity.py' -v
