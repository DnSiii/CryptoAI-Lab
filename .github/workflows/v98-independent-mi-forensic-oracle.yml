name: V98 Independent MI Read-Only Original Ledger Forensic Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mi-forensic-oracle.yml'
      - 'research/v98_independent/mi_hourly_oracle_gate.py'
      - 'research/v98_independent/v98_independent_hourly_settlement_oracle.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mi-forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download immutable original MI 30-cell receipt and 17543-hour ledger
        uses: actions/download-artifact@v4
        with:
          name: v98-mi-physical-40975970087
          run-id: 40975970087
          github-token: ${{ github.token }}
          path: original-mi
      - name: Download SHA-pinned authenticated training Clean4
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download original SHA-pinned official funding mark envelope
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Test independent sparse-funding calendar and tamper detection
        run: python research/v98_independent/v98_independent_hourly_settlement_oracle.py
      - name: Diagnose missed preregistered core refresh source provenance without changing signal
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import numpy as np
          from v98_clean4_training_reader import load
          d=load('../../official-input');t=16872
          hits=np.argwhere(d['q'][t-671:t+1]<=0)
          print('MI_PREREG_CORE_REFRESH_MISSING_AT_T',t)
          print('MI_672H_QUOTE_ZERO_LOCATIONS',[(int(t-671+i),int(j)) for i,j in hits])
          print('MI_SOURCE_FAIL_CLOSED_NO_RESCUE',True)
          PY
      - name: Independently reconstruct original hourly PnL and reject any discrepancy
        working-directory: research/v98_independent
        run: |
          python mi_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl ../../original-mi/mi_base_full_hourly_forensic.jsonl --receipt ../../original-mi/mi_30cell_receipt.json --output mi_forensic_independent_hourly_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mi-forensic-${{ github.run_id }}
          path: research/v98_independent/mi_forensic_independent_hourly_receipt.json
          retention-days: 30
          if-no-files-found: warn
