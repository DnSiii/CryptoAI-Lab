name: V98 Independent DW Frozen Artifact-Only Economic Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-dw-frozen-forensics.yml'
      - 'research/v98_independent/dw_frozen_forensics.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable DW audited summary only
        uses: actions/download-artifact@v4
        with:
          name: dw30-official-economic-summary
          run-id: 40199461005
          github-token: ${{ github.token }}
          path: frozen-receipts/summary
      - name: Fetch immutable DW core-only 6-cell artifact only
        uses: actions/download-artifact@v4
        with:
          name: dw30-ubuntu-24.04-DW_core_only
          run-id: 40199461005
          github-token: ${{ github.token }}
          path: frozen-receipts/core
      - name: Reconcile frozen core displacement and marginal evidence
        run: python research/v98_independent/dw_frozen_forensics.py
      - uses: actions/upload-artifact@v4
        with:
          name: dw-frozen-economic-forensics
          path: dw_frozen_forensics.json
          retention-days: 30
