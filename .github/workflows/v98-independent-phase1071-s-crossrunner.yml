name: V98 Independent Phase1071 S Two-Runner Authenticated Source-Only
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1071-s-crossrunner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s-authenticated-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned numeric environment
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: S synthetic source, signed mark and two-runner contract tests
        run: python -m unittest -q test_phase1069_s_sevenslot_source.py test_phase1070_s_typed_native_mark.py test_phase1071_s_authenticated_source.py test_phase1072_s_crossrunner_compare.py
      - name: Reacquire official 2022-2024 OHLC and signed native funding marks
        env:
          PYTHONUNBUFFERED: '1'
        run: python phase1071_s_authenticated_source.py
      - name: Preserve signed source receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-s-auth-${{ matrix.os }}
          path: |
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1000_four_asset_source_policy_receipt.json
            research/v98_independent/phase1071_s_authenticated_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
  compare-independent-runners:
    needs: s-authenticated-source
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: v98-s-auth-*
          path: /tmp/s-receipts
          merge-multiple: false
      - name: Compare independently authenticated source, five targets and code blobs
        run: >-
          python research/v98_independent/phase1072_s_crossrunner_compare.py
          /tmp/s-receipts/v98-s-auth-ubuntu-22.04/phase1071_s_authenticated_source_receipt.json
          /tmp/s-receipts/v98-s-auth-ubuntu-24.04/phase1071_s_authenticated_source_receipt.json
          /tmp/phase1072_s_crossrunner_comparison.json
      - name: Preserve independent cross-runner comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-s-crossrunner-comparison
          path: /tmp/phase1072_s_crossrunner_comparison.json
          retention-days: 30
          if-no-files-found: warn
