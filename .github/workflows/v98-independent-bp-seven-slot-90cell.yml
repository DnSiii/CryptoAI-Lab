name: V98 Independent BP Lagged Net Growth Seven Slot 90-Cell Historical Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-bp-seven-slot-90cell.yml'
      - 'research/v98_independent/bp_sources.py'
      - 'research/v98_independent/bp_allocator.py'
      - 'research/v98_independent/bp_90cell.py'
      - 'research/v98_independent/bp_reconcile.py'
      - 'research/v98_independent/bp_independent_receipt_audit.py'
      - 'research/v98_independent/ba_ratio_reversion_governor.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [BP_core_only, BP_full, BP_minus_opportunity, BP_minus_RV, BP_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: BP lagged net-growth breakout relative-value rebound physical settlement
        working-directory: research/v98_independent
        run: |
          python -m py_compile bp_sources.py bp_allocator.py ba_ratio_reversion_governor.py bp_90cell.py bp_reconcile.py
          python bp_sources.py
          python bp_allocator.py
          python ba_ratio_reversion_governor.py
      - name: Retrieve PINNED vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute BP complete actual-open native-funded chronological path x18
        working-directory: research/v98_independent
        run: |
          python bp_90cell.py \
            --path ${{ matrix.path }} \
            --output bp90_${{ matrix.path }}.json || echo 'BP_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bp90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/bp90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify all 18 path cells recorded, never hide failure
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('bp90_BP_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('BP_PATH_SURVIVAL',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bp90-ubuntu-*
          path: receipts
      - name: Independent two-OS 90-cell economic, marginal and causal gate
        run: python research/v98_independent/bp_reconcile.py --root receipts --output bp90_official_economic_summary.json
      - name: Independent original-receipt accounting audit (no BP engine imports)
        run: python research/v98_independent/bp_independent_receipt_audit.py --root receipts --output bp90_independent_arithmetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bp90-independent-arithmetic
          path: bp90_independent_arithmetic.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bp90-official-economic-summary
          path: bp90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  native-event-replay:
    needs: train
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve same pinned original training inputs
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-ubuntu-24.04
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage source without reading 2025
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Independently reconstruct native funding and 81 intrabar corners
        working-directory: research/v98_independent
        run: python bp_event_replay_audit.py --output bp_event_replay_original.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bp-native-event-independent-replay
          path: research/v98_independent/bp_event_replay_original.json
          retention-days: 30
          if-no-files-found: warn
