name: Paper recovery PR regression
on:
  pull_request:
    paths:
      - 'scripts/recover_paper_runtime.py'
      - 'scripts/verify_published_paper_history.py'
      - 'tests/test_paper_recovery.py'
      - '.github/workflows/paper-recovery-pr-ci.yml'
  push:
    branches:
      - 'fix/paper-expired-phantom-cancel-20261115'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-recovery-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile recovery and history verifier
        run: python -m py_compile scripts/recover_paper_runtime.py scripts/verify_published_paper_history.py
      - name: Run paper recovery regression tests
        run: python -m pytest -q tests/test_paper_recovery.py
