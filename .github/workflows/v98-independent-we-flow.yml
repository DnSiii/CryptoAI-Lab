name: V98 Independent WE OHLCV Signed-Flow Full-History Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-we-flow.yml'
      - 'research/v98_independent/we_ohlcv_flow.py'
      - 'research/v98_independent/we_ohlcv_flow_physical.py'
      - 'research/v98_independent/we_ohlcv_flow_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  we-2023-25-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Synthetic OHLCV signed-flow future mutation test before historical data
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/we_ohlcv_flow.py research/v98_independent/we_ohlcv_flow_physical.py research/v98_independent/we_ohlcv_flow_oracle.py
          python research/v98_independent/we_ohlcv_flow.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: Source incidence gate then full 30-cell historical physical training
        run: |
          set -euo pipefail
          python research/v98_independent/we_ohlcv_flow_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir we-physical
      - name: Independent source-signal cash/funding audit and adversarial cash mutation
        run: |
          set -euo pipefail
          if [ -f we-physical/we_base_full_hourly_ledger.csv ]; then
            python research/v98_independent/we_ohlcv_flow_oracle.py \
              --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
              --new-root new --corrected-root corrected --out-dir we-physical
          else
            echo 'WE_PREREG_SOURCE_INCIDENCE_REJECTED_NO_PNL'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-we-flow-2023-25-exposed-not-validated
          path: we-physical/
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce explicit economic candidate gate (rejection must not be green)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('we-physical/we_source.json').read_text())
          if source['decision'].startswith('REJECT'):
              raise SystemExit('WE_PREREG_REJECTED_NO_ENGINE')
          receipt=json.loads(Path('we-physical/we_exposed_physical.json').read_text())
          for tier in ('base','severe','supersevere'):
              row=next(x for x in receipt['cells'] if x['book']=='WE_full' and x['tier']==tier and x['order']=='carried_before_fill')
              print('WE_FINAL_METRICS',tier,json.dumps({'cagr':row.get('cagr'),'max_dd':row.get('max_dd'),'annual_returns':row.get('annual_returns'),'fees':row.get('fees_spread_impact'),'funding':row.get('signed_funding'),'final_equity':row.get('final_equity')},sort_keys=True),flush=True)
          print('WE_BASE_MARGINALS',json.dumps(receipt['marginals'].get('base/carried_before_fill'),sort_keys=True),flush=True)
          print('WE_SEVERE_MARGINALS',json.dumps(receipt['marginals'].get('severe/carried_before_fill'),sort_keys=True),flush=True)
          print('WE_GATE_FAILURES',json.dumps(receipt['failures']),flush=True)
          if receipt['decision'].startswith('REJECT'):
              raise SystemExit('WE_ECONOMIC_REJECTED_NO_ENGINE')
          assert receipt['decision']=='PASS_WE_EXPOSED_TRAINING_ONLY_NOT_VALIDATED'
          assert Path('we-physical/we_independent_oracle.json').exists()
          print('WE_EXPOSED_ONLY_NOT_ENGINE_APPROVAL')
          PY
