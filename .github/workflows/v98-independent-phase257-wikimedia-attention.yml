name: V98 Independent Phase257 Wikimedia Attention DATA ONLY
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase257-wikimedia-attention.yml'
      - 'research/v98_independent/phase257_wikimedia_attention.py'
      - 'research/v98_independent/test_phase257_wikimedia_attention.py'
      - 'research/v98_independent/phase257_wikimedia_attention_prereg.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase257-wikimedia-attention
  cancel-in-progress: false
jobs:
  data-only:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Phase257 data-only invariants
        run: python -m pytest -q research/v98_independent/test_phase257_wikimedia_attention.py
      - name: Acquire Wikimedia attention twice
        run: |
          python research/v98_independent/phase257_wikimedia_attention.py --out-dir /tmp/p257a_data --manifest /tmp/p257a.json
          python research/v98_independent/phase257_wikimedia_attention.py --out-dir /tmp/p257b_data --manifest /tmp/p257b.json
          cmp /tmp/p257a_data/pageviews_daily.csv /tmp/p257b_data/pageviews_daily.csv
          cmp /tmp/p257a.json /tmp/p257b.json
          mkdir -p research/v98_independent/data/phase257_wikimedia_attention
          cp /tmp/p257a_data/pageviews_daily.csv research/v98_independent/data/phase257_wikimedia_attention/pageviews_daily.csv
          cp /tmp/p257a.json research/v98_independent/phase257_wikimedia_attention_manifest.json
      - name: Enforce DATA_ONLY firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase257_wikimedia_attention_manifest.json'))
          assert p['phase']==257 and p['kind']=='DATA_ONLY_PUBLIC_ATTENTION'
          assert p['decision'] in {'PASS_DATA_ONLY','FAIL_DATA_NO_ALPHA'}
          assert p['alpha_executed'] is False and p['pnl_executed'] is False
          assert p['crypto_price_join'] is False and p['direction_selected'] is False
          assert p['parameter_search'] is False
          assert p['validation_accessed'] is False and p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert p['expected_days_per_asset']==1096
          print('Phase257',p['decision'])
          PY
      - name: Commit Phase257 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase257_wikimedia_attention_manifest.json research/v98_independent/data/phase257_wikimedia_attention/pageviews_daily.csv
          if git diff --cached --quiet; then
            echo no-result-change
          else
            git commit -m "v98 phase257: record Wikimedia attention DATA_ONLY evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v98-phase257-wikimedia-attention-${{ github.run_id }}
          retention-days: 30
          path: |
            research/v98_independent/phase257_wikimedia_attention_manifest.json
            research/v98_independent/data/phase257_wikimedia_attention/pageviews_daily.csv
