name: V98 Independent AT Funding Acceleration Composed 90-Cell Historical Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-at-90cell-training.yml'
      - 'research/v98_independent/at_composed_sources.py'
      - 'research/v98_independent/at_composed_allocator.py'
      - 'research/v98_independent/at_90cell_training.py'
      - 'research/v98_independent/at_90cell_reconcile.py'
      - 'research/v98_independent/v98_staged_exit_viability_governor_v2.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [AT_core_only, AT_full, AT_minus_opportunity, AT_minus_RV, AT_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: AT causal-source, allocator, syntax and signed-settlement preflight
        working-directory: research/v98_independent
        run: |
          python -m py_compile at_composed_sources.py at_composed_allocator.py at_90cell_training.py at_90cell_reconcile.py
          python at_composed_sources.py
          python at_composed_allocator.py
          python v98_staged_exit_viability_governor_v2.py
      - name: Retrieve pinned vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute AT complete actual-open funded chronological path x18
        working-directory: research/v98_independent
        run: |
          python at_90cell_training.py \
            --path ${{ matrix.path }} \
            --output at90_${{ matrix.path }}.json || echo 'AT_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: at90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/at90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Check complete 18-cell receipt, without suppressing failed gates
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('at90_AT_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('AT_PATH_MECHASICAL',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: at90-ubuntu-*
          path: receipts
      - name: Independent two-OS numeric and 90-cell economic reconciliation
        run: python research/v98_independent/at_90cell_reconcile.py --root receipts --output at90_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: at90-official-economic-summary
          path: at90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
