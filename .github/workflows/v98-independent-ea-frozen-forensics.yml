name: V98 Independent EA Frozen Artifact-Only Capital Displacement Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ea-frozen-forensics.yml'
      - 'research/v98_independent/ea_frozen_forensics.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable official EA summary (no market data)
        uses: actions/download-artifact@v4
        with:
          name: ea30-official-economic-summary
          run-id: 40208343866
          github-token: ${{ github.token }}
          path: frozen-receipts/summary
      - name: Download immutable EA core-only receipt (no market data)
        uses: actions/download-artifact@v4
        with:
          name: ea30-ubuntu-22.04-EA_core_only
          run-id: 40208343866
          github-token: ${{ github.token }}
          path: frozen-receipts/core
      - name: Frozen artifact-only marginal and core capital audit
        run: python research/v98_independent/ea_frozen_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ea-frozen-forensics
          path: ea_frozen_forensics.json
          retention-days: 30
          if-no-files-found: warn
