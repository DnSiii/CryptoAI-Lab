name: V99 R106 Phase180 block stress invariants
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/v99_r106_phase180_block_stress_features.py'
      - 'research/test_v99_r106_phase180_block_stress_features.py'
      - '.github/workflows/v99-r106-phase180-block-stress-invariants.yml'
  workflow_dispatch:
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: pytest -q research/test_v99_r106_phase180_block_stress_features.py
