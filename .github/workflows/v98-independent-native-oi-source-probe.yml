name: V98 Independent Native Open Interest 2023-24 Source-Only Probe
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-native-oi-source-probe.yml'
      - 'research/v98_independent/v98_oi_native_source_probe_20261027.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 2023-24 Binance USD-M official OI metrics source only (no 2025, no PnL)
        shell: bash
        run: |
          python -m py_compile research/v98_independent/v98_oi_native_source_probe_20261027.py
          set +e
          python research/v98_independent/v98_oi_native_source_probe_20261027.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s research/v98_independent/v98_oi_native_source_probe_20261027.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-oi-sample-source-only-20261027
          path: research/v98_independent/v98_oi_native_source_probe_20261027.json
          retention-days: 30
          if-no-files-found: warn
