name: V98 Independent Phase1234 AH Signed Variation Margin
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1234_ah_signed_variation_margin.py'
      - 'research/v98_independent/test_phase1234_ah_signed_variation_margin.py'
      - '.github/workflows/v98-independent-phase1234-ah-margin.yml'
  workflow_dispatch:
jobs:
  ah-margin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4
      - name: Verify signed futures margin, funding and 250 adversarial positions
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1234_ah_signed_variation_margin
      - name: Deterministic signed-cash receipt digest
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import hashlib,numpy as np
          from phase1234_ah_signed_variation_margin import settle_hour
          p=np.array([100.,150.,50.,200.])
          q=np.full(4,1e12)
          z=np.zeros(4)
          r=settle_hour(10000.,z,p,p,p*1.001,p*.999,p,
             np.array([1.,-.5,.4,-.1]),q,q,np.full(4,.2),
             np.full(4,.2),np.full(4,.002),z,z,p*.99,p*1.01)
          payload=np.r_[r['cash'],r['units'],r['turnover'],r['fees'],
             r['slippage'],r['funding'],r['maintenance_at_close']]
          print('AH1234_SHA256',hashlib.sha256(
             np.round(payload,8).astype('<f8').tobytes()).hexdigest())
          print('AH1234_CASH',r['cash'])
          PY
