name: V99 R106 Phase179 Insurance Integrity

on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase179_insurance_manifest.py'
      - 'tests/test_v99_phase179_insurance_manifest.py'
      - '.github/workflows/v99-r106-phase179-insurance-integrity.yml'
  workflow_dispatch:

jobs:
  invariant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Phase179 fail-closed invariants
        run: python -m pytest -q tests/test_v99_phase179_insurance_manifest.py
