name: CryptoAI V99 R106 Phase54 Alpha Frontier Failure Map
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths: ["scripts/run_v99_r106_phase54_alpha_frontier_failure_map.py", ".github/workflows/v99-r106-phase54-alpha-frontier-failure-map.yml"]
permissions: {contents: write}
jobs:
  phase54:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python scripts/run_v99_r106_phase54_alpha_frontier_failure_map.py
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase54_alpha_frontier_failure_map.json').read_text()); assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']; assert r['discipline']['reads_holdout_metrics'] is False and r['discipline']['selection_or_strategy_change'] is False
          PY
      - shell: bash
        run: |
          set -euo pipefail; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add reports/candidate_v99_r106_phase54_alpha_frontier_failure_map.json; if git diff --cached --quiet; then exit 0; fi; git commit -m "Record V99 R106 phase54 alpha-frontier failure map"; git push origin HEAD:${RESEARCH_BRANCH}
