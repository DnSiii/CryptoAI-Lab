name: V98 Independent KI Terminal Growth and Turnover Attribution
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ki-attribution.yml'
      - 'research/v98_independent/ki_original_receipt_attribution.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ki30-ubuntu-*
          run-id: 40774467065
          github-token: ${{ github.token }}
          path: original-receipts
      - name: Independent original KI 60-receipt terminal growth/cost attribution
        run: |
          python -m py_compile research/v98_independent/ki_original_receipt_attribution.py
          python research/v98_independent/ki_original_receipt_attribution.py --root original-receipts --output ki_terminal_cost_attribution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ki-terminal-cost-attribution
          path: ki_terminal_cost_attribution.json
          retention-days: 30
          if-no-files-found: warn
