name: V98 Independent JN Native Taker Source Integrity (No PnL)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-jn-taker-source.yml'
      - 'research/v98_independent/jn_native_taker_flow_prereg_20261028.md'
      - 'research/v98_independent/jn_native_taker_source_integrity.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned Clean-4 2022-2024 source only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage immutable canonical Clean-4 files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent/phase243_clean4_canonical')
          target.mkdir(parents=True,exist_ok=True)
          for asset in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT'):
              name=asset+'_1h.csv'
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Download, verify official Binance 100 native taker-buy archives and canonical parity
        working-directory: research/v98_independent
        run: |
          python -m py_compile jn_native_taker_source_integrity.py
          python jn_native_taker_source_integrity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jn-authenticated-2022-2024-native-taker-source
          path: |
            research/v98_independent/jn_native_taker_flow_source.csv
            research/v98_independent/jn_native_taker_flow_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
