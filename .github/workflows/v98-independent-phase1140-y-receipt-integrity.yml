name: V98 Independent Phase1140 Y Read-Only Receipt Integrity Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1140-y-receipt-integrity.yml'
      - 'research/v98_independent/phase1140_y_receipt_consistency.py'
      - 'research/v98_independent/test_phase1140_y_receipt_consistency.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  y-independent-receipt-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Independent synthetic receipt consistency only
        run: python -m unittest -v test_phase1140_y_receipt_consistency.py
      - name: Verify immutable frozen economic engine is unchanged
        run: python -c 'from phase1136_y_frozen_training_path import verify_freeze; assert verify_freeze()["decision"]=="FROZEN_Y_FULL_PRE_ECONOMIC"'
