name: V99 Phase195-BT Accounting Oracle
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'scripts/v99_phase195bt_*.py'
      - 'tests/test_v99_phase195bt_core.py'
      - '.github/workflows/v99-r106-phase195bt-accounting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_v99_phase195bt_core.py' -v
