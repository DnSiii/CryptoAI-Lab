name: V99 I1 original-source t-1 variance signal bridge (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_causal_variance_signal.py
      - research/verification/independent_v99_r106_i1_causal_signal_oracle.py
      - .github/workflows/v99-r106-i1-causal-variance-signal.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-causal-train-signals-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ex ante signal preregistration predates executable implementation
        run: |
          git cat-file -e ce965d4b0feaaa713ee39dd70fc249d1e9e57b9e^{commit}
          test -s research/V99_R106_I1_CAUSAL_VARIANCE_SIGNAL_PREREG_20261026.md
      - name: Restore original independently verified TRAIN-only spot receipts
        run: |
          gh run download 40019588739 --repo "$GITHUB_REPOSITORY" \
            --name d1-train-four-leg-backfill-40019588739 \
            --dir research_evidence/i1_original_okx
      - name: Restore original independently verified TRAIN-only DVOL receipts
        run: |
          gh run download 40072202459 --repo "$GITHUB_REPOSITORY" \
            --name v99-deribit-dvol-original-pit-train \
            --dir research_evidence/i1_original_dvol
      - name: Actually compute all 91 x 2 original-source lagged decisions
        run: |
          python -m research.tools.v99_r106_i1_causal_variance_signal \
            research_evidence/i1_original_okx research_evidence/i1_original_dvol \
            research_evidence/i1_causal_signal
      - name: Independently replay original receipts and adversarial future/forged-result controls
        run: |
          python -m research.verification.independent_v99_r106_i1_causal_signal_oracle \
            research_evidence/i1_original_okx research_evidence/i1_original_dvol \
            research_evidence/i1_causal_signal/i1_causal_signal.json
      - name: Assert original causal research only; no option fills or ROI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_evidence/i1_causal_signal')
          a=json.loads((root/'i1_causal_signal.json').read_text())
          b=json.loads((root/'i1_causal_signal_independent_oracle.json').read_text())
          assert a['observations']==182 and a['eligible_weeks']==91
          assert b['status']=='INDEPENDENT_ORIGINAL_T_MINUS_ONE_SIGNAL_MATCH'
          assert b['future_price_mutation_invariant'] and b['tampered_report_rejected']
          assert a['counts']==b['counts']
          no_history=sum(a['counts'][str(f)][asset]['no_history']
                         for f in range(1,6) for asset in ('BTC','ETH'))
          assert no_history==8, no_history
          assert not any(a[k] for k in ('economic_train_executed',
              'fills_authenticated','native_fees_authenticated',
              'native_margin_authenticated','validation_opened',
              'holdout_opened','orders_enabled','promotion_authorized'))
          print('REAL ORIGINAL CAUSAL SIGNALS:',182-no_history,'/',182,
                'after fixed 30d warmup; 0 historical option lifecycles')
          print('NO ECONOMIC TRAIN / NO ROI / NO ORDERS / NO PROMOTION')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-i1-original-causal-signal-${{ github.run_id }}
          path: research_evidence/i1_causal_signal/
          retention-days: 90
          if-no-files-found: warn
