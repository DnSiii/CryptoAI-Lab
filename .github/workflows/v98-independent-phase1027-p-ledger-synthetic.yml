name: V98 Independent Phase1027 P Synthetic Funded Ledger
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - .github/workflows/v98-independent-phase1027-p-ledger-synthetic.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v98-independent-phase1027-p-ledger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p-ledger-synthetic:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: P source, canonical transport and funded-ledger synthetic-only regression
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1024_1025_p_source_and_governor.py test_phase1026_p_canonical_transport.py test_phase1027_p_funded_ledger_hourly.py
