name: V98 Independent Official Spot Dec2022 Gap Forensics Only
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-spot-gap-forensics.yml'
      - 'research/v98_independent/spot_perp_gap_forensics.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gap-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify official Dec2022 spot checksums and identify exact missing UTC timestamps
        run: python research/v98_independent/spot_perp_gap_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-spot-dec2022-gap-evidence
          path: research/v98_independent/spot_perp_gap_forensics.json
          retention-days: 30
          if-no-files-found: warn
