name: V99 R106 D1 C167 preregistered decisions to independent accounts (SOURCE ONLY)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/verification/independent_d1_c167_preregistered_account_binding.py'
      - 'research/tests/test_v99_r106_d1_c167_preregistered_account_binding.py'
      - '.github/workflows/v99-r106-d1-c167-prereg-account-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pytest runner
        run: python -m pip install 'pytest==8.3.5'
      - name: C167 exact D1 decision to ledger binding plus C165 C140 C128 C129
        run: |
          python -m pytest -q research/tests/test_v99_r106_d1_c167_preregistered_account_binding.py research/tests/test_v99_r106_d1_c165_two_cost_path_bridge.py research/tests/test_v99_r106_d1_c140_hourly_journal.py research/tests/test_v99_r106_d1_cash_inventory_oracle_cycle128.py research/tests/test_v99_r106_d1_hourly_account_bridge_cycle129.py
      - name: Independent original source and fee veto regressions
        run: |
          python -m unittest research.tests.test_v99_r106_d1_c162_exact_native_fee_reexecution research.tests.test_v99_r106_d1_c161_causal_decision_oracle research.tests.test_v99_r106_d1_c160_integrated_structural_chain research.tests.test_v99_r106_d1_c159_full_funding_closure research.tests.test_v99_r106_d1_c158_risk_folds research.tests.test_v99_r106_d1_c157_accounting_cold_start research.tests.test_v99_r106_d1_c155_prereg_source research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Fail closed on economic permissions
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p=report_permissions()
          assert all(p[k] is False for k in ('historical_train_economics_run','validation_opened','final_holdout_opened','promotion_authorized','real_orders_enabled','paper_publication_authorized'))
          print('C167 SOURCE ONLY / NO HISTORICAL ROI / DATA_ONLY HOLD / NO PROMOTION')
          PY
