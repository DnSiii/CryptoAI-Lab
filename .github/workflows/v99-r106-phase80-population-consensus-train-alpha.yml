name: CryptoAI V99 R106 Phase80 Population Consensus Train Alpha
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths: ["scripts/run_v99_r106_phase80_population_consensus_train_alpha.py", ".github/workflows/v99-r106-phase80-population-consensus-train-alpha.yml"]
permissions: {contents: write}
concurrency: {group: v99-r106-phase80-population-consensus-train-alpha, cancel-in-progress: false}
jobs:
  phase80:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1", RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - id: cache_date
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: Linux-paper-v15-market-v1-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - run: python -m pip install -e ".[dev]"
      - shell: bash
        run: |
          set -euo pipefail; git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v15.json; do git cat-file -e "FETCH_HEAD:$path"; mkdir -p "$(dirname "$path")"; git show "FETCH_HEAD:$path" > "$path"; done
      - run: python scripts/prepare_dashboard_v15_replay.py
      - run: python scripts/run_v99_r106_phase80_population_consensus_train_alpha.py
      - name: Guard and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase80_population_consensus_train_alpha.json').read_text())
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['precommitment']['holdout_not_parsed'] and r['precommitment']['single_hypothesis_no_grid'] and r['precommitment']['missing_archives_not_filled'] and r['precommitment']['same_hour_pair_required'] and r['precommitment']['fixed_equal_log_weight_no_parameter']
          assert r['status'] in ('TRAIN_ALPHA_PASS_FREEZE_FOR_DOWNSTREAM','TRAIN_ALPHA_REJECT')
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase80_population_consensus_train_alpha.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 Phase80 train-only population consensus gate"
          git fetch origin ${RESEARCH_BRANCH}; git rebase origin/${RESEARCH_BRANCH}; git push origin HEAD:${RESEARCH_BRANCH}
# Trigger after workflow registration; preregistered specification unchanged.
