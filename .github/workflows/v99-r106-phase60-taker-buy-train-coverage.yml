name: CryptoAI V99 R106 Phase60 Taker Buy Train Coverage
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - scripts/run_v99_r106_phase60_taker_buy_train_coverage_audit.py
      - .github/workflows/v99-r106-phase60-taker-buy-train-coverage.yml
permissions: {contents: write}
jobs:
  phase60:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python scripts/run_v99_r106_phase60_taker_buy_train_coverage_audit.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase60_taker_buy_train_coverage_audit.json').read_text())
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['precommitment']['feature_values_after_train_end_not_parsed'] and r['precommitment']['no_holdout_inspection'] and r['precommitment']['no_returns']
          # A failed coverage gate is valid evidence, not a workflow failure. Alpha remains blocked.
          assert r['status'] in ('TRAIN_COVERAGE_PASS','TRAIN_COVERAGE_FAIL_NO_ALPHA')
          PY
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase60_taker_buy_train_coverage_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 phase60 train-only taker-buy coverage"
          git push origin HEAD:research/v99-r106-native-all-regime-engine
