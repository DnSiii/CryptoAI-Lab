name: V99 original-byte evidence adversarial gate
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'scripts/verify_v99_epoch_raw_evidence.py'
      - 'scripts/validate_v99_forward_epoch_manifest.py'
      - 'tests/test_v99_epoch_raw_evidence_gate.py'
      - '.github/workflows/v99-r106-raw-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial raw original-byte provenance tests
        run: python -m unittest discover -s tests -p 'test_v99_epoch_raw_evidence_gate.py' -v
