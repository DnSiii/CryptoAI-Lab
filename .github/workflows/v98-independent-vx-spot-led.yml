name: V98 Independent VX Spot-Led Seven-Slot Causal Historical Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-vx-spot-led.yml'
      - 'research/v98_independent/vx_spot_led_composed.py'
      - 'research/v98_independent/vx_spot_led_physical.py'
      - 'research/v98_independent/vx_spot_led_composed_prereg_20261102.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vx-exposed-2025-causal-source-gate:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numerical dependency
        run: python -m pip install numpy==1.26.4
      - name: Compile and test future mutation firewall before reading history
        run: |
          python -m py_compile research/v98_independent/vx_spot_led_composed.py
          python research/v98_independent/vx_spot_led_composed.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-spot-2025-masked-source-only
          run-id: 41328347003
          github-token: ${{ github.token }}
          path: spot25
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: nh25
      - name: Historical 2025 exposed source and target-incidence gate only
        working-directory: research/v98_independent
        env:
          SPOT: ${{ github.workspace }}/spot25
          NH: ${{ github.workspace }}/nh25
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from vw_native_carry_physical import load
          from vx_spot_led_composed import from_vw_data,source_gate,decisions,books,SLOTS
          d=from_vw_data(load(os.environ['SPOT'],os.environ['NH']))
          gate=source_gate(d)
          dec=decisions(d)
          targets=books(d)
          counts={slot:sum(float(abs(v['weights'][i]).sum())>1e-12 for v in dec.values()) for i,slot in enumerate(SLOTS)}
          regimes={r:sum(v['regime']==r for v in dec.values()) for r in ('risk_on','risk_off','mixed')}
          result={'decision':'PASS_VX_EXPOSED_SOURCE_AND_TARGETS_ONLY_NOT_PNL',
                  'source':gate,'decisions':len(dec),'books':len(targets),
                  'sleeve_active_decisions':counts,'regimes':regimes,
                  '2025_exposed_training_only':True,'2026_accessed':False,
                  'historical_pnl_computed':False,'exact_marks_authenticated':False,
                  'account_costs_authenticated':False,'independent_physical_audit':False,
                  'holdout_accessed':False,'benchmarks_accessed':False,
                  'paper_live_authorized':False}
          Path('vx_source_only_receipt.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('VX_SOURCE_ONLY',json.dumps(result,sort_keys=True),flush=True)
          PY
      - name: Execute 30 physical exposed-training cost/funding cells (not validation)
        run: |
          python research/v98_independent/vx_spot_led_physical.py --spot-dir spot25 --nh-dir nh25 --out-dir vx-physical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-vx-2025-exposed-physical-not-validated
          path: vx-physical/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-vx-exposed-2025-source-only-not-engine
          path: research/v98_independent/vx_source_only_receipt.json
          retention-days: 30
          if-no-files-found: warn
