name: V98 Independent Phase263 Developer Acceleration RV
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase263-developer-rv.yml'
      - 'research/v98_independent/phase263_developer_acceleration_rv.py'
      - 'research/v98_independent/test_phase263_developer_acceleration_rv.py'
      - 'research/v98_independent/phase263_developer_acceleration_rv_prereg.md'
      - 'research/v98_independent/phase262_developer_activity_manifest.json'
      - 'research/v98_independent/data/phase262_developer_activity/monthly_commits.csv'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase263-developer-rv
  cancel-in-progress: false
jobs:
  training:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Restore/save authenticated Clean-4 cache
        uses: ./.github/actions/v98-independent-clean4-cache
      - name: Phase263 causality and invariant tests
        run: PYTHONPATH=src python -m pytest -q research/v98_independent/test_phase263_developer_acceleration_rv.py
      - name: Verify frozen Phase262 source
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=Path('research/v98_independent/phase262_developer_activity_manifest.json')
          c=Path('research/v98_independent/data/phase262_developer_activity/monthly_commits.csv')
          p=json.loads(m.read_text())
          assert p['phase']==262 and p['decision']=='PASS_DATA_ONLY'
          assert p['pnl_executed'] is False and p['crypto_price_join'] is False
          assert hashlib.sha256(c.read_bytes()).hexdigest()==p['normalized_csv_sha256']
          print('Phase262 frozen source verified')
          PY
      - name: Rebuild and revalidate authenticated Clean-4
        run: python research/v98_independent/phase243_clean4_source_pipeline.py --attempts 3
      - name: Execute frozen Phase263 twice
        run: |
          python research/v98_independent/phase263_developer_acceleration_rv.py --out /tmp/p263a.json
          python research/v98_independent/phase263_developer_acceleration_rv.py --out /tmp/p263b.json
          cmp /tmp/p263a.json /tmp/p263b.json
          cp /tmp/p263a.json research/v98_independent/phase263_developer_acceleration_rv_results.json
      - name: Enforce Phase263 firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase263_developer_acceleration_rv_results.json'))
          assert p['phase']==263 and p['training_only'] is True and p['validation'] is None
          assert p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert p['parameters']['recent_months']==3 and p['parameters']['prior_months']==3
          assert p['parameters']['long_budget']==0.125 and p['parameters']['short_budget']==0.125
          assert p['parameters']['overlay_gross_cap']==0.25 and p['parameters']['system_gross_cap']==1.25
          assert p['rv_activity']['max_abs_overlay_net']<=1e-12
          assert p['rv_activity']['max_overlay_gross']<=0.250000001
          assert p['diagnostics']['max_open_gross']<=1.250000001
          assert p['gate']['decision'] in {'DEVELOPER_ACCELERATION_RV_CANDIDATE','REJECT_DEVELOPER_ACCELERATION_RV_NO_RESCUE'}
          print('Phase263',p['gate']['decision'])
          PY
      - name: Commit Phase263 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase263_developer_acceleration_rv_results.json
          if git diff --cached --quiet; then
            echo no-result-change
          else
            git commit -m "v98 phase263: record developer-acceleration RV evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v98-phase263-developer-rv-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: research/v98_independent/phase263_developer_acceleration_rv_results.json
