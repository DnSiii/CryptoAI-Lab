name: V98 OA Independent 105-Decision Allocation Oracle (No PnL)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-oa-allocator-oracle.yml'
      - 'research/v98_independent/oa_independent_allocator_oracle.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  oa-independent-allocator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Independent 105-decision allocator replay and tamper test
        working-directory: research/v98_independent
        run: |
          python -m py_compile oa_sources.py oa_intents.py oa_independent_allocator_oracle.py
          python oa_independent_allocator_oracle.py --root ../../official-input --output oa_independent_allocator_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-oa-independent-allocator-${{ github.run_id }}
          path: research/v98_independent/oa_independent_allocator_receipt.json
          retention-days: 30
          if-no-files-found: error
