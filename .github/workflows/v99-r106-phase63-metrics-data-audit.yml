name: CryptoAI V99 R106 Phase63 Metrics Data Audit
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths: ["scripts/run_v99_r106_phase63_metrics_data_audit.py", ".github/workflows/v99-r106-phase63-metrics-data-audit.yml"]
permissions: {contents: write}
concurrency: {group: v99-r106-phase63-metrics-data-audit, cancel-in-progress: false}
jobs:
  phase63:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {PYTHONUNBUFFERED: "1", RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python scripts/run_v99_r106_phase63_metrics_data_audit.py
      - name: Guard and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase63_metrics_data_audit.json').read_text())
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['holdout_not_listed_or_parsed'] and r['alpha_prohibited']
          assert r['status']=='DATA_AUDIT_COMPLETE'
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase63_metrics_data_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 Phase63 orthogonal metrics data audit"
          git fetch origin ${RESEARCH_BRANCH}; git rebase origin/${RESEARCH_BRANCH}; git push origin HEAD:${RESEARCH_BRANCH}
