name: V98 Independent IJ Frozen Artifact Only Economic First Fault
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ij-frozen-artifact-first-fault.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  immutable-artifact-first-fault:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ij30-official-economic-summary
          run-id: 40498899285
          github-token: ${{ github.token }}
          path: ij-frozen-audit
      - name: Read only original frozen IJ independent economic receipt, no source/PnL rerun
        shell: bash
        run: |
          python - <<'PY'
          import json,glob
          from pathlib import Path
          p=glob.glob('ij-frozen-audit/**/*.json',recursive=True)
          assert len(p)==1,p
          x=json.load(open(p[0]))
          assert x['architecture']=='IJ' and x['cells_survived']==30
          assert x['cross_os_reproducible'] and not x['errors']
          assert x['decision']=='REJECT_IJ_HISTORICAL_GROWTH_OR_MARGINAL'
          assert x['validation_2025_read'] is False
          print('IJ_FROZEN_ORIJINAL_DECISION',x['decision'])
          print('IJ_FROZEN_MARGINAL_GATES',json.dumps(x['marginal_gates_10k'],sort_keys=True))
          for sleeve,bycell in x['marginal_log_growth_10k'].items():
              for key in sorted(bycell):
                  if key.startswith('immediate|base|') or key.startswith('immediate|severe|'):
                      print('IJ_FROZEN_MARGINAL',sleeve,key,json.dumps(bycell[key],sort_keys=True))
          for label in ('full_10k_base','full_10k_severe'):
              z=x[label]
              print('IJ_FROZEN_FULL',label,'cagr',z['two_year_cagr'],
                    'dd',z['max_drawdown'],'turnover',z['turnover'],
                    'funding',z['funding'],'fees',z['fees'],
                    'slippage',z['slippage'],'pf',z['hourly_net_profit_factor'],
                    'payoff',z['hourly_net_payoff'],
                    'win',z['hourly_net_win_rate'],
                    'positive_days',z['positive_utc_days'],
                    'cvar',z['hourly_cvar_1pct'],
                    'concentration',z['max_single_asset_gross_concentration'])
          out={'source_run_id':40498899285,'original_decision':x['decision'],
               'marginal_gates':x['marginal_gates_10k'],
               'marginal_log_growth':x['marginal_log_growth_10k'],
               'historical_training_only':True,'holdout_read':False,
               'economic_pnl_recomputed':False,'trading_authorized':False}
          Path('ij_frozen_first_fault_receipt.json').write_text(
              json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ij-frozen-original-artifact-first-fault
          path: ij_frozen_first_fault_receipt.json
          retention-days: 30
