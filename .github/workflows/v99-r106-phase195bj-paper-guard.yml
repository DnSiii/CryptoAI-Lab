name: V99 Phase195-BJ Research Paper Publication Firewall
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'scripts/v99_phase195bj_paper_publication_guard.py'
      - 'tests/test_v99_phase195bj_paper_publication_guard.py'
      - 'scripts/paper_once_v99_research_variants_v2.py'
      - '.github/workflows/v99-r106-phase195bj-paper-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile isolated research scripts
        run: python -m py_compile scripts/v99_phase195bj_paper_publication_guard.py scripts/paper_once_v99_research_variants_v2.py
      - name: Run adversarial offline publication invariants
        run: python -m unittest discover -s tests -p 'test_v99_phase195bj_paper_publication_guard.py' -v
