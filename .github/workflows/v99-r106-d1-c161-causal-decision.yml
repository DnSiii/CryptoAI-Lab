name: V99 R106 D1 C161 causal feature decision oracle (SOURCE ONLY)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/verification/independent_d1_c161_causal_decision_oracle.py'
      - 'research/tests/test_v99_r106_d1_c161_causal_decision_oracle.py'
      - '.github/workflows/v99-r106-d1-c161-causal-decision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full TRAIN independent causal features plus previous structural gates
        run: |
          python -m unittest research.tests.test_v99_r106_d1_c161_causal_decision_oracle research.tests.test_v99_r106_d1_c160_integrated_structural_chain research.tests.test_v99_r106_d1_c159_full_funding_closure research.tests.test_v99_r106_d1_c158_risk_folds research.tests.test_v99_r106_d1_c157_accounting_cold_start research.tests.test_v99_r106_d1_c156_native_lot_smoke research.tests.test_v99_r106_d1_c153_pair_lattice research.tests.test_v99_r106_d1_c155_prereg_source research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Zero economic promotion permission
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p=report_permissions()
          assert all(not p[k] for k in ('historical_train_economics_run',
              'validation_opened','final_holdout_opened','promotion_authorized',
              'real_orders_enabled','paper_publication_authorized'))
          print('C161 DATA_ONLY/HOLD; no first-party authentication, ROI or promotion')
          PY
