name: V99 I1 original options bytes to native event identity (NO ECONOMIC TRAIN)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_original_event_quote_identity.py
      - research/tests/test_v99_r106_i1_original_event_quote_identity.py
      - .github/workflows/v99-r106-i1-original-event-quote-identity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-quote-event-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preregistration precedes implementation
        run: |
          git merge-base --is-ancestor 1076e8c6b446d92b7654451f8af098d1407f6fc8 HEAD
          test -s research/V99_R106_I1_ORIGINAL_EVENT_QUOTE_IDENTITY_PREREG_20261028.md
      - name: Run original-byte quote identity and adversarial controls
        run: python -m unittest -v research.tests.test_v99_r106_i1_original_event_quote_identity
      - name: Confirm actual original archive missing and economic gate remains closed
        run: |
          python - <<'PY'
          import tempfile
          from research.tests.test_v99_r106_i1_original_event_quote_identity import input_document
          from research.tools.v99_r106_i1_original_event_quote_identity import audit
          with tempfile.TemporaryDirectory() as root:
              try:
                  audit(root, input_document()[0])
              except ValueError as exc:
                  assert str(exc) == 'ORIGINAL_661D_MANIFEST_NOT_DELIVERED', str(exc)
                  print('BLOCKED_ORIGINAL_661D_LICENSED_ARCHIVE_NOT_DELIVERED')
                  print('0/180 certified original option lifecycles; NO PROMOTION/ORDERS')
              else:
                  raise AssertionError('MISSING_ORIGINAL_ARCHIVE_BYPASS')
          PY
