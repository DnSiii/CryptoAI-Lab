name: V98 Independent Clean-4 archive regression
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase243_clean4_archive_ingest.py'
      - 'research/v98_independent/phase243_clean4_official_archive_acquire.py'
      - 'research/v98_independent/test_phase243_clean4_official_archive_acquire.py'
      - 'research/v98_independent/test_phase243_clean4_archive_ingest.py'
      - 'research/v98_independent/phase243_binance_archive_ingest.py'
      - 'research/v98_independent/phase243_sell_residual_conservation.py'
      - '.github/workflows/v98-independent-clean4-archive-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean4-source-only-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'pytest>=8,<10'
      - name: Execute Clean-4 synthetic regression (not economic validation)
        env:
          PYTHONPATH: research/v98_independent
        run: python -m pytest -q research/v98_independent/test_phase243_clean4_archive_ingest.py research/v98_independent/test_phase243_clean4_official_archive_acquire.py
