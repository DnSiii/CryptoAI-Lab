name: V98 Independent A3 Frozen Boundary CI
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/v98_a3_frozen_boundary_gate.py'
      - 'research/v98_independent/test_v98_a3_frozen_boundary_gate.py'
      - '.github/workflows/v98-independent-a3-frozen-boundary-ci.yml'
permissions:
  contents: read
jobs:
  frozen-boundary-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable branch checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          test "$ACTUAL_REF" = "refs/heads/research/v98-independent-zero"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test frozen A3 identity and future boundary (no future data access)
        run: python -m unittest research.v98_independent.test_v98_a3_frozen_boundary_gate -v
