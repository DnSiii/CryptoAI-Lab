name: V99 I1 first-party historical option contract registry (NO ROI / NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_historical_instruments.py
      - research/verification/independent_v99_r106_i1_historical_instruments.py
      - .github/workflows/v99-r106-i1-historical-instrument-registry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-historical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect original historical Deribit expired BTC and ETH native instrument metadata
        run: python -m research.tools.v99_r106_i1_historical_instruments research_evidence/i1_native_instruments
      - name: Independently reparse original venue bytes and exact TRAIN-only instrument registry
        run: python -m research.verification.independent_v99_r106_i1_historical_instruments research_evidence/i1_native_instruments
      - name: Negative control — tampered report must fail original-byte oracle
        run: |
          python - <<'PY'
          import json, shutil, tempfile
          from pathlib import Path
          from research.verification.independent_v99_r106_i1_historical_instruments import audit
          source=Path('research_evidence/i1_native_instruments')
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              for p in source.iterdir():
                  shutil.copy2(p,root/p.name)
              path=root/'native_instrument_registry.json'
              obj=json.loads(path.read_text())
              assert obj['registry']['BTC']
              obj['registry']['BTC'][0]['strike'] += 1
              path.write_text(json.dumps(obj))
              try:
                  audit(root)
              except (AssertionError,ValueError):
                  pass
              else:
                  raise AssertionError('TAMPERED_NATIVE_REGISTRY_ACCEPTED')
          print('INDEPENDENT REGISTRY MUTATION REJECTED')
          PY
      - name: Explicitly prohibit promotion and economic claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research_evidence/i1_native_instruments/native_instrument_registry.json').read_text())
          assert all(x[k] is False for k in ('economic_train_executed','historical_fee_authenticated',
              'native_margin_liquidation_authenticated','historical_executable_quotes_authenticated',
              'validation_opened','holdout_opened','promotion_authorized','orders_enabled'))
          print('NATIVE CONTRACT REGISTRY ONLY — NO QUOTES, NO FEE/MARGIN CERTIFICATION, NO PNL')
          PY
      - name: Preserve first-party original source and independent results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-i1-firstparty-native-instruments-${{ github.run_id }}
          path: research_evidence/i1_native_instruments/
          retention-days: 60
          if-no-files-found: warn
