name: V98 Independent JQ Native 5m Chronological Source-Only Integrity
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-jq-native-5m-source.yml'
      - 'research/v98_independent/jq_native_5m_path_source_prereg_20261028.md'
      - 'research/v98_independent/jq_native_5m_path_source.py'
      - 'research/v98_independent/test_jq_native_5m_path_source.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Run native 5m parser integrity and causal-future tests before vendor access
        working-directory: research/v98_independent
        run: |
          python -m py_compile jq_native_5m_path_source.py test_jq_native_5m_path_source.py
          python -m unittest -v test_jq_native_5m_path_source.py
      - name: Download pinned authenticated 1h training-only source (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned 1h source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent/phase243_clean4_canonical')
          for asset in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT'):
              name=asset+'_1h.csv'
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              target.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],target/name)
          PY
      - name: Authenticate 100 official vendor 5m archives and reconcile 73152 asset-hours to pinned 1h
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python jq_native_5m_path_source.py
          rc=$?
          set -e
          test -s jq_native_5m_source_receipt.json
          if [ "$rc" -ne 0 ]; then
              echo "JQ SOURCE GATE FAILED; NO PNL OR ECONOMIC RUN AUTHORIZED"
              exit "$rc"
          fi
          test -s jq_native_5m_verified_hourly_features.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jq5m-source-${{ matrix.os }}
          path: |
            research/v98_independent/jq_native_5m_source_receipt.json
            research/v98_independent/jq_native_5m_verified_hourly_features.csv
          retention-days: 30
          if-no-files-found: warn
  independent:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jq5m-source-ubuntu-*
          path: jq-receipts
      - name: Independent dual-OS exact SHA and full archive-manifest comparison
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('jq-receipts')
          paths=[base/'jq5m-source-'+os for os in ('ubuntu-22.04','ubuntu-24.04')]
          reports=[];data=[]
          for p in paths:
              r=json.loads((p/'jq_native_5m_source_receipt.json').read_text())
              raw=(p/'jq_native_5m_verified_hourly_features.csv').read_bytes()
              assert r['decision']=='PASS_JQ_NATIVE_5M_SOURCE_ONLY_NOT_ECONOMIC',r['decision']
              assert r['archives_checksum_and_schema_verified']==100
              assert r['hourly_rows_reconciled']==73152
              assert r['fault_count']==0
              assert hashlib.sha256(raw).hexdigest()==r['features_sha256']
              reports.append(r);data.append(raw)
          assert reports[0]==reports[1],'JQ_CROSS_OS_MANIFEST_DIFFERENCE'
          assert data[0]==data[1],'JQ_CROSS_OS_FEATURE_BYTES_DIFFERENCE'
          print('JQ_DUAL_OS_NATIVE_SOURCE_PASS_100_ARCHIVES_73152_HOURS_NO_PNL',reports[0]['features_sha256'])
          PY
