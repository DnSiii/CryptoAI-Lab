name: CryptoAI V99 R106 Phase58 Taker Buy Ingestion Spec
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - scripts/run_v99_r106_phase58_taker_buy_ingestion_spec.py
      - .github/workflows/v99-r106-phase58-taker-buy-ingestion-spec.yml
permissions:
  contents: write
jobs:
  phase58:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/run_v99_r106_phase58_taker_buy_ingestion_spec.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase58_taker_buy_ingestion_spec.json').read_text())
          assert r['status']=='SPEC_READY_NO_BACKTEST'
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['source_contract']['canonical_mutation_forbidden']
          assert r['causality_contract']['no_same_bar_execution'] and r['causality_contract']['no_holdout_selection']
          PY
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase58_taker_buy_ingestion_spec.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 phase58 taker-buy ingestion contract"
          git push origin HEAD:research/v99-r106-native-all-regime-engine
