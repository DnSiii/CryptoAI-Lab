name: CryptoAI V99 R44 direct hedge frontier II
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r44-direct-hedge-frontier2]
    paths: ["scripts/run_v99_r44_direct_hedge_frontier2.py", "scripts/run_v99_r37_crash_shield.py", "scripts/run_v99_r36_safe_core_router.py", "scripts/run_v99_r25_trisleeve_meta.py", ".github/workflows/v99-r44-direct-hedge-frontier2.yml"]
permissions:
  contents: write
concurrency:
  group: v99-r44-direct-hedge-frontier2
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - id: utc
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-
      - run: python -m pip install -e "."
      - name: Restore published replay state
        shell: bash
        run: |
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v13.json reports/paper_data_sync_v15.json; do
            git cat-file -e "FETCH_HEAD:$path" || exit 1
            mkdir -p "$(dirname "$path")"
            git show "FETCH_HEAD:$path" > "$path"
          done
      - run: python scripts/prepare_dashboard_v15_replay.py
      - name: Run V99 R44 direct hedge frontier II laboratory
        run: python scripts/run_v99_r44_direct_hedge_frontier2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r44-direct-hedge-frontier2-${{ github.run_id }}
          retention-days: 60
          path: reports/candidate_v99_r44_direct_hedge_frontier2.json
      - name: Persist research report
        shell: bash
        run: |
          test -f reports/candidate_v99_r44_direct_hedge_frontier2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r44_direct_hedge_frontier2.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist V99 R44 research report"
            git push origin HEAD:research/v99-r44-direct-hedge-frontier2
          fi
