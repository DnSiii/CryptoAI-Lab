name: V98 Independent Static Clean-4 Economic Controls
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-static-baseline.yml'
      - 'research/v98_independent/v98_static_baseline_physical.py'
      - 'research/v98_independent/v98_static_baseline_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exposed-static-diagnostic:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Static control syntax and immutable book contract
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/v98_static_baseline_physical.py research/v98_independent/v98_static_baseline_oracle.py
          python research/v98_independent/v98_static_baseline_physical.py --self-test
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: Run 36 preregistered static USD-M 2023-25 physical controls
        run: |
          set -euo pipefail
          python research/v98_independent/v98_static_baseline_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir static-control
      - name: Independent static cash/funding replay and tamper detection
        run: |
          set -euo pipefail
          python research/v98_independent/v98_static_baseline_oracle.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir static-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-static-control-exposed-training-not-engine
          path: static-control/
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize fixed baseline, never approve V98
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('static-control/static_diagnostic.json').read_text())
          for name in ('cash','btc_80','eth_80','bnb_80','sol_80','equal_20'):
              for tier in ('base','severe','supersevere'):
                  x=next(v for v in r['cells'] if v['book']==name and v['tier']==tier and v['order']=='carried_before_fill')
                  print('STATIC_CONTROL',name,tier,json.dumps({k:x.get(k) for k in ('passed','reason','cagr','max_dd','annual_returns','final_equity','signed_funding','fees_spread_impact')},sort_keys=True))
          print('STATIC_NOT_V98_ENGINE_NOT_VALIDATED')
          PY
