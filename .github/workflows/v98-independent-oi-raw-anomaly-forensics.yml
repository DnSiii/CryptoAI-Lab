name: V98 Independent OI Raw Vendor Anomaly Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-oi-raw-anomaly-forensics.yml'
      - 'research/v98_independent/v98_oi_anomaly_forensics_prereg_20261027.md'
      - 'research/v98_independent/v98_oi_anomaly_forensics_20261027.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read only seven exact 2023-24 Binance OI ZIP and vendor checksum anomaly samples
        run: |
          python -m py_compile research/v98_independent/v98_oi_anomaly_forensics_20261027.py
          python research/v98_independent/v98_oi_anomaly_forensics_20261027.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-oi-raw-anomaly-source-only
          path: research/v98_independent/v98_oi_anomaly_forensics_20261027.json
          retention-days: 30
          if-no-files-found: warn
