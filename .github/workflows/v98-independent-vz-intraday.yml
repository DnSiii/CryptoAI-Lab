name: V98 Independent VZ Intraday Reversal 2023-25 Physical Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-vz-intraday.yml'
      - 'research/v98_independent/vz_intraday_reversal.py'
      - 'research/v98_independent/vz_intraday_physical.py'
      - 'research/v98_independent/vz_intraday_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vz-full-history-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Preregistered synthetic future-mutation causality and compile
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/vz_intraday_reversal.py research/v98_independent/vz_intraday_physical.py
          python research/v98_independent/vz_intraday_reversal.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: Pre-PnL incidence gate then 30 full physical cost/funding cells
        run: |
          set -euo pipefail
          python research/v98_independent/vz_intraday_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir vz-physical
      - name: Independently replay ledger and adversarial cash tamper
        run: |
          set -euo pipefail
          if [ -f vz-physical/vz_base_full_hourly_ledger.csv ]; then
            python research/v98_independent/vz_intraday_oracle.py \
              --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
              --new-root new --corrected-root corrected --out-dir vz-physical
          else
            echo 'VZ_PRE_PNL_INCIDENCE_REJECTED_NO_LEDGER'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-vz-intraday-2023-25-exposed-not-validated
          path: vz-physical/
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce explicit economic candidate gate (rejection must not be green)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('vz-physical/vz_source.json').read_text())
          if source['decision'].startswith('REJECT'):
              raise SystemExit('VZ_PREREG_REJECTED_NO_ENGINE')
          receipt=json.loads(Path('vz-physical/vz_exposed_physical.json').read_text())
          if receipt['decision'].startswith('REJECT'):
              raise SystemExit('VZ_ECONOMIC_REJECTED_NO_ENGINE')
          assert receipt['decision']=='PASS_VZ_EXPOSED_TRAINING_ONLY_NOT_VALIDATED'
          assert Path('vz-physical/vz_independent_oracle.json').exists()
          print('VZ_EXPOSED_ONLY_NOT_ENGINE_APPROVAL')
          PY
