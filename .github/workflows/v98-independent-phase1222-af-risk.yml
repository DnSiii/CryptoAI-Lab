name: V98 Independent Phase1222 AF Strict Prior Risk Inputs
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1222_af_prior_risk.py'
      - 'research/v98_independent/test_phase1222_af_prior_risk.py'
      - '.github/workflows/v98-independent-phase1222-af-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  af-risk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Test strict t-1 AF causal risk, liquidity and funding
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1222_af_prior_risk.py' -v
