name: V98 Independent SHA-Pinned One-Minute Funding Sensitivity Adapter (No PnL)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-official-1m-sensitivity.yml'
      - 'research/v98_independent/v98_official_1m_mark_sensitivity.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source-only-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-1m-full-reconciled-41161835753
          run-id: 41161835753
          github-token: ${{ github.token }}
          path: minute-input
      - name: Pinned full Clean4 9144-event 1m sensitivity only
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_official_1m_mark_sensitivity.py
          python v98_official_1m_mark_sensitivity.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --minute-csv ../../minute-input/v98_1m_clean4_full_bounds.csv --output v98_1m_sensitivity_adapter_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-1m-sensitivity-${{ github.run_id }}
          path: research/v98_independent/v98_1m_sensitivity_adapter_receipt.json
          retention-days: 30
          if-no-files-found: warn
