name: V98 NQ Seven-Slot Causal Shadow 30-Cell Physical + Independent Oracles
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-nq-30cell.yml'
      - 'research/v98_independent/nq_*.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  nq-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned Clean4 2022-24 training only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download SHA-pinned native worst-side mark envelope
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Independent raw source gate BEFORE shadow or physical PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile nq_sources.py nq_independent_source_gate.py nq_online_shadow_marginal.py nq_independent_shadow_oracle.py nq_30cell_physical.py nq_independent_fill_oracle.py nq_hourly_oracle_gate.py nq_independent_receipt_arithmetic_audit.py
          python nq_sources.py
          python nq_online_shadow_marginal.py
          python nq_independent_source_gate.py --root ../../official-input --output nq_source_receipt.json
      - name: Independent five-book shadow net accounting and lagged score reconciliation
        working-directory: research/v98_independent
        run: |
          python nq_independent_shadow_oracle.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output nq_shadow_independent_receipt.json
      - name: Run original preregistered NQ 30-cell signed physical training
        working-directory: research/v98_independent
        run: |
          python nq_30cell_physical.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output nq_30cell_receipt.json --ledger-output nq_base_full_hourly_forensic.jsonl
      - name: Independent all-hour signed settlement
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nq_30cell_receipt.json && test -s nq_base_full_hourly_forensic.jsonl; then
            python nq_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl nq_base_full_hourly_forensic.jsonl --receipt nq_30cell_receipt.json --output nq_independent_hourly_receipt.json
          else
            echo "No complete ledger; no independent all-hour settlement attestation"
          fi
      - name: Independent raw source to adaptive target to net fill replay
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nq_30cell_receipt.json && test -s nq_base_full_hourly_forensic.jsonl; then
            python nq_independent_fill_oracle.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl nq_base_full_hourly_forensic.jsonl --output nq_independent_fill_receipt.json
          else
            echo "No complete ledger; no independent fill attestation"
          fi
      - name: Independent 30-cell arithmetic and economic gates
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nq_30cell_receipt.json; then
            python nq_independent_receipt_arithmetic_audit.py --receipt nq_30cell_receipt.json > nq_independent_arithmetic_receipt.json
          else
            echo "No original 30-cell receipt; no arithmetic attestation"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-nq-original-${{ github.run_id }}
          path: |
            research/v98_independent/nq_source_receipt.json
            research/v98_independent/nq_shadow_independent_receipt.json
            research/v98_independent/nq_30cell_receipt.json
            research/v98_independent/nq_independent_hourly_receipt.json
            research/v98_independent/nq_independent_fill_receipt.json
            research/v98_independent/nq_independent_arithmetic_receipt.json
            research/v98_independent/nq_base_full_hourly_forensic.jsonl
          retention-days: 30
          if-no-files-found: warn
