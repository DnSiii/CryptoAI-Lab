name: V98 Independent Phase1258 AJ Static Preflight
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1258-aj-preflight.yml'
  workflow_dispatch:
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: AJ complete seven-slot preregistered static and causal preflight
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1258_aj_static_preflight
