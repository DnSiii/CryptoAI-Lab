name: V98 Independent Phase1160 AA Inventory Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1160_aa_inventory_executor.py'
      - 'research/v98_independent/test_phase1160_aa_inventory_executor.py'
      - '.github/workflows/v98-independent-phase1160-aa-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aa-inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4
      - name: AA independent inventory-unit signed funding tests
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1160_aa_inventory_executor.py' -v
      - name: No historical PnL
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research/v98_independent/phase1160_aa_inventory_executor.py').read_text()
          assert 'def execute_hour(' in s and "'synthetic_only':True" in s
          print('AA_LEDGER_SYNTHETIC_ONLY')
          PY
