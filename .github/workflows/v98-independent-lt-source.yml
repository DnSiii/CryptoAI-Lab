name: V98 Independent LT Seven-Slot Authenticated Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-lt-source.yml'
      - 'research/v98_independent/lt_volatility_dispersion_prereg_20261029.md'
      - 'research/v98_independent/lt_sources.py'
      - 'research/v98_independent/lt_independent_source_gate.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  lt-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned Clean4 original training source only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Authenticate original OHLC SHA256 and native funding
        run: python research/v98_independent/v98_clean4_training_reader.py --root official-input
      - name: Independently replay LT source and future-mutation causal gate
        working-directory: research/v98_independent
        run: |
          python -m py_compile lt_sources.py lt_independent_source_gate.py
          python lt_independent_source_gate.py --root ../../official-input --output lt_frozen_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-lt-source-${{ github.run_id }}
          path: research/v98_independent/lt_frozen_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
