name: V98 Independent C11 Seven Slot Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - research/v98_independent/v98_c11_seven_slot_ablation.py
      - .github/workflows/v98-independent-c11-seven-slot-diagnostic.yml
permissions:
  contents: read
  actions: read
jobs:
  c11-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify pinned authenticated V98-only price and funding artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          repo=os.environ['GH_REPO']
          root=Path('/tmp/v98_independent/ablation/sources')
          for label,artifact_id in {'prices':13444665313,'funding':13464271018}.items():
              meta=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}'],text=True))
              name=meta.get('name','').lower()
              if meta.get('expired') or meta.get('workflow_run',{}).get('head_branch')!='research/v98-independent-zero':
                  raise SystemExit(f'PINNED_SOURCE_UNAVAILABLE {label} {artifact_id}')
              if label=='prices' and not name.startswith('v98-independent-clean4-148-official-archives-'):
                  raise SystemExit('WRONG_PRICE_SOURCE')
              if label=='funding' and not ('native' in name and 'funding' in name):
                  raise SystemExit('WRONG_FUNDING_SOURCE')
              target=root/label
              target.mkdir(parents=True,exist_ok=True)
              archive=target/'artifact.zip'
              with archive.open('wb') as stream:
                  subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],stdout=stream,check=True)
              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      if not (target/item.filename).resolve().is_relative_to(target.resolve()):
                          raise SystemExit('ZIP_PATH_TRAVERSAL')
                  z.extractall(target)
              print('PINNED_SOURCE',label,artifact_id)
          PY
      - name: Resolve unique authenticated manifests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/v98_independent/ablation/sources')
          prices=list((root/'prices').rglob('source_manifest.json'))
          funding=list((root/'funding').rglob('funding_manifest.json'))
          if len(prices)!=1 or len(funding)!=1:
              raise SystemExit(f'MISSING_OR_AMBIGUOUS_MANIFESTS {len(prices)} {len(funding)}')
          with open('/tmp/v98_independent/ablation/paths.env','w') as f:
              f.write(f'PRICES={prices[0].parent}\nMANIFEST={prices[0]}\nFUNDING={funding[0].parent}\n')
          PY
          cat /tmp/v98_independent/ablation/paths.env >> "$GITHUB_ENV"
      - name: Run fixed seven-slot counterfactuals at severe 4x costs
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c11_seven_slot_ablation --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/ablation/c11_seven_slot_diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-c11-seven-slot-diagnostic-${{ github.run_id }}
          path: /tmp/v98_independent/ablation/c11_seven_slot_diagnostic.json
          if-no-files-found: warn
          retention-days: 30
