name: V99 R106 native OKX volume/PIT integrity

on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_r106_native_volume_integrity.py'
      - 'research/tests/test_v99_r106_native_volume_integrity.py'
      - '.github/workflows/v99-r106-native-volume-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v99-r106-native-volume-pit-audit
  cancel-in-progress: false

jobs:
  independent-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout research branch without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Adversarial native OHLCV contract tests
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_native_volume_integrity.py' -v
      - name: Read original immutable first-party receipts
        shell: bash
        run: |
          git fetch --no-tags origin research/v99-r106-live-receipts
          git worktree add --detach "$RUNNER_TEMP/v99-r106-immutable-receipts" FETCH_HEAD
      - name: Replay original native OHLCV semantics with no paper authorization
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v99-r106-immutable-receipts/receipts"
          bucket="2026-10-14T20"
          python -m research.tools.v99_r106_native_volume_integrity \
            --market "$root/v99_r106_okx/$bucket" \
            --terms "$root/v99_r106_okx_terms/$bucket" \
            --out "$RUNNER_TEMP/v99-native-volume-data-only.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'v99-native-volume-data-only.json').read_text())
          assert d['status']=='OKX_NATIVE_VOLUME_AND_PIT_PASS_DATA_ONLY'
          assert d['confirmed_rows']==25 and len(d['instruments'])==5
          assert d['paper_publication_authorized'] is False
          assert d['promotion_authorized'] is False
          print('25 confirmed source bars verified; DATA_ONLY, no trading')
          PY
      - name: Preserve read-only integrity result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-native-volume-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/v99-native-volume-data-only.json
          retention-days: 90
          if-no-files-found: error
