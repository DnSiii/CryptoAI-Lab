name: V98 Phase140 Treasury PIT data audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'scripts/v98_independent_phase140_treasury_curve_pit_data_only.py'
      - '.github/workflows/v98-phase140-treasury-pit-data-audit.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: v98-phase140-treasury-pit-data-audit, cancel-in-progress: false}
jobs:
  pit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {RESEARCH_BRANCH: research/v98-independent-zero}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v98-independent-zero, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Run Phase140 PIT DATA_ONLY audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/v98_independent_phase140_treasury_curve_pit_data_only.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Phase140 firewall
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('reports/v98_independent_phase140_treasury_curve_pit_data_only.json')
          assert p.exists(),'Phase140 report missing'
          r=json.loads(p.read_text())
          assert r['phase']=='140' and r['mode']=='DATA_ONLY_NO_ALPHA_NO_PNL'
          assert r['alpha_or_pnl_inspected'] is False and r['crypto_returns_accessed'] is False
          assert r['validation_accessed'] is False and r['final_holdout_accessed'] is False
          assert r['phase083_selection_use'] is False and r['v16_used'] is False and r['v99_used'] is False
          assert r['decision'] in {'PASS_PIT_DATA_ONLY','FAIL_PIT_DATA'}
          forbidden={'profit_factor','total_return','cagr','drawdown','trades','signal_direction','alpha_return'}
          txt=p.read_text().lower()
          assert not any('"'+x+'"' in txt for x in forbidden)
          PY
      - name: Persist Phase140 evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f reports/v98_independent_phase140_treasury_curve_pit_data_only.json ]; then
            git add -f reports/v98_independent_phase140_treasury_curve_pit_data_only.json
          fi
          if git diff --cached --quiet; then
            echo no-evidence-change
          else
            git commit -m "v98: record Phase140 Treasury PIT data evidence"
            git fetch origin ${RESEARCH_BRANCH}
            git rebase origin/${RESEARCH_BRANCH}
            git push origin HEAD:${RESEARCH_BRANCH}
          fi
      - name: Enforce Phase140 decision
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open('reports/v98_independent_phase140_treasury_curve_pit_data_only.json'))
          sys.exit(0 if r['decision']=='PASS_PIT_DATA_ONLY' else 2)
          PY
