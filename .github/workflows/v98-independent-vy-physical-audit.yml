name: V98 Independent VY Frozen 2023-25 Physical Independent Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-vy-physical-audit.yml'
      - 'research/v98_independent/vy_cross_sectional_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vy-independent-full-history-ledger:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-vy-2023-25-physical-not-validated
          run-id: 41431643421
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: Independently reconstruct 27048 hours and test ledger tampering
        run: |
          set -euo pipefail
          python - <<'PY' | tee vy_independent_oracle.json
          import csv,io,json,tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0,'research/v98_independent')
          from v98_2025_full_training_source_bridge import load
          from vy_cross_sectional_oracle import audit
          d=load('old','old-envelope/v98_official_mark_envelope_training.csv','new','corrected')
          src='frozen/vy_base_full_hourly_ledger.csv'
          receipt='frozen/vy_exposed_physical.json'
          result=audit(d,src,receipt)
          with open(src,newline='') as f:
              rows=list(csv.DictReader(f))
          rows[744]['cash_after']=str(float(rows[744]['cash_after'])+1.0)
          with tempfile.TemporaryDirectory() as td:
              tampered=Path(td)/'tampered.csv'
              with tampered.open('w',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
              try:
                  audit(d,tampered,receipt)
              except ValueError as exc:
                  if 'VY_INDEPENDENT_MISMATCH' not in str(exc):raise
                  result['tampered_cash_detected']=True
              else:
                  raise RuntimeError('VY_ORACLE_FAILED_TO_REJECT_TAMPER')
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Preserve frozen rejection, no candidate promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('frozen/vy_exposed_physical.json').read_text())
          assert r['decision']=='REJECT_VY_EXPOSED_TRAINING'
          assert len(r['cells'])==30
          assert not r['account_costs_authenticated'] and not r['exact_exchange_marks_authenticated']
          assert not r['holdout_accessed'] and not r['paper_live_authorized']
          print('VY_ORIGINAL_EXPOSED_REJECTION_PRESERVED',len(r['failures']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-vy-frozen-independent-full-history-audit-not-engine
          path: vy_independent_oracle.json
          retention-days: 30
          if-no-files-found: warn
