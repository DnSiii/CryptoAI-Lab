name: V98 Independent Conservative Mark Envelope Settlement Contract
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mark-envelope-settlement.yml'
      - 'research/v98_independent/v98_mark_envelope_settlement.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  envelope-settlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download original SHA256-pinned Clean4 training
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download independent official mark envelope pinned artifact
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Audit 9144-event signed worst-side mark settlement with both funding orders
        run: |
          python -m py_compile research/v98_independent/v98_mark_envelope_settlement.py
          python research/v98_independent/v98_mark_envelope_settlement.py --root official-input --envelope-csv envelope-input/v98_official_mark_envelope_training.csv --output v98_mark_envelope_settlement_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mark-envelope-settlement-${{ github.run_id }}
          path: v98_mark_envelope_settlement_receipt.json
          retention-days: 30
          if-no-files-found: warn
