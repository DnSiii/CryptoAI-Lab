name: V99 I1 original Deribit delivery calendar to option spine (SOURCE ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_original_delivery_to_spine.py
      - research/verification/independent_v99_r106_i1_delivery_spine_oracle.py
      - research/tests/test_v99_r106_i1_original_delivery_to_spine.py
      - research/tests/test_v99_r106_i1_delivery_pagination_oracle.py
      - research/verification/independent_v99_r106_i1_delivery_price_oracle.py
      - .github/workflows/v99-r106-i1-original-delivery-to-spine.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  firstparty-delivery-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      V99_DELIVERY_OUTPUT: research_evidence/i1_delivery_train/delivery_index_train_only.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ex-ante preregistration predates integration
        run: |
          git merge-base --is-ancestor 11bb0ec540f77bd587abca9903538b23f68816c2 HEAD
          test -s research/V99_R106_I1_ORIGINAL_DELIVERY_TO_SPINE_PREREG_20261028.md
      - name: Run synthetic controls and independent calendar-join oracle
        run: python -m unittest -v research.tests.test_v99_r106_i1_original_delivery_to_spine research.tests.test_v99_r106_i1_delivery_pagination_oracle
      - name: Restore previously independently verified first-party 661d Deribit delivery prices
        run: |
          gh run download 40117855925 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-delivery-index-train-40117855925 \
            --dir research_evidence/i1_delivery_train
          test -s "$V99_DELIVERY_OUTPUT"
      - name: Independently re-fetch all original first-party delivery data pages
        run: python -m research.verification.independent_v99_r106_i1_delivery_price_oracle
      - name: Bind actual original BTC ETH delivery records to synthetic option-expiry spine (SOURCE ONLY)
        run: |
          mkdir -p research_evidence/i1_delivery_spine
          python - <<'PY'
          import json
          from pathlib import Path
          from research.tests.test_v99_r106_i1_original_delivery_to_spine import make_spine
          from research.tools.v99_r106_i1_original_delivery_to_spine import main
          from research.verification.independent_v99_r106_i1_delivery_spine_oracle import verify
          source = make_spine()
          root = Path("research_evidence/i1_delivery_spine")
          (root/"synthetic_source_spine.json").write_text(json.dumps(source))
          main(root/"synthetic_source_spine.json",
               "research_evidence/i1_delivery_train/delivery_index_train_only.json",
               root/"firstparty_delivery_bound_to_synthetic_expiry.json")
          raw = Path("research_evidence/i1_delivery_train/delivery_index_train_only.json").read_bytes()
          result = json.loads((root/"firstparty_delivery_bound_to_synthetic_expiry.json").read_text())
          check = verify(source, raw, result)
          assert check["independent_calendar_settlement_events"] == 1
          assert not result["original_delivery_index_authenticated"]
          assert not result["native_economic_train_executed"]
          assert not result["promotion_authorized"]
          print("ACTUAL FIRSTPARTY DELIVERY CALENDAR + SYNTHETIC EXPIRY ONLY; NOT HISTORICAL OPTIONS ECONOMICS")
          PY
      - name: Verify original 182 signals and attempt full original quote source run (must fail closed)
        run: |
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from research.tools.v99_r106_i1_original_intent_binding import bind
          from research.tools.v99_r106_i1_source_driven_entry_book import build
          original=bind(Path("research_evidence/i1_original_causal/i1_causal_signal.json"))
          assert len(original["intents"])==180 and original["positive_fixed_intents"]==132
          with tempfile.TemporaryDirectory() as root:
              try:
                  build(root,original["intents"])
              except ValueError as exc:
                  assert str(exc)=="ORIGINAL_661D_MANIFEST_NOT_DELIVERED",str(exc)
                  print("ORIGINAL SIGNALS 182 / INTENTS 180 / POSITIVE 132")
                  print("BLOCKED ORIGINAL OPTIONS TAPE; FIRSTPARTY DELIVERY CALENDAR AVAILABLE")
                  print("0/180 CERTIFIED LIFECYCLES; NO TRAIN/ROI/PROMOTION/ORDERS")
              else:
                  raise AssertionError("UNLICENSED SOURCE TAPE ACCEPTED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-i1-delivery-spine-source-only-${{ github.run_id }}
          path: research_evidence/i1_delivery_spine/
          retention-days: 30
          if-no-files-found: warn
