name: V98 Independent HX Cross Venue Taker Divergence Seven Slot 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-hx-seven-slot.yml'
      - 'research/v98_independent/hx_cross_venue_taker_divergence_prereg_20261027.md'
      - 'research/v98_independent/hx_cross_venue_sources.py'
      - 'research/v98_independent/hx_official_spot_taker_source.py'
      - 'research/v98_independent/hx_cross_venue_loader.py'
      - 'research/v98_independent/hx_source_viability.py'
      - 'research/v98_independent/hx_30cell.py'
      - 'research/v98_independent/hx_reconcile_30cell.py'
      - 'research/v98_independent/hx_independent_ledger_replay.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  spot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently download and authenticate 100 official 2022-2024 spot archives
        working-directory: research/v98_independent
        run: |
          python -m py_compile hx_official_spot_taker_source.py
          python hx_official_spot_taker_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx-spot-flow-2022-2024
          path: research/v98_independent/hx_spot_flow_training/
          retention-days: 30
          if-no-files-found: warn
  source:
    needs: spot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned training data only (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Retrieve HX authenticated 2022-2024 spot taker-flow only
        uses: actions/download-artifact@v4
        with:
          name: hx-spot-flow-2022-2024
          github-token: ${{ github.token }}
          path: research/v98_independent/hx_spot_flow_training
      - name: Retrieve checksum-pinned native futures taker buyer-flow 2022-2024
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-native-taker-flow-2022-2024-pinned-source
          run-id: 40415754877
          github-token: ${{ github.token }}
          path: native-input
      - name: Stage native futures taker buyer-flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          found=list(Path('native-input').rglob('native_taker_flow_clean4_2022_2024.csv'))
          assert len(found)==1,found
          shutil.copy2(found[0],Path('research/v98_independent/native_taker_flow_clean4_2022_2024.csv'))
          PY
      - name: Stage exact authenticated Clean-4 source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: HX cross venue taker divergence source viability
        working-directory: research/v98_independent
        run: |
          python -m py_compile hx_cross_venue_loader.py hx_cross_venue_sources.py hx_source_viability.py hx_30cell.py hx_reconcile_30cell.py
          python hx_cross_venue_sources.py
          python hx_cross_venue_loader.py
          python -c 'import hx_30cell, hx_reconcile_30cell, hx_independent_ledger_replay'
          python hx_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx-source-viability
          path: research/v98_independent/hx_source_viability.json
          retention-days: 30
          if-no-files-found: warn
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [HX_core_only, HX_full, HX_minus_opportunity, HX_minus_RV, HX_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Retrieve HX authenticated 2022-2024 spot taker-flow only
        uses: actions/download-artifact@v4
        with:
          name: hx-spot-flow-2022-2024
          github-token: ${{ github.token }}
          path: research/v98_independent/hx_spot_flow_training
      - name: Retrieve checksum-pinned native futures taker buyer-flow 2022-2024
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-native-taker-flow-2022-2024-pinned-source
          run-id: 40415754877
          github-token: ${{ github.token }}
          path: native-input
      - name: Stage native futures taker buyer-flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          found=list(Path('native-input').rglob('native_taker_flow_clean4_2022_2024.csv'))
          assert len(found)==1,found
          shutil.copy2(found[0],Path('research/v98_independent/native_taker_flow_clean4_2022_2024.csv'))
          PY
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Run native 6-cell path USD10k, base/severe/supersevere and both funding orders
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python hx_30cell.py --path ${{ matrix.path }} --output hx30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s hx30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/hx30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hx30-ubuntu-*
          path: receipts
      - name: Independent artifact-only 30-cell cross-OS and marginal gate
        shell: bash
        run: python research/v98_independent/hx_reconcile_30cell.py --root receipts --output hx30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx30-official-economic-summary
          path: hx30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [HX_core_only, HX_full, HX_minus_opportunity, HX_minus_RV, HX_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Retrieve HX authenticated 2022-2024 spot taker-flow only
        uses: actions/download-artifact@v4
        with:
          name: hx-spot-flow-2022-2024
          github-token: ${{ github.token }}
          path: research/v98_independent/hx_spot_flow_training
      - name: Retrieve checksum-pinned native futures taker buyer-flow 2022-2024
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-native-taker-flow-2022-2024-pinned-source
          run-id: 40415754877
          github-token: ${{ github.token }}
          path: native-input
      - name: Stage native futures taker buyer-flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          found=list(Path('native-input').rglob('native_taker_flow_clean4_2022_2024.csv'))
          assert len(found)==1,found
          shutil.copy2(found[0],Path('research/v98_independent/native_taker_flow_clean4_2022_2024.csv'))
          PY
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding, NAV, fee, slippage and 81-corner settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py hx_independent_ledger_replay.py
          python hx_independent_ledger_replay.py --path ${{ matrix.path }} --output hx_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/hx_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
