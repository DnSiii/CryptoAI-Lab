name: V98 Independent Phase180 T10YIE Disinflation Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'scripts/v98_independent_phase180_t10yie_disinflation_gate.py'
      - 'research/v98_independent_phase180_t10yie_disinflation_stress_preregister.md'
      - '.github/workflows/v98-independent-phase180.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase180:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Guard preregistration and isolation
        run: |
          test "$(git hash-object research/v98_independent_phase180_t10yie_disinflation_stress_preregister.md)" = "3fd431e3516c30a11b98745fb6adb8876ae5703b"
          grep -q 'No threshold sweep' research/v98_independent_phase180_t10yie_disinflation_stress_preregister.md
      - name: Rebuild canonical V98 training-only data
        run: python scripts/v98_independent_phase050_rebuild_data.py
      - name: Execute Phase180 twice and require reproducibility
        run: |
          python scripts/v98_independent_phase180_t10yie_disinflation_gate.py
          cp reports/v98_independent_phase180_t10yie_disinflation_gate.json /tmp/p180a.json
          python scripts/v98_independent_phase180_t10yie_disinflation_gate.py
          cmp /tmp/p180a.json reports/v98_independent_phase180_t10yie_disinflation_gate.json
      - name: Audit invariants
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/v98_independent_phase180_t10yie_disinflation_gate.json'))
          assert x['window']==['2023-01-01','2025-12-31'] and x['validation'] is None and x['final_holdout'] is None
          assert not x['same_day_use'] and not x['parameter_search'] and not x['threshold_search'] and not x['lookback_search'] and not x['rescue_allowed']
          assert not x['v16_used'] and not x['v99_used']
          assert x['variants']['DISINFLATION_GATE']['max_open_gross'] <= .35002
          assert set(x['variants']['DISINFLATION_GATE']['folds'])=={'2023','2024','2025'}
          print(x['gate'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase180
          path: reports/v98_independent_phase180_t10yie_disinflation_gate.json
