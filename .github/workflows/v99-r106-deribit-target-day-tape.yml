name: V99 R106 Deribit target-day full API trade pagination (SOURCE ONLY NO QUOTES)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/V99_R106_DERIBIT_TARGET_DAY_TAPE_PAGINATION_PREREG_20261030.md'
      - 'research/tools/v99_r106_deribit_target_day_tape.py'
      - 'research/verification/independent_v99_r106_deribit_target_day_tape_oracle.py'
      - '.github/workflows/v99-r106-deribit-target-day-tape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-original-day:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove fixed preregistration predates first source request
        run: |
          git merge-base --is-ancestor db7d7201c06969303f4007a0c9f3a3d7b8472e14 HEAD
          echo 'EX_ANTE_TAPE_SCOPE_CONFIRMED'
      - name: Fetch bounded original Deribit 2022-01-23 options trade pages
        run: |
          python -m research.tools.v99_r106_deribit_target_day_tape research_evidence/target_day_tape
      - name: Independently replay every original page and original trade ID
        run: |
          python -m research.verification.independent_v99_r106_deribit_target_day_tape_oracle research_evidence/target_day_tape
      - name: Fail closed on quote/fill/economics promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_evidence/target_day_tape/target_day_trade_tape_source_only.json').read_text())
          assert r['certified_option_lifecycles']==0
          assert r['original_661_day_quote_archive_delivered'] is False
          assert r['tape_is_not_executable_quotes'] is True
          assert r['api_pagination_does_not_certify_exchange_market_completeness'] is True
          assert r['elligible_put_trade_activity_is_not_synchronized_bbo'] is True
          for key in ('original_executable_quotes_authenticated','native_fills_authenticated',
              'historical_native_fee_tier_authenticated','full_lifecycle_authenticated',
              'economic_trial_run','validation_opened','final_holdout_opened',
              'promotion_authorized','paper_publication_authorized','orders_enabled'):
              assert r[key] is False, key
          print('SOURCE_ONLY; NO NATIVE QUOTES; NO ECONOMICS; NO PROMOTION')
          PY
      - name: Remove all original trade bytes from artifact even on failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          path=Path('research_evidence/target_day_tape/raw_ephemeral')
          if path.exists(): shutil.rmtree(path)
          print('ORIGINAL_TRADE_BYTES_DELETED_BEFORE_ARTIFACT')
          PY
      - name: Archive only aggregate counts and original-page digests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-deribit-target-day-trade-tape-${{ github.run_id }}
          path: research_evidence/target_day_tape/target_day_trade_tape_source_only.json
          retention-days: 30
          if-no-files-found: warn
