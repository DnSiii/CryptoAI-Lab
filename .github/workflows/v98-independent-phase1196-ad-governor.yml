name: V98 Independent Phase1196 AD 81 Corner Governor Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1196_ad_81corner_governor.py'
      - 'research/v98_independent/test_phase1196_ad_81corner_governor.py'
      - '.github/workflows/v98-independent-phase1196-ad-governor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ad-governor-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Test signed 81-corner governor and executable exits
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1196_ad_81corner_governor.py' -v
