name: V98 Independent Phase1021 Intrabar 16-Corner Oracle
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - .github/workflows/v98-independent-phase1021-intrabar-corners.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v98-independent-phase1021-corners-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sixteen-corner-oracle:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Independently enumerate all 16 intrabar corners in 3000 long-only states
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1021_o_intrabar_16corner_oracle.py
