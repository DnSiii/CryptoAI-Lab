name: V99 R106 D1 C166 actual prospective receipts quarantine and full bridge (SOURCE ONLY)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/verification/independent_d1_c166_prospective_receipt_quarantine.py'
      - 'research/tests/test_v99_r106_d1_c166_prospective_receipt_quarantine.py'
      - '.github/workflows/v99-r106-d1-c166-receipt-quarantine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test runner
        run: python -m pip install 'pytest==8.3.5'
      - name: Adversarial C166 and full C165/C140 account bridge regression
        run: |
          python -m pytest -q research/tests/test_v99_r106_d1_c166_prospective_receipt_quarantine.py research/tests/test_v99_r106_d1_c165_two_cost_path_bridge.py research/tests/test_v99_r106_d1_cash_inventory_oracle_cycle128.py research/tests/test_v99_r106_d1_hourly_account_bridge_cycle129.py research/tests/test_v99_r106_d1_c140_hourly_journal.py
      - name: Existing independent D1 source regression
        run: |
          python -m unittest research.tests.test_v99_r106_d1_target_rebalance_cycle139 research.tests.test_v99_r106_d1_c163_c139_c151_integration research.tests.test_v99_r106_d1_c162_exact_native_fee_reexecution research.tests.test_v99_r106_d1_c161_causal_decision_oracle research.tests.test_v99_r106_d1_c160_integrated_structural_chain research.tests.test_v99_r106_d1_c159_full_funding_closure research.tests.test_v99_r106_d1_c158_risk_folds research.tests.test_v99_r106_d1_c157_accounting_cold_start research.tests.test_v99_r106_d1_c156_native_lot_smoke research.tests.test_v99_r106_d1_c153_pair_lattice research.tests.test_v99_r106_d1_c155_prereg_source research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Read isolated live receipt branch without changing it
        run: |
          git fetch --depth=1 origin refs/heads/research/v99-r106-live-receipts
          git worktree add --detach "$RUNNER_TEMP/v99-receipts" FETCH_HEAD
          python -m research.verification.independent_d1_c166_prospective_receipt_quarantine --receipts-root "$RUNNER_TEMP/v99-receipts"
      - name: Assert preregistered D1 permissions remain closed
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p=report_permissions()
          assert all(p[k] is False for k in ('historical_train_economics_run',
              'validation_opened','final_holdout_opened','promotion_authorized',
              'real_orders_enabled','paper_publication_authorized'))
          print('C166 CURRENT RECEIPTS QUARANTINED / DATA_ONLY HOLD / NO PROMOTION')
          PY
