name: V98 Independent DY Frozen Artifact-Only Economic Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-dy-frozen-forensics.yml'
      - 'research/v98_independent/dy_frozen_forensics.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable DY audited summary only
        uses: actions/download-artifact@v4
        with:
          name: dy30-official-economic-summary
          run-id: 40203843760
          github-token: ${{ github.token }}
          path: frozen-receipts/summary
      - name: Fetch immutable DY core-only 6-cell artifact only
        uses: actions/download-artifact@v4
        with:
          name: dy30-ubuntu-24.04-DY_core_only
          run-id: 40203843760
          github-token: ${{ github.token }}
          path: frozen-receipts/core
      - name: Reconcile frozen core displacement and marginal evidence
        run: python research/v98_independent/dy_frozen_forensics.py
      - uses: actions/upload-artifact@v4
        with:
          name: dy-frozen-economic-forensics
          path: dy_frozen_forensics.json
          retention-days: 30
