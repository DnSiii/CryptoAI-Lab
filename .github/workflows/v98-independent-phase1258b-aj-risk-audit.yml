name: V98 Independent Phase1258b AJ Adversarial Risk Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1258b-aj-risk-audit.yml'
  workflow_dispatch:
jobs:
  risk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Execute fixed-seed 5000 actual-open adversarial risk cases
        working-directory: research/v98_independent
        run: python phase1258b_aj_adversarial_risk_audit.py --output aj1258b_risk_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aj1258b-${{ matrix.os }}
          path: research/v98_independent/aj1258b_risk_receipt.json
          retention-days: 30
          if-no-files-found: warn
  reconcile:
    needs: risk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aj1258b-*
          path: receipts
      - name: Verify cross-OS adversarial categorical agreement
        run: |
          python - <<'PY'
          import glob,json,math
          paths=sorted(glob.glob('receipts/*/*.json'))
          assert len(paths)==2,paths
          a,b=[json.load(open(p)) for p in paths]
          for key in ('cases','accepted','explicit_rejections','rejection_reasons','decision'):
              assert a[key]==b[key],(key,a[key],b[key])
          for key in ('max_order_delta_residual','max_exit_capacity_residual','max_survival_shortfall'):
              assert math.isfinite(a[key]) and math.isfinite(b[key])
              assert abs(a[key]-b[key])<=1e-8,(key,a[key],b[key])
          print('AJ1258B_CROSSRUNNER_PASS',a['accepted'],a['explicit_rejections'])
          print('AJ1258B_RAW_HASH_MATCH',a['accepted_units_raw_sha256']==b['accepted_units_raw_sha256'])
          PY
