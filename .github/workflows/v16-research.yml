name: CryptoAI V16 strict research gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "research/v16-*"
    paths:
      - ".github/workflows/v16-research.yml"
      - "src/cryptoai_v13/v16.py"
      - "scripts/search_v16.py"
      - "tests/test_v16_research.py"

permissions:
  contents: read

jobs:
  research:
    name: Recent-weighted causal validation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out research code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run causal and no-real-order tests
        run: python -m pytest

      - name: Synchronize the latest closed public candles
        run: python scripts/sync_paper_data_v13.py

      - name: Run the V16 strict gate
        run: python scripts/search_v16.py

      - name: Upload complete V16 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v16-research-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: reports/v16_research_gate.json
