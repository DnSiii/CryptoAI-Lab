name: V99 R106 D1 C163 C139 paired rebalance integration (SOURCE ONLY)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_r106_d1_target_rebalance_cycle139.py'
      - 'research/tests/test_v99_r106_d1_target_rebalance_cycle139.py'
      - 'research/tests/test_v99_r106_d1_c163_c139_c151_integration.py'
      - '.github/workflows/v99-r106-d1-c163-paired-rebalance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original C139 paired-fill invariants and independent C151 lot veto
        run: |
          python -m unittest research.tests.test_v99_r106_d1_target_rebalance_cycle139 research.tests.test_v99_r106_d1_c163_c139_c151_integration -v
      - name: Existing C162 through C153 source-only structural regression
        run: |
          python -m unittest research.tests.test_v99_r106_d1_c162_exact_native_fee_reexecution research.tests.test_v99_r106_d1_c161_causal_decision_oracle research.tests.test_v99_r106_d1_c160_integrated_structural_chain research.tests.test_v99_r106_d1_c159_full_funding_closure research.tests.test_v99_r106_d1_c158_risk_folds research.tests.test_v99_r106_d1_c157_accounting_cold_start research.tests.test_v99_r106_d1_c156_native_lot_smoke research.tests.test_v99_r106_d1_c153_pair_lattice research.tests.test_v99_r106_d1_c155_prereg_source research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Fail closed against promotion, orders, validation and holdout
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p=report_permissions()
          assert all(not p[k] for k in ('historical_train_economics_run',
              'validation_opened','final_holdout_opened','promotion_authorized',
              'real_orders_enabled','paper_publication_authorized'))
          print('C163 DATA_ONLY/HOLD — model-only source checks; NO PROMOTION')
          PY
