name: V98 Independent MF Read-Only 30-Cell Economic Rejection Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mf-audit.yml'
      - 'research/v98_independent/mf_independent_receipt_arithmetic_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mf-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original immutable MF 30-cell receipt
        uses: actions/download-artifact@v4
        with:
          name: v98-mf-physical-40960725817
          run-id: 40960725817
          github-token: ${{ github.token }}
          path: mf-receipt
      - name: Independently reconcile 30 cells, marginal economics and rejection
        run: python research/v98_independent/mf_independent_receipt_arithmetic_audit.py --receipt mf-receipt/mf_30cell_training_receipt.json
