name: V99 R106 Phase158 Cross-Venue Funding Divergence DATA Audit
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'scripts/run_v99_r106_phase158_crossvenue_funding_divergence_data_audit.py'
      - '.github/workflows/v99-r106-phase158-crossvenue-funding-divergence-data-audit.yml'
permissions:
  contents: write
concurrency: {group: v99-r106-phase158-crossvenue-funding-divergence-data-audit, cancel-in-progress: false}
jobs:
  data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3'
      - name: Assert preregistered data-only contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_v99_r106_phase158_crossvenue_funding_divergence_data_audit.py').read_text(); q=Path('research/v99_r106_phase158_crossvenue_funding_divergence_data_prereg.md').read_text()
          assert 'DATA-ONLY' in q and 'No PnL is computed' in q and '95%' in q and '90%' in q
          assert "'pnl_computed':False" in p and "'holdout_rows_used_for_feature_construction':0" in p and "'v99_frozen':True" in p
          print('Phase158 data-only frozen contract PASS')
          PY
      - name: Run Phase158 orthogonal funding data audit
        run: python scripts/run_v99_r106_phase158_crossvenue_funding_divergence_data_audit.py
      - name: Verify fail-closed invariants
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/candidate_v99_r106_phase158_crossvenue_funding_divergence_data_audit.json'))
          assert x['pnl_computed'] is False and x['holdout_rows_used_for_feature_construction']==0 and x['holdout_rows_used_for_selection']==0
          assert x['frozen_assets_untouched']=={'v16':True,'v99_frozen':True} and len(x['assets'])==5
          print(x['status'])
          PY
      - name: Commit DATA evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/candidate_v99_r106_phase158_crossvenue_funding_divergence_data_audit.json
          git diff --cached --quiet || git commit -m 'Record V99 R106 Phase158 funding data audit'
          git pull --rebase origin research/v99-r106-native-all-regime-engine
          git push origin HEAD:research/v99-r106-native-all-regime-engine
