name: V99 I1 bounded licensed CoinAPI original object fetch (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_coinapi_authenticated_object_fetch.py
      - research/tests/test_v99_r106_i1_coinapi_authenticated_object_fetch.py
      - research/V99_R106_I1_COINAPI_AUTHENTICATED_SINGLE_OBJECT_FETCH_PREREG_20261102.md
      - .github/workflows/v99-r106-i1-coinapi-original-object-fetch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-transport-no-paid-read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source-transport preregistration precedes implementation
        run: |
          git merge-base --is-ancestor df1fc20a1e98e6bd1e236cc1054bbb58485a64ec HEAD
          test -s research/V99_R106_I1_COINAPI_AUTHENTICATED_SINGLE_OBJECT_FETCH_PREREG_20261102.md
      - name: Run adversarial original-byte and billable-veto tests
        run: python -m unittest -v research.tests.test_v99_r106_i1_coinapi_authenticated_object_fetch
      - name: Real secret-aware preflight; NEVER authorize billable HEAD or GET in CI
        env:
          COINAPI_API_KEY: ${{ secrets.COINAPI_API_KEY }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          from pathlib import Path
          from research.tools.v99_r106_i1_coinapi_authenticated_object_fetch import acquire
          with tempfile.TemporaryDirectory() as temporary:
              root=Path(temporary)
              license_file=root/"SYNTHETIC_TEST_LICENSE_NOT_A_REAL_GRANT.txt"
              license_file.write_text("SYNTHETIC CI TEST ONLY", encoding="utf-8")
              digest=hashlib.sha256(license_file.read_bytes()).hexdigest()
              report=acquire(
                  "T-QUOTES/D-20220123/E-DERIBIT/IDDI-test+SC-test+S-BTC__002D25FEB22__002D40000__002DP.csv.gz",
                  "BTC-25FEB22-40000-P", root/"no_download",
                  license_document=license_file, license_sha256=digest,
                  authorize_billable_read=False)
              assert report["status"] in (
                  "BLOCKED_NO_COINAPI_API_KEY",
                  "BLOCKED_BILLABLE_PROVIDER_READ_NOT_AUTHORIZED")
              assert not (root/"no_download").exists()
              assert not report["original_object_acquired"]
              assert not report["economic_train_executed"]
              assert not report["promotion_authorized"]
              print(json.dumps({
                  "status":report["status"],
                  "provider_requests":0,
                  "original_objects_downloaded":0,
                  "certified_option_lifecycles":0,
                  "economic_train_executed":False,
                  "promotion_authorized":False,
              },sort_keys=True))
          PY
