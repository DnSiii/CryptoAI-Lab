name: V99 R106 D1 C155 preregistered source checks (NO ECONOMICS)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_r106_d1_basis_carry_preregistered.py'
      - 'research/tests/test_v99_r106_d1_c155_prereg_source.py'
      - '.github/workflows/v99-r106-d1-c155-prereg-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Eight D1 causal/source-only tests
        run: python -m unittest research.tests.test_v99_r106_d1_c155_prereg_source -v
      - name: Existing exact paired lot and sealed calendar tests
        run: |
          python -m unittest research.tests.test_v99_r106_d1_c153_pair_lattice research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Explicit no-economic-authorization proof
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p = report_permissions()
          assert all(p[k] is False for k in (
            'historical_train_economics_run', 'validation_opened',
            'final_holdout_opened', 'promotion_authorized',
            'real_orders_enabled', 'paper_publication_authorized'))
          print('DATA_ONLY/HOLD — NO PROMOTION; no historical market economics')
          PY
