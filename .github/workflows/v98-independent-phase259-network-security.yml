name: V98 Independent Phase259 Network Security Expansion
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase259-network-security.yml'
      - 'research/v98_independent/phase259_network_security_expansion.py'
      - 'research/v98_independent/test_phase259_network_security_expansion.py'
      - 'research/v98_independent/phase259_network_security_expansion_prereg.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase259-network-security
  cancel-in-progress: false
jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Restore/save Clean-4 cache
        uses: ./.github/actions/v98-independent-clean4-cache
      - name: Phase259 causal/invariant tests
        run: PYTHONPATH=src python -m pytest -q research/v98_independent/test_phase259_network_security_expansion.py
      - name: Rebuild/revalidate Clean-4
        run: python research/v98_independent/phase243_clean4_source_pipeline.py --attempts 3
      - name: Execute Phase259 twice
        run: |
          python research/v98_independent/phase259_network_security_expansion.py --out /tmp/p259a.json
          python research/v98_independent/phase259_network_security_expansion.py --out /tmp/p259b.json
          cmp /tmp/p259a.json /tmp/p259b.json
          cp /tmp/p259a.json research/v98_independent/phase259_network_security_expansion_results.json
      - name: Enforce Phase259 firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase259_network_security_expansion_results.json'))
          assert p['phase']==259 and p['training_only'] is True and p['validation'] is None
          assert p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert p['parameters']['recent_days']==30 and p['parameters']['prior_days']==30
          assert p['parameters']['sleeve_per_asset']==0.0625 and p['parameters']['system_gross_cap']==1.5
          assert p['diagnostics']['max_open_gross']<=1.500000001
          assert p['gate']['decision'] in {'NETWORK_SECURITY_EXPANSION_CANDIDATE','REJECT_NETWORK_SECURITY_EXPANSION_NO_RESCUE'}
          print('Phase259',p['gate']['decision'])
          PY
      - name: Commit Phase259 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase259_network_security_expansion_results.json
          if git diff --cached --quiet; then
            echo no-result-change
          else
            git commit -m "v98 phase259: record network-security expansion evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v98-phase259-network-security-${{ github.run_id }}
          retention-days: 30
          path: research/v98_independent/phase259_network_security_expansion_results.json
