name: V98 Independent BX Segregated Four Book Seven Slot 90-Cell Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-bx-seven-slot-90cell.yml'
      - 'research/v98_independent/bx_sources.py'
      - 'research/v98_independent/bx_allocator.py'
      - 'research/v98_independent/bx_ringfenced_governor.py'
      - 'research/v98_independent/bx_90cell.py'
      - 'research/v98_independent/bx_reconcile.py'
      - 'research/v98_independent/bx_independent_receipt_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [BX_core_only, BX_full, BX_minus_opportunity, BX_minus_RV, BX_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile and test BX source causality, allocator and physical no-netting
        working-directory: research/v98_independent
        run: |
          python -m py_compile bx_sources.py bx_allocator.py bx_ringfenced_governor.py bx_90cell.py bx_reconcile.py bx_independent_receipt_audit.py
          python bx_sources.py
          python bx_allocator.py
          python bx_ringfenced_governor.py
      - name: Retrieve pinned vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute BX native-funded ringfenced historical 18-cell path
        working-directory: research/v98_independent
        run: |
          python bx_90cell.py --path ${{ matrix.path }} --output bx90_${{ matrix.path }}.json || echo 'BX_REJECTION_OR_FAILURE_RECORDED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bx90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/bx90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify every 18-cell path is present, do not hide failures
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('bx90_BX_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('BX_PATH_SURVIVAL',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bx90-ubuntu-*
          path: receipts
      - name: Independent cross-OS physical economic and ringfence gate
        run: python research/v98_independent/bx_reconcile.py --root receipts --output bx90_official_economic_summary.json
      - name: Independent original-receipt arithmetic audit
        if: always()
        run: python research/v98_independent/bx_independent_receipt_audit.py --root receipts --output bx90_independent_arithmetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bx90-official-economic-summary
          path: bx90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bx90-independent-arithmetic
          path: bx90_independent_arithmetic.json
          retention-days: 30
          if-no-files-found: warn
