name: V98 Independent Official Premium Index Source Feasibility No PnL
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-premium-source-feasibility.yml'
      - 'research/v98_independent/v98_premium_source_feasibility_20261101.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v98-premium-source-only:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe four preregistered Clean-4 2023-2025 monthly source files and vendor SHA; no PnL
        working-directory: research/v98_independent
        run: python v98_premium_source_feasibility_20261101.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-premium-source-feasibility
          path: research/v98_independent/v98_premium_source_feasibility_result.json
          retention-days: 30
          if-no-files-found: warn
