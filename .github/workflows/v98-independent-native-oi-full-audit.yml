name: V98 Independent OI Full Source Artifact-Only Independent Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-native-oi-full-audit.yml'
      - 'research/v98_independent/v98_oi_full_history_independent_audit_20261027.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-full-source-only
          run-id: 40476881649
          github-token: ${{ github.token }}
          path: frozen-oi
      - name: Independently reconcile every source manifest day and every causal hourly OI row
        shell: bash
        run: |
          python -m py_compile research/v98_independent/v98_oi_full_history_independent_audit_20261027.py
          python research/v98_independent/v98_oi_full_history_independent_audit_20261027.py --root frozen-oi --output v98_oi_independent_source_audit.json
          python - <<'PY'
          import collections,glob,json
          p=glob.glob('frozen-oi/**/v98_oi_full_history_source_report_20261027.json',recursive=True)
          assert len(p)==1
          x=json.load(open(p[0]))
          bad=[v for v in x['manifest'] if not v['passed']]
          by_asset=collections.Counter(v['asset'] for v in bad)
          by_reason=collections.Counter((v['asset'],v.get('first_fault','').split(':')[0]) for v in bad)
          print('V98_OI_QUARANTINE_BY_ASSET',dict(by_asset))
          print('V98_OI_QUARANTINE_BY_REASON',dict(by_reason))
          print('V98_OI_QUARANTINE_EARLIEST',bad[:15])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-oi-full-source-artifact-only-audit
          path: v98_oi_independent_source_audit.json
          retention-days: 30
          if-no-files-found: warn
