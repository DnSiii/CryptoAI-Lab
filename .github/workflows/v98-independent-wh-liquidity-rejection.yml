name: V98 Independent WH Liquidity Rejection Full-History Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-wh-liquidity-rejection.yml'
      - 'research/v98_independent/wh_liquidity_rejection.py'
      - 'research/v98_independent/wh_liquidity_rejection_physical.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wh-2023-25-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: WH causal future-mutation and syntax tests
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/wh_liquidity_rejection.py research/v98_independent/wh_liquidity_rejection_physical.py
          python research/v98_independent/wh_liquidity_rejection.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: WH full 30-cell exposed training
        run: |
          set -euo pipefail
          python research/v98_independent/wh_liquidity_rejection_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir wh-physical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-wh-liquidity-rejection-exposed-not-validated
          path: wh-physical/
          retention-days: 30
          if-no-files-found: warn
      - name: Explicit reject or unvalidated training-only status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('wh-physical/wh_source.json').read_text())
          if s['decision'].startswith('REJECT'):raise SystemExit('WH_PRE_PNL_REJECTED')
          r=json.loads(Path('wh-physical/wh_exposed_physical.json').read_text())
          for tier in ('base','severe','supersevere'):
              x=next(v for v in r['cells'] if v['book']=='WH_full' and v['tier']==tier and v['order']=='carried_before_fill')
              print('WH_FULL',tier,json.dumps({k:x.get(k) for k in ('passed','reason','cagr','max_dd','annual_returns','final_equity')},sort_keys=True),flush=True)
          print('WH_FAILURES',json.dumps(r['failures']),flush=True)
          if r['decision'].startswith('REJECT'):raise SystemExit('WH_REJECTED_NO_ENGINE')
          assert r['decision']=='PASS_WH_EXPOSED_TRAINING_ONLY_NOT_VALIDATED'
          print('WH_EXPOSED_TRAINING_ONLY_INDEPENDENT_AUDIT_PENDING')
          PY
