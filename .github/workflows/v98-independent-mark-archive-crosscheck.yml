name: V98 Independent Official Mark Kline Archive Crosscheck (Training Only)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mark-archive-crosscheck.yml'
      - 'research/v98_independent/v98_mark_archive_crosscheck.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  archive-mark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned original Clean4 training-only source
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Compare official checksum-verified 2023-01 mark-price klines to conservative marks
        run: python research/v98_independent/v98_mark_archive_crosscheck.py --root official-input --output v98_mark_archive_202301_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mark-archive-202301-${{ github.run_id }}
          path: v98_mark_archive_202301_receipt.json
          retention-days: 30
          if-no-files-found: warn
