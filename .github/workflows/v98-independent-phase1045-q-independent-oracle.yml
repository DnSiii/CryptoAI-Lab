name: V98 Independent Phase1045 Q Signed Independent Oracle
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/test_phase1045_q_signed_independent_oracle.py'
      - '.github/workflows/v98-independent-phase1045-q-independent-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q-independent-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1'
      - name: Verify 5000 independent signed corner states and 3600 LP states
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1045_q_signed_independent_oracle.py
