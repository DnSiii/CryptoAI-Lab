name: V99 R106 prospective OKX 1H source receipts

on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_r106_okx_prospective_receipt.py'
      - 'research/tests/test_v99_r106_okx_prospective_receipt.py'
      - 'research/tools/v99_r106_receipt_append.py'
      - 'research/tests/test_v99_r106_receipt_append.py'
      - 'research/tools/v99_r106_okx_multihour_continuity.py'
      - 'research/tests/test_v99_r106_okx_multihour_continuity.py'
      - '.github/workflows/v99-r106-okx-asof-receipts.yml'
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v99-r106-okx-prospective-receipts
  cancel-in-progress: false

jobs:
  first-party-market-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout source-only branch without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Python 3.12 (no external packages)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic time, market and no-trade adversarial tests
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_okx_prospective_receipt.py' -v
      - name: Verify append-only receipt-store invariants
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_receipt_append.py' -v
      - name: Test successive-hour immutable continuity and revisions
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_okx_multihour_continuity.py' -v
      - name: Acquire current first-party OKX 1H receipts with OKX server time
        run: |
          python -m research.tools.v99_r106_okx_prospective_receipt \
            --out research_evidence/okx_live_receipt
      - name: Independently verify manifest and each raw source hash
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('research_evidence/okx_live_receipt')
          m=json.loads((d/'manifest.json').read_text())
          assert m['status']=='FIRST_PARTY_OKX_HTTP_OBSERVED_DATA_ONLY'
          assert m['promotion_authorized'] is False
          assert m['paper_publication_authorized'] is False
          assert m['original_r106_binance_fee_and_funding_model_transfer_authorized'] is False
          assert m['holdout_accessed'] is False
          assert len(m['instruments'])==5
          for name,item in sorted(m['instruments'].items()):
              raw=(d/(name+'.raw.json')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==item['source_raw_sha256']
              assert item['confirmed_candles']>=3
              print(name,item['latest_confirmed_close_utc'],item['source_raw_sha256'])
          print('OKX live prospective DATA_ONLY receipt passed; NO PAPER publication')
          PY
      - name: Audit against most recent distinct archived OKX capture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("v99-r106-okx-firstparty-")) | select(.expired == false)] | sort_by(.created_at) | last | .name // empty')"
          if [ -z "$prior_name" ]; then
            # Main paper refresh creates >100 newer artifacts daily, so the
            # first repository artifacts page can hide yesterday's source.
            # This exact baseline exists as official GitHub Actions artifact.
            prior_name="v99-r106-okx-firstparty-38630788811"
            echo "::notice::Artifact not in first API page; using verified first OKX as-of baseline $prior_name"
          fi
          prior_run="${prior_name##*-}"
          mkdir -p research_evidence/previous_okx
          gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" --name "$prior_name" --dir research_evidence/previous_okx
          python -m research.tools.v99_r106_okx_multihour_continuity \
            --previous research_evidence/previous_okx \
            --current research_evidence/okx_live_receipt \
            --out research_evidence/okx_live_receipt/continuity_witness.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_evidence/okx_live_receipt/continuity_witness.json')
          r=json.loads(p.read_text())
          assert r['paper_publication_authorized'] is False
          assert r['promotion_authorized'] is False
          print('DATA_ONLY consecutive acquisition witness:',r['status'],r['issues'])
          PY
      - name: Save original first-party acquisition receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-okx-firstparty-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: research_evidence/okx_live_receipt/
