name: V98 Independent Phase1083 T Event Ledger Synthetic
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1083-t-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t-event-ledger-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Run synthetic causal source, canonical and event-ledger tests
        run: python -m unittest -q test_phase1081_t_sevenslot_source.py test_phase1082_t_authenticated_source.py test_phase1083_t_event_driven_ledger.py
