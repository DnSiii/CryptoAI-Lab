name: V98 Independent Phase1185 AC 90-Cell FIFO Reconciliation Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1185_ac_fifo_reconciliation_synthetic.py'
      - '.github/workflows/v98-independent-phase1185-ac-fifo-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ac-fifo-reconcile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Independent FIFO reconcile every hour across all 90 synthetic cells
        run: python phase1185_ac_fifo_reconciliation_synthetic.py
      - name: Preserve complete FIFO synthetic reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-ac-1185-fifo-${{ matrix.os }}
          path: research/v98_independent/phase1185_ac_fifo_synthetic_receipt.json
          retention-days: 30
          if-no-files-found: warn
