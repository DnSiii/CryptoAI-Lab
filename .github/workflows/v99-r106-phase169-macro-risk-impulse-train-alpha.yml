name: V99 R106 Phase169 Macro Risk Impulse TRAIN Alpha
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/v99_r106_phase169_macro_risk_impulse_prereg.md'
      - 'scripts/run_v99_r106_phase169_macro_risk_impulse_train_alpha.py'
      - '.github/workflows/v99-r106-phase169-macro-risk-impulse-train-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v99-r106-phase169-macro-alpha
  cancel-in-progress: false
jobs:
  alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Frozen firewall precheck
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PREREGISTERED BEFORE ANY Phase169 PnL.' research/v99_r106_phase169_macro_risk_impulse_prereg.md
          python - <<'PY'
          import json
          d=json.load(open('reports/candidate_v99_r106_phase168_external_macro_data_audit.json'))
          assert d['status']=='PASS_DATA_ONLY'
          assert d['holdout_rows_used_for_feature_construction']==0 and d['holdout_rows_used_for_selection']==0
          assert d['frozen_assets_untouched']=={'v16':True,'v99_frozen':True}
          PY
      - name: Run TRAIN-only alpha gate
        run: python scripts/run_v99_r106_phase169_macro_risk_impulse_train_alpha.py
      - name: Assert scientific firewall
        run: |
          python - <<'PY'
          import json
          p='reports/candidate_v99_r106_phase169_macro_risk_impulse_train_alpha.json'; d=json.load(open(p))
          assert d['status'] in {'TRAIN_ALPHA_PASS_FREEZE_FOR_DOWNSTREAM','TRAIN_ALPHA_REJECT'}
          assert d['holdout_rows_used_for_feature_construction']==0 and d['holdout_rows_used_for_selection']==0
          assert d['frozen_assets_untouched']=={'v16':True,'v99_frozen':True}
          assert d['precommitment']['entire_target_shift_hours']==1 and d['precommitment']['single_hypothesis_no_grid'] is True
          PY
      - name: Commit evidence race-safe
        shell: bash
        run: |
          set -euo pipefail
          p=reports/candidate_v99_r106_phase169_macro_risk_impulse_train_alpha.json
          cp "$p" /tmp/phase169.json
          git fetch origin research/v99-r106-native-all-regime-engine
          git reset --hard origin/research/v99-r106-native-all-regime-engine
          cp /tmp/phase169.json "$p"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record V99 R106 Phase169 macro TRAIN alpha'
          git push origin HEAD:research/v99-r106-native-all-regime-engine
