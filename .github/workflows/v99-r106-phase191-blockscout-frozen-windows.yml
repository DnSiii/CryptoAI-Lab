name: V99 R106 Phase191 Blockscout Frozen Windows
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase191_blockscout_frozen_windows.py'
      - '.github/workflows/v99-r106-phase191-blockscout-frozen-windows.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard V16/V99 Frozen
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ei '(^|/)(V16_FROZEN|V99_FROZEN)(/|\.|_)|(^|/)frozen/(v16|v99)(/|$)'; then echo 'Frozen artifact touched'; exit 1; fi
      - name: Restore prior DATA_ONLY source checkpoint
        uses: actions/cache/restore@v4
        with:
          path: /tmp/source.json
          key: phase191-blockscout-${{ github.run_id }}
          restore-keys: |
            phase191-blockscout-
      - name: Capture fixed TRAIN source snapshot
        run: |
          set -euo pipefail
          python research/tools/v99_phase191_blockscout_frozen_windows.py --snapshot /tmp/source.json > /tmp/live.json
          test -s /tmp/source.json
          sha256sum /tmp/source.json
      - name: Deterministic offline replay twice
        run: |
          set -euo pipefail
          python research/tools/v99_phase191_blockscout_frozen_windows.py --replay /tmp/source.json > /tmp/a.json
          python research/tools/v99_phase191_blockscout_frozen_windows.py --replay /tmp/source.json > /tmp/b.json
          cmp /tmp/live.json /tmp/a.json
          cmp /tmp/a.json /tmp/b.json
          cat /tmp/a.json
          sha256sum /tmp/a.json
      - name: Check checkpoint presence
        if: always()
        id: checkpoint
        run: |
          if test -s /tmp/source.json; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Save partial or complete DATA_ONLY source checkpoint
        if: always() && steps.checkpoint.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/source.json
          key: phase191-blockscout-${{ github.run_id }}
