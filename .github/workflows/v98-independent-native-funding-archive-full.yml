name: V98 Independent Full Native Funding Rate Archive Attestation
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-native-funding-archive-full.yml'
      - 'research/v98_independent/v98_native_funding_archive_full_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  funding-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned original Clean4 training-only artifact
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Independently verify 100 official signed funding archives and all 9144 native rates
        run: |
          python -m py_compile research/v98_independent/v98_native_funding_archive_full_audit.py
          python research/v98_independent/v98_native_funding_archive_full_audit.py --root official-input --output v98_native_funding_archive_full_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-native-funding-full-${{ github.run_id }}
          path: v98_native_funding_archive_full_receipt.json
          retention-days: 30
          if-no-files-found: warn
