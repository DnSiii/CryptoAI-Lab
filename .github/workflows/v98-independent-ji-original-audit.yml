name: V98 Independent JI Original Receipt Independent Economic Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ji-original-audit.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  original_receipt_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download only original JI 2023-2024 native physical book artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ji30-ubuntu-*
          run-id: 40640553144
          github-token: ${{ github.token }}
          path: original-receipts
      - name: Independently recalculate original 60 physical receipts without engine imports
        run: |
          python -m py_compile research/v98_independent/ji_original_artifact_independent_audit.py
          python research/v98_independent/ji_original_artifact_independent_audit.py --root original-receipts --output ji_original_independent_economic_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ji-original-independent-economic-audit
          path: ji_original_independent_economic_audit.json
          retention-days: 30
          if-no-files-found: warn
