name: V98 Independent Phase1135 Y Frozen-Source Synthetic Economic Oracle
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1135-y-synthetic.yml'
      - 'research/v98_independent/phase1135_y_funded_training_simulator.py'
      - 'research/v98_independent/test_phase1135_y_funded_training_simulator.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  y-economic-synthetic-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Y Phase1135 source-agnostic synthetic tests ONLY
        run: |
          python -m unittest -v test_phase1135_y_funded_training_simulator.py
          python -m unittest -q test_phase1131_y_growth_metrics.py test_phase1132_y_closed_trade_accounting.py
      - name: Assert no historical economic receipt
        run: |
          test ! -e phase1136_y_Y_full_training_receipt.json
          test ! -e phase1137_y_full_pre_economic_freeze.json
