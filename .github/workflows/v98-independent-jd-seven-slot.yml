name: V98 Independent JD OI Deleveraging Breadth Seven Slot 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-jd-seven-slot.yml'
      - 'research/v98_independent/jd_oi_deleveraging_breadth_prereg_20261027.md'
      - 'research/v98_independent/jd_oi_deleveraging_breadth_sources.py'
      - 'research/v98_independent/jd_source_viability.py'
      - 'research/v98_independent/jd_30cell.py'
      - 'research/v98_independent/jd_reconcile_30cell.py'
      - 'research/v98_independent/jd_independent_ledger_replay.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned training data only (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: offjdial-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: oi-input
      - name: Stage exact independently audited OI v2 source (no missing-day fill)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('oi-input');target=Path('research/v98_independent')
          names=['v98_oi_full_history_source_v2_report_20261027.json','v98_oi_full_history_v2_verified_hourly_20261027.csv']
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Stage exact authentjdated Clean-4 source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('offjdial-input');target=Path('research/v98_independent')
          names=['phase803_offjdial_training_ohlc_receipt.json','phase1000_four_asset_source_poljdy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonjdal'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-v2-full-source-artifact-only-audit
          run-id: 40477926560
          github-token: ${{ github.token }}
          path: oi-audit
      - name: Require independent OI artifact-only integrity before any economjd PnL
        run: |
          python - <<'PY'
          import glob,json
          p=glob.glob('oi-audit/**/*.json',recursive=True)
          assert len(p)==1,p
          x=json.load(open(p[0]))
          assert x['decision']=='PASS_OI_ARTIFACT_INTEGRITY_WITH_GAPS_NOT_TRAINING_APPROVAL'
          assert x['verified_days']==3011 and x['quarantined_days']==37
          assert x['verified_hourly_rows']==72264 and not x['pnl_computed']
          PY
      - name: JD native OI deleveraging breadth source viability
        working-directory: research/v98_independent
        run: |
          python -m py_compile jd_oi_deleveraging_breadth_sources.py jd_source_viability.py jd_30cell.py jd_reconcile_30cell.py
          python jd_oi_deleveraging_breadth_sources.py
          python -c 'import jd_30cell, jd_reconcile_30cell, jd_independent_ledger_replay'
          python jd_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jd-source-viability
          path: research/v98_independent/jd_source_viability.json
          retention-days: 30
          if-no-files-found: warn
  economjd:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [JD_core_only, JD_full, JD_minus_opportunity, JD_minus_RV, JD_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authentjdated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: offjdial-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: oi-input
      - name: Stage exact independently audited OI v2 source (no missing-day fill)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('oi-input');target=Path('research/v98_independent')
          names=['v98_oi_full_history_source_v2_report_20261027.json','v98_oi_full_history_v2_verified_hourly_20261027.csv']
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('offjdial-input');target=Path('research/v98_independent')
          names=['phase803_offjdial_training_ohlc_receipt.json','phase1000_four_asset_source_poljdy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonjdal'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Run native 6-cell path USD10k, base/severe/supersevere and both funding orders
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python jd_30cell.py --path ${{ matrix.path }} --output jd30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s jd30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jd30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/jd30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economjd]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jd30-ubuntu-*
          path: receipts
      - name: Independent artifact-only 30-cell cross-OS and marginal gate
        shell: bash
        run: python research/v98_independent/jd_reconcile_30cell.py --root receipts --output jd30_offjdial_economjd_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jd30-offjdial-economjd-summary
          path: jd30_offjdial_economjd_summary.json
          retention-days: 30
          if-no-files-found: warn

  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [JD_core_only, JD_full, JD_minus_opportunity, JD_minus_RV, JD_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authentjdated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: offjdial-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: oi-input
      - name: Stage exact independently audited OI v2 source (no missing-day fill)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('oi-input');target=Path('research/v98_independent')
          names=['v98_oi_full_history_source_v2_report_20261027.json','v98_oi_full_history_v2_verified_hourly_20261027.csv']
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('offjdial-input');target=Path('research/v98_independent')
          names=['phase803_offjdial_training_ohlc_receipt.json','phase1000_four_asset_source_poljdy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonjdal'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding, NAV, fee, slippage and 81-corner settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py jd_independent_ledger_replay.py
          python jd_independent_ledger_replay.py --path ${{ matrix.path }} --output jd_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jd-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/jd_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
