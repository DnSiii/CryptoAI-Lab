name: V99 I1 CoinAPI derived-only native day integration (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_coinapi_derived_day_bridge.py
      - research/V99_R106_I1_DERIVED_PREPUBLICATION_INDEPENDENT_REPLAY_PREREG_20261102.md
      - research/tools/v99_r106_i1_local_tape_import.py
      - research/tests/test_v99_r106_i1_coinapi_derived_day_bridge.py
      - research/verification/independent_v99_r106_i1_coinapi_derived_day_oracle.py
      - .github/workflows/v99-r106-i1-coinapi-derived-day.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derived-only-source-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert preregistration is an ancestor
        run: |
          git merge-base --is-ancestor c651e124de2a26b617fb2753f41e7e4df92420c3 HEAD
          test -s research/V99_R106_I1_COINAPI_DERIVED_DAY_BRIDGE_PREREG_20261102.md
          git merge-base --is-ancestor 57319c2d1a1951e8815faa7fd36b25ebe074e990 HEAD
          test -s research/V99_R106_I1_DERIVED_PREPUBLICATION_INDEPENDENT_REPLAY_PREREG_20261102.md
      - name: Synthetic two-asset streaming conversion, mandatory independent replay, publication veto
        run: python -m unittest -v research.tests.test_v99_r106_i1_coinapi_derived_day_bridge
      - name: Original source manifest still fail-closed; never certify economics
        run: |
          python - <<'PY'
          from research.tools.v99_r106_i1_coinapi_derived_day_bridge import SCHEMA
          from research.tools.v99_r106_i1_local_tape_import import SCHEMA as ORIGINAL
          assert SCHEMA != ORIGINAL
          print("DERIVED_ONLY_NOT_ORIGINAL_SOURCE; 0 original economic lifecycles certified")
          print("NO TRAIN/ROI/PROMOTION/ORDERS; validation and holdout sealed")
          PY
