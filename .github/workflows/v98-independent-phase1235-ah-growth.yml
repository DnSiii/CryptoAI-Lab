name: V98 Independent Phase1235 AH Signed Growth Core
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1235_ah_signed_growth_core.py'
      - 'research/v98_independent/test_phase1235_ah_signed_growth_core.py'
      - '.github/workflows/v98-independent-phase1235-ah-growth.yml'
  workflow_dispatch:
jobs:
  ah-growth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numpy
        run: python -m pip install numpy==1.26.4
      - name: Verify signed source and no future leakage
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1235_ah_signed_growth_core
      - name: Emit reproducible signed growth hash
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import hashlib,numpy as np
          from test_phase1235_ah_signed_growth_core import TestAHGrowth
          from phase1235_ah_signed_growth_core import ah_growth_source
          x=ah_growth_source(*TestAHGrowth.fixture())
          print('AH1235_SHA256',hashlib.sha256(
            np.round(x,8).astype('<f8').tobytes()).hexdigest())
          print('AH1235_LONG_SHORT_ACTIVE',
            int(np.count_nonzero(x>0)),int(np.count_nonzero(x<0)))
          PY
