name: V98 Clean-4 2025 Official Source-Only Training Extension
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-2025-training-source-only.yml'
      - 'research/v98_independent/v98_2025_training_source_acquire.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Official vendor SHA-verified 2025 source only (not validation)
        working-directory: research/v98_independent
        run: python v98_2025_training_source_acquire.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-2025-training-source-only-${{ github.run_id }}
          path: research/v98_independent/v98_2025_training_official_source/
          retention-days: 30
          if-no-files-found: warn
