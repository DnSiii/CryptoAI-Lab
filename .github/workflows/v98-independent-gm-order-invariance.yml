name: V98 Independent GM Frozen Funding Order Physical Invariance
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-gm-order-invariance.yml'
      - 'research/v98_independent/gm_frozen_order_invariance_audit.py'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gm30-ubuntu-24.04-*
          run-id: 40302799868
          github-token: ${{ github.token }}
          path: frozen-receipts
      - name: Prove 15 funding-order physical pairs invariant from frozen receipts
        run: python research/v98_independent/gm_frozen_order_invariance_audit.py --root frozen-receipts --output gm_frozen_order_invariance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gm-frozen-order-invariance
          path: gm_frozen_order_invariance.json
          retention-days: 30
          if-no-files-found: warn
