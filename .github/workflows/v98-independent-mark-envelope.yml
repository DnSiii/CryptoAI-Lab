name: V98 Independent Two-Sided Official Funding Mark Envelope
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mark-envelope.yml'
      - 'research/v98_independent/v98_mark_envelope_source.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mark-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve original SHA256-pinned Clean4 training only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Produce 9144 signed-funding timestamp two-sided mark OHLC bounds from official SHA-verified archives
        run: |
          python -m py_compile research/v98_independent/v98_mark_envelope_source.py
          python research/v98_independent/v98_mark_envelope_source.py --root official-input --csv v98_official_mark_envelope_training.csv --output v98_official_mark_envelope_training_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-official-mark-envelope-${{ github.run_id }}
          path: |
            v98_official_mark_envelope_training.csv
            v98_official_mark_envelope_training_receipt.json
          retention-days: 30
          if-no-files-found: warn
