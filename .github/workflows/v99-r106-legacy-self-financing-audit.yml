name: V99 R106 legacy C1/C2 self-financing accounting forensic (NO PROMOTION)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_legacy_self_financing_audit.py
      - research/tests/test_v99_r106_legacy_self_financing_audit.py
      - research/V99_R106_LEGACY_SELF_FINANCING_ACCOUNTING_AUDIT_PREREG_20261030.md
      - research/V99_R106_TERMINAL_LIQUIDATION_CONSERVATION_PREREG_20261030.md
      - .github/workflows/v99-r106-legacy-self-financing-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-train-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg and synthetic adversarial conservation tests
        run: |
          test -s research/V99_R106_LEGACY_SELF_FINANCING_ACCOUNTING_AUDIT_PREREG_20261030.md
          python -m unittest discover -s research/tests -p 'test_v99_r106_legacy_self_financing_audit.py' -v
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: v99-r106-canonical-market
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - name: Original canonical TRAIN only; fail closed if missing
        run: |
          test -s data/canonical/BTCUSDT_1h.csv
          test -s data/canonical/ETHUSDT_1h.csv
      - name: Historical rejected-journal audit; quantity-based NAV conservation, independent replay
        run: |
          python -m research.tools.v99_r106_legacy_self_financing_audit
          cp research_evidence/v99_r106_legacy_self_financing_audit.json /tmp/v99-self-financing-first.json
          python -m research.tools.v99_r106_legacy_self_financing_audit
          cmp /tmp/v99-self-financing-first.json research_evidence/v99_r106_legacy_self_financing_audit.json
          python - <<'PY'
          import json
          p='research_evidence/v99_r106_legacy_self_financing_audit.json'
          r=json.load(open(p))
          assert r['status']=='READ_ONLY_LEGACY_ACCOUNTING_DIAGNOSTIC_NO_PROMOTION'
          assert r['new_economic_candidate'] is False
          assert r['promotion_authorized'] is False
          assert r['sealed_validation_parsed'] is False and r['final_holdout_parsed'] is False
          assert r['funding_or_native_fills_verified'] is False
          for system in r['systems'].values():
              for scenario in system.values():
                  assert scenario['rows']==16055
                  assert scenario['independent_conservation_verified'] is True
                  assert scenario['promotable'] is False
                  assert scenario['terminal_liquidation_independently_verified'] is True
                  exit_data = scenario['modeled_terminal_close']
                  assert exit_data['terminal_notional'] >= 0
                  assert exit_data['terminal_close_fee'] >= 0
                  assert exit_data['terminal_liquidated_nav_NOT_STRATEGY_ROI'] > 0
          print('READ_ONLY_REJECTED_LEGACY_ACCOUNTING_VERIFIED_NO_PROMOTION')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-r106-legacy-self-financing-accounting-readonly
          retention-days: 90
          if-no-files-found: warn
          path: research_evidence/v99_r106_legacy_self_financing_audit.json
