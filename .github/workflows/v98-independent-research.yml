name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py tests/test_v98_independent_phase106.py tests/test_v98_independent_phase109.py tests/test_v98_independent_phase111.py tests/test_v98_independent_phase112.py tests/test_v98_independent_future_holdout_policy.py -q
      - name: Reconstruct V98 training-only canonical market data
        run: |
          python scripts/download_futures_archive.py --config v98_independent_phase050_data.json --workers 40
          python scripts/build_canonical.py --config v98_independent_phase050_data.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.load(open('config/v98_independent_phase050_data.json'))
          assert cfg['cutoff_month']=='2025-12'
          assert set(cfg['symbols'])=={'BTCUSDT','ETHUSDT','BNBUSDT','XRPUSDT','SOLUSDT'}
          assert Path('data/canonical/BTCUSDT_1h.csv').exists()
          PY
      - name: Execute preregistered Phase130 BTC realized-volatility regime
        run: python scripts/v98_independent_phase130_realized_volatility_regime.py
      - name: Enforce Phase130 isolation and anti-overfit contract
        if: always()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase130_realized_volatility_regime.json'))
          assert p['phase']=='130'
          assert p['validation'] is None and p['final_holdout'] is None
          assert p['v16_used'] is False and p['v99_used'] is False
          assert p['phase083_selection_use'] is False and p['parameter_search'] is False and p['rescue_allowed'] is False
          assert p['training_gate']['decision'] in ('PASS_TRAINING','REJECT_NO_RESCUE')
          assert p['execution_guard_audit']['max_open_gross'] <= .750000001
          PY
      - name: Commit V98 Phase130 evidence only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f reports/v98_independent_phase130_realized_volatility_regime.json ]; then git add -f reports/v98_independent_phase130_realized_volatility_regime.json; fi
          if [ -f reports/v98_independent_phase130_realized_volatility_regime_positions.csv ]; then git add -f reports/v98_independent_phase130_realized_volatility_regime_positions.csv; fi
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase130 realized-volatility regime evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload V98 Phase130 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase130-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v98_independent_phase130_realized_volatility_regime.json
            reports/v98_independent_phase130_realized_volatility_regime_positions.csv
