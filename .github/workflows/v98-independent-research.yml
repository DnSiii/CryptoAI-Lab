name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py -q
      - name: Rebuild Phase076 validation-only data through 2026-07
        run: python scripts/v98_independent_phase076_rebuild_validation_data.py
      - name: Execute frozen Phase075 candidate on Phase076 validation
        run: python scripts/v98_independent_phase076_validation.py
      - name: Enforce Phase076 validation isolation contract
        if: always()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase076_validation.json'))
          assert p['engine']=='V98 Independent' and p['phase']=='076'
          assert p['candidate']=='Phase075 frozen 21-day cross-sectional downside-risk asymmetry'
          assert p['parameters_frozen_from_phase075']
          assert p['final_holdout'] is None and p['final_holdout_untouched']
          assert not p['v99_used'] and not p['v16_used'] and not p['parameter_search'] and not p['rescue_allowed']
          assert p['reproducibility']['training_positions_sha256']=='33286707f5ae63d13b8758ee1a93b2fc786ce434fb4d3e8884df0ad3d84d0880'
          print('Phase076 validation isolation guard passed; final holdout untouched')
          PY
      - name: Commit V98 Phase076 validation evidence only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -f reports/v98_independent_phase076_validation.json || git add -f reports/v98_independent_phase076_validation.json
          test ! -f reports/v98_independent_phase076_validation_positions.csv || git add -f reports/v98_independent_phase076_validation_positions.csv
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase076 frozen candidate validation"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload Phase076 validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase076-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v98_independent_phase076_validation.json
            reports/v98_independent_phase076_validation_positions.csv
