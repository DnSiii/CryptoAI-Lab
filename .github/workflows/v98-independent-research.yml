name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py tests/test_v98_independent_phase106.py tests/test_v98_independent_phase109.py tests/test_v98_independent_phase111.py tests/test_v98_independent_phase112.py tests/test_v98_independent_future_holdout_policy.py -q
      - name: Execute corrected Phase139 DATA_ONLY twice
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          script='scripts/v98_independent_phase139_treasury_curve_data_only_v2.py'
          outs=[]
          codes=[]
          for _ in range(2):
              p=subprocess.run([sys.executable,script],capture_output=True,text=True)
              codes.append(p.returncode)
              if not p.stdout.strip():
                  raise SystemExit('Phase139 produced no JSON output: '+p.stderr)
              outs.append(json.loads(p.stdout))
          a,b=outs
          a['workflow_reexecution']={
              'second_normalized_observations_sha256':b['normalized_observations_sha256'],
              'identical_hash':a['normalized_observations_sha256']==b['normalized_observations_sha256'],
              'identical_integrity_metadata':a['counts']==b['counts'] and a['coverage']==b['coverage'] and a['gates']==b['gates'],
              'return_codes':codes
          }
          if not a['workflow_reexecution']['identical_hash'] or not a['workflow_reexecution']['identical_integrity_metadata']:
              a['decision']='FAIL'
          out=pathlib.Path('reports/v98_independent_phase139_treasury_curve_data_only.json')
          out.write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          print(json.dumps(a,indent=2,sort_keys=True))
          PY
      - name: Enforce Phase139 DATA_ONLY firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase139_treasury_curve_data_only.json'))
          assert p['phase']=='139' and p['mode']=='DATA_ONLY' and p['series']=='T10Y2Y'
          assert p['calendar']=={'start':'2023-01-01','end':'2025-12-31'}
          assert p['reproducibility']['identical_hash'] is True
          assert p['reproducibility']['identical_integrity_metadata'] is True
          assert p['workflow_reexecution']['identical_hash'] is True
          assert p['workflow_reexecution']['identical_integrity_metadata'] is True
          forbidden={'values','observations','returns','correlation','pnl','profit_factor','sharpe','direction','quantiles'}
          text=json.dumps(p).lower()
          assert not any(('"'+x+'"' in text) for x in forbidden)
          assert p['decision'] in {'PASS','FAIL'}
          print('Phase139 DATA_ONLY decision:',p['decision'])
          PY
      - name: Commit Phase139 evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f reports/v98_independent_phase139_treasury_curve_data_only.json ]; then git add -f reports/v98_independent_phase139_treasury_curve_data_only.json; fi
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase139 treasury-curve data-only evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload Phase139 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase139-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: reports/v98_independent_phase139_treasury_curve_data_only.json
      - name: Enforce Phase139 gate outcome
        run: |
          python - <<'PY'
          import json,sys
          p=json.load(open('reports/v98_independent_phase139_treasury_curve_data_only.json'))
          sys.exit(0 if p['decision']=='PASS' else 2)
          PY
