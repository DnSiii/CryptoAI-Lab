name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py tests/test_v98_independent_phase106.py tests/test_v98_independent_phase109.py tests/test_v98_independent_phase111.py tests/test_v98_independent_phase112.py tests/test_v98_independent_future_holdout_policy.py -q
      - name: Execute preregistered Phase117 global-liquidity DATA_ONLY gate
        run: python scripts/v98_independent_phase117_global_liquidity_feasibility.py
      - name: Enforce Phase117 isolation and activation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase117_global_liquidity_feasibility.json'))
          assert p['phase']=='117' and p['training_only'] is True
          assert p['validation_accessed'] is False and p['final_holdout_accessed'] is False
          assert p['v16_used'] is False and p['v99_used'] is False
          assert p['values_exposed'] is False and p['descriptives_computed'] is False
          assert p['returns_computed'] is False and p['correlations_computed'] is False
          assert p['alpha_computed'] is False and p['pnl_computed'] is False and p['parameter_search'] is False
          assert p['decision']=='PASS_DATA_ONLY'
          assert p['coverage'] >= 0.95 and p['invalid_records']==0 and p['postcanonical_duplicate_dates']==0 and p['outside_training_rows']==0
          PY
      - name: Rebuild frozen V98 training market data only
        run: python scripts/v98_independent_phase050_rebuild_data.py
      - name: Execute preregistered Phase118 WALCL regime training gate
        run: python scripts/v98_independent_phase118_global_liquidity_regime.py
      - name: Enforce Phase118 isolation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase118_global_liquidity_regime.json'))
          assert p['phase']=='118' and p['validation'] is None and p['final_holdout'] is None
          assert p['v16_used'] is False and p['v99_used'] is False and p['phase083_selection_use'] is False
          assert p['parameter_search'] is False and p['rescue_allowed'] is False
          assert p['training_gate']['decision'] in {'PASS_TRAINING','REJECT_NO_RESCUE'}
          assert p['execution_guard_audit']['max_open_gross'] <= 0.750000001
          PY
      - name: Commit V98 Phase117-118 evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v98_independent_phase117_global_liquidity_feasibility.json reports/v98_independent_phase118_global_liquidity_regime.json reports/v98_independent_phase118_global_liquidity_regime_positions.csv
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase118 WALCL regime training evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload V98 Phase118 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase118-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            reports/v98_independent_phase117_global_liquidity_feasibility.json
            reports/v98_independent_phase118_global_liquidity_regime.json
            reports/v98_independent_phase118_global_liquidity_regime_positions.csv
