name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py tests/test_v98_independent_phase106.py tests/test_v98_independent_phase109.py tests/test_v98_independent_phase111.py tests/test_v98_independent_future_holdout_policy.py -q
      - name: Execute corrected Phase111 stablecoin-peg DATA_ONLY gate
        run: python scripts/v98_independent_phase111_stablecoin_peg_feasibility.py
      - name: Enforce Phase111 isolation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase111_stablecoin_peg_feasibility.json'))
          assert p['phase']=='111' and p['mode']=='DATA_ONLY_NO_ALPHA_NO_PNL'
          assert p['v99_used'] is False and p['v16_used'] is False and p['phase083_selection_use'] is False
          assert p['validation'] is None and p['final_holdout'] is None
          assert p['alpha_or_pnl_computed'] is False and p['parameter_search'] is False and p['rescue_allowed'] is False
          assert p['price_descriptives_exposed'] is False and p['parser_correction_only'] is True
          assert p['gate'] in {'PASS_DATA_ONLY','FAIL_DATA_NO_ALPHA'}
          print('Phase111 corrected isolation guard passed:',p['gate'])
          PY
      - name: Commit V98 corrected Phase111 evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v98_independent_phase111_stablecoin_peg_feasibility.json
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record corrected phase111 stablecoin peg evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload corrected Phase111 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase111-corrected-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: reports/v98_independent_phase111_stablecoin_peg_feasibility.json
