name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py -q
      - name: Rebuild frozen V98 training-only data
        run: python scripts/v98_independent_phase050_rebuild_data.py --config v98_independent_phase050_data.json
      - name: Execute frozen Phase077 sign-entropy training
        run: python scripts/v98_independent_phase077_sign_entropy.py
      - name: Enforce Phase077 isolation contract
        if: always()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase077_sign_entropy.json'))
          assert p['engine']=='V98 Independent' and p['phase']=='077'
          assert p['preregistration']=='reports/v98_independent_phase077_prereg.md'
          assert p['validation'] is None and p['final_holdout'] is None and p['final_holdout_untouched']
          assert not p['v99_used'] and not p['v16_used'] and not p['parameter_search'] and not p['rescue_allowed']
          print('Phase077 isolation guard passed')
          PY
      - name: Commit V98 Phase077 evidence only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -f reports/v98_independent_phase077_sign_entropy.json || git add -f reports/v98_independent_phase077_sign_entropy.json
          test ! -f reports/v98_independent_phase077_sign_entropy_positions.csv || git add -f reports/v98_independent_phase077_sign_entropy_positions.csv
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase077 sign entropy training"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload Phase077 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase077-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v98_independent_phase077_sign_entropy.json
            reports/v98_independent_phase077_sign_entropy_positions.csv
