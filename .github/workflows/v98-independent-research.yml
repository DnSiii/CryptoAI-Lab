name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1"}
    steps:
      - name: Check out isolated V98 branch
        uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run V98 causality and invariant tests only
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py -q
      - name: Reconstruct V98 training-only canonical data
        run: |
          python scripts/download_futures_archive.py --workers 40 --config v98_independent_phase050_data.json
          python scripts/build_canonical.py --config v98_independent_phase050_data.json
      - name: Execute frozen Phase059 macro-risk training
        run: python scripts/v98_independent_phase059_macro_risk_overlay.py
      - name: Enforce Phase059 isolation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase059_macro_risk_overlay.json'))
          assert p['engine']=='V98 Independent' and p['phase']=='059'
          assert p['final_holdout'] is None and p['final_holdout_untouched'] and not p['v99_used']
          assert 'no search/inversion/rescue' in p['selection_policy']
          if not p['training_gate']['passed']: assert p['validation'] is None
          print('Phase059 isolation guard passed')
          PY
      - name: Commit V98 Phase059 evidence only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -f reports/v98_independent_phase059_macro_risk_overlay.json || git add reports/v98_independent_phase059_macro_risk_overlay.json
          test ! -f reports/v98_independent_phase059_macro_risk_overlay_positions.csv || git add reports/v98_independent_phase059_macro_risk_overlay_positions.csv
          if git diff --cached --quiet; then echo "No Phase059 evidence changes to commit."; else git commit -m "v98: record phase059 macro-risk evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload V98 Phase059 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase059-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v98_independent_phase059_macro_risk_overlay.json
            reports/v98_independent_phase059_macro_risk_overlay_positions.csv
