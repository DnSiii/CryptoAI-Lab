name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py tests/test_v98_independent_phase106.py tests/test_v98_independent_phase109.py tests/test_v98_independent_phase111.py tests/test_v98_independent_phase112.py tests/test_v98_independent_future_holdout_policy.py -q
      - name: Reconstruct V98 Phase050 training-only canonical data
        run: |
          python scripts/download_futures_archive.py --config v98_independent_phase050_data.json --workers 40
          python scripts/build_canonical.py --config v98_independent_phase050_data.json
      - name: Reconfirm corrected Phase111 DATA_ONLY gate
        run: python scripts/v98_independent_phase111_stablecoin_peg_feasibility.py
      - name: Enforce Phase111 activation gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase111_stablecoin_peg_feasibility.json'))
          assert p['gate']=='PASS_DATA_ONLY' and p['alpha_or_pnl_computed'] is False and p['validation'] is None and p['final_holdout'] is None
          PY
      - name: Execute preregistered Phase112 training gate
        run: python scripts/v98_independent_phase112_stablecoin_confidence_regime.py
      - name: Enforce Phase112 isolation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase112_stablecoin_confidence_regime.json'))
          assert p['phase']=='112' and p['v99_used'] is False and p['v16_used'] is False
          assert p['phase083_selection_use'] is False and p['validation'] is None and p['final_holdout'] is None
          assert p['parameter_search'] is False and p['rescue_allowed'] is False
          assert p['training_gate']['decision'] in {'PASS_TRAINING','REJECT_NO_RESCUE'}
          PY
      - name: Execute preregistered Phase113 DATA_ONLY gate
        run: python scripts/v98_independent_phase113_fear_greed_feasibility.py
      - name: Enforce Phase113 no-alpha isolation
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase113_fear_greed_feasibility.json'))
          assert p['phase']=='113' and p['mode']=='DATA_ONLY_NO_ALPHA_NO_PNL'
          assert p['alpha_or_pnl_computed'] is False and p['value_descriptives_exposed'] is False
          assert p['validation'] is None and p['final_holdout'] is None and p['v99_used'] is False and p['v16_used'] is False
          assert p['gate'] in {'PASS_DATA_ONLY','FAIL_DATA_NO_ALPHA'}
          PY
      - name: Commit V98 evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v98_independent_phase111_stablecoin_peg_feasibility.json reports/v98_independent_phase112_stablecoin_confidence_regime.json reports/v98_independent_phase112_stablecoin_confidence_regime_positions.csv reports/v98_independent_phase113_fear_greed_feasibility.json
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase113 data-only evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload V98 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            reports/v98_independent_phase112_stablecoin_confidence_regime.json
            reports/v98_independent_phase112_stablecoin_confidence_regime_positions.csv
            reports/v98_independent_phase113_fear_greed_feasibility.json
