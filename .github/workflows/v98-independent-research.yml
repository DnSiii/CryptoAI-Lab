name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py -q
      - name: Rebuild training-only canonical data
        run: python scripts/v98_independent_phase050_rebuild_data.py --config v98_independent_phase050_data.json
      - name: Execute frozen Phase093 training only
        run: python scripts/v98_independent_phase093_sentiment_contrarian.py
      - name: Enforce Phase093 isolation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase093_sentiment_contrarian.json'))
          assert p['engine']=='V98 Independent' and p['phase']=='093'
          assert p['preregistration']=='reports/v98_independent_phase093_sentiment_contrarian_prereg.md'
          assert p['phase083_selection_use'] is False and not p['v99_used'] and not p['v16_used']
          assert p['validation'] is None and p['final_holdout'] is None and not p['parameter_search'] and not p['rescue_allowed']
          print('Phase093 isolation guard passed:',p['training_gate'])
          PY
      - name: Commit V98 Phase093 evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v98_independent_phase093_sentiment_contrarian.json reports/v98_independent_phase093_sentiment_contrarian_positions.csv
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase093 sentiment training"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload Phase093 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase093-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            reports/v98_independent_phase093_sentiment_contrarian.json
            reports/v98_independent_phase093_sentiment_contrarian_positions.csv
