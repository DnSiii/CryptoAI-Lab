name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py tests/test_v98_independent_phase106.py tests/test_v98_independent_phase109.py tests/test_v98_independent_phase111.py tests/test_v98_independent_phase112.py tests/test_v98_independent_future_holdout_policy.py -q
      - name: Execute preregistered Phase128 STLFSI4 DATA_ONLY gate
        run: python scripts/v98_independent_phase128_stl_fsi_data_only.py
      - name: Enforce Phase128 isolation and no-alpha contract
        if: always()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase128_stl_fsi_data_only.json'))
          assert p['phase']=='128' and p['mode']=='DATA_ONLY'
          assert p['numeric_values_exposed'] is False and p['alpha_or_pnl_inspected'] is False
          assert p['validation'] is None and p['final_holdout'] is None
          assert p['v16_used'] is False and p['v99_used'] is False
          assert p['phase083_selection_use'] is False and p['parameter_search'] is False and p['rescue_allowed'] is False
          assert p['decision'] in ('PASS_DATA_ONLY','FAIL_DATA_NO_ALPHA')
          PY
      - name: Commit V98 Phase128 evidence only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f reports/v98_independent_phase128_stl_fsi_data_only.json ]; then git add -f reports/v98_independent_phase128_stl_fsi_data_only.json; fi
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase128 STLFSI4 data-only evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload V98 Phase128 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase128-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: reports/v98_independent_phase128_stl_fsi_data_only.json
