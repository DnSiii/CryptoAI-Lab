name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - ".github/workflows/v98-independent-research.yml"
      - "state/v98_independent_state.json"
      - "research/v98_independent/V98_NORTH_STAR.md"
      - "research/v98_independent/phase243_engine_architecture_prereg.md"
      - "research/v98_independent/or_*.py"
permissions:
  actions: read
  contents: read
concurrency:
  group: v98-independent-research-governance
  cancel-in-progress: true
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Enforce V98 North Star state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('state/v98_independent_state.json'))
          n=Path('research/v98_independent/V98_NORTH_STAR.md').read_text()
          assert s['engine']=='V98 Independent'
          assert s['branch']=='research/v98-independent-zero'
          assert s['champion'] is None
          assert s['holdout_locked'] is True
          assert s['phase083_selection_use'] is False
          assert 'strongest engine' in s['objective']
          assert 'no artificial return ceiling' in s['objective']
          assert 'strongest trading engine' in n
          assert 'maxim' in n.lower() and 'compounded' in n.lower()
          assert 'external benchmarks only' in n
          print('V98 North Star governance PASS')
          PY
      - name: Enforce current Clean-4 quarantine contract
        run: |
          python - <<'PY'
          import json
          s=json.load(open('state/v98_independent_state.json'))
          d=s.get('data_foundation',{})
          if d:
              assert d['status']=='PASS_CLEAN4_SOURCE_DATA_ONLY_NO_ALPHA'
              assert d['universe']==['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT']
              assert 'QUARANTINED_SOURCE_CONFLICT' in d['xrp']
          print('V98 data-foundation governance PASS')
          PY
      - name: V98 architecture/inventory regression tests
        run: |
          PYTHONPATH=src:research/v98_independent python -m pytest -q             research/v98_independent/test_phase243_inventory_isolation.py             research/v98_independent/test_phase244_growth_core.py             research/v98_independent/test_phase245_market_state_core.py

  or-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned authenticated Clean-4 2022-24 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download pinned independently audited native OI v2 (2022-24 only)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: frozen-oi
      - name: Download pinned official worst-side hourly mark envelope (not exact event mark)
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Source-only and causal synthetic gates before PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile or_sources.py or_intents.py or_source_gate.py or_independent_source_oracle.py or_independent_allocator_oracle.py or_30cell_physical.py or_hourly_oracle_gate.py or_independent_fill_oracle.py or_independent_receipt_arithmetic_audit.py or_independent_source_oracle.py or_independent_allocator_oracle.py
          python or_sources.py
          python or_intents.py
          python or_source_gate.py --root ../../official-input --oi-root ../../frozen-oi --output or_source_receipt.json
          python or_independent_source_oracle.py --root ../../official-input --oi-root ../../frozen-oi --output or_independent_source_receipt.json
          python or_independent_allocator_oracle.py --root ../../official-input --oi-root ../../frozen-oi --output or_independent_allocator_receipt.json
      - name: Run preregistered OR funding-dislocation 30-cell signed physical training
        id: physical
        continue-on-error: true
        working-directory: research/v98_independent
        run: |
          python or_30cell_physical.py --root ../../official-input --oi-root ../../frozen-oi --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output or_30cell_receipt.json --ledger-output or_base_full_hourly_forensic.jsonl
      - name: Independent all-hour signed settlement
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s or_30cell_receipt.json && test -s or_base_full_hourly_forensic.jsonl; then
            python or_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl or_base_full_hourly_forensic.jsonl --receipt or_30cell_receipt.json --output or_independent_hourly_receipt.json
          else
            echo "NO_COMPLETE_OR_LEDGER_FOR_INDEPENDENT_SETTLEMENT"
          fi
      - name: Independently reconstruct net physical fills and tamper detection
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s or_base_full_hourly_forensic.jsonl; then
            python or_independent_fill_oracle.py --root ../../official-input --oi-root ../../frozen-oi --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl or_base_full_hourly_forensic.jsonl --output or_independent_fill_receipt.json
          else
            echo "NO_COMPLETE_OP_LEDGER_FOR_INDEPENDENT_FILLS"
          fi
      - name: Independent 30-cell arithmetic and economic gate
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s or_30cell_receipt.json; then
            python or_independent_receipt_arithmetic_audit.py --receipt or_30cell_receipt.json > or_independent_arithmetic_receipt.json
            cat or_independent_arithmetic_receipt.json
          else
            echo "NO_OR_RECEIPT_FOR_ARITHMETIC_AUDIT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-or-original-${{ github.run_id }}
          path: |
            research/v98_independent/or_source_receipt.json
            research/v98_independent/or_independent_source_receipt.json
            research/v98_independent/or_independent_allocator_receipt.json
            research/v98_independent/or_30cell_receipt.json
            research/v98_independent/or_independent_hourly_receipt.json
            research/v98_independent/or_independent_fill_receipt.json
            research/v98_independent/or_independent_arithmetic_receipt.json
            research/v98_independent/or_base_full_hourly_forensic.jsonl
          retention-days: 30
          if-no-files-found: warn
      - name: Economic gate is binding; no false completion
        if: always()
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('or_30cell_receipt.json')
          if not p.exists():raise SystemExit('OR_MISSING_PHYSICAL_RECEIPT')
          r=json.loads(p.read_text())
          print('OR_ORIGINAL_DECISION',r['decision'])
          print('OR_GATE_FAILURES',r['gate_failures'])
          if r['decision']!='PASS_PROVISIONAL_TRAINING_NOT_VALIDATED':
              raise SystemExit('OR_REJECTED_NO_PROMOTION')
          if not Path('or_independent_source_receipt.json').exists() or not Path('or_independent_allocator_receipt.json').exists() or not Path('or_independent_hourly_receipt.json').exists() or not Path('or_independent_fill_receipt.json').exists() or not Path('or_independent_arithmetic_receipt.json').exists():
              raise SystemExit('OR_MISSING_INDEPENDENT_EVIDENCE')
          print('OR_PROVISIONAL_TRAINING_ONLY_NOT_INDEPENDENT_VALIDATION')
          PY
