name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py -q
      - name: Execute Phase092 sentiment feasibility only
        run: python scripts/v98_independent_phase092_sentiment_feasibility.py
      - name: Enforce Phase092 no-alpha isolation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase092_sentiment_feasibility.json'))
          assert p['engine']=='V98 Independent' and p['phase']=='092' and p['kind']=='DATA_FEASIBILITY_ONLY'
          assert p['preregistration']=='reports/v98_independent_phase092_sentiment_feasibility_prereg.md'
          assert not p['alpha_executed'] and not p['pnl_executed'] and not p['crypto_return_join'] and not p['direction_selected'] and not p['parameter_search']
          assert p['phase083_selection_use'] is False and not p['v99_used'] and not p['v16_used']
          assert p['period_utc'][1]=='2025-12-31'
          print('Phase092 no-alpha isolation guard passed:',p['decision'])
          PY
      - name: Commit V98 Phase092 feasibility evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v98_independent_phase092_sentiment_feasibility.json
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase092 sentiment feasibility"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload Phase092 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase092-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: reports/v98_independent_phase092_sentiment_feasibility.json
