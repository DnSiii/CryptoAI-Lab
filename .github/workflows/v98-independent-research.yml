name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent*.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: V98 causality/invariant tests
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py tests/test_v98_independent_phase049.py tests/test_v98_independent_phase106.py -q
      - name: Rebuild canonical V98 training-only data
        run: python scripts/v98_independent_phase050_rebuild_data.py
      - name: Execute frozen Phase106 training gate
        run: python scripts/v98_independent_phase106_txcount_rotation.py
      - name: Enforce Phase106 isolation contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase106_txcount_rotation.json'))
          assert p['phase']=='106' and p['v99_used'] is False and p['v16_used'] is False
          assert p['phase083_selection_use'] is False and p['validation'] is None and p['final_holdout'] is None
          assert p['parameter_search'] is False and p['rescue_allowed'] is False
          assert p['training_gate']['decision'] in {'PASS_TRAINING','REJECT_NO_RESCUE'}
          print('Phase106 isolation guard passed:',p['training_gate']['decision'])
          PY
      - name: Commit V98 Phase106 evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v98_independent_phase106_txcount_rotation.json reports/v98_independent_phase106_txcount_rotation_positions.csv
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m "v98: record phase106 TxCnt rotation evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload Phase106 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase106-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            reports/v98_independent_phase106_txcount_rotation.json
            reports/v98_independent_phase106_txcount_rotation_positions.csv
