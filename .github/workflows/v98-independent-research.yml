name: V98 Independent Research
on:
  workflow_dispatch:
  push:
    branches: [research/v98-independent-zero]
    paths: [".github/workflows/v98-independent-research.yml", "config/v98_independent.json", "scripts/v98_independent_*.py", "tests/test_v98_independent*.py", "state/v98_independent_state.json"]
permissions: {contents: write}
concurrency: {group: v98-independent-research, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1"}
    steps:
      - name: Check out isolated V98 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run V98 causality and invariant tests only
        run: python -m pytest tests/test_v98_independent.py tests/test_v98_independent_phase044.py tests/test_v98_independent_phase045.py tests/test_v98_independent_phase046.py -q
      - name: Synchronize latest closed public candles
        run: python scripts/sync_paper_data_v13.py
      - name: Audit shared public derivatives metrics archive
        run: python scripts/v98_independent_phase047_acquire.py
      - name: Run frozen Phase048 only after integrity gate
        shell: bash
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/v98_independent_phase047_oi_acquisition_audit.json').read_text())
          raise SystemExit(0 if r.get('decision')=='integrity_sample_pass' else 1)
          PY
          then
            python scripts/v98_independent_phase048_taker_pressure.py
          else
            echo 'Phase048 backtest correctly blocked by shared archive integrity gate.'
            exit 1
          fi
      - name: Commit compact V98 Phase048 evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v98_independent_phase047_oi_acquisition_audit.json
          test ! -f reports/v98_independent_phase048_taker_pressure.json || git add reports/v98_independent_phase048_taker_pressure.json state/v98_independent_state.json
          if git diff --cached --quiet; then echo "No compact evidence changes to commit."; else git commit -m "v98: record phase048 frozen taker evidence"; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
      - name: Upload V98 Phase048 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v98-independent-phase048-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v98_independent_phase047_oi_acquisition_audit.json
            reports/v98_independent_phase048_taker_pressure.json
            reports/v98_independent_phase048_taker_pressure_positions.csv
