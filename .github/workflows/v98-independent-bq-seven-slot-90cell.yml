name: V98 Independent BQ Prequential Shadow Expert Seven Slot 90-Cell Historical Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-bp-seven-slot-90cell.yml'
      - 'research/v98_independent/bq_sources.py'
      - 'research/v98_independent/bq_allocator.py'
      - 'research/v98_independent/bq_90cell.py'
      - 'research/v98_independent/bq_reconcile.py'
      - 'research/v98_independent/bq_independent_receipt_audit.py'
      - 'research/v98_independent/ba_ratio_reversion_governor.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [BQ_core_only, BQ_full, BQ_minus_opportunity, BQ_minus_RV, BQ_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: BQ prequential shadow experts inverse-vol core compression reversal crisis physical settlement
        working-directory: research/v98_independent
        run: |
          python -m py_compile bq_sources.py bq_allocator.py ba_ratio_reversion_governor.py bq_90cell.py bq_reconcile.py
          python bq_sources.py
          python bq_allocator.py
          python ba_ratio_reversion_governor.py
      - name: Retrieve PINNED vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute BQ complete actual-open native-funded chronological path x18
        working-directory: research/v98_independent
        run: |
          python bq_90cell.py \
            --path ${{ matrix.path }} \
            --output bq90_${{ matrix.path }}.json || echo 'BQ_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bq90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/bq90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify all 18 path cells recorded, never hide failure
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('bq90_BQ_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('BQ_PATH_SURVIVAL',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bq90-ubuntu-*
          path: receipts
      - name: Independent two-OS 90-cell economic, marginal and causal gate
        run: python research/v98_independent/bq_reconcile.py --root receipts --output bq90_official_economic_summary.json
      - name: Independent original-receipt accounting audit (no BQ engine imports)
        run: python research/v98_independent/bq_independent_receipt_audit.py --root receipts --output bq90_independent_arithmetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bq90-independent-arithmetic
          path: bq90_independent_arithmetic.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bq90-official-economic-summary
          path: bq90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  native-event-replay:
    needs: train
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve same pinned original training inputs
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-ubuntu-24.04
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage source without reading 2025
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Independently reconstruct native funding and 81 intrabar corners
        working-directory: research/v98_independent
        run: python bq_event_replay_audit.py --output bq_event_replay_original.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bp-native-event-independent-replay
          path: research/v98_independent/bq_event_replay_original.json
          retention-days: 30
          if-no-files-found: warn
