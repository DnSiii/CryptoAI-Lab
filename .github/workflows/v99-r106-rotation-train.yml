name: V99 R106 preregistered long-cash strength rotation TRAIN
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/V99_R106_ROTATION_TRAIN_PREREG_20261016.md
      - research/tools/v99_r106_rotation_train.py
      - research/tests/test_v99_r106_rotation_train.py
      - .github/workflows/v99-r106-rotation-train.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Read isolated research
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert preregistration and run synthetic causal tests first
        run: |
          test -s research/V99_R106_ROTATION_TRAIN_PREREG_20261016.md
          python -m unittest discover -s research/tests -p 'test_v99_r106_rotation_train.py' -v
      - name: Restore TRAIN input canonical historical cache, read-only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: v99-r106-canonical-market
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - name: Require original BTC and ETH canonical prices
        run: |
          test -s data/canonical/BTCUSDT_1h.csv
          test -s data/canonical/ETHUSDT_1h.csv
      - name: Run single train experiment and reproduce independently
        run: |
          python -m research.tools.v99_r106_rotation_train
          cp reports/candidate_v99_r106_rotation_train.json /tmp/first.json
          python -m research.tools.v99_r106_rotation_train
          cmp /tmp/first.json reports/candidate_v99_r106_rotation_train.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/first.json'))
          assert r['final_holdout_accessed'] is False
          assert r['holdout_market_values_parsed'] is False
          assert r['promotion_authorized'] is False
          assert r['paper_publication_authorized'] is False
          assert r['settled_funding_authenticated'] is False
          assert r['economic_trials']==1
          print('DECISION:',r['status'])
          print('SEVERE FOLDS',r['severe']['fold_returns'])
          print('SUPERSEVERE FOLDS',r['supersevere']['fold_returns'])
          PY
      - name: Archive preliminary research decision only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-rotation-train-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: reports/candidate_v99_r106_rotation_train.json
