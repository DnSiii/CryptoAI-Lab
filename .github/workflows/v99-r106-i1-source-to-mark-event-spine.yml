name: V99 I1 original 661d held-contract event spine (HOLD)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_source_to_mark_event_spine.py
      - research/verification/independent_v99_r106_i1_source_mark_spine_oracle.py
      - research/tests/test_v99_r106_i1_source_to_mark_event_spine.py
      - .github/workflows/v99-r106-i1-source-to-mark-event-spine.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm ex-ante source-spine preregistration
        run: |
          git merge-base --is-ancestor 64fb7362808db91fae9ded05083742d70176379c HEAD
          test -s research/V99_R106_I1_SOURCE_TO_MARK_EVENT_SPINE_PREREG_20261028.md
      - name: Rebuild original-shaped 661d synthetic source spine and reject adversarial cases
        run: python -m unittest -v research.tests.test_v99_r106_i1_source_to_mark_event_spine
      - name: Restore original 182 causal signals from archived independent artifact
        run: |
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
      - name: Attempt actual original source-to-event compilation without licensed tape (must fail)
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from research.tools.v99_r106_i1_original_intent_binding import bind
          from research.tools.v99_r106_i1_source_driven_entry_book import build
          from research.tools.v99_r106_i1_source_to_mark_event_spine import compile_spine
          signal=Path("research_evidence/i1_original_causal/i1_causal_signal.json")
          original=bind(signal)
          assert len(original["intents"])==180 and original["positive_fixed_intents"]==132
          with tempfile.TemporaryDirectory() as root:
              try:
                  books=build(root,original["intents"])
                  compile_spine(root,books,[])
              except ValueError as exc:
                  assert str(exc)=="ORIGINAL_661D_MANIFEST_NOT_DELIVERED",str(exc)
                  print("ORIGINAL 182 SIGNALS / 180 INTENTS / 132 POSITIVE")
                  print("BLOCKED: NO LICENSED ORIGINAL 661D BTC+ETH OPTIONS MANIFEST")
                  print("0/180 ECONOMICALLY CERTIFIED; NO TRAIN/ROI/PROMOTION/ORDERS")
              else:
                  raise AssertionError("ORIGINAL MISSING ARCHIVE ACCEPTED")
          PY
