name: V99 I1 preregistered original-DVOL variance-premium structural screen (NO TRADES)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_i1_variance_premium.py'
      - 'research/verification/independent_v99_r106_i1_variance_oracle.py'
      - '.github/workflows/v99-r106-i1-variance-premium-structural.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one-shot-i1-structural-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert preregistration was committed before executable screen
        shell: bash
        run: |
          git cat-file -e 89a88e4a248e42e87e55d0a0ea4c61322d6ea222^{commit}
          test -s research/V99_R106_I1_VARIANCE_PREMIUM_STRUCTURAL_PREREG_20261024.md
          python - <<'PY'
          from research.tools.v99_r106_d1_real_train_source_join import START,END,HOURS,FOLD_EDGES
          assert (START,END,HOURS)==(1639008000000,1696118400000,15864)
          assert len(FOLD_EDGES)==6
          print('I1 EX ANTE TRAIN ONLY / NO ECONOMIC TRADES')
          PY
      - name: Restore independently audited original OKX TRAIN spot opens
        run: |
          gh run download 40019588739 --repo "$GITHUB_REPOSITORY" \
            --name d1-train-four-leg-backfill-40019588739 \
            --dir research_evidence/i1_original_okx
      - name: Restore independently audited original Deribit DVOL TRAIN
        run: |
          gh run download 40072202459 --repo "$GITHUB_REPOSITORY" \
            --name v99-deribit-dvol-original-pit-train \
            --dir research_evidence/i1_original_dvol
      - name: One-shot preregistered nonoverlap gross variance-premium screen
        run: |
          python -m research.tools.v99_r106_i1_variance_premium \
            research_evidence/i1_original_okx research_evidence/i1_original_dvol research_evidence/i1_screen
      - name: Independent source-to-forward-variance oracle and negative control
        run: |
          python -m research.verification.independent_v99_r106_i1_variance_oracle \
            research_evidence/i1_original_okx research_evidence/i1_original_dvol research_evidence/i1_screen
      - name: Assert DATA_ONLY and preserve sealed future partitions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_evidence/i1_screen')
          r=json.loads((p/'i1_structural_report.json').read_text())
          v=json.loads((p/'i1_independent_oracle.json').read_text())
          assert v['status']=='INDEPENDENT_ORIGINAL_DVOL_SPOT_30D_VARIANCE_REEXECUTION_VERIFIED'
          assert v['adversarial_corruption_rejected']
          assert r['observations']==2*r['windows']
          assert r['status']==v['decision']
          for k in ('promotion_authorized','validation_opened','holdout_opened',
                    'orders_enabled','paper_publication_authorized',
                    'trading_engine_evaluated','economic_backtest_executed'):
              assert r[k] is False,k
          print('I1 STRUCTURAL DECISION:',r['status'])
          print('5 FOLD PREMIUM:',{a:[x['mean_premium'] for x in z['folds']] for a,z in r['folds'].items()})
          print('NO ROI / NO ENGINE / NO VALIDATION / NO HOLDOUT / NO PROMOTION')
          PY
      - name: Archive original-source structural report and independent verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-i1-original-variance-premium-screen-${{ github.run_id }}
          path: research_evidence/i1_screen/
          retention-days: 90
          if-no-files-found: warn
