name: V98 Independent Phase1116-1118 X Complete Portfolio Synthetic
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1116-x-basket.yml'
      - 'research/v98_independent/phase1116_x_basket_shock_oracle.py'
      - 'research/v98_independent/test_phase1116_x_basket_shock_oracle.py'
      - 'research/v98_independent/phase1117_x_contingent_governor.py'
      - 'research/v98_independent/test_phase1117_x_contingent_governor.py'
      - 'research/v98_independent/phase1118_x_sevenslot_source.py'
      - 'research/v98_independent/test_phase1118_x_sevenslot_source.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x-seven-slot-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
      - name: X 4000 adverse books, basket OCO and complete seven-slot chronology
        run: python -m unittest -v test_phase1116_x_basket_shock_oracle.py test_phase1117_x_contingent_governor.py test_phase1118_x_sevenslot_source.py
