name: V98 Independent Phase1116 X Atomic Basket Synthetic
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1116-x-basket.yml'
      - 'research/v98_independent/phase1116_x_basket_shock_oracle.py'
      - 'research/v98_independent/test_phase1116_x_basket_shock_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x-basket-shock-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numpy
        run: python -m pip install 'numpy==1.26.4'
      - name: X 2000 adverse basket states and 8 oracle contracts
        run: python -m unittest -v test_phase1116_x_basket_shock_oracle.py
