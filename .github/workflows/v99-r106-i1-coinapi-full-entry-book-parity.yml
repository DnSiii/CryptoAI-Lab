name: V99 I1 CoinAPI full original Sunday entry books (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/V99_R106_I1_COINAPI_FULL_ENTRY_BOOK_PARITY_PREREG_20261102.md
      - research/V99_R106_I1_COINAPI_FULL_INVENTORY_BOUNDED_MERGE_PREREG_20261102.md
      - research/tools/v99_r106_i1_coinapi_derived_day_bridge.py
      - research/tools/v99_r106_i1_coinapi_661d_original_byte_chain.py
      - research/verification/independent_v99_r106_i1_coinapi_derived_day_oracle.py
      - research/tools/v99_r106_i1_coinapi_full_entry_book_parity.py
      - research/tests/test_v99_r106_i1_coinapi_full_entry_book_parity.py
      - .github/workflows/v99-r106-i1-coinapi-full-entry-book-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-coinapi-full-inventory-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Immutable TRAIN partition, prereg ancestry and protected file check
        run: |
          git merge-base --is-ancestor df94b81121b661e41ad4111a60a54c557ebbb069 HEAD
          git merge-base --is-ancestor f4a5e8c349a12c86ff5ebfe478051e0e62cec33b HEAD
          test -s research/V99_R106_I1_COINAPI_FULL_INVENTORY_BOUNDED_MERGE_PREREG_20261102.md
          python - <<'PY'
          from research.tools.v99_r106_i1_local_tape_import import FIRST,END,DAYS
          assert (FIRST.isoformat(),END.isoformat(),DAYS)==('2021-12-09','2023-10-01',661)
          print('TRAIN ONLY; no sealed validation, holdout, Frozen, paper or orders')
          PY
      - name: Original per-contract full entry book versus independently derived parser
        run: python -m unittest -v research.tests.test_v99_r106_i1_coinapi_full_entry_book_parity
      - name: Original 661-day economic source absence must fail closed
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from research.tools.v99_r106_i1_coinapi_full_entry_book_parity import build
          with tempfile.TemporaryDirectory() as t:
              root=Path(t)
              for name in ('specs','original','derived'):
                  (root/name).mkdir()
              try:
                  build(root/'specs',root/'original',root/'derived',root/'signals.json')
              except ValueError as e:
                  assert str(e)=='WRITTEN_COINAPI_CHAIN_LICENSE_REQUIRED',str(e)
                  print('SOURCE_HOLD: WRITTEN_COINAPI_CHAIN_LICENSE_REQUIRED')
                  print('NO TRAIN ROI / PROMOTION / ORDERS')
              else:
                  raise AssertionError('UNLICENSED_SOURCE_BYPASS')
          PY
