name: V98 Independent EW Full Historical Physical Ledger Oracle
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ew-ledger-oracle.yml'
      - 'research/v98_independent/ew_independent_ledger_replay.py'
      - 'research/v98_independent/ew_30cell.py'
      - 'research/v98_independent/ew_sources.py'
      - 'research/v98_independent/v98_independent_settlement_oracle.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  oracle:
    strategy:
      fail-fast: false
      matrix:
        path: [EW_core_only, EW_full, EW_minus_opportunity, EW_minus_RV, EW_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retriewe authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding, NAV, fee, slippage and 81-corner settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py ew_independent_ledger_replay.py
          python ew_independent_ledger_replay.py --path ${{ matrix.path }} --output ew_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ew-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/ew_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
