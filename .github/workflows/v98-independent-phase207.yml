name: V98 Independent Phase207
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'scripts/v98_independent_phase207_residual_momentum.py'
      - 'research/v98_independent/phase207_prereg.md'
      - 'research/v98_independent/data/phase206_funding/**'
      - '.github/workflows/v98-independent-phase207.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phase207:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Rebuild training-only prices
        run: |
          python scripts/download_futures_archive.py --config v98_independent_phase050_data.json
          python scripts/build_canonical.py --config v98_independent_phase050_data.json
      - name: Training firewall
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          assets={'BTCUSDT','ETHUSDT','BNBUSDT','XRPUSDT','SOLUSDT'}
          for a in sorted(assets):
              d=pd.read_csv(Path('data/canonical')/f'{a}_1h.csv'); c='open_time' if 'open_time' in d.columns else ('timestamp' if 'timestamp' in d.columns else d.columns[0]); t=pd.to_datetime(d[c],utc=True,errors='raise')
              assert t.is_monotonic_increasing and not t.duplicated().any() and not (t>=pd.Timestamp('2026-01-01',tz='UTC')).any()
              if a!='BTCUSDT':
                  f=pd.read_csv(Path('research/v98_independent/data/phase206_funding')/f'{a}_funding.csv'); ft=pd.to_datetime(f['fundingTime_utc'],utc=True,errors='raise',format='mixed'); assert ft.is_monotonic_increasing and not ft.duplicated().any() and not (ft>=pd.Timestamp('2026-01-01',tz='UTC')).any()
          print('Phase207 training-only firewall OK')
          PY
      - name: Deterministic run 1
        run: |
          python scripts/v98_independent_phase207_residual_momentum.py
          sha256sum reports/v98_independent_phase207_results.json | tee /tmp/hash1
      - name: Deterministic run 2
        run: |
          python scripts/v98_independent_phase207_residual_momentum.py
          sha256sum reports/v98_independent_phase207_results.json | tee /tmp/hash2
          diff -u /tmp/hash1 /tmp/hash2
      - name: Commit V98-only report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v98_independent_phase207_results.json
          git diff --cached --quiet && exit 0
          git commit -m 'V98 Phase207 harvest residual momentum'
          git push
