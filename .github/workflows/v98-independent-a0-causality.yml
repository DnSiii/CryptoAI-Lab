name: V98 Independent A0 Causal Generator Tests
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/v98_sevenslot_preregistered_a0.py'
      - 'research/v98_independent/test_v98_sevenslot_preregistered_a0.py'
      - '.github/workflows/v98-independent-a0-causality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V98 A0 deterministic tests (not economic validation)
        env:
          PYTHONPATH: .
        run: python -m unittest research.v98_independent.test_v98_sevenslot_preregistered_a0 -v
