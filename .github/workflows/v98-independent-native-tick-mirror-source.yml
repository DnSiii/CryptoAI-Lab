name: V98 Independent Funding Mark Mirror Provenance SOURCE ONLY
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-native-tick-mirror-source.yml'
      - 'research/v98_independent/v98_mirror_funding_mark_source_only.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mirror-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned Clean4 2022-24 training only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download pinned official mark OHLC envelope
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Untrusted mirror crosscheck with pinned native rates and official OHLC
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_mirror_funding_mark_source_only.py
          python v98_mirror_funding_mark_source_only.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output v98_mirror_mark_receipt.json --mirror-csv v98_mirror_mark_untrusted_training.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mirror-source-only-${{ github.run_id }}
          path: |
            research/v98_independent/v98_mirror_mark_receipt.json
            research/v98_independent/v98_mirror_mark_untrusted_training.csv
          retention-days: 30
          if-no-files-found: warn
