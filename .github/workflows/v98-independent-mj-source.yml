name: V98 Independent MJ Preregistered Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mj-source.yml'
      - 'research/v98_independent/mj_sources.py'
      - 'research/v98_independent/mj_independent_source_gate.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mj-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download immutable SHA-authenticated Clean4 2022-24 training only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Test synthetic future mutation and independently replay original source
        working-directory: research/v98_independent
        run: |
          python -m py_compile mj_sources.py mj_independent_source_gate.py
          python mj_sources.py
          python mj_independent_source_gate.py --root ../../official-input --output mj_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mj-source-${{ github.run_id }}
          path: research/v98_independent/mj_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
