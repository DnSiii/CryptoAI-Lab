name: V99 Phase195-Q Bellatrix Era Parity
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase195q_*.py'
      - 'research/tests/test_phase195q_*.py'
      - '.github/workflows/v99-r106-phase195q-era-bellatrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install 'trie==3.1.0' 'python-snappy==0.7.3' 'rlp==4.1.0' 'eth-utils==5.3.1' 'pycryptodome==3.23.0'
      - name: Synthetic tests
        run: python research/tests/test_phase195q_bellatrix.py
      - name: Fixed archive check
        run: |
          python research/tools/v99_phase195q_run.py | tee phase195q.json
          python -c "import json; x=json.load(open('phase195q.json')); assert x['economic_trials']==0 and not x['promotion_authorized'] and not x['independent_consensus_anchor']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v99-phase195q-evidence
          path: phase195q.json
          retention-days: 30
