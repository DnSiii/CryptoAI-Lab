name: V98 Independent OZ Structural Trend Full-History Seven-Slot
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/oz_structural_trend.py'
      - 'research/v98_independent/oz_independent_oracle.py'
      - '.github/workflows/v98-independent-oz-structural-trend-30cell.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  oz-full-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected
      - name: OZ synthetic causality and allocator (not PnL)
        working-directory: research/v98_independent
        run: python oz_structural_trend.py
      - name: OZ 30 physical cells and independent decision/cash/funding oracles
        working-directory: research/v98_independent
        env:
          OLD_ROOT: ${{ runner.temp }}/old
          OLD_ENVELOPE: ${{ runner.temp }}/old-envelope/v98_official_mark_envelope_training.csv
          NEW_ROOT: ${{ runner.temp }}/new
          CORRECTED_ROOT: ${{ runner.temp }}/corrected
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          from v98_2025_full_training_source_bridge import load
          from oz_structural_trend import run
          d=load(os.environ["OLD_ROOT"],os.environ["OLD_ENVELOPE"],
                 os.environ["NEW_ROOT"],os.environ["CORRECTED_ROOT"])
          result=run(d)
          Path("oz_full_training_result.json").write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=False)+"\n")
          print("OZ_BINDING_DECISION",result["decision"],"FAILURES",len(result["gate_failures"]),flush=True)
          if result["decision"]!="PASS_PROVISIONAL_OZ_TRAINING_NOT_VALIDATED":
              sys.exit("OZ_FROZEN_ECONOMIC_REJECTION_NOT_A_SUCCESSFUL_ENGINE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-oz-full-training-receipt-${{ github.run_id }}
          path: research/v98_independent/oz_full_training_result.json
          retention-days: 30
          if-no-files-found: warn
