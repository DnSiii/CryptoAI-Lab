name: V98 NT Breakout Dispersion Seven-Slot 30-Cell Physical + Independent Gates
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-nt-30cell.yml'
      - 'research/v98_independent/nt_*.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  nt-physical:
    runt-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned authenticated Clean-4 2022-24 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download pinned official worst-side hourly mark envelope (not exact event mark)
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Source-only and causal synthetic gates before PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile nt_sources.py nt_intents.py nt_source_gate.py nt_30cell_physical.py nt_hourly_oracle_gate.py nt_independent_fill_oracle.py nt_independent_receipt_arithmetic_audit.py
          python nt_sources.py
          python v98_future_net_growth_capital_competition.py
          python nt_intents.py
          python nt_source_gate.py --root ../../official-input --output nt_source_receipt.json
      - name: Run original NT 30-cell signed physical training
        id: physical
        continue-on-error: true
        working-directory: research/v98_independent
        run: |
          python nt_30cell_physical.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output nt_30cell_receipt.json --ledger-output nt_base_full_hourly_forensic.jsonl
      - name: Independent all-hour signed settlement
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nt_30cell_receipt.json && test -s nt_base_full_hourly_forensic.jsonl; then
            python nt_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl nt_base_full_hourly_forensic.jsonl --receipt nt_30cell_receipt.json --output nt_independent_hourly_receipt.json
          else
            echo "NO_COMPLETE_NT_LEDGER_FOR_INDEPENDENT_SETTLEMENT"
          fi
      - name: Independently reconstruct net physical fills and tamper detection
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nt_base_full_hourly_forensic.jsonl; then
            python nt_independent_fill_oracle.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl nt_base_full_hourly_forensic.jsonl --output nt_independent_fill_receipt.json
          else
            echo "NO_COMPLETE_NT_LEDGER_FOR_INDEPENDENT_FILLS"
          fi
      - name: Independent 30-cell arithmetic and economic gate
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nt_30cell_receipt.json; then
            python nt_independent_receipt_arithmetic_audit.py --receipt nt_30cell_receipt.json > nt_independent_arithmetic_receipt.json
            cat nt_independent_arithmetic_receipt.json
          else
            echo "NO_NT_RECEIPT_FOR_ARITHMETIC_AUDIT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-nt-original-${{ github.run_id }}
          path: |
            research/v98_independent/nt_source_receipt.json
            research/v98_independent/nt_30cell_receipt.json
            research/v98_independent/nt_independent_hourly_receipt.json
            research/v98_independent/nt_independent_fill_receipt.json
            research/v98_independent/nt_independent_arithmetic_receipt.json
            research/v98_independent/nt_base_full_hourly_forensic.jsonl
          retention-days: 30
          if-no-files-found: warn
      - name: Economic gate is binding; no false completion
        if: always()
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('nt_30cell_receipt.json')
          if not p.exists():raise SystemExit('NT_MISSING_PHYSICAL_RECEIPT')
          r=json.loads(p.read_text())
          print('NT_ORIGINAL_DECISION',r['decision'])
          print('NT_GATE_FAILURES',r['gate_failures'])
          if r['decision']!='PASS_PROVISIONAL_TRAINING_NOT_VALIDATED':
              raise SystemExit('NT_REJECTED_NO_PROMOTION')
          if not Path('nt_independent_hourly_receipt.json').exists() or not Path('nt_independent_fill_receipt.json').exists() or not Path('nt_independent_arithmetic_receipt.json').exists():
              raise SystemExit('NT_MISSING_INDEPENDENT_EVIDENCE')
          print('NT_PROVISIONAL_TRAINING_ONLY_NOT_INDEPENDENT_VALIDATION')
          PY
