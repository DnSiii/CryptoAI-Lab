name: V98 Independent Phase208
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'scripts/v98_independent_phase208_vol_compression_breakout.py'
      - 'research/v98_independent/phase208_prereg.md'
      - 'research/v98_independent/data/phase206_funding/**'
      - '.github/workflows/v98-independent-phase208.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phase208:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Rebuild training-only prices
        run: |
          python scripts/download_futures_archive.py --config v98_independent_phase050_data.json
          python scripts/build_canonical.py --config v98_independent_phase050_data.json
      - name: Training firewall and funding integrity
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          assets={'BTCUSDT','ETHUSDT','BNBUSDT','XRPUSDT','SOLUSDT'}
          cut=pd.Timestamp('2026-01-01',tz='UTC')
          for a in sorted(assets):
              d=pd.read_csv(Path('data/canonical')/f'{a}_1h.csv'); c='open_time' if 'open_time' in d.columns else ('timestamp' if 'timestamp' in d.columns else d.columns[0]); t=pd.to_datetime(d[c],utc=True,errors='raise')
              assert t.is_monotonic_increasing and not t.duplicated().any() and not (t>=cut).any()
              f=pd.read_csv(Path('research/v98_independent/data/phase206_funding')/f'{a}_funding.csv'); ft=pd.to_datetime(f['fundingTime_utc'],utc=True,errors='raise',format='mixed')
              assert ft.is_monotonic_increasing and not ft.duplicated().any() and not (ft>=cut).any()
          print('Phase208 training-only firewall OK')
          PY
      - name: Deterministic run 1
        run: |
          python scripts/v98_independent_phase208_vol_compression_breakout.py
          sha256sum reports/v98_independent_phase208_results.json | tee /tmp/hash1
      - name: Deterministic run 2
        run: |
          python scripts/v98_independent_phase208_vol_compression_breakout.py
          sha256sum reports/v98_independent_phase208_results.json | tee /tmp/hash2
          diff -u /tmp/hash1 /tmp/hash2
      - name: Mechanical training gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase208_results.json'))
          assert len(p['specs'])==8
          passing=[]
          for k,v in p['specs'].items():
              ok=all(v[y]['base']['return']>0 and v[y]['base']['profit_factor']>1 for y in ('2023','2024','2025'))
              if ok: passing.append(k)
          print('training-fold coherent specs:',passing)
          PY
      - name: Commit V98-only report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v98_independent_phase208_results.json
          git diff --cached --quiet && exit 0
          git commit -m 'V98 Phase208 harvest volatility-compression breakout'
          git pull --rebase origin research/v98-independent-zero
          git push
