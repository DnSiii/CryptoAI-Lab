name: V99 R106 native OKX contract funding as-of receipts

on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_r106_okx_terms_asof.py'
      - 'research/tests/test_v99_r106_okx_terms_asof.py'
      - '.github/workflows/v99-r106-okx-terms-asof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v99-r106-okx-native-terms-receipt
  cancel-in-progress: false

jobs:
  source-contract-funding-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout research only, no write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare standard Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test native terms and funding receipt guard offline
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_okx_terms_asof.py' -v
      - name: Capture official contract multipliers, tick/lot and funding notices
        run: python -m research.tools.v99_r106_okx_terms_asof --out research_evidence/okx_terms
      - name: Verify five full first-party native instrument/funding receipts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research_evidence/okx_terms')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['status']=='OKX_NATIVE_CONTRACT_AND_FUNDING_OBSERVED'
          assert manifest['fee_schedule_independently_proven'] is False
          assert manifest['funding_cashflows_settled_and_pit_authenticated'] is False
          assert manifest['paper_publication_authorized'] is False
          assert manifest['promotion_authorized'] is False
          assert len(manifest['contracts'])==5
          for inst,info in sorted(manifest['contracts'].items()):
              for typ in ('metadata','funding'):
                  raw=(root/(typ+'_'+inst+'.raw.json')).read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==info[('contract' if typ=='metadata' else 'funding')+'_raw_sha256']
              assert info['contract']['ctType']=='linear'
              assert info['contract']['settleCcy']=='USDT'
              assert info['funding_notice']['settled_cashflow_authenticated'] is False
              print(inst,'ctVal',info['contract']['ctVal'],info['contract']['ctValCcy'],
                    'rate_notice',info['funding_notice']['observed_rate_not_settled'])
          print('CONTRACT/FUNDING AS-OF SOURCE VERIFIED; no simulated PnL.')
          PY
      - name: Archive native first-party raw terms in immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-okx-terms-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: research_evidence/okx_terms/
