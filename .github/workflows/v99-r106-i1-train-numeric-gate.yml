name: V99 I1 fixture gate + uncertified nonfixture numeric diagnostic
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_train_numeric_gate.py
      - research/tests/test_v99_r106_i1_train_numeric_gate.py
      - research/verification/independent_v99_r106_i1_train_numeric_oracle.py
      - .github/workflows/v99-r106-i1-train-numeric-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ex-ante-numeric-risk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify numeric gate preregistration predates code
        run: |
          git merge-base --is-ancestor b9d59c43c708a0616b11dc548b3d0b4d9fea9977 HEAD
          test -s research/V99_R106_I1_TRAIN_ECONOMIC_NUMERIC_GATE_PREREG_20261028.md
          git merge-base --is-ancestor 457c61e8be0c49c540715b83bfe0b6de49d78454 HEAD
          test -s research/V99_R106_I1_NONFIXTURE_NUMERIC_DIAGNOSTIC_PREREG_20261028.md
      - name: Exercise synthetic 661d fixture gate, provisional diagnostic and independent oracle
        run: python -m unittest -v research.tests.test_v99_r106_i1_train_numeric_gate
      - name: Assert no licensed economic evidence or promotion
        run: |
          python - <<'PY'
          from research.tools.v99_r106_i1_train_numeric_gate import evaluate
          try:
              evaluate({'schema': 'V99_I1_FIXED_90W_DAILY_TRAIN_EQUITY_INPUT_V1',
                        'fixture': False, 'initial_capital_usd': '10000',
                        'scenarios': {}})
          except ValueError as exc:
              assert str(exc) == 'ORIGINAL_ECONOMIC_SOURCE_PROVENANCE_NOT_CERTIFIED'
              print('BLOCKED_ORIGINAL_ECONOMIC_SOURCE_PROVENANCE_NOT_CERTIFIED')
              print('0/180 original economic lifecycles certified; PROVISIONAL DIAGNOSTIC ONLY; NO ORIGINAL TRAIN/ROI/PROMOTION/ORDERS')
          else:
              raise AssertionError('FORGED_NONFIXTURE_ECONOMIC_GATE')
          PY
