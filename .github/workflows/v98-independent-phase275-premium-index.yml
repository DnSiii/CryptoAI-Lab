name: V98 Independent Phase275 Premium Index DATA ONLY
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase275-premium-index.yml'
      - 'research/v98_independent/phase275_premium_index_dataonly.py'
      - 'research/v98_independent/test_phase275_premium_index_dataonly.py'
      - 'research/v98_independent/phase275_premium_index_dataonly_prereg.md'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q research/v98_independent/test_phase275_premium_index_dataonly.py
      - name: Acquire and reconstruct verified premium-index source
        run: python research/v98_independent/phase275_premium_index_dataonly.py
      - name: Enforce DATA_ONLY firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase275_premium_index_manifest.json'))
          assert p['phase']==275 and p['decision'] in {'PASS_DATA_ONLY','FAIL_DATA_NO_ALPHA'}
          assert p['alpha_executed'] is False and p['pnl_executed'] is False
          assert p['crypto_return_join'] is False and p['direction_selected'] is False and p['parameter_search'] is False
          assert p['validation_accessed'] is False and p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          print('Phase275',p['decision'])
          PY
      - name: Commit manifest and canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase275_premium_index_manifest.json research/v98_independent/data/phase275_premium_index/premium_index_1h.csv
          if ! git diff --cached --quiet; then
            git commit -m "v98 phase275: record premium-index DATA_ONLY evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-phase275-premium-index-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/v98_independent/phase275_premium_index_manifest.json
            research/v98_independent/data/phase275_premium_index/premium_index_1h.csv
