name: CryptoAI V99 R106 Phase57 Taker Buy Data Availability
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths: ["scripts/run_v99_r106_phase57_taker_buy_data_availability_audit.py", ".github/workflows/v99-r106-phase57-taker-buy-data-availability.yml"]
permissions: {contents: write}
jobs:
  phase57a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1", RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - id: cache_date
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: Linux-paper-v15-market-v1-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_v99_r106_phase57_taker_buy_data_availability_audit.py
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase57_taker_buy_data_availability_audit.json').read_text())
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['precommitment']['data_availability_only'] and r['precommitment']['strategy_change'] is False
          assert r['precommitment']['no_proxy_from_ohlcv'] and r['precommitment']['no_holdout_feature_selection']
          assert r['actionable_for_phase57b'] is False
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase57_taker_buy_data_availability_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 phase57 taker-buy availability evidence"
          git push origin HEAD:${RESEARCH_BRANCH}
