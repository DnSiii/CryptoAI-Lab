name: V98 Independent SPOT 2022-2024 Official Source Integrity Only
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-spot-perp-source.yml'
      - 'research/v98_independent/spot_perp_source_prereg_20261026.md'
      - 'research/v98_independent/spot_perp_source_only.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spot-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile isolated source-only script
        run: python -m py_compile research/v98_independent/spot_perp_source_only.py
      - name: Download 100 exact official spot monthly archives and verify provider checksums
        run: python research/v98_independent/spot_perp_source_only.py
      - name: Enforce source-only no-holdout/no-PnL firewall
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('research/v98_independent/spot_perp_source_only')
          p=json.loads((root/'spot_source_integrity_receipt.json').read_text())
          raw=(root/'spot_clean4_2022_2024_1h.csv').read_bytes()
          assert p['decision']=='PASS_SPOT_SOURCE_INTEGRITY_ONLY_NOT_ECONOMIC'
          assert p['archive_count']==100 and p['provider_sha256_count']==100
          assert p['asset_hours']==73152 and p['two_pass_byte_identical'] is True
          assert p['canonical_sha256']==hashlib.sha256(raw).hexdigest()
          assert p['validation_2025_read'] is False and p['data_2026_read'] is False
          assert p['historical_system_pnl_computed'] is False and p['alpha_selected'] is False
          assert p['external_benchmarks_used'] is False and p['trading_authorized'] is False
          print('SPOT_SOURCE_ONLY_INTEGRITY_PASS',p['canonical_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-spot-clean4-2022-2024-source-only
          path: research/v98_independent/spot_perp_source_only/
          retention-days: 30
          if-no-files-found: warn
