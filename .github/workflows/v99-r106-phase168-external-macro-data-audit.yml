name: V99 R106 Phase168 External Macro DATA Audit
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/v99_r106_phase168_external_macro_data_prereg.md'
      - 'scripts/run_v99_r106_phase168_external_macro_data_audit.py'
      - '.github/workflows/v99-r106-phase168-external-macro-data-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v99-r106-phase168-macro-data
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen firewall precheck
        shell: bash
        run: |
          set -euo pipefail
          test -f research/v99_r106_phase168_external_macro_data_prereg.md
          grep -Fq 'PREREGISTERED DATA ONLY. BEFORE ANY Phase168 PnL.' research/v99_r106_phase168_external_macro_data_prereg.md
          git status --porcelain
      - name: Run DATA-only audit
        run: python scripts/run_v99_r106_phase168_external_macro_data_audit.py
      - name: Assert scientific firewall
        run: |
          python - <<'PY'
          import json
          p='reports/candidate_v99_r106_phase168_external_macro_data_audit.json'
          d=json.load(open(p))
          assert d['pnl_computed'] is False
          assert d['holdout_rows_used_for_feature_construction']==0
          assert d['holdout_rows_used_for_selection']==0
          assert d['frozen_assets_untouched']=={'v16':True,'v99_frozen':True}
          assert d['status'] in {'PASS_DATA_ONLY','FAIL_DATA_ONLY'}
          if d['status']=='PASS_DATA_ONLY':
            assert d['snapshot_path']=='data/research/v99_r106_phase168_external_macro_train.csv'
          PY
      - name: Commit evidence and validated TRAIN snapshot race-safe
        shell: bash
        run: |
          set -euo pipefail
          cp reports/candidate_v99_r106_phase168_external_macro_data_audit.json /tmp/phase168.json
          if test -f data/research/v99_r106_phase168_external_macro_train.csv; then cp data/research/v99_r106_phase168_external_macro_train.csv /tmp/phase168.csv; fi
          git fetch origin research/v99-r106-native-all-regime-engine
          git reset --hard origin/research/v99-r106-native-all-regime-engine
          cp /tmp/phase168.json reports/candidate_v99_r106_phase168_external_macro_data_audit.json
          if test -f /tmp/phase168.csv; then mkdir -p data/research; cp /tmp/phase168.csv data/research/v99_r106_phase168_external_macro_train.csv; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/candidate_v99_r106_phase168_external_macro_data_audit.json
          if test -f data/research/v99_r106_phase168_external_macro_train.csv; then git add data/research/v99_r106_phase168_external_macro_train.csv; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record V99 R106 Phase168 macro DATA audit and TRAIN snapshot'
          git push origin HEAD:research/v99-r106-native-all-regime-engine
