name: V98 Independent Rejected AS First Fault Physical Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-as-first-fault-forensics.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download original pinned native training-only source
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-ubuntu-24.04
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage authenticated Clean4 2023-24 only
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Diagnose physical first fault for rejected AS without rescue
        working-directory: research/v98_independent
        run: |
          python v98_as_rejected_first_fault_forensics.py --output as_first_fault_forensics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-as-rejected-first-fault-forensics
          path: research/v98_independent/as_first_fault_forensics.json
          retention-days: 30
          if-no-files-found: warn
