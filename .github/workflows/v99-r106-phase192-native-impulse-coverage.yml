name: V99 R106 Phase192 Native Impulse Coverage
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase192_native_impulse_coverage.py'
      - 'research/tools/v99_phase192_snapshot_integrity.py'
      - '.github/workflows/v99-r106-phase192-native-impulse-coverage.yml'
  workflow_dispatch:
concurrency:
  group: v99-r106-phase192-native-impulse-coverage
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard V16/V99 Frozen
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ei '(^|/)(V16_FROZEN|V99_FROZEN)(/|\.|_)|(^|/)frozen/(v16|v99)(/|$)'; then echo 'Frozen artifact touched'; exit 1; fi
      - name: Phase192 invariant self-tests
        run: |
          python research/tools/v99_phase192_native_impulse_coverage.py --self-test
          python research/tools/v99_phase192_snapshot_integrity.py --self-test
      - name: Restore latest partial TRAIN-only snapshot
        uses: actions/cache/restore@v4
        with:
          path: .phase192-cache/phase192-source.json
          key: phase192-source-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            phase192-source-v3-
            phase192-source-v2-
      - name: Audit restored checkpoint before network continuation
        if: hashFiles('.phase192-cache/phase192-source.json') != ''
        run: python research/tools/v99_phase192_snapshot_integrity.py .phase192-cache/phase192-source.json | tee /tmp/restored-integrity.json
      - name: Acquire preregistered TRAIN-only native-event snapshot
        id: acquire
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .phase192-cache
          python research/tools/v99_phase192_native_impulse_coverage.py --snapshot .phase192-cache/phase192-source.json | tee /tmp/live.json
          test -s .phase192-cache/phase192-source.json
          sha256sum .phase192-cache/phase192-source.json
      - name: Audit partial checkpoint after acquisition
        if: always() && hashFiles('.phase192-cache/phase192-source.json') != ''
        run: python research/tools/v99_phase192_snapshot_integrity.py .phase192-cache/phase192-source.json | tee /tmp/post-acquire-integrity.json
      - name: Persist partial snapshot across transient transport failures
        if: always() && hashFiles('.phase192-cache/phase192-source.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .phase192-cache/phase192-source.json
          key: phase192-source-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deterministic zero-network replay twice
        if: steps.acquire.outcome == 'success'
        run: |
          set -euo pipefail
          python research/tools/v99_phase192_native_impulse_coverage.py --replay .phase192-cache/phase192-source.json > /tmp/a.json
          python research/tools/v99_phase192_native_impulse_coverage.py --replay .phase192-cache/phase192-source.json > /tmp/b.json
          cmp /tmp/live.json /tmp/a.json
          cmp /tmp/a.json /tmp/b.json
          cat /tmp/a.json
      - name: Publish immutable DATA_ONLY evidence
        if: steps.acquire.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phase192-native-impulse-${{ github.sha }}
          path: |
            .phase192-cache/phase192-source.json
            /tmp/a.json
            /tmp/restored-integrity.json
            /tmp/post-acquire-integrity.json
          retention-days: 30
      - name: Preserve failure semantics after checkpoint
        if: steps.acquire.outcome != 'success'
        run: |
          echo 'TRAIN-only acquisition incomplete; partial snapshot was integrity-audited and checkpointed when available.'
          exit 1
