name: V98 Exact Funding Official Capture Contract (Synthetic, No PnL)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-exact-funding-capture-contract.yml'
      - 'research/v98_independent/v98_exact_funding_official_capture.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v98-capture-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and tamper contract (synthetic only)
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_exact_funding_official_capture.py
          python v98_exact_funding_official_capture.py --self-test
          python v98_exact_funding_official_capture.py --dry-run
      - name: Never claim exact official capture from synthetic CI
        run: |
          echo 'V98 official markPrice capture requires an authorized network and independently auditable transport provenance.'
          echo 'No exchange response fetched, no event mark attested, no economic PnL, no paper/live authorization.'
