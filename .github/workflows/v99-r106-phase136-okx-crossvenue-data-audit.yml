name: V99 R106 Phase136 OKX cross-venue data audit
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'scripts/run_v99_r106_phase136_okx_crossvenue_data_audit.py'
      - '.github/workflows/v99-r106-phase136-okx-crossvenue-data-audit.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: v99-r106-phase136-okx-crossvenue-data, cancel-in-progress: false}
jobs:
  data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Snapshot frozen assets
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          files=sorted({p for pat in ('*v16*frozen*','*v99*frozen*') for p in pathlib.Path('.').rglob(pat) if p.is_file() and '.git' not in p.parts})
          pathlib.Path('/tmp/frozen_before.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},sort_keys=True))
          PY
      - name: Run Phase136 DATA_ONLY audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/run_v99_r106_phase136_okx_crossvenue_data_audit.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify DATA_ONLY firewall and frozen assets
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          before=json.loads(pathlib.Path('/tmp/frozen_before.json').read_text())
          after={x:hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest() for x in before}
          assert before==after,'Frozen asset mutation detected'
          p=pathlib.Path('reports/candidate_v99_r106_phase136_okx_crossvenue_data_audit.json')
          assert p.exists(),'Phase136 report missing'
          r=json.loads(p.read_text())
          assert r['mode']=='DATA_ONLY_NO_ALPHA_NO_PNL'
          assert r['return_relation_computed'] is False and r['alpha_computed'] is False and r['pnl_computed'] is False
          assert r['holdout_used'] is False
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['frozen_instruments']==['BTC-USDT-SWAP','ETH-USDT-SWAP','SOL-USDT-SWAP','XRP-USDT-SWAP','DOGE-USDT-SWAP']
          assert r['status'] in {'PASS_DATA_ONLY','FAIL_DATA_NO_ALPHA'}
          forbidden={'ohlc','returns','correlation','profit_factor','pnl_value','trade_win_rate'}
          txt=p.read_text().lower()
          assert not any('"'+x+'"' in txt for x in forbidden)
          PY
      - name: Persist Phase136 evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f reports/candidate_v99_r106_phase136_okx_crossvenue_data_audit.json ]; then
            git add -f reports/candidate_v99_r106_phase136_okx_crossvenue_data_audit.json
          fi
          if git diff --cached --quiet; then
            echo no-evidence-change
          else
            git commit -m "Record V99 R106 Phase136 OKX data feasibility"
            git fetch origin ${RESEARCH_BRANCH}
            git rebase origin/${RESEARCH_BRANCH}
            git push origin HEAD:${RESEARCH_BRANCH}
          fi
      - name: Enforce Phase136 decision
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open('reports/candidate_v99_r106_phase136_okx_crossvenue_data_audit.json'))
          sys.exit(0 if r['status']=='PASS_DATA_ONLY' else 2)
          PY
