name: V98 Independent Intrabar 1m Source Integrity
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-intrabar-1m-source.yml'
      - 'research/v98_independent/v98_intrabar_stress_1m_probe.py'
      - 'research/v98_independent/v98_intrabar_stress_1m_independent_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned 1h and native funding
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Check 1m publisher checksum and 1h aggregate provenance
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_intrabar_stress_1m_probe.py
          python v98_intrabar_stress_1m_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-intrabar-1m-original-zip-and-primary
          path: |
            research/v98_independent/v98_intrabar_1m_raw
            research/v98_independent/v98_intrabar_1m_primary_receipt.json
          retention-days: 30
          if-no-files-found: warn
  independent:
    needs: primary
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-intrabar-1m-original-zip-and-primary
          path: research/v98_independent
      - name: Stage exact pinned 1h and native funding independently
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent original ZIP replay and fail-closed gate
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_intrabar_stress_1m_independent_audit.py
          python v98_intrabar_stress_1m_independent_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-intrabar-1m-independent-verdict
          path: research/v98_independent/v98_intrabar_1m_independent_receipt.json
          retention-days: 30
          if-no-files-found: warn
