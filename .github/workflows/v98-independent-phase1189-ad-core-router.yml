name: V98 Independent Phase1189 AD Online Core Router Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1189_ad_online_core_router.py'
      - 'research/v98_independent/test_phase1189_ad_online_core_router.py'
      - '.github/workflows/v98-independent-phase1189-ad-core-router.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ad-core-router-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Validate causal online experts and HMM router (synthetic only)
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1189_ad_online_core_router.py' -v
