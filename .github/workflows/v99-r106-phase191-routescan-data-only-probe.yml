name: V99 R106 Phase191 Routescan DATA_ONLY Probe
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase191_routescan_data_only_probe.py'
      - '.github/workflows/v99-r106-phase191-routescan-data-only-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard V16/V99 Frozen unchanged in this commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Ei '(^|/)(v16|v99).*frozen|frozen.*(v16|v99)'; then
            echo 'Frozen artifact touched'; exit 1
          fi
      - name: Run independent DATA_ONLY probe twice
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/v99_phase191_routescan_data_only_probe.py > /tmp/a.json
          python research/tools/v99_phase191_routescan_data_only_probe.py > /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
          cat /tmp/a.json
          sha256sum /tmp/a.json
