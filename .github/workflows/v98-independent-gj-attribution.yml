name: V98 Independent GJ Frozen Component Funding Order Attribution
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-gj-attribution.yml'
      - 'research/v98_independent/gj_frozen_failure_attribution.py'
permissions:
  actions: read
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gj30-ubuntu-24.04-*
          run-id: 40292914310
          github-token: ${{ github.token }}
          path: frozen-paths
      - uses: actions/download-artifact@v4
        with:
          name: gj30-official-economic-summary
          run-id: 40292914310
          github-token: ${{ github.token }}
          path: frozen-summary
      - name: Independent frozen per-sleeve funding-order and fee decomposition
        run: |
          python research/v98_independent/gj_frozen_failure_attribution.py --root frozen-paths --official frozen-summary/gj30_official_economic_summary.json --output gj_frozen_component_attribution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gj-frozen-component-attribution
          path: gj_frozen_component_attribution.json
          retention-days: 30
          if-no-files-found: warn
