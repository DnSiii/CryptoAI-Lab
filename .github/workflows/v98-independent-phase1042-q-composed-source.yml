name: V98 Independent Phase1042 Q Composed Source-Only Contract
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1042_q_signed_sevenslot_source.py'
      - 'research/v98_independent/test_phase1042_q_signed_sevenslot_source.py'
      - '.github/workflows/v98-independent-phase1042-q-composed-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q-composed-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
      - name: Verify Q seven-slot composition and no-future synthetic causality
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1042_q_signed_sevenslot_source.py
