name: V98 Independent KZ Risk Budgeted Trend Pullback Dispersion 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kz-seven-slot.yml'
      - 'research/v98_independent/kz_risk_budgeted_dispersion_prereg_20261029.md'
      - 'research/v98_independent/kz_risk_budgeted_dispersion_sources.py'
      - 'research/v98_independent/kz_source_viability.py'
      - 'research/v98_independent/kz_real_causality_audit.py'
      - 'research/v98_independent/kz_30cell.py'
      - 'research/v98_independent/kz_reconcile_30cell.py'
      - 'research/v98_independent/kz_independent_ledger_replay.py'
      - 'research/v98_independent/kz_original_artifact_independent_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned training data only (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact authenticated Clean-4 source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: KZ authenticated 1h funding and causal source viability
        working-directory: research/v98_independent
        run: |
          python -m py_compile kz_risk_budgeted_dispersion_sources.py kz_source_viability.py kz_30cell.py kz_reconcile_30cell.py kz_original_artifact_independent_audit.py kz_independent_ledger_replay.py
          python kz_risk_budgeted_dispersion_sources.py
          python kz_source_viability.py
          python kz_real_causality_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kz-source-viability
          path: |
            research/v98_independent/kz_source_viability.json
            research/v98_independent/kz_real_causality_audit.json
          retention-days: 30
          if-no-files-found: warn
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [KZ_core_only, KZ_full, KZ_minus_opportunity, KZ_minus_RV, KZ_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Run pinned native funding 6-cell path USD10k, base/severe/supersevere and both funding orders
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python kz_30cell.py --path ${{ matrix.path }} --output kz30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s kz30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kz30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/kz30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kz30-ubuntu-*
          path: receipts
      - name: Independent artifact-only 30-cell cross-OS and marginal gate
        shell: bash
        run: python research/v98_independent/kz_reconcile_30cell.py --root receipts --output kz30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kz30-official-economic-summary
          path: kz30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  original_receipt_audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kz30-ubuntu-*
          path: original-receipts
      - name: Independently audit 60 original physical receipts, no signal/engine import
        run: python research/v98_independent/kz_original_artifact_independent_audit.py --root original-receipts --output kz_original_independent_economic_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kz-original-independent-economic-audit
          path: kz_original_independent_economic_audit.json
          retention-days: 30
          if-no-files-found: warn

  oracle:
    needs: [audit, original_receipt_audit]
    if: needs.audit.result == 'success' && needs.original_receipt_audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [KZ_core_only, KZ_full, KZ_minus_opportunity, KZ_minus_RV, KZ_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding, NAV, fee, slippage and 81-corner settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py kz_independent_ledger_replay.py
          python kz_independent_ledger_replay.py --path ${{ matrix.path }} --output kz_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kz-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/kz_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
