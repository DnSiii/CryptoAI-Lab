name: V98 Independent PN OI Leverage Migration Seven-Slot Full Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-pn-oi-leverage-migration.yml'
      - 'research/v98_independent/pn_oi_leverage_migration_*.py'
      - 'research/v98_independent/pn_oi_leverage_migration_prereg_20261101.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pn-full-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile and causal synthetic before any PnL
        run: |
          python -m py_compile research/v98_independent/pn_oi_leverage_migration_composed.py research/v98_independent/pn_oi_leverage_migration_oracle.py research/v98_independent/pn_oi_leverage_migration_receipt_audit.py
          python research/v98_independent/pn_oi_leverage_migration_composed.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-oi
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-2025-native-oi-vendor-sha-source-only
          run-id: 41282113093
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new-oi
      - name: Execute complete PN 30-cell exposed training with independent decisions and cash oracles
        working-directory: research/v98_independent
        env:
          OLD_ROOT: ${{ runner.temp }}/old
          OLD_ENVELOPE: ${{ runner.temp }}/old-envelope/v98_official_mark_envelope_training.csv
          NEW_ROOT: ${{ runner.temp }}/new
          CORRECTED_ROOT: ${{ runner.temp }}/corrected
          OLD_OI: ${{ runner.temp }}/old-oi
          NEW_OI: ${{ runner.temp }}/new-oi
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from v98_2025_full_training_source_bridge import load as load_price
          from v98_oi_clean4_value_bridge import load as load_oi
          from pn_oi_leverage_migration_composed import run
          d=load_price(os.environ["OLD_ROOT"],os.environ["OLD_ENVELOPE"],
                       os.environ["NEW_ROOT"],os.environ["CORRECTED_ROOT"])
          bridge=load_oi(os.environ["OLD_OI"],os.environ["NEW_OI"])
          out=run(d,bridge)
          Path("pn_full_training_result.json").write_text(
              json.dumps(out,indent=2,sort_keys=True,allow_nan=False)+"\n")
          print("PN_BINDING_TRAINING_DECISION",out["decision"],
                "FAILURES",len(out["gate_failures"]),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-pn-full-training-receipt
          path: research/v98_independent/pn_full_training_result.json
          retention-days: 30
          if-no-files-found: warn
  pn-independent-audit:
    needs: pn-full-physical
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v98-pn-full-training-receipt
          path: pn-receipt
      - name: Independently replay economics and four receipt tamper cases
        run: |
          python research/v98_independent/pn_oi_leverage_migration_receipt_audit.py pn-receipt/pn_full_training_result.json | tee pn_independent_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-pn-independent-receipt-audit
          path: pn_independent_audit.json
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce PN economic gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("pn-receipt/pn_full_training_result.json").read_text())
          if r["decision"]!="PASS_PROVISIONAL_PN_TRAINING_NOT_VALIDATED":
              raise SystemExit("PN_PREREGISTERED_ECONOMIC_REJECTION_NOT_APPROVED")
          PY
