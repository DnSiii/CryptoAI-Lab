name: V98 Independent 2025 Native OI Source-Only 8-File Vendor SHA Probe
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-oi-2025-sample-source.yml'
      - 'research/v98_independent/v98_oi_2025_sample_source_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vendor-checksummed eight 2025 Clean-4 OI archive probes; no PnL
        shell: bash
        run: |
          python -m py_compile research/v98_independent/v98_oi_2025_sample_source_probe.py
          python research/v98_independent/v98_oi_2025_sample_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-oi-2025-8file-source-only-receipt
          path: v98_oi_2025_sample_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
