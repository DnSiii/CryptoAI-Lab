name: V98 Independent KN Frozen Original Receipt Attribution
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kn-frozen-receipts.yml'
      - 'research/v98_independent/kn_frozen_receipt_attribution.py'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kn30-ubuntu-*
          run-id: 40796650808
          github-token: ${{ github.token }}
          path: original-kn-receipts
      - name: Independent KN frozen receipt attribution without signal or PnL rerun
        run: python research/v98_independent/kn_frozen_receipt_attribution.py --root original-kn-receipts --output kn_frozen_receipt_attribution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kn-frozen-original-receipt-attribution
          path: kn_frozen_receipt_attribution.json
          retention-days: 30
