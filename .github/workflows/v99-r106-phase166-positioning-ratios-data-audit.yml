name: V99 R106 Phase166 Positioning Ratios DATA Audit
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/v99_r106_phase166_positioning_ratios_data_prereg.md'
      - 'scripts/run_v99_r106_phase166_positioning_ratios_data_audit.py'
      - '.github/workflows/v99-r106-phase166-positioning-ratios-data-audit.yml'
permissions:
  contents: write
concurrency:
  group: v99-r106-phase166-positioning-data
  cancel-in-progress: false
jobs:
  data-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Assert Phase165 closed and Phase166 firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('reports/candidate_v99_r106_phase165_open_interest_data_audit.json'))
          q=Path('research/v99_r106_phase166_positioning_ratios_data_prereg.md').read_text()
          p=Path('scripts/run_v99_r106_phase166_positioning_ratios_data_audit.py').read_text()
          assert x['status']=='FAIL_DATA_ONLY'
          assert x['pnl_computed'] is False and x['holdout_rows_used_for_selection']==0
          assert 'BEFORE ANY Phase166 PnL' in q and 'DATA ONLY' in q
          assert "'pnl_computed':False" in p and "'holdout_rows_used_for_selection':0" in p
          PY
      - name: Run frozen Phase166 DATA-only audit
        run: python scripts/run_v99_r106_phase166_positioning_ratios_data_audit.py
      - name: Verify no-PnL invariants
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/candidate_v99_r106_phase166_positioning_ratios_data_audit.json'))
          assert x['pnl_computed'] is False
          assert x['holdout_rows_used_for_feature_construction']==0
          assert x['holdout_rows_used_for_selection']==0
          assert x['frozen_assets_untouched']=={'v16':True,'v99_frozen':True}
          assert len(x['fixed_fields'])==4
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/candidate_v99_r106_phase166_positioning_ratios_data_audit.json
          git diff --cached --quiet || git commit -m 'Record V99 R106 Phase166 positioning DATA audit'
          git pull --rebase origin research/v99-r106-native-all-regime-engine
          git push origin HEAD:research/v99-r106-native-all-regime-engine
