name: V98 Independent Causal Atomic Pretrade No-Future-Funding Tests
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-causal-atomic-ci.yml'
      - 'research/v98_independent/v98_pretrade_causal_atomic_planner.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v98-causal-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Assert t-1 causal sizing, close-first, funding reserve, and fail-closed settlement
        run: python research/v98_independent/v98_pretrade_causal_atomic_planner.py
