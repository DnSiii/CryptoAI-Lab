name: V98 OB Two-Clock Persistent-Core Complete Seven-Slot 30-Cell Physical + Independent Gates
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ob-30cell.yml'
      - 'research/v98_independent/ob_*.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  ob-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned authenticated Clean-4 2022-24 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download pinned official worst-side hourly mark envelope (not exact event mark)
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Source-only and causal synthetic gates before PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile ob_sources.py ob_intents.py ob_source_gate.py ob_30cell_physical.py ob_hourly_oracle_gate.py ob_independent_fill_oracle.py ob_independent_receipt_arithmetic_audit.py ob_independent_source_oracle.py
          python ob_sources.py
          python ob_intents.py
          python ob_source_gate.py --root ../../official-input --output ob_source_receipt.json
          python ob_independent_source_oracle.py --root ../../official-input --output ob_independent_source_receipt.json
      - name: Run preregistered OB two-clock 30-cell signed physical training
        id: physical
        continue-on-error: true
        working-directory: research/v98_independent
        run: |
          python ob_30cell_physical.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output ob_30cell_receipt.json --ledger-output ob_base_full_hourly_forensic.jsonl
      - name: Independent all-hour signed settlement
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s ob_30cell_receipt.json && test -s ob_base_full_hourly_forensic.jsonl; then
            python ob_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl ob_base_full_hourly_forensic.jsonl --receipt ob_30cell_receipt.json --output ob_independent_hourly_receipt.json
          else
            echo "NO_COMPLETE_OB_LEDGER_FOR_INDEPENDENT_SETTLEMENT"
          fi
      - name: Independently reconstruct net physical fills and tamper detection
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s ob_base_full_hourly_forensic.jsonl; then
            python ob_independent_fill_oracle.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl ob_base_full_hourly_forensic.jsonl --output ob_independent_fill_receipt.json
          else
            echo "NO_COMPLETE_OB_LEDGER_FOR_INDEPENDENT_FILLS"
          fi
      - name: Independent 30-cell arithmetic and economic gate
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s ob_30cell_receipt.json; then
            python ob_independent_receipt_arithmetic_audit.py --receipt ob_30cell_receipt.json > ob_independent_arithmetic_receipt.json
            cat ob_independent_arithmetic_receipt.json
          else
            echo "NO_OB_RECEIPT_FOR_ARITHMETIC_AUDIT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-ob-original-${{ github.run_id }}
          path: |
            research/v98_independent/ob_source_receipt.json
            research/v98_independent/ob_independent_source_receipt.json
            research/v98_independent/ob_30cell_receipt.json
            research/v98_independent/ob_independent_hourly_receipt.json
            research/v98_independent/ob_independent_fill_receipt.json
            research/v98_independent/ob_independent_arithmetic_receipt.json
            research/v98_independent/ob_base_full_hourly_forensic.jsonl
          retention-days: 30
          if-no-files-found: warn
      - name: Economic gate is binding; no false completion
        if: always()
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ob_30cell_receipt.json')
          if not p.exists():raise SystemExit('OB_MISSING_PHYSICAL_RECEIPT')
          r=json.loads(p.read_text())
          print('OB_ORIGINAL_DECISION',r['decision'])
          print('OB_GATE_FAILURES',r['gate_failures'])
          if r['decision']!='PASS_PROVISIONAL_TRAINING_NOT_VALIDATED':
              raise SystemExit('OB_REJECTED_NO_PROMOTION')
          if not Path('ob_independent_source_receipt.json').exists() or not Path('ob_independent_hourly_receipt.json').exists() or not Path('ob_independent_fill_receipt.json').exists() or not Path('ob_independent_arithmetic_receipt.json').exists():
              raise SystemExit('OB_MISSING_INDEPENDENT_EVIDENCE')
          print('OB_PROVISIONAL_TRAINING_ONLY_NOT_INDEPENDENT_VALIDATION')
          PY
