name: V98 Independent CG Frozen Source Activation Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-cg-source-activation.yml'
      - 'research/v98_independent/cg_signal_activation_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frozen_source_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve original pinned Clean4 2022-2024 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Count original frozen CG module activations without changing signals
        working-directory: research/v98_independent
        run: python cg_signal_activation_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: cg-frozen-source-activation
          path: research/v98_independent/cg_activation_audit.json
          retention-days: 30
