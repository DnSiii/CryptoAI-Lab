name: V98 Independent LV Authenticated Seven-Slot Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-lv-source.yml'
      - 'research/v98_independent/lv_sources.py'
      - 'research/v98_independent/lv_independent_source_gate.py'
      - 'research/v98_independent/lv_slow_rotation_convex_overlay_prereg_20261029.md'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  lv-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve pinned original Clean4 training-only artifact
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Authenticate original OHLC and native funding
        run: python research/v98_independent/v98_clean4_training_reader.py --root official-input
      - name: Independent LV source gate BEFORE any PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile lv_sources.py lv_independent_source_gate.py
          python lv_sources.py
          python lv_independent_source_gate.py --root ../../official-input --output lv_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-lv-source-${{ github.run_id }}
          path: research/v98_independent/lv_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
