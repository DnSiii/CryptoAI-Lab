name: V98 Independent HR Frozen Training Readonly Artifact Diagnostics
on:
  push:
    branches: [research/v98-independent-zero]
    paths: ['.github/workflows/v98-independent-hr-readonly-diagnostics.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hr30-official-economic-summary
          run-id: 40442202139
          github-token: ${{ github.token }}
          path: diag
      - name: Read immutable HR independent artifact; NO rerun or tuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('diag/hr30_official_economic_summary.json').read_text())
          assert d['architecture']=='HR'
          assert d['decision']=='REJECT_HR_HISTORICAL_GROWTH_OR_MARGINAL'
          assert d['validation_2025_read'] is False
          assert d['cells_survived']==30 and d['cross_os_reproducible'] is True
          assert not d['errors']
          print('HR_FROZEN_DECISION',d['decision'])
          for key in ('full_10k_base','full_10k_severe'):
              x=d[key]
              print('HR_FROZEN_FULL',key,'CAGR',x['two_year_cagr'],
                    'DD',x['max_drawdown'],'TURNOVER',x['turnover'],
                    'FEES',x['fees'],'SLIPPAGE',x['slippage'],
                    'FUNDING',x['funding'],'PF',x['hourly_net_profit_factor'],
                    'PAYOFF',x['hourly_net_payoff'],
                    'WIN_RATE',x['hourly_net_win_rate'],
                    'WORST_HOUR',x['worst_hour_net_return'],
                    'CVAR_1PCT',x['hourly_cvar_1pct'],
                    'MAX_GROSS_NAV',x['max_gross_to_nav'],
                    'MAX_ASSET_CONCENTRATION',x['max_single_asset_gross_concentration'],
                    'POSITIVE_DAYS',x['positive_utc_days'],'/',x['total_utc_days'])
          print('HR_FROZEN_GATES','growth',d['growth_gates_10k'],
                'turnover',d['turnover_gate_10k'],
                'severe_dd',d['severe_drawdown_gate_10k'])
          for book,by_key in d['marginal_log_growth_10k'].items():
              for key,annual in sorted(by_key.items()):
                  if '|base|' in key or '|severe|' in key:
                      print('HR_FROZEN_MARGINAL',book,key,
                            '2023',annual['2023'],'2024',annual['2024'],
                            'sum',annual['2023']+annual['2024'])
          print('HR_FROZEN_MARGINAL_GATES',d['marginal_gates_10k'])
          PY
