name: CryptoAI V99 R106 Phase59 Taker Buy Provenance Probe
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - scripts/run_v99_r106_phase59_taker_buy_provenance_probe.py
      - .github/workflows/v99-r106-phase59-taker-buy-provenance-probe.yml
permissions: {contents: write}
jobs:
  phase59:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python scripts/run_v99_r106_phase59_taker_buy_provenance_probe.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase59_taker_buy_provenance_probe.json').read_text())
          assert r['status']=='PROVENANCE_PROBE_PASS' and r['all_pass']
          assert len(r['results'])==6
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen']
          assert r['precommitment']['no_returns'] and r['precommitment']['no_holdout_inspection'] and r['precommitment']['no_ohlcv_proxy']
          PY
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase59_taker_buy_provenance_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 phase59 taker-buy provenance evidence"
          git push origin HEAD:research/v99-r106-native-all-regime-engine
