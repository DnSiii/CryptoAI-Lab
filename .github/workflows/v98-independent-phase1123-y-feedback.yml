name: V98 Independent Phase1123-1124 Y Continuous Growth Synthetic
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1123-y-feedback.yml'
      - 'research/v98_independent/phase1123_y_continuous_feedback.py'
      - 'research/v98_independent/test_phase1123_y_continuous_feedback.py'
      - 'research/v98_independent/test_phase1123_y_causality.py'
      - 'research/v98_independent/phase1124_y_pretrade_growth.py'
      - 'research/v98_independent/test_phase1124_y_pretrade_growth.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  y-causal-feedback-and-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numpy
        run: python -m pip install 'numpy==1.26.4'
      - name: Y 5000 adversarial books, causal feedback, 81-state pretrade
        run: python -m unittest -v test_phase1123_y_continuous_feedback.py test_phase1123_y_causality.py test_phase1124_y_pretrade_growth.py
