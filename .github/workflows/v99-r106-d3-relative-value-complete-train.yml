name: V99 D3 one-shot relative-value complete original TRAIN independent oracle (HOLD)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_d3_relative_value_train.py
      - research/verification/independent_v99_r106_d3_relative_value_oracle.py
      - research/tests/test_v99_r106_d3_relative_value_train.py
      - .github/workflows/v99-r106-d3-relative-value-complete-train.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  d3-original-train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preregistration committed before implementation
        run: |
          git merge-base --is-ancestor 3e5ddd2ab56381fa0ba88917757c7373c0daf3a9 HEAD
          test -s research/V99_R106_D3_RELATIVE_VALUE_COMPLETE_TRAIN_PREREG_20261029.md
      - name: Synthetic causal/accounting controls (not PnL certification)
        run: python -m unittest -v research.tests.test_v99_r106_d3_relative_value_train
      - name: Restore archived first-party OKX original TRAIN only
        run: |
          gh run download 40019588739 --repo "$GITHUB_REPOSITORY" \
            --name d1-train-four-leg-backfill-40019588739 \
            --dir research_evidence/d3_original
      - name: Execute one-shot D3 complete TRAIN with modeled costs, no funding claim
        run: |
          python -m research.tools.v99_r106_d3_relative_value_train \
            research_evidence/d3_original research_evidence/d3_result
      - name: Independently replay all 15864 original hours, events, fees, NAV and gates
        run: |
          python -m research.verification.independent_v99_r106_d3_relative_value_oracle \
            research_evidence/d3_original research_evidence/d3_result \
            | tee research_evidence/d3_result/d3_independent_oracle.json
      - name: Fail-closed numeric decision without unlocking validation or holdout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("research_evidence/d3_result")
          r=json.loads((d/"d3_train_report.json").read_text())
          v=json.loads((d/"d3_independent_oracle.json").read_text())
          assert v["hours_verified"]==15864 and v["events_verified"]==r["event_count"]
          assert v["status"]=="INDEPENDENT_D3_FULL_ORIGINAL_TRAIN_HOURLY_REPLAY_PRE_FUNDING_ONLY"
          assert r["original_price_receipts_verified"] and not r["original_economic_train_certified"]
          assert not r["promotion_authorized"] and not r["validation_opened"] and not r["holdout_opened"]
          assert not r["orders_enabled"] and not v["promotion_authorized"]
          assert v["numeric_pass_both"]==r["numeric_pass_both"]
          decision=("D3_NUMERIC_ONLY_HOLD_MISSING_NATIVE_FUNDING_FEES_FILLS"
                    if r["numeric_pass_both"] else "REJECT_D3_NUMERIC_TRAIN_PERMANENT_NO_RETUNE")
          (d/"d3_decision.txt").write_text(decision+"\nNO PROMOTION / NO ORDERS / NO VALIDATION / NO HOLDOUT\n")
          print("D3_DECISION="+decision)
          for sc in ("severe","supersevere"):
              m=r["metrics"][sc]
              print(sc,"ROI_PRE_FUNDING",m["roi_pre_funding"],"FOLDS",m["positive_folds"],
                    "MAX_DD",m["max_drawdown"],
                    "FAILED_GATES",[k for k,x in m["gates"].items() if not x])
          PY
      - name: Archive complete reproducible original TRAIN journals and decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-d3-original-train-independent-${{ github.run_id }}
          path: research_evidence/d3_result/
          retention-days: 90
          if-no-files-found: warn
