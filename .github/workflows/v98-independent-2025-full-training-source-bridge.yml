name: V98 Independent Clean-4 2022-25 Source-Only Integration
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/v98_2025_full_training_source_bridge.py'
      - '.github/workflows/v98-independent-2025-full-training-source-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verified-full-training-source:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected
      - name: Full 2022-25 27,048-hour 13,524-event source integration; no PnL
        working-directory: research/v98_independent
        run: python v98_2025_full_training_source_bridge.py --old-root "${{ runner.temp }}/old" --old-envelope "${{ runner.temp }}/old-envelope/v98_official_mark_envelope_training.csv" --new-root "${{ runner.temp }}/new" --corrected-root "${{ runner.temp }}/corrected" --output v98_2025_full_training_source_bridge_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-2022-2025-source-integration-${{ github.run_id }}
          path: research/v98_independent/v98_2025_full_training_source_bridge_receipt.json
          retention-days: 30
          if-no-files-found: warn
