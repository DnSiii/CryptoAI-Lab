name: V98 Independent Full Clean4 Official Mark Archive Crosscheck
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mark-archive-full.yml'
      - 'research/v98_independent/v98_mark_archive_full_crosscheck.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  archive-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve original SHA256-pinned Clean4 2022-2024 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Verify 100 official monthly ZIP checksums and 9144 funding-slot mark candle opens
        run: |
          python -m py_compile research/v98_independent/v98_mark_archive_crosscheck.py research/v98_independent/v98_mark_archive_full_crosscheck.py
          python research/v98_independent/v98_mark_archive_full_crosscheck.py --root official-input --output v98_mark_archive_full_training_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-full-mark-archive-${{ github.run_id }}
          path: v98_mark_archive_full_training_receipt.json
          retention-days: 30
          if-no-files-found: warn
