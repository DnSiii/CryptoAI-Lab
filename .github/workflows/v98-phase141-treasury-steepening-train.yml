name: V98 Phase141 Treasury steepening train gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'reports/v98_independent_phase141_treasury_curve_steepening_risk_on_prereg.md'
      - 'scripts/v98_independent_phase141_treasury_curve_steepening_risk_on.py'
      - '.github/workflows/v98-phase141-treasury-steepening-train.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: v98-phase141-treasury-steepening, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {RESEARCH_BRANCH: research/v98-independent-zero}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v98-independent-zero, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: Rebuild frozen V98 training corpus only
        run: python scripts/v98_independent_phase050_rebuild_data.py --config v98_independent_phase050_data.json --workers 40
      - name: Run Phase141 first deterministic pass
        run: |
          python scripts/v98_independent_phase141_treasury_curve_steepening_risk_on.py
          sha256sum reports/v98_independent_phase141_treasury_curve_steepening_risk_on.json | awk '{print $1}' > /tmp/phase141.sha
      - name: Run Phase141 second deterministic pass
        run: |
          python scripts/v98_independent_phase141_treasury_curve_steepening_risk_on.py
          test "$(sha256sum reports/v98_independent_phase141_treasury_curve_steepening_risk_on.json | awk '{print $1}')" = "$(cat /tmp/phase141.sha)"
      - name: Enforce isolation and frozen contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase141_treasury_curve_steepening_risk_on.json'))
          assert p['phase']=='141'
          assert p['pit_dependency']['decision']=='PASS_PIT_SHORTCUT'
          assert p['signal_contract']['lookback_available_observations']==20
          assert p['signal_contract']['direction']=='delta>0 => long; else flat'
          assert abs(p['signal_contract']['target_gross']-.45)<1e-12
          assert abs(p['signal_contract']['hard_gross_cap']-.50)<1e-12
          assert p['validation'] is None and p['final_holdout'] is None
          assert p['phase083_selection_use'] is False and p['v16_used'] is False and p['v99_used'] is False
          assert p['parameter_search'] is False and p['rescue_allowed'] is False
          assert p['training_gate']['decision'] in {'PASS_TRAINING','REJECT_NO_RESCUE'}
          PY
      - name: Persist Phase141 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v98_independent_phase141_treasury_curve_steepening_risk_on.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v98: record Phase141 Treasury steepening train evidence"
          git fetch origin ${RESEARCH_BRANCH}
          git rebase origin/${RESEARCH_BRANCH}
          git push origin HEAD:${RESEARCH_BRANCH}
