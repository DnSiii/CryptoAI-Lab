name: V98 Independent Phase1199 AD Fifteen Static Source Hash Crossrunner
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1199_ad_static_source_crossrunner.py'
      - 'research/v98_independent/test_phase1199_ad_static_source_crossrunner.py'
      - '.github/workflows/v98-independent-phase1199-ad-static-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ad-static-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        repeat: [a, b]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - name: Validate static observer synthetic invariants
        run: python -m unittest -q test_phase1199_ad_static_source_crossrunner.py
      - name: Fresh official Clean-4 static-source attestation
        env:
          PYTHONUNBUFFERED: '1'
        run: python phase1199_ad_static_source_crossrunner.py
      - name: Preserve all provenance and static-source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-ad-1199-${{ matrix.os }}-${{ matrix.repeat }}
          path: |
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1000_four_asset_source_policy_receipt.json
            research/v98_independent/phase1190_ad_authenticated_core_source_receipt.json
            research/v98_independent/phase1199_ad_static_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
  ad-crossrunner:
    needs: ad-static-source
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v98-ad-1199-*
          path: /tmp/v98-ad-1199
      - name: Exact 15-hash four-runner source-only agreement
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v98-ad-1199')
          paths=[root/('v98-ad-1199-'+os+'-'+repeat)/'phase1199_ad_static_source_receipt.json'
                 for os in ('ubuntu-22.04','ubuntu-24.04') for repeat in ('a','b')]
          if not all(p.is_file() for p in paths):
              raise SystemExit('AD1199_MISSING_FOUR_SOURCE_RECEIPTS')
          receipts=[json.loads(p.read_text()) for p in paths]
          for r in receipts:
              assert r['decision']=='PASS_AD_15_STATIC_SOURCE_HASHES_NOT_FULL_FREEZE'
              assert r['source_only'] is True and r['historical_system_pnl_computed'] is False
              assert r['validation_2025_read'] is False and r['nav_feedback_hashed'] is False
              assert r['official_hours']==18288 and r['native_funding_events']==9144
              assert len(r['static_hashes'])==15 and len(set(r['static_hashes'].values()))==15
          for key in ('static_hashes','native_bounds_sha256','core_router_observer_sha256',
                      'opportunity_active_asset_hours','rv_active_hours',
                      'official_hours','native_funding_events'):
              assert all(r[key]==receipts[0][key] for r in receipts),'AD1199_SOURCE_DRIFT_'+key
          print(json.dumps({'decision':'PASS_AD_FOUR_RUNNER_15_STATIC_HASHES_NOT_FULL_FREEZE',
              'static_hashes':receipts[0]['static_hashes'],
              'native_bounds_sha256':receipts[0]['native_bounds_sha256']},sort_keys=True))
          PY
