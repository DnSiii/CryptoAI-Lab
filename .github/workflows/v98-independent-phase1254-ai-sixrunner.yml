name: V98 Independent Phase1254 AI Six Runner Exact Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1254-ai-sixrunner.yml'
  workflow_dispatch:
jobs:
  emit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Independently recompute all frozen AI signed sources
        working-directory: research/v98_independent
        run: python phase1253_ai_crossos_numeric_forensics.py --emit ai1253_source_arrays.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai1254-source-${{ matrix.os }}-${{ matrix.replica }}
          path: research/v98_independent/ai1253_source_arrays.json
          retention-days: 30
          if-no-files-found: error
  exact:
    needs: emit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai1254-source-*
          path: receipts
          merge-multiple: false
      - name: Fail closed on any cross-OS or cross-instance raw source hash mismatch
        working-directory: research/v98_independent
        run: |
          python phase1254_ai_sixrunner_source_gate.py \
            --input-glob '../../receipts/*/ai1253_source_arrays.json' \
            --output ai1254_sixrunner.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai1254-sixrunner-verdict
          path: research/v98_independent/ai1254_sixrunner.json
          retention-days: 30
          if-no-files-found: warn
