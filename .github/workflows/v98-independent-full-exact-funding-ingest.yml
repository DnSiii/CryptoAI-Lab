name: V98 Independent 2022-25 Exact Funding Content Contract Only
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/v98_exact_funding_full_history_ingest.py'
      - 'research/v98_independent/v98_exact_funding_full_history_capture.py'
      - 'research/v98_independent/v98_exact_funding_full_history_capture_audit.py'
      - '.github/workflows/v98-independent-full-exact-funding-ingest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-exact-mark-content-contract:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Strict full-history 13,524-event synthetic tamper contract (not source provenance or PnL)
        working-directory: research/v98_independent
        run: |
          python v98_exact_funding_full_history_ingest.py --self-test
          python v98_exact_funding_full_history_capture.py --self-test
          python v98_exact_funding_full_history_capture.py --dry-run
          python v98_exact_funding_full_history_capture_audit.py --self-test
