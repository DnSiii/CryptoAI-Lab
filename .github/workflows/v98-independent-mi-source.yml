name: V98 Independent MI Source Only Chronological Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mi-source.yml'
      - 'research/v98_independent/mi_sources.py'
      - 'research/v98_independent/mi_independent_source_gate.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mi-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download immutable authenticated 2022-24 Clean4 source ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Check source, causal mutation, forced rebalance and independent hourly signals
        working-directory: research/v98_independent
        run: |
          python -m py_compile mi_sources.py mi_independent_source_gate.py
          python mi_sources.py
          python mi_independent_source_gate.py --root ../../official-input --output mi_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mi-source-${{ github.run_id }}
          path: research/v98_independent/mi_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
