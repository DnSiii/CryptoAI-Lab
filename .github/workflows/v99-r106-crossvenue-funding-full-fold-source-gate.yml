name: V99 original OKX five-fold funding availability (DATA ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/V99_R106_CROSSVENUE_FUNDING_FULL_FOLD_SOURCE_GO_NO_GO_PREREG_20261029.md
      - .github/workflows/v99-r106-crossvenue-funding-full-fold-source-gate.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-five-fold-go-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce ex-ante preregistration ancestry
        run: |
          git merge-base --is-ancestor a2eace7833659df90279285195104a9780437b3c HEAD
          test -s research/V99_R106_CROSSVENUE_FUNDING_FULL_FOLD_SOURCE_GO_NO_GO_PREREG_20261029.md
      - name: Restore archived first-party OKX TRAIN-only bulk funding ZIPs
        run: |
          gh run download 40019980953 --repo "$GITHUB_REPOSITORY" \
            --name d1-bulk-funding-train-40019980953 \
            --dir research_evidence/okx_original_funding
      - name: Independently reparse all original ZIP bytes and rates
        run: |
          python -m research.verification.independent_d1_okx_bulk_funding research_evidence/okx_original_funding
      - name: Compute exact five-fold source coverage and probe missing early archive listings
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from decimal import Decimal
          from research.verification.independent_d1_okx_bulk_funding import check
          from research.tools.v99_r106_d1_real_train_source_join import START, END, FOLD_EDGES
          root=Path("research_evidence/okx_original_funding")
          proof=check(root)
          assert proof["status"]=="INDEPENDENT_PARTIAL_FIRST_PARTY_FUNDING_NO_ECONOMICS"
          assert len(FOLD_EDGES)==6 and FOLD_EDGES[0]==START and FOLD_EDGES[-1]==END
          eight=8*3600*1000
          expected=range(START,END,eight)
          assets={}
          for inst in ("BTC-USDT-SWAP","ETH-USDT-SWAP"):
              rows=json.loads((root/inst/"funding_rows.json").read_text())
              stamps=[r["settlement_ms"] for r in rows]
              assert stamps==sorted(set(stamps)) and all(START<=t<END for t in stamps)
              assert all(Decimal(str(r["venue_rate"])).is_finite() for r in rows)
              original=set(stamps)
              folds=[]
              for i,(left,right) in enumerate(zip(FOLD_EDGES,FOLD_EDGES[1:]),1):
                  slots=[t for t in expected if left<=t<right]
                  observed=sum(t in original for t in slots)
                  folds.append(dict(fold=i,expected=len(slots),observed=observed,
                      missing=len(slots)-observed,coverage=round(observed/len(slots),8),
                      passes_95pct=observed*100>=95*len(slots)))
              assets[inst]=dict(original_rows=len(stamps),
                  first_original_utc=datetime.fromtimestamp(stamps[0]/1000,timezone.utc).isoformat() if stamps else None,
                  last_original_utc=datetime.fromtimestamp(stamps[-1]/1000,timezone.utc).isoformat() if stamps else None,
                  off_grid=sum(t not in expected for t in stamps),
                  folds=folds)
          early={}
          for inst in assets:
              params={"module":"3","instType":"SWAP","instFamilyList":inst.removesuffix("-SWAP"),
                      "dateAggrType":"monthly",
                      "begin":str(int(datetime(2021,12,1,tzinfo=timezone.utc).timestamp()*1000)),
                      "end":str(int(datetime(2022,3,1,tzinfo=timezone.utc).timestamp()*1000))}
              url="https://www.okx.com/api/v5/public/market-data-history?"+urllib.parse.urlencode(params)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"CryptoAI-Lab-V99-TRAIN-only/1.0","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      raw=response.read(250001)
                      if len(raw)>250000: raise ValueError("OVERSIZED_LISTING")
                  obj=json.loads(raw)
                  if obj.get("code")!="0" or not isinstance(obj.get("data"),list):
                      raise ValueError("OKX_ARCHIVE_LISTING_CODE_"+str(obj.get("code")))
                  names=[]
                  for entry in obj["data"]:
                      for group in entry.get("details",[]):
                          for item in group.get("groupDetails",[]):
                              name=item.get("filename","")
                              if (name.startswith(inst+"-") and
                                  any(x in name for x in ("2021-12","2022-01","2022-02"))):
                                  names.append(name)
                  early[inst]={"status":"LISTING_ONLY_NOT_SOURCE_RECEIPTS",
                               "original_early_filenames":sorted(set(names))}
              except Exception as exc:
                  early[inst]={"status":"LISTING_UNAVAILABLE_NOT_ZERO_COVERAGE",
                               "error":type(exc).__name__+":"+str(exc)[:160]}
          ready=all(f["passes_95pct"] for asset in assets.values() for f in asset["folds"])
          result={"schema":"V99_R106_CROSSVENUE_ORIGINAL_FUNDING_FIVE_FOLD_SOURCE_V1",
              "status":"OKX_SOURCE_ELIGIBLE_ONLY" if ready else "BLOCKED_FIVE_FOLD_NATIVE_FUNDING",
              "train_start_ms":START,"train_end_exclusive_ms":END,
              "independent_original_zip_oracle_passed":True,
              "original_source_run_id":40019980953,
              "assets":assets,"early_archive_listing_only":early,
              "binance_leg_not_verified_this_run":True,
              "historical_account_settled_funding_authenticated":False,
              "native_fee_tier_authenticated":False,"economic_train_executed":False,
              "roi_calculated":False,"promotion_authorized":False,
              "validation_opened":False,"holdout_opened":False,"orders_enabled":False}
          assert all(not result[k] for k in ("historical_account_settled_funding_authenticated",
              "native_fee_tier_authenticated","economic_train_executed","roi_calculated",
              "promotion_authorized","validation_opened","holdout_opened","orders_enabled"))
          Path("v99_crossvenue_original_funding_source_go_no_go.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Archive actual source-only no-go decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-crossvenue-original-funding-source-${{ github.run_id }}
          path: v99_crossvenue_original_funding_source_go_no_go.json
          retention-days: 30
          if-no-files-found: warn
