name: CryptoAI V99 R105 all-regime structural audit
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r105-all-regime-structural-audit]
    paths:
      - "scripts/run_v99_r105_all_regime_structural_audit.py"
      - "scripts/run_v99_r105_all_regime_structural_audit_fast.py"
      - "scripts/run_v99_r105_all_regime_structural_audit_fast2.py"
      - "research/V99_ALL_REGIME_REBUILD_STANDARD.md"
      - ".github/workflows/v99-r105-all-regime-structural-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: v99-r105-canonical-market
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - name: Install package
        run: python -m pip install -e "."
      - name: Restore published replay state
        run: |
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v13.json reports/paper_data_sync_v15.json; do
            mkdir -p "$(dirname "$path")"
            git show "FETCH_HEAD:$path" > "$path"
          done
      - name: Prepare frozen V15 replay inputs
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Run V99 R105 structural audit
        run: python scripts/run_v99_r105_all_regime_structural_audit_fast2.py
      - name: Upload V99 R105 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r105-all-regime-structural-audit
          retention-days: 60
          path: reports/v99_r105_all_regime_structural_audit.json
