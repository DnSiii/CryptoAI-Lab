name: V98 NH Frozen Candidate Sealed 2025 30-Cell Independent Validation
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-nh-2025-validation.yml'
      - 'research/v98_independent/v98_nh_2025_validation.py'
      - 'research/v98_independent/v98_nh_2025_validation_reader.py'
      - 'research/v98_independent/v98_nh_2025_independent_*.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  nh-2025-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile all 2025 validation and independent oracle scripts before data acquisition
        working-directory: research/v98_independent
        run: python -m py_compile v98_nh_2025_validation_reader.py v98_nh_2025_validation.py v98_nh_2025_independent_accounting.py v98_nh_2025_independent_fill_oracle.py v98_nh_2025_independent_arithmetic.py
      - name: Verify frozen 2023-24 NH code blobs, fail closed on any modification
        run: |
          test "$(git hash-object research/v98_independent/nh_sources.py)" = "25c1ef234778abffafcadd4d477cb74fc44f356d"
          test "$(git hash-object research/v98_independent/nh_30cell_physical.py)" = "9ae8306142b2b475884519502e74661057c9b224"
          test "$(git hash-object research/v98_independent/nh_independent_source_gate.py)" = "5221cfcbea88dbd0f30ea1846cdf94ad19674b64"
          test "$(git hash-object research/v98_independent/v98_oneway_net_atomic_planner.py)" = "913c3db3bcd408d39385eefea5ac14e1a101507f"
          test "$(git hash-object research/v98_independent/v98_next_pretrade_projection.py)" = "6fce5b8c7fa16b0cf51d3743cc135e415570b83c"
          echo NH_2025_FROZEN_STRATEGY_BLOBS_PASS
      - name: Download SHA-authenticated frozen 2022-24 training source as causal history ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download separately authenticated official 2025 source, immutable artifact
        uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: validation-input
      - name: Run frozen NH sealed 2025 30-cell physical validation
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_nh_2025_validation_reader.py v98_nh_2025_validation.py v98_nh_2025_independent_accounting.py v98_nh_2025_independent_fill_oracle.py v98_nh_2025_independent_arithmetic.py
          python v98_nh_2025_validation.py --training-root ../../official-input --validation-root ../../validation-input --output v98_nh_2025_30cell_receipt.json --ledger-output v98_nh_2025_base_full_hourly_forensic.jsonl
      - name: Independent 8760-hour signed settlement + daily UTC audit
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s v98_nh_2025_30cell_receipt.json && test -s v98_nh_2025_base_full_hourly_forensic.jsonl; then
            python v98_nh_2025_independent_accounting.py --training-root ../../official-input --validation-root ../../validation-input --ledger-jsonl v98_nh_2025_base_full_hourly_forensic.jsonl --receipt v98_nh_2025_30cell_receipt.json --output v98_nh_2025_independent_accounting_receipt.json
          else
            echo "No complete 2025 original ledger: independent settlement not attested."
          fi
      - name: Independent 8760-hour strategy-to-net-fill oracle and tamper test
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s v98_nh_2025_base_full_hourly_forensic.jsonl; then
            python v98_nh_2025_independent_fill_oracle.py --training-root ../../official-input --validation-root ../../validation-input --ledger-jsonl v98_nh_2025_base_full_hourly_forensic.jsonl --output v98_nh_2025_independent_fill_receipt.json
          else
            echo "No complete 2025 ledger: no source-to-fill attestation."
          fi
      - name: Independent 30-cell 2025 cost and economic decision replay
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s v98_nh_2025_30cell_receipt.json; then
            python v98_nh_2025_independent_arithmetic.py --receipt v98_nh_2025_30cell_receipt.json --output v98_nh_2025_independent_arithmetic_receipt.json
          else
            echo "No 2025 original receipt: no arithmetic attestation."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-nh-2025-sealed-validation-${{ github.run_id }}
          path: |
            research/v98_independent/v98_nh_2025_30cell_receipt.json
            research/v98_independent/v98_nh_2025_base_full_hourly_forensic.jsonl
            research/v98_independent/v98_nh_2025_independent_accounting_receipt.json
            research/v98_independent/v98_nh_2025_independent_fill_receipt.json
            research/v98_independent/v98_nh_2025_independent_arithmetic_receipt.json
          retention-days: 30
          if-no-files-found: warn
