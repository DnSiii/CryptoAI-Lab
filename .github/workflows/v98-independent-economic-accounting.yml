name: V98 Independent Economic Accounting Contract
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase243_economic_accounting.py'
      - 'research/v98_independent/test_phase243_economic_accounting.py'
      - 'research/v98_independent/phase243_strict_historical_accounting_run.py'
      - 'research/v98_independent/test_phase243_strict_historical_accounting_run.py'
      - 'research/v98_independent/v98_causal_compound_sizing.py'
      - 'research/v98_independent/test_v98_causal_compound_sizing.py'
      - 'research/v98_independent/v98_causal_target_execution_bridge.py'
      - 'research/v98_independent/test_v98_causal_target_execution_bridge.py'
      - 'research/v98_independent/v98_sevenslot_weight_to_targets.py'
      - 'research/v98_independent/test_v98_sevenslot_weight_to_targets.py'
      - 'research/v98_independent/v98_seven_slot_economic_replay.py'
      - 'research/v98_independent/test_v98_seven_slot_economic_replay.py'
      - 'research/v98_independent/v98_phase243_training_reader.py'
      - 'research/v98_independent/test_v98_phase243_training_reader.py'
      - '.github/workflows/v98-independent-economic-accounting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economic-accounting-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate V98 cost and funding accounting (not historical strategy validation)
        run: python -m unittest research/v98_independent/test_phase243_economic_accounting.py research/v98_independent/test_phase243_strict_historical_accounting_run.py research/v98_independent/test_v98_causal_target_execution_bridge.py research/v98_independent/test_v98_sevenslot_weight_to_targets.py research/v98_independent/test_v98_seven_slot_economic_replay.py research/v98_independent/test_v98_phase243_training_reader.py research/v98_independent/test_v98_causal_compound_sizing.py -v
