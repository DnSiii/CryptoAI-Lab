name: V99 five-variant research paper refresh

on:
  workflow_run:
    workflows: ["CryptoAI multi-engine paper refresh"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v99-research-paper.yml"

permissions:
  contents: write

concurrency:
  group: cryptoai-v99-research-paper
  cancel-in-progress: true

jobs:
  paper:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out V99 research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-

      - name: Install research package
        run: python -m pip install -e ".[dev]"

      - name: Restore shared universe and V99 research paper boundary
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin paper-results >/dev/null 2>&1; then
            git fetch --no-tags origin paper-results
            for path in \
              state/paper_v15_universe.json \
              state/paper_v99_research_state.json; do
              if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
                mkdir -p "$(dirname "$path")"
                git show "FETCH_HEAD:$path" > "$path"
              fi
            done
          fi

      - name: Synchronize official public market data
        run: |
          python scripts/sync_paper_data_v13.py
          python scripts/sync_paper_data_v15.py

      - name: Run five V99 variants in full forward paper mode
        run: python scripts/paper_once_v99_research_variants_v2.py

      - name: Verify paper isolation, shared boundary and full dashboard series
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s=json.loads(Path('state/paper_v99_research_state.json').read_text())
          l=json.loads(Path('reports/paper_v99_research_ledger.json').read_text())
          expected={'r98','f1','f3','f7','f12'}
          assert s['mode']=='PAPER_ONLY' and s['real_orders_enabled'] is False
          assert l['mode']=='PAPER_ONLY' and l['real_orders_enabled'] is False
          assert int(l.get('schema_version', 0)) >= 2
          assert set(l['variants'])==expected
          assert set(l['backtest_reference'])==expected
          boundary=l['paper_start_after_timestamp']
          for key,item in l['variants'].items():
              assert item['paper_start_after_timestamp']==boundary, (key,item['paper_start_after_timestamp'],boundary)
              assert item['real_orders_enabled'] is False
              assert isinstance(item.get('equity_curve'), list) and item['equity_curve'], key
              assert isinstance(item.get('operations'), list), key
          for key,item in l['backtest_reference'].items():
              assert isinstance(item.get('curve'), list) and len(item['curve']) >= 30, (key, len(item.get('curve', [])))
          assert l['same_boundary_for_all_variants'] is True
          print('V99 full research paper/dashboard series verification passed')
          PY

      - name: Upload V99 research paper audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v99-research-paper-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            state/paper_v99_research_state.json
            reports/paper_v99_research_snapshot.json
            reports/paper_v99_research_ledger.json

      - name: Publish durable V99 research paper results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          results_dir="$RUNNER_TEMP/paper-results-v99-research"
          git fetch --no-tags origin paper-results
          git worktree add --detach "$results_dir" FETCH_HEAD
          git -C "$results_dir" switch -C paper-results
          mkdir -p "$results_dir/state" "$results_dir/reports"
          cp state/paper_v99_research_state.json "$results_dir/state/paper_v99_research_state.json"
          cp reports/paper_v99_research_snapshot.json "$results_dir/reports/paper_v99_research_snapshot.json"
          cp reports/paper_v99_research_ledger.json "$results_dir/reports/paper_v99_research_ledger.json"
          git -C "$results_dir" add \
            state/paper_v99_research_state.json \
            reports/paper_v99_research_snapshot.json \
            reports/paper_v99_research_ledger.json
          if ! git -C "$results_dir" diff --cached --quiet; then
            git -C "$results_dir" commit -m "Update V99 research paper snapshot ${{ steps.utc.outputs.date }}"
            git -C "$results_dir" push origin HEAD:paper-results
          fi
