name: V98 Independent Staged Exit Native Source Capacity Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-staged-capacity-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Fetch pinned native Clean4 training-only source
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original authenticated training source
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Source-only physical capacity and source-pin audit (no PnL)
        working-directory: research/v98_independent
        run: |
          python v98_staged_exit_source_capacity_probe.py --output capacity_${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v98-staged-source-${{ matrix.os }}
          path: research/v98_independent/capacity_${{ matrix.os }}.json
          retention-days: 30
  reconcile:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v98-staged-source-*
          path: receipts
      - name: Independently reconcile two OS capacity receipts
        run: |
          python - <<'PY'
          import json,glob
          files=sorted(glob.glob('receipts/*/*.json'))
          assert len(files)==2,files
          a,b=(json.load(open(x)) for x in files)
          assert a==b,'V98_STAGED_SOURCE_CROSS_OS_MISMATCH'
          assert a['no_pnl'] and not a['validation_2025_read']
          print('V98_STAGED_SOURCE_CROSS_OS_REPRODUCIBLE_NOT_ECONOMIC')
          print(json.dumps(a['years'],sort_keys=True))
          PY
