name: V99 R106 protected forward/backtest isolation

on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'scripts/paper_once_v99_research_variants_v2.py'
      - 'research/tests/test_v99_r106_forward_generator_isolation.py'
      - 'research/tests/test_v99_r106_runner_integration.py'
      - 'research/tools/v99_r106_published_epoch_witness.py'
      - 'research/tests/test_v99_r106_published_epoch_witness.py'
      - '.github/workflows/v99-r106-forward-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v99-r106-forward-isolation
  cancel-in-progress: false

jobs:
  fail-closed-paper-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout read-only V99 research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only numerical test dependency (no exchange credentials)
        run: python -m pip install pandas==2.2.3
      - name: Run protected forward/backtest and operation-history invariants
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_forward_generator_isolation.py' -v
      - name: Run actual five-variant runner with isolated synthetic inputs
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_runner_integration.py' -v
      - name: Re-run immutable V99 research publication guard tests
        run: python -m unittest discover -s tests -p 'test_v99_phase195bj_paper_publication_guard.py' -v
      - name: Re-run five-variant research epoch quarantine tests
        run: python -m unittest discover -s research/tests -p 'test_v99_phase195gb_paper_epoch_audit.py' -v

      - name: Run published-epoch witness invariants
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_published_epoch_witness.py' -v
      - name: Retrieve immutable published R106 paper ledger (read-only)
        shell: bash
        run: |
          git fetch --no-tags origin paper-results
          mkdir -p research_evidence
          git show FETCH_HEAD:reports/paper_v99_research_ledger.json > research_evidence/published_ledger.json
          sha256sum research_evidence/published_ledger.json > research_evidence/published_raw_sha256.txt
      - name: Audit current published paper without publication or tuning
        shell: bash
        run: |
          python -m research.tools.v99_r106_published_epoch_witness \
            --ledger research_evidence/published_ledger.json \
            --output research_evidence/published_witness.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('research_evidence/published_witness.json').read_text())
          assert report['promotion_authorized'] is False
          assert report['publication_authorized'] is False
          assert report['independent_exchange_receipts_authenticated'] is False
          print('Observed published evidence:',report['status'],report['published_last_utc'])
          PY
      - name: Archive read-only signed evidence (never the entire ledger)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-published-epoch-audit
          retention-days: 21
          if-no-files-found: error
          path: |
            research_evidence/published_witness.json
            research_evidence/published_raw_sha256.txt
