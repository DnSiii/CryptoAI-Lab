name: V98 Independent Phase1030 P Canonical 90-Cell Economic Preflight ONLY
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - .github/workflows/v98-independent-phase1030-p-preflight.yml
      - research/v98_independent/phase1027_p_funded_ledger_hourly.py
      - research/v98_independent/phase1029_p_training_gate.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v98-independent-phase1030-p-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p-preflight:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Test P 90-cell growth decision firewall without historical PnL
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1029_p_training_gate_contract.py
      - name: Authenticate fresh 100 OHLC, 100 mark, 100 funding and P five frozen target pins
        working-directory: research/v98_independent
        run: python phase1029_p_training_gate.py
      - name: Preserve P preflight receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase1030-p-preflight-receipts
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1000_four_asset_source_policy_receipt.json
            research/v98_independent/phase1029_p_training_gate_result.json
