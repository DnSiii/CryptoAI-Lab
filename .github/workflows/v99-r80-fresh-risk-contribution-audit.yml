name: CryptoAI V99 R80 fresh risk contribution audit
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r80-fresh-risk-contribution-audit]
    paths:
      - "scripts/run_v99_r80_fresh_risk_contribution_audit.py"
      - "scripts/run_v99_r62_asset_damage_precursor_audit.py"
      - "scripts/run_v99_r75_hedged_recovery_alpha.py"
      - ".github/workflows/v99-r80-fresh-risk-contribution-audit.yml"
permissions:
  contents: write
concurrency:
  group: v99-r80-fresh-risk-contribution-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-
      - name: Install package
        run: python -m pip install -e "."
      - name: Restore published replay state
        shell: bash
        run: |
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v13.json reports/paper_data_sync_v15.json; do
            git cat-file -e "FETCH_HEAD:$path" || exit 1
            mkdir -p "$(dirname "$path")"
            git show "FETCH_HEAD:$path" > "$path"
          done
      - name: Prepare frozen V15 replay inputs
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Run V99 R80 fresh risk contribution audit
        run: python scripts/run_v99_r80_fresh_risk_contribution_audit.py
      - name: Upload V99 R80 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r80-fresh-risk-contribution-audit-${{ github.run_id }}
          retention-days: 60
          path: reports/v99_r80_fresh_risk_contribution_audit.json
      - name: Persist V99 R80 report
        shell: bash
        run: |
          test -f reports/v99_r80_fresh_risk_contribution_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v99_r80_fresh_risk_contribution_audit.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "Persist V99 R80 fresh risk contribution audit"
            git push origin HEAD:research/v99-r80-fresh-risk-contribution-audit
          fi
