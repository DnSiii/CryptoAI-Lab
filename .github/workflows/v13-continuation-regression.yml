name: V13 continuation raw notional regression
on:
  push:
    branches:
      - fix/v13-continuation-raw-notional-scaling
  pull_request:
    paths:
      - 'scripts/paper_continuation.py'
      - 'tests/test_paper_continuation_raw_notional.py'
      - '.github/workflows/v13-continuation-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-notional-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run adversarial raw-notional tests
        run: python -m unittest discover -s tests -p 'test_paper_continuation_raw_notional.py' -v
