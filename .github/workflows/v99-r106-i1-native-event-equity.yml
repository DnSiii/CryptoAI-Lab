name: V99 I1 native event-to-661d TRAIN equity (uncertified source)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_native_event_equity.py
      - research/tests/test_v99_r106_i1_native_event_equity.py
      - .github/workflows/v99-r106-i1-native-event-equity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-event-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ex-ante preregistration commit is ancestor
        run: |
          git merge-base --is-ancestor 76f68a0013ee1b667efd92bf32e2d23f62c57cf6 HEAD
          test -s research/V99_R106_I1_NATIVE_EVENT_TO_661D_EQUITY_PREREG_20261028.md
      - name: Execute 661d dual-scenario event replay and independent native cash identity controls
        run: python -m unittest -v research.tests.test_v99_r106_i1_native_event_equity
      - name: Confirm historical certification still blocked
        run: |
          python - <<'PY'
          from research.tests.test_v99_r106_i1_native_event_equity import flat_fixture, complete_fixed_decisions
          from research.tools.v99_r106_i1_native_event_equity import replay
          from research.tools.v99_r106_i1_train_numeric_gate import evaluate
          data=flat_fixture()
          data['fixture']=False
          try:
              replay(data)
          except ValueError as exc:
              assert str(exc)=='MISSING_COMPLETE_FIXED_180_DECISION_LEDGER'
          else:
              raise AssertionError('MISSING_180_DECISION_LEDGER_BYPASS')
          data['decisions']=complete_fixed_decisions()
          result=replay(data)
          assert result['status']=='PROVISIONAL_UNCERTIFIED_NATIVE_EVENT_EQUITY'
          assert result['original_options_economic_train_certified'] is False
          assert result['promotion_authorized'] is False
          try:
              evaluate(result)
          except ValueError as exc:
              assert str(exc)=='ORIGINAL_ECONOMIC_SOURCE_PROVENANCE_NOT_CERTIFIED'
              print('BLOCKED_ORIGINAL_ECONOMIC_SOURCE_PROVENANCE_NOT_CERTIFIED')
              print('0/180 original options economic lifecycles certified; NO PROMOTION/ORDERS')
          else:
              raise AssertionError('NONFIXTURE_NUMERIC_GATE_BYPASS')
          PY
