name: V98 Independent Exact Funding Mark Authorized Ingest Readiness No PnL
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-authorized-exact-mark-readiness.yml'
      - 'research/v98_independent/v98_authorized_funding_mark_ingest.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-bridge dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile and test offline exact-mark parser with synthetic fixture
        run: |
          python -m py_compile research/v98_independent/v98_authorized_funding_mark_ingest.py
          python research/v98_independent/v98_authorized_funding_mark_ingest.py --self-test
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected
      - name: Independently generate strict native funding event expectation from SHA-pinned Clean-4 source
        working-directory: research/v98_independent
        env:
          OLD_ROOT: ${{ runner.temp }}/old
          OLD_ENVELOPE: ${{ runner.temp }}/old-envelope/v98_official_mark_envelope_training.csv
          NEW_ROOT: ${{ runner.temp }}/new
          CORRECTED_ROOT: ${{ runner.temp }}/corrected
        run: |
          python v98_authorized_funding_mark_ingest.py --export-native \
            --old-root "$OLD_ROOT" --old-envelope "$OLD_ENVELOPE" \
            --new-root "$NEW_ROOT" --corrected-root "$CORRECTED_ROOT" \
            --output v98_native_expected_funding_2022_2025.csv
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path("v98_native_expected_funding_2022_2025.csv")
          rows=list(csv.DictReader(p.open()))
          assert len(rows)==13524
          assert len({(r["asset"],r["fundingTime"]) for r in rows})==13524
          receipt={"decision":"PASS_NATIVE_RATE_EXPECTATION_ONLY_EXACT_MARK_ORIGIN_STILL_MISSING",
                   "rows":len(rows),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                   "pnl_computed":False,"2026_data_accessed":False,
                   "exact_mark_evidence_present":False,
                   "remaining_requirement":"Authorized raw exchange-origin /fapi/v1/fundingRate pages with markPrice, response headers, independent custody attestation."}
          Path("v98_native_mark_ingest_readiness_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v98-independent-authorized-mark-ingest-readiness-no-pnl
          path: |
            research/v98_independent/v98_native_expected_funding_2022_2025.csv
            research/v98_independent/v98_native_mark_ingest_readiness_receipt.json
          if-no-files-found: error
          retention-days: 30
