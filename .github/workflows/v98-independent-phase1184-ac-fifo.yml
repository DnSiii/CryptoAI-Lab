name: V98 Independent Phase1184 AC FIFO Tradebook Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1184_ac_fifo_tradebook.py'
      - 'research/v98_independent/test_phase1184_ac_fifo_tradebook.py'
      - '.github/workflows/v98-independent-phase1184-ac-fifo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ac-fifo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC runtime
        run: python -m pip install numpy==1.26.4
      - name: Test independent signed FIFO funding and self-financing trade metrics
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1184_ac_fifo_tradebook.py' -v
