name: V98 Independent Phase1257 AJ Wealth Allocator and Open Governor
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1257-aj-allocation-risk.yml'
  workflow_dispatch:
jobs:
  aj-risk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Run 13 preregistered AJ wealth and governor tests
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1256_1257_aj_allocator_governor
