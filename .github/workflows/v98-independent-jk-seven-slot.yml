name: V98 Independent JK Online Marginal Router Seven Slot 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-jk-seven-slot.yml'
      - 'research/v98_independent/jk_online_marginal_router_prereg_20261028.md'
      - 'research/v98_independent/jk_online_marginal_router_sources.py'
      - 'research/v98_independent/jk_source_viability.py'
      - 'research/v98_independent/jk_30cell.py'
      - 'research/v98_independent/jk_reconcile_30cell.py'
      - 'research/v98_independent/jk_independent_ledger_replay.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned training data only (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact authenticated Clean-4 source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: JK online marginal router source viability
        working-directory: research/v98_independent
        run: |
          python -m py_compile hw_spot_perp_basis_loader.py jk_online_marginal_router_sources.py jk_source_viability.py jk_30cell.py jk_reconcile_30cell.py
          python jk_online_marginal_router_sources.py
          python jk_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jk-source-viability
          path: research/v98_independent/jk_source_viability.json
          retention-days: 30
          if-no-files-found: warn
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [JK_core_only, JK_full, JK_minus_opportunity, JK_minus_RV, JK_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Run native 6-cell path USD10k, base/severe/supersevere and both funding orders
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python jk_30cell.py --path ${{ matrix.path }} --output jk30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s jk30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jk30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/jk30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jk30-ubuntu-*
          path: receipts
      - name: Independent artifact-only 30-cell cross-OS and marginal gate
        shell: bash
        run: python research/v98_independent/jk_reconcile_30cell.py --root receipts --output jk30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jk30-official-economic-summary
          path: jk30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [JK_core_only, JK_full, JK_minus_opportunity, JK_minus_RV, JK_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding, NAV, fee, slippage and 81-corner settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py jk_independent_ledger_replay.py
          python jk_independent_ledger_replay.py --path ${{ matrix.path }} --output jk_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jk-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/jk_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
