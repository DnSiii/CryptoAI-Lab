name: V99 I1 native coin portfolio accounting oracle (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_native_coin_account_replay.py
      - research/verification/independent_v99_r106_i1_native_coin_account_oracle.py
      - research/tests/test_v99_r106_i1_native_coin_account_replay.py
      - .github/workflows/v99-r106-i1-native-coin-account-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-coin-model-integrity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run independent two-position native-coin replay and adversarial tests
        run: python -m unittest research.tests.test_v99_r106_i1_native_coin_account_replay -v
      - name: Independently reexecute both scenario cash journals and explicitly veto economic promotion
        run: |
          python - <<'PY'
          from research.tests.test_v99_r106_i1_native_coin_account_replay import exercise
          from research.verification.independent_v99_r106_i1_native_coin_account_oracle import audit
          for scenario in ("severe","supersevere"):
              trace, observed, wallet = exercise(scenario)
              proof = audit(trace, observed)
              assert proof["events"] == 7 and proof["snapshots"] == 1
              assert not proof["historical_economic_train"] and not proof["promotion_authorized"]
              assert wallet.reserved_coin == 0 and len(wallet.settled) == 2
              print("INDEPENDENT_SYNTHETIC_COIN_JOURNAL", scenario, proof)
          print("SOURCE_ONLY/HOLD — NO AUTHENTICATED FULL OPTIONS LIFECYCLE")
          print("NO HISTORICAL ECONOMIC TRAIN, NO ROI, NO ORDERS, NO PROMOTION")
          PY
