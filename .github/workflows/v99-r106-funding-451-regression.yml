name: V99 R106 funding 451 fail-fast regression (SOURCE ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_binance_funding_api_clock_binding.py'
      - 'research/verification/independent_v99_r106_binance_funding_api_clock_oracle.py'
      - 'tests/test_v99_r106_funding_api_451_failfast.py'
      - '.github/workflows/v99-r106-funding-451-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-451-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce preregistration ancestry
        run: git merge-base --is-ancestor 2d20a4c95fdcd47ecc1be3b5262f2c9f585aad43 HEAD
      - name: Compile and execute five source-blocker regression tests
        run: |
          python -m py_compile research/tools/v99_r106_binance_funding_api_clock_binding.py research/verification/independent_v99_r106_binance_funding_api_clock_oracle.py
          python -m unittest discover -s tests -p 'test_v99_r106_funding_api_451_failfast.py' -v
      - name: Explicit non-economic status
        run: echo 'SOURCE_ONLY_451_REGRESSION; NO_MARKET_EXECUTION; NO_ECONOMICS; NO_PROMOTION'
