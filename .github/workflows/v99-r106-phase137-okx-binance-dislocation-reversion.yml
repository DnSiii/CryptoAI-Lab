name: V99 R106 Phase137 cross-venue dislocation reversion train alpha
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'scripts/run_v99_r106_phase137_okx_binance_dislocation_reversion_train_alpha.py'
      - '.github/workflows/v99-r106-phase137-okx-binance-dislocation-reversion.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: v99-r106-phase137-crossvenue-reversion, cancel-in-progress: false}
jobs:
  train-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1", RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - id: cache_date
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: Linux-paper-v15-market-v1-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - run: python -m pip install -e ".[dev]"
      - name: Restore canonical V15 state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v15.json; do
            git cat-file -e "FETCH_HEAD:$path"
            mkdir -p "$(dirname "$path")"
            git show "FETCH_HEAD:$path" > "$path"
          done
      - name: Prepare canonical V15 replay
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Verify exact-MAD implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/run_v99_r106_phase137_okx_binance_dislocation_reversion_train_alpha.py').read_text()
          assert 'mad=rolling_exact_mad(spread,LOOKBACK)' in s
          assert 'np.median(np.abs(x-np.median(x)))' in s
          assert 'dev.abs().rolling(LOOKBACK' not in s
          PY
      - name: Snapshot frozen assets
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          files=sorted({p for pat in ('*v16*frozen*','*v99*frozen*') for p in pathlib.Path('.').rglob(pat) if p.is_file() and '.git' not in p.parts})
          pathlib.Path('/tmp/frozen_before.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},sort_keys=True))
          PY
      - name: Run Phase137 exact-MAD corrected train-only gate
        run: python scripts/run_v99_r106_phase137_okx_binance_dislocation_reversion_train_alpha.py
      - name: Verify frozen assets and prereg contract
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          before_path=pathlib.Path('/tmp/frozen_before.json');assert before_path.exists(),'Frozen snapshot missing'
          before=json.loads(before_path.read_text());after={x:hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest() for x in before};assert before==after,'Frozen asset mutation detected'
          p=pathlib.Path('reports/candidate_v99_r106_phase137_okx_binance_dislocation_reversion_train_alpha.json');assert p.exists(),'Phase137 report missing'
          r=json.loads(p.read_text());pc=r['precommitment'];si=r['source_integrity'];ci=r['causality_invariants']
          assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen'];assert pc['single_hypothesis_no_grid'] and pc['no_sign_flip'] and pc['no_symbol_substitution']
          assert pc['lookback_hours']==168 and abs(pc['alpha_gross']-.20)<1e-12;assert pc['mad_definition']=='median(abs(window - median(window))) on the same 168h spread window'
          assert pc['holdout_rows_used_for_feature_construction']==0 and pc['holdout_rows_used_for_selection']==0;assert si['all_phase136_hashes_reproduced'] is True
          assert ci['complete_score_shift_hours']==1 and ci['feature_inputs_strictly_pre_train_end'] and ci['post_train_targets_zero'];assert r['status'] in ('TRAIN_ALPHA_PASS_FREEZE_FOR_DOWNSTREAM','TRAIN_ALPHA_REJECT')
          PY
      - name: Persist evidence
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase137_okx_binance_dislocation_reversion_train_alpha.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 Phase137 exact-MAD corrected train gate"
          git fetch origin ${RESEARCH_BRANCH}
          git rebase origin/${RESEARCH_BRANCH}
          git push origin HEAD:${RESEARCH_BRANCH}
