name: V99 R106 Phase148 Cross-Venue Body-Range Ratio TRAIN Alpha
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'scripts/run_v99_r106_phase148_crossvenue_body_range_ratio_train_alpha.py'
      - '.github/workflows/v99-r106-phase148-crossvenue-body-range-ratio-train-alpha.yml'
permissions:
  contents: write
concurrency: {group: v99-r106-phase148-crossvenue-body-range-ratio-train-alpha, cancel-in-progress: false}
jobs:
  train-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1", RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - id: cache_date
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: Linux-paper-v15-market-v1-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - run: python -m pip install -e ".[dev]"
      - name: Restore canonical V15 state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v15.json; do git cat-file -e "FETCH_HEAD:$path"; mkdir -p "$(dirname "$path")"; git show "FETCH_HEAD:$path" > "$path"; done
      - name: Prepare canonical V15 replay
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Assert preregistered frozen contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_v99_r106_phase148_crossvenue_body_range_ratio_train_alpha.py').read_text(); q=Path('docs/v99_r106_phase148_crossvenue_body_range_ratio_divergence_preregister.md').read_text()
          assert "LOOKBACK=168" in p and "score=(-centered).shift(1)" in p
          assert 'direction: reversion' in q and 'four chronological temporal folds' in q and '>=98%' in q
          assert "'holdout_rows_used_for_feature_construction':0" in p and "'no_sign_flip':True" in p and "'zero_range_missing':True" in p
          assert 'br[valid]=(c[valid]-o[valid])/rng[valid]' in p and 'bin_br=((bc-bo)/rng).where(valid)' in p
          print('Phase148 frozen contract PASS')
          PY
      - name: Run Phase148 TRAIN alpha and folds
        run: python scripts/run_v99_r106_phase148_crossvenue_body_range_ratio_train_alpha.py
      - name: Verify invariants
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/candidate_v99_r106_phase148_crossvenue_body_range_ratio_train_alpha.json'))
          assert x['frozen_assets_untouched']=={'v16':True,'v99_frozen':True}
          assert x['precommitment']['holdout_rows_used_for_feature_construction']==0 and x['precommitment']['holdout_rows_used_for_selection']==0
          assert x['causality_invariants']['complete_score_shift_hours']==1 and x['causality_invariants']['post_train_targets_zero'] is True
          assert x['causality_invariants']['max_l1']<=1.000000001 and x['diagnostic']['valid_folds']==4
          assert x['source_integrity']['all_phase136_hashes_reproduced'] is True and x['source_integrity']['imputation'] is False
          print(x['status'],x['diagnostic']['healthy_folds'])
          PY
      - name: Commit TRAIN evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/candidate_v99_r106_phase148_crossvenue_body_range_ratio_train_alpha.json
          git diff --cached --quiet || git commit -m 'Record V99 R106 Phase148 body-range ratio TRAIN gate'
          git pull --rebase origin research/v99-r106-native-all-regime-engine
          git push origin HEAD:research/v99-r106-native-all-regime-engine
