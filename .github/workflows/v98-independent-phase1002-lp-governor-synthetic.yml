name: V98 Independent Phase1002 LP Governor Synthetic Validation
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - .github/workflows/v98-independent-phase1002-lp-governor-synthetic.yml
      - research/v98_independent/phase1002_lp_opening_repair.py
      - research/v98_independent/test_phase1002_lp_opening_repair.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v98-independent-phase1002-lp-synthetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lp-source-only:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical solver
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1'
      - name: Exact LP witnesses and 12000 synthetic stress states
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1002_lp_opening_repair.py
