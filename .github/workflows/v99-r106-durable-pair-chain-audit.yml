name: V99 R106 durable paired-source chain DATA_ONLY
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_durable_pair_chain_audit.py'
      - 'research/tools/v99_r106_durable_run_attestation.py'
      - 'research/tests/test_v99_r106_durable_run_attestation.py'
      - 'research/tests/test_v99_r106_durable_pair_chain_audit.py'
      - '.github/workflows/v99-r106-durable-pair-chain-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-durable-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout durable source branch independently read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-live-receipts
          path: durable_receipts
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Adversarial synthetic verification
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_durable_pair_chain_audit.py' -v
      - name: Verify entire durable original-byte receipt chain
        run: |
          python -m research.tools.v99_r106_durable_pair_chain_audit \
            --root durable_receipts \
            --out research_evidence/durable_pair_chain.json
      - name: Verify original GitHub Actions runs and archived artifacts read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s research/tests -p 'test_v99_r106_durable_run_attestation.py' -v
          python -m research.tools.v99_r106_durable_run_attestation \
            --report research_evidence/durable_pair_chain.json \
            --repository "$GITHUB_REPOSITORY" \
            --out research_evidence/durable_run_attestation.json
      - name: Enforce zero economic experiments and no frozen or holdout usage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_evidence/durable_pair_chain.json').read_text())
          assert r['schema']=='V99_R106_DURABLE_PAIRED_SOURCE_CHAIN_V1'
          assert r['economic_trials']==0
          assert r['minimum_two_consecutive_atomic_hours_authenticated'] is False
          assert r['longest_same_run_claimed_continuity_streak_hours'] <= r['paired_hours']
          print('Claimed same-run source streak (NOT authenticated):',
                r['longest_same_run_claimed_continuity_streak_hours'])
          for f in ('paper_publication_authorized','promotion_authorized',
                    'holdout_accessed','real_orders_enabled','cross_venue_economic_transfer_authorized'):
              assert r[f] is False
          print('VALIDATED_DATA_ONLY',r['status'],'paired=',r['paired_hours'],
                'missing=',len(r['missing_paired_hours']),
                'adjacent=',r['verified_adjacent_links'])
          PY
      - name: Archive DATA_ONLY evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-durable-chain-audit
          retention-days: 90
          path: |
            research_evidence/durable_pair_chain.json
            research_evidence/durable_run_attestation.json
          if-no-files-found: error
