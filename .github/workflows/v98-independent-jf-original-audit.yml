name: V98 Independent JF Original Receipt Second Economic Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-jf-original-audit.yml'
      - 'research/v98_independent/jf_original_artifact_independent_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  independent-original-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download all ten original 2023-2024 JF book artifacts from immutable source run
        uses: actions/download-artifact@v4
        with:
          pattern: je30-ubuntu-*
          run-id: 40623130201
          github-token: ${{ github.token }}
          path: jf-original-receipts
      - name: Independently recompute all 60 original physical receipts, chronology, costs, source SHA and marginal growth
        shell: bash
        run: |
          python -m py_compile research/v98_independent/jf_original_artifact_independent_audit.py
          python research/v98_independent/jf_original_artifact_independent_audit.py --root jf-original-receipts --output jf_second_independent_original_receipt_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jf-second-independent-original-receipt-audit
          path: jf_second_independent_original_receipt_audit.json
          retention-days: 30
          if-no-files-found: warn
