name: V98 Independent Phase162
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'scripts/v98_independent_phase162_nfci_activation_audit.py'
      - '.github/workflows/v98-independent-phase162.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase162
  cancel-in-progress: false
jobs:
  data-only-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install numpy
      - name: Deterministic activation audit
        run: |
          python scripts/v98_independent_phase162_nfci_activation_audit.py > /tmp/a.json
          cp reports/v98_independent_phase162_nfci_activation_audit.json /tmp/report_a.json
          python scripts/v98_independent_phase162_nfci_activation_audit.py > /tmp/b.json
          cmp /tmp/report_a.json reports/v98_independent_phase162_nfci_activation_audit.json
      - name: Enforce firewall and invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/v98_independent_phase162_nfci_activation_audit.json'))
          assert p['phase']=='162' and p['kind']=='DATA_ONLY_DIAGNOSTIC'
          assert p['reacquisition_hash_verified'] and p['economic_firewall']
          assert p['validation'] is None and p['final_holdout'] is None
          assert not p['v16_used'] and not p['v99_used']
          assert p['positive_count']+p['zero_count']+p['negative_count']==p['observations']
          PY
      - name: Commit Phase162 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/v98_independent_phase162_nfci_activation_audit.json
          if git diff --cached --quiet; then echo no-evidence-change; else git commit -m 'v98: record phase162 NFCI activation audit'; git pull --rebase --autostash origin research/v98-independent-zero; git push origin HEAD:research/v98-independent-zero; fi
