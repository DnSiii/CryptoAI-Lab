name: V98 Independent Phase1003 Common Intrabar Forensic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - .github/workflows/v98-independent-phase1003-common-intrabar-forensic.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v98-independent-phase1003-intrabar-forensic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forensic:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned frozen target and source runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Source-only static risk geometry regression
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1003_common_intrabar_forensic.py
      - name: Fresh 100 OHLC ZIPs then ex-post frozen target/corner diagnostic only
        working-directory: research/v98_independent
        run: python phase1003_common_intrabar_forensic.py
      - name: Preserve source-only forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase1003-common-intrabar-source-only
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1003_common_intrabar_forensic_result.json
