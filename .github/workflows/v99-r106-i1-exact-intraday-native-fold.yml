name: V99 I1 exact intraday native fold accounting (synthetic only)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_native_event_equity.py
      - research/tools/v99_r106_i1_train_numeric_gate.py
      - research/verification/independent_v99_r106_i1_train_numeric_oracle.py
      - research/tests/test_v99_r106_i1_exact_fold_event_replay.py
      - .github/workflows/v99-r106-i1-exact-intraday-native-fold.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-fold-native-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce preregistration ancestry and immutable partitions
        run: |
          git merge-base --is-ancestor 015c4924ad728b5d0edcfe46c123e5405c03d6a7 HEAD
          test -s research/V99_R106_I1_INTRADAY_EVENT_FOLD_REPLAY_PREREG_20261029.md
      - name: Replay synthetic 661-day native accounting, exact folds and independent oracle
        run: |
          python -m unittest -v research.tests.test_v99_r106_i1_exact_fold_event_replay research.tests.test_v99_r106_i1_native_event_equity research.tests.test_v99_r106_i1_train_numeric_gate
      - name: Prohibit original economic certification and promotion
        run: |
          python - <<'PY'
          from research.tests.test_v99_r106_i1_exact_fold_event_replay import edge_fixture
          from research.tools.v99_r106_i1_native_event_equity import replay
          from research.tools.v99_r106_i1_train_numeric_gate import evaluate
          x = evaluate(replay(edge_fixture()))
          assert x['exact_chronological_fold_gate_evaluable'] is True
          assert x['exact_chronological_fold_gate_pass'] is False
          assert x['formal_numeric_train_pass_both_scenarios'] is False
          assert x['promotion_authorized'] is False
          assert x['original_options_economic_train_certified'] is False
          print('EXACT_FOLD_ACCOUNTING_SYNTHETIC_ONLY; 0/180 ORIGINAL ECONOMIC LIFECYCLES; NO PROMOTION')
          PY
