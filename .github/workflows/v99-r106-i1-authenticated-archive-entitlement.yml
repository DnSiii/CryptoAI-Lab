name: V99 I1 authenticated 2021-23 options archive entitlement (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research_tools/v99_r106_tardis_authenticated_scope.py
      - research/tests/test_v99_r106_tardis_authenticated_scope.py
      - .github/workflows/v99-r106-i1-authenticated-archive-entitlement.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-options-entitlement-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify negative controls and bounded requests without network
        run: python -m unittest research.tests.test_v99_r106_tardis_authenticated_scope -v
      - name: Read-only authenticated historical non-sample dates (max two bytes each; HTTP 206 + gzip)
        env:
          TARDIS_API_KEY: ${{ secrets.TARDIS_API_KEY }}
        run: python research_tools/v99_r106_tardis_authenticated_scope.py
      - name: Upload redacted scope only, not licensed data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v99-i1-authenticated-archive-entitlement-${{ github.run_id }}
          path: tardis_quote_probe/authenticated_scope_probe.json
          if-no-files-found: warn
          retention-days: 30
