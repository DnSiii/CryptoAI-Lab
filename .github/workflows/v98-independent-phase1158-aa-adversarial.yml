name: V98 Independent Phase1158 AA Adversarial Exit Liquidity
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1156_aa_exit_reserve_governor.py'
      - 'research/v98_independent/phase1158_aa_adversarial_oracle.py'
      - '.github/workflows/v98-independent-phase1158-aa-adversarial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aa-adversarial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4
      - name: 5000 deterministic AA liquidity risk corners
        run: python research/v98_independent/phase1158_aa_adversarial_oracle.py
