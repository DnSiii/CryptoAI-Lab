name: V98 Independent AK Frozen 90-Cell Chronological Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ak-90cell-training.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [AK_core_only, AK_full, AK_minus_opportunity, AK_minus_RV, AK_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve pinned independently vendor-attested 2023-24 Clean4
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute frozen AK path x18 historical economic cells
        working-directory: research/v98_independent
        run: |
          python ak_slow_compound_90cell.py \
            --path ${{ matrix.path }} \
            --output ak90_${{ matrix.path }}.json || echo 'AK_HISTORICAL_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ak90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/ak90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Enforce explicit 18-cell mechanical survival per path
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          paths=glob.glob('ak90_AK_*.json')
          assert len(paths)==1,paths
          a=json.load(open(paths[0]))
          print('AK_PATH_SURVIVAL',a['path'],sum(x['passed'] for x in a['cells']),'of',len(a['cells']))
          assert len(a['cells'])==18 and all(x['passed'] for x in a['cells'])
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ak90-ubuntu-*
          path: receipts
      - name: Reconcile all 90 historical cells and sleeve marginal wealth
        run: python research/v98_independent/ak_90cell_reconcile.py --root receipts --output ak90_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ak90-official-economic-summary
          path: ak90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
