name: V99 R106 same-hour atomic pair source-only tests
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_atomic_source_pair.py'
      - 'research/tests/test_v99_r106_atomic_source_pair.py'
      - '.github/workflows/v99-r106-atomic-pair-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-no-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test atomic same-hour pair and all existing append-only guards
        run: |
          python -m unittest discover -s research/tests -p 'test_v99_r106_atomic_source_pair.py' -v
          python -m unittest discover -s research/tests -p 'test_v99_r106_receipt_append.py' -v
          python -m unittest discover -s research/tests -p 'test_v99_r106_terms_append.py' -v
      - name: Confirm no paper ledger, holdout or orders required
        run: |
          python - <<'PY'
          from research.tools import v99_r106_atomic_source_pair as pair
          assert pair.verify.__code__.co_argcount == 2
          print('SOURCE DATA ONLY; no economic experiments; synthetic test suite PASS')
          PY
