name: V98 Independent Phase1253 AI Cross OS Source Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1253-ai-crossos-forensics.yml'
  workflow_dispatch:
jobs:
  emit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Emit full signed source arrays on frozen synthetic fixtures
        working-directory: research/v98_independent
        run: python phase1253_ai_crossos_numeric_forensics.py --emit ai1253_source_arrays.json
      - name: Preserve raw independent arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai1253-source-${{ matrix.os }}
          path: research/v98_independent/ai1253_source_arrays.json
          if-no-files-found: error
          retention-days: 30
  compare:
    needs: emit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai1253-source-*
          path: receipts
          merge-multiple: false
      - name: Crossrunner compare every source element without economic changes
        working-directory: research/v98_independent
        run: |
          python phase1253_ai_crossos_numeric_forensics.py --compare \
            ../../receipts/ai1253-source-ubuntu-22.04/ai1253_source_arrays.json \
            ../../receipts/ai1253-source-ubuntu-24.04/ai1253_source_arrays.json \
            --output ai1253_crossos_forensic.json
      - name: Preserve forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai1253-crossos-forensic
          path: research/v98_independent/ai1253_crossos_forensic.json
          if-no-files-found: warn
          retention-days: 30
