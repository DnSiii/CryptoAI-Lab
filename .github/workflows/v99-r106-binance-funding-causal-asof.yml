name: V99 R106 first-party funding causal as-of full TRAIN (SOURCE ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/V99_R106_BINANCE_FUNDING_CAUSAL_ASOF_PREREG_20261030.md'
      - 'research/tools/v99_r106_binance_funding_causal_asof.py'
      - 'research/verification/independent_v99_r106_binance_funding_causal_asof_oracle.py'
      - 'tests/test_v99_r106_binance_funding_causal_asof.py'
      - '.github/workflows/v99-r106-binance-funding-causal-asof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-train-causal-funding-asof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preregistration precedes all implementation
        run: git merge-base --is-ancestor b7eaeb9fd893a1cafc08c1c812beacb362b57d18 HEAD
      - name: Compile and test no-backdating fixtures
        run: |
          python -m py_compile research/tools/v99_r106_binance_funding_causal_asof.py research/verification/independent_v99_r106_binance_funding_causal_asof_oracle.py
          python -m unittest discover -s tests -p 'test_v99_r106_binance_funding_causal_asof.py' -v
      - name: Actually fetch 44 publisher SHA256 archives and compute 15,864 hourly TRAIN as-of decisions per asset
        run: python -m research.tools.v99_r106_binance_funding_causal_asof research_evidence/binance_causal_asof
      - name: Independent raw-byte re-execution of every original event and hourly decision
        run: python -m research.verification.independent_v99_r106_binance_funding_causal_asof_oracle research_evidence/binance_causal_asof
      - name: Assert strict original source hold and NO PROMOTION
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_evidence/binance_causal_asof/binance_funding_causal_asof_source_only.json').read_text())
          assert r['promotion'] is False and r['economics_executed'] is False
          assert r['api_451_unresolved'] is True
          assert r['public_release_time_certified'] is False
          assert r['account_settlement_certified'] is False
          assert r['original_strict_exact_clock_observed_per_asset'] == 821
          for s in ('BTCUSDT','ETHUSDT'):
              x=r['assets'][s]
              assert x['source_train_events'] == 1983
              assert x['source_hourly_decisions'] == 15864
              assert x['nominal_boundary_decisions_current_event_forbidden'] == 1983
          print('ORIGINAL_CAUSAL_ASOF_SOURCE_ONLY; NO_ECONOMICS; NO_PROMOTION')
          PY
      - name: Remove original source ZIP and CHECKSUM bytes before artifact upload
        if: always()
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          p=Path('research_evidence/binance_causal_asof/raw_ephemeral')
          if p.exists(): shutil.rmtree(p)
          print('ORIGINAL_RAW_SOURCE_BYTES_REMOVED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-binance-causal-funding-source-only-${{ github.run_id }}
          path: |
            research_evidence/binance_causal_asof/binance_funding_source_only.json
            research_evidence/binance_causal_asof/binance_funding_causal_asof_source_only.json
          retention-days: 30
          if-no-files-found: warn
