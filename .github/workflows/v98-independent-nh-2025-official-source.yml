name: V98 NH Frozen Candidate Official 2025 Validation Source Acquisition
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-nh-2025-official-source.yml'
      - 'research/v98_independent/v98_nh_2025_official_source_acquire.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nh-2025-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Verify original NH training freeze and no strategy modification
        run: |
          test -f research/v98_independent/nh_frozen_provisional_training_champion_20261030.md
          test -f research/v98_independent/nh_2025_validation_firewall_prereg_20261030.md
          python - <<'PY'
          from pathlib import Path
          p=Path('research/v98_independent/nh_frozen_provisional_training_champion_20261030.md').read_text()
          assert 'a9a2454282c2f97d92a1a58cbcfe305945306ab4' in p
          print('NH_2025_FROZEN_TRAINING_GATE_PRESENT')
          PY
      - name: Download and checksum-verify 144 official Binance USD-M 2025 archives, no PnL
        working-directory: research/v98_independent
        run: python v98_nh_2025_official_source_acquire.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-nh-2025-official-source-${{ github.run_id }}
          path: research/v98_independent/v98_nh_2025_official_source/
          retention-days: 30
          if-no-files-found: warn
