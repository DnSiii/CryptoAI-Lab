name: V99 I1 licensed one-day complete source proof (NO ORDERS, NO RAW UPLOAD)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research_tools/v99_r106_tardis_full_day_source.py
      - research/tests/test_v99_r106_i1_licensed_full_day_source.py
      - .github/workflows/v99-r106-i1-licensed-full-day-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-original-day:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARDIS_API_KEY: ${{ secrets.TARDIS_API_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify protocol preceded source implementation
        run: |
          git merge-base --is-ancestor 77d43f5fb5771fabdc4dcdbe0faf663dff67c5f3 369db27867a3e3d63a072bdb3056e5818d8b2700
          git merge-base --is-ancestor 77d43f5fb5771fabdc4dcdbe0faf663dff67c5f3 HEAD
          test -s research/V99_R106_I1_LICENSED_FULLDAY_SOURCE_PREREG_20261026.md
      - name: Falsification tests on synthetic fixtures (NOT economic evidence)
        run: python -m unittest -v research.tests.test_v99_r106_i1_licensed_full_day_source
      - name: Attempt one authorized complete original TRAIN day, or prove missing key
        run: python research_tools/v99_r106_tardis_full_day_source.py
      - name: Fail closed on all unproven economic and market coverage flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research_evidence/v99_i1_full_day_20220615/source_check.json').read_text())
          assert p['schema']=='V99_I1_BOUNDED_AUTHENTICATED_FULL_DAY_SOURCE_V1'
          assert p['source_date_utc']=='2022-06-15'
          assert not any(p[k] for k in ('economic_train_executed','validation_opened',
              'holdout_opened','orders_enabled','promotion_authorized'))
          if p['status']=='SOURCE_ONE_DAY_FIELDS_OBSERVED_NOT_LIFECYCLE':
              assert p['full_gzip_consumed'] and len(p['original_compressed_sha256'])==64
              assert all(p['asset_counts'][a]['valid_put_quotes']>0 for a in ('BTC','ETH'))
              assert not p['complete_2021_2023_archive']
              assert not p['vendor_gap_certified']
          else:
              assert p['status'].startswith('BLOCKED_')
          print('SOURCE STATUS:',p['status'],'/ ECONOMIC TRAIN NOT RUN / NO PROMOTION')
          PY
      - name: Upload REDACTED METADATA ONLY; NEVER PAID ORIGINAL DATA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-i1-licensed-day-metadata-only-${{ github.run_id }}
          path: research_evidence/v99_i1_full_day_20220615/source_check.json
          retention-days: 30
          if-no-files-found: warn
