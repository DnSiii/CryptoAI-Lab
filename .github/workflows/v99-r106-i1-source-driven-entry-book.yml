name: V99 I1 original source-driven 90-week entry inventory (HOLD)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_source_driven_entry_book.py
      - research/tests/test_v99_r106_i1_source_driven_entry_book.py
      - research/verification/independent_v99_r106_i1_source_entry_book_oracle.py
      - .github/workflows/v99-r106-i1-source-driven-entry-book.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-driven-entry-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source-driven book preregistration is ancestor
        run: |
          git merge-base --is-ancestor 854bd16c8fbd042720bd9019a42f1b4adf709e72 HEAD
          test -s research/V99_R106_I1_SOURCE_DRIVEN_ENTRY_BOOK_PREREG_20261028.md
      - name: Run 661-day synthetic source-shaped tests
        run: python -m unittest -v research.tests.test_v99_r106_i1_source_driven_entry_book
      - name: Retrieve original 182 historical causal signals and attempt actual missing source
        run: |
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from research.tools.v99_r106_i1_original_intent_binding import bind
          from research.tools.v99_r106_i1_source_driven_entry_book import build
          original=bind(Path("research_evidence/i1_original_causal/i1_causal_signal.json"))
          assert len(original["intents"])==180 and original["positive_fixed_intents"]==132
          with TemporaryDirectory() as missing:
              try:
                  build(missing, original["intents"])
              except ValueError as exc:
                  assert str(exc)=="ORIGINAL_661D_MANIFEST_NOT_DELIVERED",str(exc)
                  print("ORIGINAL 182 SIGNALS / 180 INTENTS / 132 POSITIVE REBOUND")
                  print("BLOCKED_ORIGINAL_661D_LICENSED_DERIBIT_OPTIONS_ARCHIVE_NOT_DELIVERED")
                  print("NO SOURCE-DRIVEN ORIGINAL BOOKS / NO ECONOMIC TRAIN / NO PROMOTION")
              else:
                  raise AssertionError("MISSING_ORIGINAL_ARCHIVE_BYPASSED")
          PY
