name: V98 Independent Phase271 Blockspace Opportunity
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase271-blockspace-opportunity.yml'
      - 'research/v98_independent/phase271_blockspace_opportunity.py'
      - 'research/v98_independent/test_phase271_blockspace_opportunity.py'
      - 'research/v98_independent/phase271_blockspace_opportunity_prereg.md'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - uses: ./.github/actions/v98-independent-clean4-cache
      - run: PYTHONPATH=src python -m pytest -q research/v98_independent/test_phase271_blockspace_opportunity.py
      - run: python research/v98_independent/phase243_clean4_source_pipeline.py --attempts 3
      - name: Execute twice
        run: |
          python research/v98_independent/phase271_blockspace_opportunity.py --out /tmp/a.json
          python research/v98_independent/phase271_blockspace_opportunity.py --out /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
          cp /tmp/a.json research/v98_independent/phase271_blockspace_opportunity_results.json
      - run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase271_blockspace_opportunity_results.json'))
          assert p['phase']==271 and p['training_only'] is True and p['validation'] is None
          assert p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert p['gate']['decision'] in {'BLOCKSPACE_OPPORTUNITY_CANDIDATE','REJECT_BLOCKSPACE_OPPORTUNITY_NO_RESCUE'}
          assert p['diagnostics']['max_open_gross']<=1.500000001
          print('Phase271',p['gate']['decision'])
          PY
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase271_blockspace_opportunity_results.json
          if ! git diff --cached --quiet; then
            git commit -m "v98 phase271: record blockspace opportunity evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
