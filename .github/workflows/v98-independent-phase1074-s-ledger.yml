name: V98 Independent Phase1074 S Signed Funded Ledger Synthetic
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1074-s-ledger.yml'
      - 'research/v98_independent/phase1074_s_funded_ledger.py'
      - 'research/v98_independent/test_phase1074_s_funded_ledger.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s-funded-ledger-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: S causal funded ledger synthetic accounting, signed marks and fold metrics
        run: python -m unittest -v test_phase1073_s_signed_execution.py test_phase1074_s_funded_ledger.py
