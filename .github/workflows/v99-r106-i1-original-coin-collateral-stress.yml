name: V99 I1 original Deribit index native-coin collateral stress (NO ROI / NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_original_coin_collateral_stress.py
      - research/verification/independent_v99_r106_i1_original_coin_collateral_stress.py
      - .github/workflows/v99-r106-i1-original-coin-collateral-stress.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-index-coin-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover independently verified original 661-day BTC and ETH TRAIN index receipts
        run: |
          gh run download 40117855925 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-delivery-index-train-40117855925 \
            --dir research_evidence/i1_original_delivery
          test -s research_evidence/i1_original_delivery/delivery_index_train_only.json
      - name: Execute historical original-index native-coin risk stress (synthetic strikes, NO ROI)
        run: |
          python -m research.tools.v99_r106_i1_original_coin_collateral_stress \
            research_evidence/i1_original_delivery/delivery_index_train_only.json \
            research_evidence/i1_original_coin_stress/stress.json
      - name: Independent original-byte and algebraic replay
        run: |
          python -m research.verification.independent_v99_r106_i1_original_coin_collateral_stress \
            research_evidence/i1_original_delivery/delivery_index_train_only.json \
            research_evidence/i1_original_coin_stress/stress.json
      - name: Reject original source tampering and fabricated stress results
        run: |
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from research.verification.independent_v99_r106_i1_original_coin_collateral_stress import audit
          original=Path('research_evidence/i1_original_delivery/delivery_index_train_only.json')
          report=Path('research_evidence/i1_original_coin_stress/stress.json')
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp)/'changed_original.json'
              raw=json.loads(original.read_text())
              raw['assets']['btc_usd']['records'][3]['delivery_price']*=1.01
              p.write_text(json.dumps(raw))
              try: audit(p,report)
              except AssertionError: pass
              else: raise AssertionError('SOURCE_MUTATION_NOT_REJECTED')
              q=Path(tmp)/'changed_result.json'
              altered=json.loads(report.read_text())
              altered['observations'][0]['coin_obligation_to_reserved_ratio']='999.0000000000'
              q.write_text(json.dumps(altered))
              try: audit(original,q)
              except AssertionError: pass
              else: raise AssertionError('FABRICATED_STRESS_NOT_REJECTED')
          print('INDEPENDENT MUTATION CONTROLS PASSED; NO ECONOMIC ROI')
          PY
      - name: Enforce quarantined risk-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research_evidence/i1_original_coin_stress/stress.json').read_text())
          assert len(x['observations'])==182
          assert x['status']=='HISTORICAL_INDEX_SYNTHETIC_STRIKES_NOT_ECONOMICS'
          assert all(x[k] is False for k in ('economic_train_executed','validation_opened','holdout_opened',
              'promotion_authorized','orders_enabled','native_margin_or_fee_authenticated',
              'option_strikes_quotes_or_fills_historical'))
          print('ORIGINAL HISTORICAL UNDERLYING STRESS ONLY; QUOTE SOURCE 0/182; NO PROMOTION')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-i1-original-coin-collateral-stress-${{ github.run_id }}
          path: research_evidence/i1_original_coin_stress/
          retention-days: 60
          if-no-files-found: warn
