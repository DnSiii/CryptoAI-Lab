name: V98 Independent IB Frozen Economic Cost Contrasts
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ib-frozen-cost-contrasts.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ia30-ubuntu-24.04-IB_*
          run-id: 40476018579
          github-token: ${{ github.token }}
          path: frozen-physical-books
          merge-multiple: false
      - name: Compare original frozen full versus ablations without rerunning source or PnL
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,math
          files=glob.glob('frozen-physical-books/**/*.json',recursive=True)
          assert len(files)==5,files
          paths={}
          for p in files:
              x=json.load(open(p))
              assert x['architecture']=='IB' and x['historical_training_only'] and not x['validation_2025_read']
              assert x['path'] not in paths
              paths[x['path']]={(z['mode'],z['fee'],z['order']):z for z in x['cells']}
          assert set(paths)=={'IB_full','IB_core_only','IB_minus_opportunity','IB_minus_RV','IB_minus_stress'}
          for fee in ('base','severe','supersevere'):
              k=('immediate',fee,'carried_before_fill')
              full=paths['IB_full'][k]
              assert full['passed']
              print('IB_FROZEN_COST_FULL',fee,json.dumps({
                  x:full[x] for x in ('net_log_growth','two_year_cagr','funding','fees',
                                     'slippage','turnover','max_drawdown','positive_utc_days')},sort_keys=True))
              for name in ('IB_core_only','IB_minus_opportunity','IB_minus_RV','IB_minus_stress'):
                  alt=paths[name][k]
                  assert alt['passed']
                  contrast={
                      'delta_log_growth':full['net_log_growth']-alt['net_log_growth'],
                      'delta_signed_funding_usd':full['funding']-alt['funding'],
                      'delta_fees_slippage_usd':(full['fees']+full['slippage'])-(alt['fees']+alt['slippage']),
                      'delta_turnover_usd':full['turnover']-alt['turnover'],
                      'delta_max_drawdown':full['max_drawdown']-alt['max_drawdown'],
                      'delta_positive_utc_days':full['positive_utc_days']-alt['positive_utc_days']}
                  assert all(math.isfinite(v) for v in contrast.values())
                  print('IB_FROZEN_COST_CONTRAST',fee,name,json.dumps(contrast,sort_keys=True))
          print('IB_FROZEN_COST_CONTRASTS_DESCRIPTIVE_NOT_ADDITIVE_OR_TRADE_AUTHORIZATION')
          PY
