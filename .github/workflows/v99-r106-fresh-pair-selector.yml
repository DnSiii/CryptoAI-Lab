name: V99 R106 fresh receipt pairing fail-closed tests
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_fresh_pair_selector.py'
      - 'research/tests/test_v99_r106_fresh_pair_selector.py'
      - '.github/workflows/v99-r106-fresh-pair-selector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-trade-fresh-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Adversarial fail-closed selector tests
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_fresh_pair_selector.py' -v
      - name: Existing full source gate adversarial tests
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_asof_pair_gate.py' -v
      - name: Explicit no-promotion status
        run: echo 'DATA_ONLY; no source receipt alteration, paper write, economic run, orders or holdout.'
