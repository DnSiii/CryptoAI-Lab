name: V98 Independent Phase206 Funding PIT
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98_independent_phase206_funding.yml'
      - 'research/v98_independent/phase206_acquire_funding_archive.py'
      - 'research/v98_independent/phase206_transport_amendment.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire training-only realized funding snapshot A from official Binance archive
        run: |
          rm -rf research/v98_independent/data/phase206_funding
          python research/v98_independent/phase206_acquire_funding_archive.py
          find research/v98_independent/data/phase206_funding -name '*_funding.csv' -print0 | sort -z | xargs -0 sha256sum > /tmp/funding_a.sha256
      - name: Reacquire and verify deterministic historical payload
        run: |
          rm -rf research/v98_independent/data/phase206_funding
          python research/v98_independent/phase206_acquire_funding_archive.py
          find research/v98_independent/data/phase206_funding -name '*_funding.csv' -print0 | sort -z | xargs -0 sha256sum > /tmp/funding_b.sha256
          diff -u /tmp/funding_a.sha256 /tmp/funding_b.sha256
      - name: Independent firewall and integrity audit
        run: |
          python - <<'PY'
          import csv,glob,json,datetime,pathlib
          cutoff=int(datetime.datetime(2026,1,1,tzinfo=datetime.timezone.utc).timestamp()*1000)
          root=pathlib.Path('research/v98_independent/data/phase206_funding')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['phase']=='206'
          assert manifest['mode']=='DATA_ACQUISITION_ONLY'
          assert manifest['integrity']['holdout_opened'] is False
          assert manifest['integrity']['alpha_or_pnl_computed'] is False
          assert manifest['source']=='Binance official Data Collection USD-M monthly fundingRate archive'
          files=sorted(glob.glob(str(root/'*_funding.csv')))
          assert len(files)==5, files
          audit={'phase':'206','namespace':'V98 Independent','status':'PASS','transport':'official_binance_archive','cutoff_exclusive_ms':cutoff,'files':{}}
          for p in files:
              with open(p,newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
              assert rows
              assert list(rows[0].keys())==['fundingTime_ms','fundingTime_utc','fundingRate','fundingIntervalHours']
              ts=[int(r['fundingTime_ms']) for r in rows]
              rates=[float(r['fundingRate']) for r in rows]
              intervals=[float(r['fundingIntervalHours']) for r in rows]
              assert ts==sorted(ts) and len(ts)==len(set(ts)) and max(ts)<cutoff
              assert all(x==x and abs(x)!=float('inf') for x in rates)
              assert all(x>0 and x==x for x in intervals)
              audit['files'][pathlib.Path(p).name]={'rows':len(ts),'first_ms':min(ts),'last_ms':max(ts)}
          (root/'integrity_audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2))
          PY
      - name: Commit V98 Independent funding evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v98_independent/data/phase206_funding
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'v98 independent: freeze Phase206 official-archive funding snapshot'
          git pull --rebase --autostash origin research/v98-independent-zero
          git push origin HEAD:research/v98-independent-zero
      - name: Upload Phase206 acquisition evidence
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-phase206-funding-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            research/v98_independent/data/phase206_funding/manifest.json
            research/v98_independent/data/phase206_funding/integrity_audit.json
