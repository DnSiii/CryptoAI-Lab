name: V98 Independent BN Relative Dislocation Defensive Pair Seven Slot 90-Cell Historical Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-bn-seven-slot-90cell.yml'
      - 'research/v98_independent/bn_sources.py'
      - 'research/v98_independent/bn_allocator.py'
      - 'research/v98_independent/bn_90cell.py'
      - 'research/v98_independent/bn_reconcile.py'
      - 'research/v98_independent/bn_independent_receipt_audit.py'
      - 'research/v98_independent/ba_ratio_reversion_governor.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [BN_core_only, BN_full, BN_minus_opportunity, BN_minus_RV, BN_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: BN acceleration opportunity, ratio dislocation, defensive pair, physical settlement
        working-directory: research/v98_independent
        run: |
          python -m py_compile bn_sources.py bn_allocator.py ba_ratio_reversion_governor.py bn_90cell.py bn_reconcile.py
          python bn_sources.py
          python bn_allocator.py
          python ba_ratio_reversion_governor.py
      - name: Retrieve PINNED vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          run-id: 40018746960
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute BN complete actual-open native-funded chronological path x18
        working-directory: research/v98_independent
        run: |
          python bn_90cell.py \
            --path ${{ matrix.path }} \
            --output bn90_${{ matrix.path }}.json || echo 'BN_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bn90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/bn90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify all 18 path cells recorded, never hide failure
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('bn90_BN_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('BN_PATH_SURVIVAL',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bn90-ubuntu-*
          path: receipts
      - name: Independent two-OS 90-cell economic, marginal and causal gate
        run: python research/v98_independent/bn_reconcile.py --root receipts --output bn90_official_economic_summary.json
      - name: Independent original-receipt accounting audit (no BN engine imports)
        run: python research/v98_independent/bn_independent_receipt_audit.py --root receipts --output bn90_independent_arithmetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bn90-independent-arithmetic
          path: bn90_independent_arithmetic.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bn90-official-economic-summary
          path: bn90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
