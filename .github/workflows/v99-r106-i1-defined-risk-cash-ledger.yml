name: V99 I1 defined-risk options self-financing cash ledger oracle (NO TRADES)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_defined_risk_options_ledger.py
      - research/verification/independent_v99_r106_i1_spread_cash_oracle.py
      - .github/workflows/v99-r106-i1-defined-risk-cash-ledger.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-accounting-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently verify modeled put spread opens, conservative exit and expiry
        run: python -m research.verification.independent_v99_r106_i1_spread_cash_oracle
      - name: Enforce no native/executable market claims
        run: |
          python - <<'PY'
          from research.tools.v99_r106_i1_defined_risk_options_ledger import COST_SCENARIOS,TRAIN_END_MS
          assert set(COST_SCENARIOS)=={'severe','supersevere'}
          assert TRAIN_END_MS==1696118400000
          print('SYNTHETIC ACCOUNTING ONLY / REAL HISTORICAL OPTIONS TRAIN BLOCKED / NO PROMOTION / NO ORDERS')
          PY
