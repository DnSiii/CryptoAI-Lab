name: V13 original paper full verification (read-only)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - '.github/workflows/v13-original-paper-full-verification.yml'
      - 'scripts/verify_paper_cycle_v13.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research verifier
        uses: actions/checkout@v4
        with:
          path: research
          persist-credentials: false
      - name: Checkout original published paper snapshot without modifying it
        uses: actions/checkout@v4
        with:
          ref: paper-results
          path: published
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier dependency
        run: python -m pip install 'pandas>=2.0,<3'
      - name: Verify original ledger and complete paper continuity without touching published checkout
        run: |
          set -euo pipefail
          mkdir -p audit-root/scripts
          cp research/scripts/verify_paper_cycle_v13.py audit-root/scripts/verify_paper_cycle_v13.py
          for item in config state reports; do
            ln -s "../published/$item" "audit-root/$item"
          done
          python audit-root/scripts/verify_paper_cycle_v13.py
      - name: Assert original published checkout remains byte-for-byte untouched
        working-directory: published
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git status --porcelain
