name: V13 original paper full verification (read-only)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - '.github/workflows/v13-original-paper-full-verification.yml'
      - 'scripts/verify_paper_cycle_v13.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research verifier
        uses: actions/checkout@v4
        with:
          path: research
          persist-credentials: false
      - name: Checkout original published paper snapshot without modifying it
        uses: actions/checkout@v4
        with:
          ref: paper-results
          path: published
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier dependency
        run: python -m pip install 'pandas>=2.0,<3'
      - name: Verify original ledger and complete paper continuity using research verifier
        working-directory: published
        run: |
          mkdir -p scripts
          cp ../research/scripts/verify_paper_cycle_v13.py scripts/verify_paper_cycle_v13.py
          python scripts/verify_paper_cycle_v13.py
      - name: Assert checkout remains read-only
        working-directory: published
        run: test -z "$(git status --porcelain --untracked-files=no)"
