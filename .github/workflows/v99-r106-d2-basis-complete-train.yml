name: V99 D2 distinct basis-convergence complete TRAIN and independent oracle (HOLD)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_d2_basis_train.py
      - research/verification/independent_v99_r106_d2_basis_oracle.py
      - research/tests/test_v99_r106_d2_basis_train.py
      - .github/workflows/v99-r106-d2-basis-complete-train.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  d2-complete-train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce preregistration before any D2 implementation or TRAIN PnL
        run: |
          git merge-base --is-ancestor 2ab0ac1e7f167c8761ccd1a58f757dbaf19be338 HEAD
          test -s research/V99_R106_D2_BASIS_CONVERGENCE_COMPLETE_TRAIN_PREREG_20261029.md
      - name: Synthetic adversarial controls (not evidence of profitability)
        run: python -m unittest -v research.tests.test_v99_r106_d2_basis_train
      - name: Restore original first-party four-leg OKX strictly TRAIN prices
        run: |
          gh run download 40019588739 --repo "$GITHUB_REPOSITORY" \
            --name d1-train-four-leg-backfill-40019588739 \
            --dir research_evidence/d2_original_four_legs
      - name: Execute distinct complete D2 pre-funding TRAIN (NOT certified)
        run: |
          python -m research.tools.v99_r106_d2_basis_train \
            research_evidence/d2_original_four_legs research_evidence/d2_result
      - name: Independently replay 15864 original hours, decisions, positions, fees and NAV
        run: |
          python -m research.verification.independent_v99_r106_d2_basis_oracle \
            research_evidence/d2_original_four_legs research_evidence/d2_result \
            | tee research_evidence/d2_result/d2_independent_oracle.json
      - name: Explicit reject/freeze decision without opening validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research_evidence/d2_result/d2_train_report.json").read_text())
          o=json.loads(Path("research_evidence/d2_result/d2_independent_oracle.json").read_text())
          assert o["hours_verified"]==15864 and o["events_verified"]==r["event_count"]
          assert o["promotion_authorized"] is False
          assert r["promotion_authorized"] is False and r["validation_opened"] is False
          assert r["holdout_opened"] is False and r["orders_enabled"] is False
          assert r["original_economic_train_certified"] is False
          decision="REJECT_D2_NUMERIC_TRAIN" if not r["numeric_pass_both"] else "D2_NUMERIC_ONLY_HOLD_NATIVE_COST_FUNDING_MISSING"
          Path("research_evidence/d2_result/d2_decision.txt").write_text(
              decision+"\nNO PROMOTION / NO ORDERS / NO VALIDATION / NO HOLDOUT\n")
          print("D2_DECISION="+decision)
          for sc in ("severe","supersevere"):
              m=r["metrics"][sc]
              print(sc,"PRE_FUNDING_ONLY_ROI",m["roi_pre_funding"],
                    "POSITIVE_FOLDS",m["positive_folds"],"MAX_DD",m["max_drawdown"],
                    "FAILED_GATES",[k for k,v in m["gates"].items() if not v])
          PY
      - name: Archive reproducible full hourly journal and independent decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-d2-original-train-independent-${{ github.run_id }}
          path: research_evidence/d2_result/
          retention-days: 90
          if-no-files-found: warn
