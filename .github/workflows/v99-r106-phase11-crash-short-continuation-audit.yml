name: CryptoAI V99 R106 phase 11 crash short continuation audit
on:
  workflow_dispatch:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - "scripts/run_v99_r106_phase11_crash_short_continuation_audit.py"
      - ".github/workflows/v99-r106-phase11-crash-short-continuation-audit.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: v99-r106-canonical-market
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - name: Install package
        run: python -m pip install -e "."
      - name: Restore published replay state
        run: |
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v13.json reports/paper_data_sync_v15.json; do
            mkdir -p "$(dirname "$path")"
            git show "FETCH_HEAD:$path" > "$path"
          done
      - name: Prepare frozen V15 replay inputs
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Run R106 phase 11 audit
        run: python scripts/run_v99_r106_phase11_crash_short_continuation_audit.py
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-phase11-crash-short-continuation-audit
          retention-days: 60
          path: reports/candidate_v99_r106_phase11_crash_short_continuation_audit.json
      - name: Persist research evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_v99_r106_phase11_crash_short_continuation_audit.json
          git diff --cached --quiet || git commit -m "Persist R106 phase 11 crash-short audit evidence [skip ci]"
          git push origin HEAD:research/v99-r106-native-all-regime-engine
