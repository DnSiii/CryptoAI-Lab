name: V99 paper subcent forensic gate
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - "scripts/paper_once_v13.py"
      - "scripts/verify_paper_cycle_v13.py"
      - "tests/test_paper_subcent_gate.py"
      - ".github/workflows/v99-paper-subcent-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_paper_subcent_gate.py
