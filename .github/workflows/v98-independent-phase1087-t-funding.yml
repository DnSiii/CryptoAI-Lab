name: V98 Independent Phase1087 T Funding and t-1 Oracle
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1087-t-funding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t-signed-funding-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Verify frozen T and synthetic signed funding order causality
        run: |
          python -c 'from phase1084_t_frozen_training_path import verify_freeze; assert verify_freeze()["decision"]=="FROZEN_T_PRE_ECONOMIC"'
          python -m unittest -q test_phase1087_t_funding_causality.py
