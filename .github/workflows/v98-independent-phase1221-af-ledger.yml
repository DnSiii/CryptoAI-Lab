name: V98 Independent Phase1221 AF Actual Cash Native Funding Ledger
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1221_af_actual_ledger.py'
      - 'research/v98_independent/test_phase1221_af_actual_ledger.py'
      - '.github/workflows/v98-independent-phase1221-af-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  af-ledger:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4
      - name: Test fully collateralized AF actual-open native funding ledger
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1221_af_actual_ledger.py' -v
