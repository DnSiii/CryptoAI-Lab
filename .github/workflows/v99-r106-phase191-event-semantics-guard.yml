name: V99 R106 Phase191 Event Semantics Guard

on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase191_event_semantics_guard.py'
      - 'research/results/v99_r106_phase191_chain_native_semantics_audit.md'
      - '.github/workflows/v99-r106-phase191-event-semantics-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-only-semantic-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert frozen trees are not in Phase191 change set
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD | tee /tmp/changed.txt
          if grep -Ei '(^|/)(v16.*frozen|v99.*frozen)(/|$)' /tmp/changed.txt; then
            echo 'Frozen path modified by Phase191' >&2
            exit 1
          fi
      - name: Run issuer-specific semantics self-test twice
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/v99_phase191_event_semantics_guard.py | tee /tmp/run1.txt
          python research/tools/v99_phase191_event_semantics_guard.py | tee /tmp/run2.txt
          cmp /tmp/run1.txt /tmp/run2.txt
          sha256sum research/tools/v99_phase191_event_semantics_guard.py
