name: V98 Independent KE BookDepth Physical Source Geometry Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ke-bookdepth-geometry.yml'
      - 'research/v98_independent/ke_bookdepth_geometry_source_audit.py'
      - 'research/v98_independent/ke_bookdepth_geometry_prereg_20261028.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage pinned Clean-4 1h OHLC only, no future data
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent/phase243_clean4_canonical')
          target.mkdir(parents=True,exist_ok=True)
          for asset in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT'):
              name=asset+'_1h.csv';found=list(root.rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Syntax and publisher source physical geometry gate, no PnL
        run: |
          python -m py_compile research/v98_independent/ke_bookdepth_geometry_source_audit.py
          python research/v98_independent/ke_bookdepth_geometry_source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ke-bookdepth-physical-geometry-source-only
          path: research/v98_independent/ke_bookdepth_geometry_source_audit.json
          retention-days: 30
          if-no-files-found: warn
