name: V98 Independent Phase240
on:
  push:
    branches: [research/v98-independent-zero]
    paths: ['research/v98_independent/phase240_eval.py','research/v98_independent/phase240_validate.py','research/v98_independent/phase240_preregister.md','research/v98_independent/phase240_preexecution_audit.md','.github/workflows/v98-independent-phase240.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  phase240:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/v98-independent-zero}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Rebuild training-only prices
        run: |
          python scripts/download_futures_archive.py --config v98_independent_phase050_data.json
          python scripts/build_canonical.py --config v98_independent_phase050_data.json
      - name: Firewall and frozen invariants
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          cut=pd.Timestamp('2026-01-01',tz='UTC')
          for a in ('BTCUSDT','ETHUSDT','BNBUSDT','XRPUSDT','SOLUSDT'):
              d=pd.read_csv(Path('data/canonical')/f'{a}_1h.csv'); c='open_time' if 'open_time' in d.columns else ('timestamp' if 'timestamp' in d.columns else d.columns[0]); t=pd.to_datetime(d[c],utc=True,errors='raise'); assert t.is_monotonic_increasing and not t.duplicated().any() and not (t>=cut).any()
              f=pd.read_csv(Path('research/v98_independent/data/phase206_funding')/f'{a}_funding.csv'); ft=pd.to_datetime(f['fundingTime_utc'],utc=True,errors='raise',format='mixed'); assert ft.is_monotonic_increasing and not ft.duplicated().any() and not (ft>=cut).any()
          e=Path('research/v98_independent/phase240_eval.py').read_text()
          assert 'COSTS={"base":.0007,"severe":.0014,"supersevere":.0028}' in e
          assert 'shock.iloc[i-1]' in e and 'beta.shift(1)' in e and '.median().shift(1)' in e
          assert 'SPECS=tuple((lb,sw,1,H) for lb in (168,336) for sw in (72,168) for H in (4,8))' in e
          print('Phase240 firewall/funding/causality/grid invariants OK')
          PY
      - name: Deterministic runs
        run: |
          python research/v98_independent/phase240_eval.py --out /tmp/phase240_run1.json
          python research/v98_independent/phase240_eval.py --out /tmp/phase240_run2.json
          diff -u /tmp/phase240_run1.json /tmp/phase240_run2.json
          sha256sum /tmp/phase240_run1.json /tmp/phase240_run2.json
          cp /tmp/phase240_run2.json research/v98_independent/phase240_results.json
      - name: Independent validation and gate
        run: python research/v98_independent/phase240_validate.py /tmp/phase240_run1.json | tee /tmp/phase240_validation.json
      - name: Commit V98-only result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/v98_independent/phase240_results.json
          git diff --cached --quiet && exit 0
          git commit -m 'V98 Phase240 harvest idiosyncratic shock recovery relative value'
          git pull --rebase origin research/v98-independent-zero
          git push
