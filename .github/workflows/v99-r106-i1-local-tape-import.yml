name: V99 I1 local 661-day licensed original tape import (FIXTURE CI ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_local_tape_import.py
      - research/tests/test_v99_r106_i1_local_tape_import.py
      - research/tools/v99_r106_i1_tardis_licensed_transfer.py
      - research/tests/test_v99_r106_i1_tardis_licensed_transfer.py
      - research/tools/v99_r106_i1_single_day_source_feasibility.py
      - research/verification/independent_v99_r106_i1_single_day_source.py
      - research/tests/test_v99_r106_i1_single_day_source_feasibility.py
      - .github/workflows/v99-r106-i1-local-tape-import.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-original-tape-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Immutable preregistration ancestry spans hundreds of research commits.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm ex-ante preregistration predates implementation
        run: |
          git merge-base --is-ancestor 87e1551c34758acf47dd4ae220697448873a37e1 HEAD
          test -s research/V99_R106_I1_661D_LOCAL_ORIGINAL_TAPE_IMPORT_PREREG_20261028.md
          git merge-base --is-ancestor 2361721ffce16813d61aee60f1d909d22c36c43e HEAD
          test -s research/V99_R106_I1_LICENSED_TARDIS_TRANSFER_PREREG_20261028.md
          git merge-base --is-ancestor 6837ad833d2dfe5c552964f0d4ed2f85ce8c738f HEAD
          test -s research/V99_R106_I1_TARGETED_LICENSED_ARCHIVE_ACQUISITION_PREREG_20261028.md
          git merge-base --is-ancestor d1a132ea7516c35f0b03a8767474976d29847a9c HEAD
          test -s research/V99_R106_I1_LIVE_CHAIN_VS_FIXED_TENOR_SOURCE_COVERAGE_PREREG_20261029.md
          git merge-base --is-ancestor 0a5f04f89ffb74ccca2af152c2e1320ef245ff1a HEAD
          test -s research/V99_R106_I1_LICENSED_DAY_24H_TRANSFER_PREFLIGHT_PREREG_20261029.md
      - name: Run synthetic 661-day full intake and independent original-byte oracle
        run: python -m unittest -v research.tests.test_v99_r106_i1_local_tape_import
      - name: Test opt-in licensed archive transfer OFFLINE with mock vendor (no key, no downloads)
        run: python -m unittest -v research.tests.test_v99_r106_i1_tardis_licensed_transfer
      - name: Verify fixed 2022-01-23 one-day source-only feasibility and independent replay (synthetic)
        run: python -m unittest -v research.tests.test_v99_r106_i1_single_day_source_feasibility
      - name: Verify actual preselected licensed source day absent (no substitution)
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.tools.v99_r106_i1_single_day_source_feasibility import inspect
          target = Path('research_evidence/i1_original_licensed_661_day_options/2022-01-23.csv.gz')
          result = inspect(target)
          assert result['status'] == 'SOURCE_MISSING', result['status']
          assert not result['promotion_authorized']
          print('BLOCKED_LICENSED_2022-01-23_SOURCE_DAY_NOT_DELIVERED')
          print('SOURCE_ONLY/HOLD; 0/180 original option lifecycles certified')
          PY
      - name: Reproduce actual missing licensed archive without synthetic substitution
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.tools.v99_r106_i1_local_tape_import import build_manifest
          try:
              build_manifest(Path('research_evidence/i1_original_licensed_661_day_options'), fixture=False)
          except ValueError as exc:
              assert str(exc) == 'MISSING_OR_UNSAFE_ORIGINAL_ROOT', str(exc)
              print('BLOCKED_ORIGINAL_LICENSED_661_DAY_OPTIONS_ARCHIVE_MISSING')
              print('0/180 original economic lifecycles certified; NO TRAIN/ROI/PROMOTION/ORDERS')
          else:
              raise AssertionError('ORIGINAL_OPTIONS_ARCHIVE_FABRICATED')
          PY
