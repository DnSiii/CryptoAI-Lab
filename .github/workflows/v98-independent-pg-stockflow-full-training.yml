name: V98 Independent PG Native OI Stock-to-Flow Seven-Slot Full Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-pg-stockflow-full-training.yml'
      - 'research/v98_independent/pg_inventory_stockflow_composed.py'
      - 'research/v98_independent/pg_inventory_stockflow_independent_oracle.py'
      - 'research/v98_independent/pg_inventory_stockflow_receipt_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pg-full-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile PG and independent decision oracle; synthetic causal future mutation and quarantine tests
        run: |
          python -m py_compile research/v98_independent/pg_inventory_stockflow_composed.py research/v98_independent/pg_inventory_stockflow_independent_oracle.py
          python research/v98_independent/pg_inventory_stockflow_composed.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/oi-old
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-2025-native-oi-vendor-sha-source-only
          run-id: 41282113093
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/oi-new
      - name: Audit both native OI artifacts and run full 30-cell physical training with independent decisions, cash and fills
        working-directory: research/v98_independent
        env:
          OLD_ROOT: ${{ runner.temp }}/old
          OLD_ENVELOPE: ${{ runner.temp }}/old-envelope/v98_official_mark_envelope_training.csv
          NEW_ROOT: ${{ runner.temp }}/new
          CORRECTED_ROOT: ${{ runner.temp }}/corrected
          OI_OLD_ROOT: ${{ runner.temp }}/oi-old
          OI_NEW_ROOT: ${{ runner.temp }}/oi-new
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from v98_2025_full_training_source_bridge import load
          from pg_inventory_stockflow_composed import native_oi, run
          d = load(os.environ["OLD_ROOT"], os.environ["OLD_ENVELOPE"],
                   os.environ["NEW_ROOT"], os.environ["CORRECTED_ROOT"])
          oi, observed, provenance = native_oi(os.environ["OI_OLD_ROOT"], os.environ["OI_NEW_ROOT"])
          out = run(d, oi, observed, provenance)
          Path("pg_full_training_result.json").write_text(
              json.dumps(out, indent=2, sort_keys=True, allow_nan=False)+"\n")
          print("PG_BINDING_TRAINING_DECISION", out["decision"],
                "FAILURES", len(out["gate_failures"]), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-pg-full-training-receipt
          path: research/v98_independent/pg_full_training_result.json
          retention-days: 30
          if-no-files-found: warn
  pg-independent-audit:
    needs: pg-full-physical
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v98-pg-full-training-receipt
          path: pg-receipt
      - name: Independently replay arithmetic and every binding gate; reject four tampered receipts
        run: |
          python -m py_compile research/v98_independent/pg_inventory_stockflow_receipt_audit.py
          python research/v98_independent/pg_inventory_stockflow_receipt_audit.py pg-receipt/pg_full_training_result.json | tee pg_independent_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-pg-independent-receipt-audit
          path: pg_independent_audit.json
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce economic rejection as failed workflow, never as approved engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("pg-receipt/pg_full_training_result.json").read_text())
          if receipt["decision"]!="PASS_PROVISIONAL_PG_TRAINING_NOT_VALIDATED":
              raise SystemExit("PG_PRE_REGISTERED_ECONOMIC_REJECTION_NOT_APPROVED")
          PY
