name: V99 R106 Phase90 cross-sectional global positioning level train alpha
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'scripts/run_v99_r106_phase90_crosssectional_global_positioning_level_train_alpha.py'
      - 'research/v99_r106_phase90_crosssectional_global_positioning_level_prereg.md'
      - '.github/workflows/v99-r106-phase90-crosssectional-global-positioning-level-train-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: v99-r106-phase90-${{ runner.os }}-numpy-pandas
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas
      - name: Snapshot frozen assets
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          files=sorted({p for pat in ('*v16*frozen*','*v99*frozen*') for p in root.rglob(pat) if p.is_file() and '.git' not in p.parts})
          snap={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          pathlib.Path('/tmp/frozen_before.json').write_text(json.dumps(snap,sort_keys=True))
          print('frozen assets snapshotted',len(snap))
          PY
      - name: Run Phase90 train-only gate
        run: python scripts/run_v99_r106_phase90_crosssectional_global_positioning_level_train_alpha.py
      - name: Verify frozen assets unchanged
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          before=json.loads(pathlib.Path('/tmp/frozen_before.json').read_text()); after={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in before}
          assert before==after,'Frozen asset mutation detected'
          print('V16/V99 frozen guards OK')
          PY
      - name: Show evidence
        run: cat reports/candidate_v99_r106_phase90_crosssectional_global_positioning_level_train_alpha.json
      - name: Persist evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/candidate_v99_r106_phase90_crosssectional_global_positioning_level_train_alpha.json
          if git diff --cached --quiet; then echo 'No evidence change'; else git commit -m 'research(v99): persist Phase90 train evidence'; git push origin HEAD:research/v99-r106-native-all-regime-engine; fi
