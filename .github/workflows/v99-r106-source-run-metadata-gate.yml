name: V99 R106 source metadata CI
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_schedule_source_pair_metadata_gate.py'
      - 'research/tests/test_v99_r106_schedule_source_pair_metadata_gate.py'
      - '.github/workflows/v99-r106-source-run-metadata-gate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/tests -p 'test_v99_r106_schedule_source_pair_metadata_gate.py' -v
