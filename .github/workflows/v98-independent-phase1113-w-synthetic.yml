name: V98 Independent Phase1113 W Full Synthetic Survival
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1113-w-synthetic.yml'
      - 'research/v98_independent/phase1110_w_256state_governor.py'
      - 'research/v98_independent/phase1111_w_sevenslot_source.py'
      - 'research/v98_independent/phase1112_w_atomic_ledger.py'
      - 'research/v98_independent/phase1113_w_synthetic_integration.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w-composed-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
      - name: W three-seed five-path 2200h synthetic composition and reject decision
        run: python phase1113_w_synthetic_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-w-phase1113-synthetic-receipt
          path: research/v98_independent/phase1113_w_synthetic_receipt.json
          if-no-files-found: warn
