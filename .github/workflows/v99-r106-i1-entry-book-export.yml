name: V99 I1 original quote-to-entry-book bridge (SOURCE ONLY / NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_entry_book_export.py
      - research/tools/v99_r106_i1_full_archive_intake.py
      - research/tests/test_v99_r106_i1_full_archive_intake.py
      - research/tests/test_v99_r106_i1_entry_book_scaling.py
      - research/verification/independent_v99_r106_i1_entry_book_export.py
      - research/verification/independent_v99_r106_i1_full_archive_intake.py
      - .github/workflows/v99-r106-i1-entry-book-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-to-engine-entry-books:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify last-captured quote supersession against independent exporter oracle
        run: python -m unittest research.tests.test_v99_r106_i1_full_archive_intake.FullArchiveIntakeTests.test_same_arrival_last_capture_row_revokes_higher_exchange_timestamp -v
      - name: Verify 12k-strike scaling, two-clock parity and streaming source integrity
        run: python -m unittest research.tests.test_v99_r106_i1_entry_book_scaling -v
      - name: Exercise complete source-to-book bridge and independent raw-byte reconstruction
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import tempfile
          from pathlib import Path
          from research.tests.test_v99_r106_i1_full_archive_intake import make_fixture, attach_synthetic_native_bytes
          from research.tools.v99_r106_i1_entry_book_export import export_books
          from research.verification.independent_v99_r106_i1_entry_book_export import audit
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)/'original'
              make_fixture(root)
              report=export_books(root)
              assert report['fixture'] and report['source_pairs']==182
              assert len(report['quotes'])==364
              assert report['status']=='SYNTHETIC_NOT_ECONOMIC'
              assert not any(report[k] for k in ('economic_train_executed',
                  'validation_opened','holdout_opened','promotion_authorized','orders_enabled'))
              output=Path(tmp)/'entry_books.json'
              output.write_text(json.dumps(report))
              assert audit(root,output)==364
              original=root/'2021-12-12.csv'
              original.write_bytes(original.read_bytes()+b'\n')
              try:
                  audit(root,output)
              except AssertionError:
                  pass
              else:
                  raise AssertionError('ORIGINAL_SOURCE_CORRUPTION_NOT_DETECTED')
          # Adversarial TEST-ONLY native archive: contract created after decision.
          # The invented first-week BTC strike must not reach an engine entry book.
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)/'fake_original_bytes'
              make_fixture(root)
              attach_synthetic_native_bytes(root,late_first_btc=True)
              report=export_books(root)
              assert not report['fixture'] and report['native_registry_verified']
              assert report['source_pairs']==181 and len(report['quotes'])==363
              assert not report['economic_train_executed'] and not report['promotion_authorized']
              output=Path(tmp)/'native_asof_export.json'
              output.write_text(json.dumps(report))
              assert audit(root,output)==363
              assert all(q['native_contract_terms'] is not None
                         and q['native_registry_source_sha256'] for q in report['quotes'])
              # Corrupt only the exported native lot field; the independent
              # original-venue-byte oracle must detect it, not trust output.
              tampered=json.loads(output.read_text())
              tampered['quotes'][0]['native_contract_terms']['min_trade_amount']=999.0
              output.write_text(json.dumps(tampered))
              try:
                  audit(root,output)
              except AssertionError:
                  pass
              else:
                  raise AssertionError('FORGED_NATIVE_LOT_TERM_NOT_DETECTED')
              # A forged original registry source digest must also fail.
              tampered=json.loads(json.dumps(report))
              tampered['quotes'][0]['native_registry_source_sha256']='0'*64
              output.write_text(json.dumps(tampered))
              try:
                  audit(root,output)
              except AssertionError:
                  pass
              else:
                  raise AssertionError('FORGED_NATIVE_ORIGINAL_SHA_NOT_DETECTED')
          # The pre-2023 price grid is 0.0005; off-grid 0.0401 must not
          # leak into the downstream entry books even with intact file hashes.
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)/'original'
              make_fixture(root)
              attach_synthetic_native_bytes(root)
              path=root/'2021-12-12.csv'
              with path.open(newline='',encoding='utf-8') as fp:
                  rows=list(csv.DictReader(fp))
              rows[1]['bid_price']='0.0401'
              with path.open('w',newline='',encoding='utf-8') as fp:
                  writer=csv.DictWriter(fp,fieldnames=rows[0].keys())
                  writer.writeheader()
                  writer.writerows(rows)
              manifest_path=root/'manifest.json'
              manifest=json.loads(manifest_path.read_text())
              manifest['days'][0]['sha256']=hashlib.sha256(path.read_bytes()).hexdigest()
              manifest_path.write_text(json.dumps(manifest))
              result=export_books(root)
              assert result['source_pairs']==181 and len(result['quotes'])==363
              output=root/'offgrid_books.json'
              output.write_text(json.dumps(result))
              assert audit(root,output)==363
          print('ORIGINAL-BYTE TICK-STEPS BOUND / 2022 OFF-GRID QUOTE EXCLUDED')
          print('TEST-ONLY FAKE NATIVE ARCHIVE: UNLISTED ENTRY EXCLUDED, NO REAL PROVENANCE')
          print('SOURCE-TO-ENGINE ENTRY BOOKS INDEPENDENTLY VERIFIED')
          print('SYNTHETIC ONLY; REAL 2021-2023 QUOTE TAPE ABSENT; NO ECONOMICS, NO PROMOTION, NO ORDERS')
          PY
