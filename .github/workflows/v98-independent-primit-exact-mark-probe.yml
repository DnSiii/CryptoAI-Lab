name: V98 Independent Primit Exact Funding Mark Transport Source-Only Probe
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-primit-exact-mark-probe.yml'
      - 'research/v98_independent/v98_primit_exact_mark_source_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v98-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only strict 2023-01 BTC funding event sample
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_primit_exact_mark_source_probe.py
          python v98_primit_exact_mark_source_probe.py --output v98_primit_mark_probe_receipt.json --raw-output v98_primit_2023_01_btc_raw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-primit-mark-source-only-${{ github.run_id }}
          path: |
            research/v98_independent/v98_primit_mark_probe_receipt.json
            research/v98_independent/v98_primit_2023_01_btc_raw.json
          retention-days: 30
          if-no-files-found: warn
