name: V98 NS Independent Raw Source Oracle (No PnL)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ns-independent-source.yml'
      - 'research/v98_independent/v98_ns_independent_source_oracle.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  independent-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Independently reconstruct 53 biweekly source decisions
        working-directory: research/v98_independent
        run: |
          python v98_ns_independent_source_oracle.py --root ../../official-input --output ns_independent_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-ns-independent-source-${{ github.run_id }}
          path: research/v98_independent/ns_independent_source_receipt.json
          retention-days: 30
