name: V99 R106 recorded TRAIN status census
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_train_candidate_inventory.py
      - research/tests/test_v99_r106_train_candidate_inventory.py
      - .github/workflows/v99-r106-train-candidate-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/tests -p 'test_v99_r106_train_candidate_inventory.py' -v
      - run: python -m research.tools.v99_r106_train_candidate_inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-train-inventory
          retention-days: 90
          if-no-files-found: error
          path: research_evidence/train_inventory.json
