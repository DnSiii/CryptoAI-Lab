name: V98 Independent VX Frozen Exposed Physical Independent Accounting Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-vx-physical-audit.yml'
      - 'research/v98_independent/vx_spot_led_physical_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vx-independent-ledger:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: v98-vx-2025-exposed-physical-not-validated
          run-id: 41423925777
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-spot-2025-masked-source-only
          run-id: 41328347003
          github-token: ${{ github.token }}
          path: spot25
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: nh25
      - name: Independent 8760-hour source, cash, fills, fee and funding replay
        run: |
          python research/v98_independent/vx_spot_led_physical_oracle.py \
            --spot-dir spot25 --nh-dir nh25 \
            --ledger frozen/vx_base_full_hourly_ledger.csv \
            --receipt frozen/vx_exposed_physical.json | tee vx_oracle.json
      - name: Enforce original frozen economic rejection, no resurrection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('frozen/vx_exposed_physical.json').read_text())
          assert r['decision']=='REJECT_VX_EXPOSED_TRAINING'
          assert len(r['cells'])==30
          assert not r['account_costs_authenticated'] and not r['exact_funding_marks_authenticated']
          assert not r['holdout_accessed'] and not r['paper_live_authorized']
          print('VX_ORIGINAL_REJECTION_PRESERVED',len(r['gate_failures']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-vx-frozen-2025-independent-audit-not-engine
          path: vx_oracle.json
          retention-days: 30
          if-no-files-found: warn
