name: V98 OQ Funding-Dislocation Cross-Sectional Seven-Slot 30-Cell Physical and Independent Gates
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-oq-funding-dislocation-30cell.yml'
      - 'research/v98_independent/oq_*.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  oq-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned authenticated Clean-4 2022-24 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download pinned independently audited native OI v2 (2022-24 only)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: frozen-oi
      - name: Download pinned official worst-side hourly mark envelope (not exact event mark)
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Source-only and causal synthetic gates before PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile oq_sources.py oq_intents.py oq_source_gate.py oq_independent_source_oracle.py oq_independent_allocator_oracle.py oq_30cell_physical.py oq_hourly_oracle_gate.py oq_independent_fill_oracle.py oq_independent_receipt_arithmetic_audit.py oq_independent_source_oracle.py oq_independent_allocator_oracle.py
          python oq_sources.py
          python oq_intents.py
          python oq_source_gate.py --root ../../official-input --oi-root ../../frozen-oi --output oq_source_receipt.json
          python oq_independent_source_oracle.py --root ../../official-input --oi-root ../../frozen-oi --output oq_independent_source_receipt.json
          python oq_independent_allocator_oracle.py --root ../../official-input --oi-root ../../frozen-oi --output oq_independent_allocator_receipt.json
      - name: Run preregistered OQ funding-dislocation 30-cell signed physical training
        id: physical
        continue-on-error: true
        working-directory: research/v98_independent
        run: |
          python oq_30cell_physical.py --root ../../official-input --oi-root ../../frozen-oi --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output oq_30cell_receipt.json --ledger-output oq_base_full_hourly_forensic.jsonl
      - name: Independent all-hour signed settlement
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s oq_30cell_receipt.json && test -s oq_base_full_hourly_forensic.jsonl; then
            python oq_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl oq_base_full_hourly_forensic.jsonl --receipt oq_30cell_receipt.json --output oq_independent_hourly_receipt.json
          else
            echo "NO_COMPLETE_OP_LEDGER_FOR_INDEPENDENT_SETTLEMENT"
          fi
      - name: Independently reconstruct net physical fills and tamper detection
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s oq_base_full_hourly_forensic.jsonl; then
            python oq_independent_fill_oracle.py --root ../../official-input --oi-root ../../frozen-oi --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl oq_base_full_hourly_forensic.jsonl --output oq_independent_fill_receipt.json
          else
            echo "NO_COMPLETE_OP_LEDGER_FOR_INDEPENDENT_FILLS"
          fi
      - name: Independent 30-cell arithmetic and economic gate
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s oq_30cell_receipt.json; then
            python oq_independent_receipt_arithmetic_audit.py --receipt oq_30cell_receipt.json > oq_independent_arithmetic_receipt.json
            cat oq_independent_arithmetic_receipt.json
          else
            echo "NO_OP_RECEIPT_FOR_ARITHMETIC_AUDIT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-op-original-${{ github.run_id }}
          path: |
            research/v98_independent/oq_source_receipt.json
            research/v98_independent/oq_independent_source_receipt.json
            research/v98_independent/oq_independent_allocator_receipt.json
            research/v98_independent/oq_30cell_receipt.json
            research/v98_independent/oq_independent_hourly_receipt.json
            research/v98_independent/oq_independent_fill_receipt.json
            research/v98_independent/oq_independent_arithmetic_receipt.json
            research/v98_independent/oq_base_full_hourly_forensic.jsonl
          retention-days: 30
          if-no-files-found: warn
      - name: Economic gate is binding; no false completion
        if: always()
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('oq_30cell_receipt.json')
          if not p.exists():raise SystemExit('OQ_MISSING_PHYSICAL_RECEIPT')
          r=json.loads(p.read_text())
          print('OQ_ORIGINAL_DECISION',r['decision'])
          print('OQ_GATE_FAILURES',r['gate_failures'])
          if r['decision']!='PASS_PROVISIONAL_TRAINING_NOT_VALIDATED':
              raise SystemExit('OQ_REJECTED_NO_PROMOTION')
          if not Path('oq_independent_source_receipt.json').exists() or not Path('oq_independent_allocator_receipt.json').exists() or not Path('oq_independent_hourly_receipt.json').exists() or not Path('oq_independent_fill_receipt.json').exists() or not Path('oq_independent_arithmetic_receipt.json').exists():
              raise SystemExit('OQ_MISSING_INDEPENDENT_EVIDENCE')
          print('OQ_PROVISIONAL_TRAINING_ONLY_NOT_INDEPENDENT_VALIDATION')
          PY
