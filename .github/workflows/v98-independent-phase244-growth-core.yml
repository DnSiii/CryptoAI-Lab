name: V98 Independent Phase244 Growth Core
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase244-growth-core.yml'
      - 'research/v98_independent/phase244_growth_core.py'
      - 'research/v98_independent/test_phase244_growth_core.py'
      - 'research/v98_independent/phase244_growth_core_prereg.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase244-growth-core
  cancel-in-progress: false
jobs:
  growth-core-training:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Phase244 causality and invariant tests
        run: PYTHONPATH=src python -m pytest -q research/v98_independent/test_phase244_growth_core.py
      - name: Rebuild authenticated Clean-4 training source
        run: python research/v98_independent/phase243_clean4_source_pipeline.py --attempts 3
      - name: Execute frozen Phase244 twice
        run: |
          python research/v98_independent/phase244_growth_core.py --out /tmp/phase244_a.json
          python research/v98_independent/phase244_growth_core.py --out /tmp/phase244_b.json
          cmp /tmp/phase244_a.json /tmp/phase244_b.json
          cp /tmp/phase244_a.json research/v98_independent/phase244_growth_core_results.json
      - name: Enforce Phase244 firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase244_growth_core_results.json'))
          assert p['phase']==244 and p['role']=='growth_core'
          assert p['training_only'] is True and p['validation'] is None
          assert p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert p['parameters']['assets']==['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT']
          assert p['parameters']['entry_hours']==2160 and p['parameters']['exit_hours']==720
          assert p['parameters']['gross_cap']==1.0
          assert p['gate']['decision'] in {'GROWTH_CORE_CANDIDATE','REJECT_GROWTH_CORE_NO_RESCUE'}
          assert p['diagnostics']['max_open_gross']<=1.000000001
          print('Phase244',p['gate']['decision'])
          PY
      - name: Commit Phase244 training evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase244_growth_core_results.json
          if git diff --cached --quiet; then
            echo no-result-change
          else
            git commit -m "v98 phase244: record Growth Core training evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - name: Upload Phase244 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v98-phase244-growth-core-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: research/v98_independent/phase244_growth_core_results.json
