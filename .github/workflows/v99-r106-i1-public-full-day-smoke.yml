name: V99 I1 REAL public full-day OPTIONS source smoke (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_public_full_day_probe.py
      - research/tests/test_v99_r106_i1_public_full_day_probe.py
      - .github/workflows/v99-r106-i1-public-full-day-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-original-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm real-day preregistration predates code
        run: |
          git merge-base --is-ancestor 917d91df8cd0d3ccbba0eaa8229b0dee5335ad1d HEAD
          test -s research/V99_R106_I1_PUBLIC_FULL_DAY_SOURCE_SMOKE_PREREG_20261028.md
      - name: Test offline adversarial controls (not market evidence)
        run: python -m unittest research.tests.test_v99_r106_i1_public_full_day_probe -v
      - name: Attempt one real free original day, bounded; never upload raw gzip
        run: python -m research.tools.v99_r106_i1_public_full_day_probe | tee public_probe_summary.json
      - name: Verify real vs fixture status and no economic claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('public_probe_summary.json').read_text())
          assert r['fixture'] is False
          assert r['day']=='2022-06-01'
          assert r['economic_train_executed'] is False
          assert r['complete_661_day_train_certified'] is False
          assert r['native_terms_or_fills_certified'] is False
          assert not any(r[k] for k in ('roi_calculated','validation_opened',
                                       'holdout_opened','promotion_authorized','orders_enabled'))
          if r['status']=='PUBLIC_REAL_FULL_DAY_SOURCE_SMOKE_PASS':
              assert r['real_full_day_original_quote_scan_passed']
              assert r['rows']>0 and all(v>0 for v in r['qualifying_put_rows_by_asset'].values())
              print('REAL PUBLIC DAY SOURCE FORMAT VERIFIED; 660 MORE TRAIN DAYS + NATIVE TERMS MISSING; NO TRAIN')
          else:
              assert not r['real_full_day_original_quote_scan_passed']
              print('REAL PUBLIC DAY INCOMPLETE OR UNAVAILABLE:',r['status'])
              # Unexpected content or importer rejection is a real code/data issue.
              assert r['status'] in ('BOUNDED_REAL_SOURCE_INCOMPLETE',
                  'PUBLIC_DAY_TIME_CAP_EXCEEDED', 'PUBLIC_DAY_HTTP_UNAVAILABLE',
                  'PUBLIC_DAY_HTTP_NOT_200','PUBLIC_DAY_NETWORK_OR_SOURCE_UNAVAILABLE')
          PY
      - name: Upload redacted source-only summary (NEVER archive)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-public-full-day-source-summary-${{ github.run_id }}
          path: public_probe_summary.json
          if-no-files-found: warn
          retention-days: 14
