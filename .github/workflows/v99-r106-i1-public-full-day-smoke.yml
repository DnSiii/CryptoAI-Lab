name: V99 I1 REAL public full-day OPTIONS source smoke (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_public_full_day_probe.py
      - research/verification/independent_v99_r106_i1_hourly_capture_oracle.py
      - research/V99_R106_I1_ORIGINAL_DAY_HOURLY_COVERAGE_PREREG_20261028.md
      - research/V99_R106_I1_ORIGINAL_DAY_HOURLY_COVERAGE_CORRECTION_20261028.md
      - research/tests/test_v99_r106_i1_public_full_day_probe.py
      # Verify this workflow's own repair in a real run, not only in source review.
      - .github/workflows/v99-r106-i1-public-full-day-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v99-i1-public-original-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-original-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm real-day preregistration predates code
        run: |
          git merge-base --is-ancestor 917d91df8cd0d3ccbba0eaa8229b0dee5335ad1d HEAD
          git merge-base --is-ancestor df2fb82e5c4325b189d4699bc1dcaac60ab3cc2a HEAD
          git merge-base --is-ancestor 9218d88cf7c61fcebb787f1fa21efd5a2e8d99ed HEAD
          test -s research/V99_R106_I1_PUBLIC_FULL_DAY_SOURCE_SMOKE_PREREG_20261028.md
      - name: Test offline adversarial controls (not market evidence)
        run: python -m unittest research.tests.test_v99_r106_i1_public_full_day_probe research.tests.test_v99_r106_i1_local_tape_import -v
      - name: Attempt one real free original day, bounded; never upload raw gzip
        run: python -m research.tools.v99_r106_i1_public_full_day_probe | tee public_probe_summary.json
      - name: Verify real vs fixture status and no economic claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('public_probe_summary.json').read_text())
          assert r['fixture'] is False
          assert r['day']=='2022-06-01'
          assert r['economic_train_executed'] is False
          assert r['complete_661_day_train_certified'] is False
          assert r['native_terms_or_fills_certified'] is False
          assert not any(r[k] for k in ('roi_calculated','validation_opened',
                                       'holdout_opened','promotion_authorized','orders_enabled'))
          if r['status']=='PUBLIC_REAL_FULL_DAY_SOURCE_SMOKE_PASS':
              assert r['real_full_day_original_quote_scan_passed']
              assert r['btc_eth_24_hour_source_coverage']
              assert r['independent_btc_eth_hourly_verification']
              assert r['qualifying_put_arrival_hours_by_asset']=={'BTC':24,'ETH':24}
              # Ex-ante 2026-10-28 real-byte parity pin: reject a changed
              # vendor day rather than silently treating a different tape as
              # the same historical input. This is NOT a PnL or fill gate.
              assert r['sha256']=='9d7b1e62fb7f16648348154ebcece472461d3038c96e61ca7e96de4ce8adcdbd'
              assert r['downloaded_bytes']==217070416
              assert r['rows']==14720180
              assert r['qualifying_put_rows_by_asset']=={'BTC':1778798,'ETH':3138873}
              print('PINNED ORIGINAL 2022-06-01 BYTES/ROWS/ASSETS + INDEPENDENT HOURS MATCH; NO TRAIN')
          else:
              assert not r['real_full_day_original_quote_scan_passed']
              print('REAL PUBLIC DAY INCOMPLETE OR UNAVAILABLE:',r['status'])
              # Unexpected content or importer rejection is a real code/data issue.
              assert r['status'] in ('BOUNDED_REAL_SOURCE_INCOMPLETE',
                  'PUBLIC_DAY_TIME_CAP_EXCEEDED', 'PUBLIC_DAY_HTTP_UNAVAILABLE',
                  'PUBLIC_DAY_HTTP_NOT_200','PUBLIC_DAY_NETWORK_OR_SOURCE_UNAVAILABLE',
                  'PUBLIC_DAY_HOURLY_GAP','PUBLIC_DAY_HOURLY_ORACLE_MISMATCH')
          PY
      - name: Upload redacted source-only summary (NEVER archive)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-public-full-day-source-summary-${{ github.run_id }}
          path: public_probe_summary.json
          if-no-files-found: warn
          retention-days: 14
