name: V98 Independent LT Early Physical Rejection Diagnostic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-lt-physical-diagnostic.yml'
      - 'research/v98_independent/lt_local_physical_diagnostic.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  lt-physical-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve pinned 2022-2024 original Clean4 training source
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Source hard gate and ten signed-collateral local rejection-only cells
        working-directory: research/v98_independent
        run: |
          python -m py_compile lt_sources.py lt_independent_source_gate.py lt_local_physical_diagnostic.py
          python lt_local_physical_diagnostic.py --root ../../official-input --output lt_local_early_physical_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-lt-early-physical-${{ github.run_id }}
          path: research/v98_independent/lt_local_early_physical_receipt.json
          retention-days: 30
          if-no-files-found: warn
