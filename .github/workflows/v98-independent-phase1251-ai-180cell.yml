name: V98 Independent Phase1251 AI Complete 180 Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1251-ai-180cell.yml'
  workflow_dispatch:
jobs:
  ai-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Execute all 180 preregistered AI synthetic cells
        working-directory: research/v98_independent
        run: |
          python phase1251_ai_complete_180cell.py --output ai_phase1251_receipt.json || echo 'STRUCTURAL_REJECTION: preserve complete raw receipt'
      - name: Upload raw AI receipts even on structural failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-phase1251-${{ matrix.os }}
          path: research/v98_independent/ai_phase1251_receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Enforce complete survival and executable marginal activity
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json
          a=json.load(open('ai_phase1251_receipt.json'))
          c=a['cells'];p=sum(x['passed'] for x in c)
          print('AI1251_DECISION',a['decision'])
          print('AI1251_PASS',p,'AI1251_FAIL',len(c)-p)
          print('AI1251_EXCITED',a['mandatory_slots_excited'])
          assert len(c)==180 and p==180 and a['mandatory_slots_excited']
          PY
  reconcile:
    if: always()
    needs: ai-full
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-phase1251-*
          path: receipts
          merge-multiple: false
      - name: Crossrunner compare all 180 raw AI cells
        run: |
          python - <<'PY'
          import json,glob,math,hashlib
          files=sorted(glob.glob('receipts/*/*.json'))
          assert len(files)==2,files
          a,b=[json.load(open(p)) for p in files]
          money={'synthetic_final_nav','synthetic_min_nav','turnover','fees','slippage','funding'}
          ratios={'synthetic_max_dd'}
          def check(x,y,path=''):
              assert type(x)==type(y),(path,type(x),type(y))
              if isinstance(x,dict):
                  assert set(x)==set(y),(path,set(x)^set(y))
                  for k in x:check(x[k],y[k],path+'.'+k)
              elif isinstance(x,list):
                  assert len(x)==len(y),(path,len(x),len(y))
                  for i,(u,v) in enumerate(zip(x,y)):check(u,v,path+'.'+str(i))
              elif isinstance(x,float):
                  key=path.split('.')[-1]
                  tol=(1e-10 if key in ratios else
                       max(1e-5,1e-12*max(abs(x),abs(y))) if key in money
                       else 1e-12)
                  assert math.isfinite(x) and math.isfinite(y) and abs(x-y)<=tol,(path,x,y,tol)
              else:assert x==y,(path,x,y)
          check(a,b)
          def canonical(x,key=''):
              if isinstance(x,dict):return {k:canonical(v,k) for k,v in sorted(x.items())}
              if isinstance(x,list):return [canonical(v,key) for v in x]
              if isinstance(x,float):return round(x,10 if key in ratios else 5 if key in money else 12)
              return x
          for p,r in zip(files,(a,b)):
              h=hashlib.sha256(json.dumps(canonical(r),sort_keys=True,separators=(',',':')).encode()).hexdigest()
              print('AI1251_CANONICAL_SHA256',p,h)
          print('AI1251_CROSSRUNNER_RECONCILED',len(a['cells']),'cells')
          print('AI1251_STRUCTURAL_DECISION',a['decision'])
          PY
