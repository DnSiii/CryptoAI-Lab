name: V98 Independent WR Structural Beta Reversal Seven-Slot Exposed Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-wr-structural-beta.yml'
      - 'research/v98_independent/wr_structural_beta_reversal.py'
      - 'research/v98_independent/wr_structural_beta_reversal_physical.py'
      - 'research/v98_independent/wr_independent_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wr-exposed:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: WR syntax and causal future-mutation self-test
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/wr_structural_beta_reversal.py research/v98_independent/wr_structural_beta_reversal_physical.py research/v98_independent/wr_independent_audit.py
          python research/v98_independent/wr_structural_beta_reversal.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: WR complete physical exposed training
        run: |
          set -euo pipefail
          python research/v98_independent/wr_structural_beta_reversal_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir wr-training
      - name: WR independent hourly cash funding and tamper audit
        run: |
          set -euo pipefail
          python research/v98_independent/wr_independent_audit.py --out-dir wr-training
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-wr-exposed-training-not-validated
          path: wr-training/
          retention-days: 30
          if-no-files-found: warn
      - name: WR final explicit nonapproval receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('wr-training/wr_exposed_physical.json').read_text())
          print('WR_DECISION',r['decision'],'INCIDENCE',r['sleeve_incidence'],'FAILURES',r.get('failures',r.get('failed_incidence')))
          for tier in ('base','severe','supersevere'):
              x=next((c for c in r['cells'] if c['book']=='WR_full' and c['tier']==tier and c['order']=='carried_before_fill'),None)
              print('WR_FULL',tier,json.dumps({k:x.get(k) for k in ('passed','reason','hour','cagr','max_dd','annual_returns','governor_trims','fees_spread_impact','signed_funding','turnover')} if x else {'not_run':True},sort_keys=True))
          print('WR_NOT_VALIDATED_NOT_PAPER_NOT_LIVE')
          PY
