name: V98 Independent Phase1223 AF Complete Seven Slot 180 Cell Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1223_af_complete_180cell.py'
      - 'research/v98_independent/test_phase1223_af_complete_180cell.py'
      - '.github/workflows/v98-independent-phase1223-af-complete.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  af-full-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Execute complete AF 180 cells once and preserve all failures
        run: |
          python - <<'PY'
          import json,unittest
          from pathlib import Path
          from test_phase1223_af_complete_180cell import AFCompleteSyntheticTests
          suite=unittest.defaultTestLoader.loadTestsFromTestCase(AFCompleteSyntheticTests)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          receipt=AFCompleteSyntheticTests.receipt
          Path('phase1223_af_complete_180cell_receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2,allow_nan=False)+'\n')
          print(json.dumps({'decision':receipt['decision'],
                'passed':sum(x['passed'] for x in receipt['cells']),
                'failures':[x.get('reason') for x in receipt['cells']
                            if not x['passed']][:10]},sort_keys=True))
          assert result.wasSuccessful(), 'AF1223_STRUCTURAL_GATE_FAILED_NO_RESCUE'
          PY
      - name: Preserve every synthetic AF cell even after rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-af-phase1223-${{ matrix.os }}
          path: research/v98_independent/phase1223_af_complete_180cell_receipt.json
          retention-days: 30
          if-no-files-found: warn
  af-full-crossrunner:
    needs: af-full-synthetic
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v98-af-phase1223-*
          path: /tmp/v98-af-phase1223
      - name: Strict cross-OS 180-cell numerical and failure reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v98-af-phase1223')
          paths=[root/('v98-af-phase1223-'+os)/'phase1223_af_complete_180cell_receipt.json'
                 for os in ('ubuntu-22.04','ubuntu-24.04')]
          if not all(p.is_file() for p in paths):
              raise SystemExit('AF1223_MISSING_INDEPENDENT_RECEIPTS')
          a,b=[json.loads(p.read_text()) for p in paths]
          assert len(a['cells'])==len(b['cells'])==180
          for x,y in zip(a['cells'],b['cells']):
              for k in ('fixture','path','mode','fee','order','passed'):
                  assert x[k]==y[k], 'AF1223_DISCRETE_DRIFT_'+k
              if not x['passed']:
                  assert x['reason']==y['reason'], 'AF1223_FAILURE_DRIFT'
              else:
                  for k in ('hours_executed','active_hours'):
                      assert x[k]==y[k], 'AF1223_DISCRETE_DRIFT_'+k
                  for k in ('synthetic_final_nav','synthetic_turnover','synthetic_fees',
                            'synthetic_slippage','synthetic_funding',
                            'nonzero_execution_fraction'):
                      assert abs(x[k]-y[k])<=1e-7, 'AF1223_NUMERIC_DRIFT_'+k
          assert a['decision']==b['decision']=='PASS_AF_180_CAUSAL_SYNTHETIC_NOT_ECONOMIC'
          assert sum(x['passed'] for x in a['cells'])==180
          assert a['historical_system_pnl_computed'] is False
          print(json.dumps({'decision':'PASS_AF_FULL_180_CROSSRUNNER_SYNTHETIC_ONLY',
                            'cells':180},sort_keys=True))
          PY
