name: V98 Independent Phase1259 AJ Clean4 Official Source Attestation
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1259-aj-source-attestation.yml'
  workflow_dispatch:
jobs:
  attest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Reauthenticate 100 official USD-M OHLC monthly archives
        working-directory: research/v98_independent
        run: |
          python phase803_training_ohlc_official_replay.py || echo 'AJ1259_OHLC_QUARANTINE: preserve source receipt'
      - name: Reauthenticate 100 native funding and 100 mark archives
        working-directory: research/v98_independent
        run: |
          python phase1000_four_asset_source_policy.py || echo 'AJ1259_MARK_FUNDING_QUARANTINE: preserve source receipt'
      - name: Preserve official source receipts and canonical training inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aj1259-official-source-${{ matrix.os }}
          path: |
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1000_four_asset_source_policy_receipt.json
            research/v98_independent/phase243_clean4_canonical/*.csv
            research/v98_independent/phase1000_four_asset_conservative_bounds_source_only.csv
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce official 18,288h x4 and 9,144 native event source gate
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json,pathlib
          a=json.load(open('phase803_official_training_ohlc_receipt.json'))
          b=json.load(open('phase1000_four_asset_source_policy_receipt.json'))
          print('AJ1259_OHLC',a['decision'])
          print('AJ1259_MARK_NATIVE',b['decision'])
          assert a['decision']=='PASS_PHASE803_100_OFFICIAL_KLINE_ARCHIVES_TRAINING_ONLY'
          assert len(a['assets'])==4
          assert all(x['hours']==18288 for x in a['assets'].values())
          assert b['decision'].startswith('PASS_100_MARK_100_FUNDING_')
          assert b['verified_asset_events']==9144
          assert len(list(pathlib.Path('phase243_clean4_canonical').glob('*_1h.csv')))==4
          PY
  reconcile:
    if: always()
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aj1259-official-source-*
          path: receipts
      - name: Reconcile official source manifests across two Ubuntu images
        run: |
          python - <<'PY'
          import glob,json
          dirs=sorted(glob.glob('receipts/aj1259-official-source-*'))
          assert len(dirs)==2,dirs
          names=('phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json')
          for name in names:
              a,b=[json.load(open(d+'/research/v98_independent/'+name)) for d in dirs]
              assert a==b,(name,a,b)
              assert a['decision'].startswith('PASS_'),(name,a['decision'])
              print('AJ1259_EXACT_OFFICIAL_SOURCE_PASS',name,a['decision'])
          PY
