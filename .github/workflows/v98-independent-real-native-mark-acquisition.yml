name: V98 Independent Real Native Mark Acquisition (No PnL)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-real-native-mark-acquisition.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve pinned training-only expected native funding events
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-authorized-mark-ingest-readiness-no-pnl
          run-id: 41580181612
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/expected
      - name: Verify pinned expectation and attempt real exchange-origin capture
        env:
          PYTHONPATH: research/v98_independent
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("${{ runner.temp }}/expected")
          paths=list(root.rglob("v98_native_expected_funding_2022_2025.csv"))
          if len(paths)!=1: raise SystemExit("EXPECTED_CSV_MISSING_OR_AMBIGUOUS")
          p=paths[0]
          print("expected_csv_sha256="+hashlib.sha256(p.read_bytes()).hexdigest())
          Path("/tmp/v98_expected_path").write_text(str(p))
          PY
          EXPECTED="$(cat /tmp/v98_expected_path)"
          SHA="$(sha256sum "$EXPECTED" | cut -d' ' -f1)"
          python research/v98_independent/v98_delivery_native_mark_collector.py \
            --expected-funding-csv "$EXPECTED" \
            --expected-funding-sha256 "$SHA" \
            --evidence-dir "${{ runner.temp }}/native_capture"
      - name: Preserve captured raw responses (transport only, origin NOT independently attested)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v98-independent-real-native-mark-raw-unattested
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/native_capture/authorized_funding_pages.jsonl
