name: V98 Independent PS Daily Stateful Trend Inventory Seven-Slot Full Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ps-daily-inventory.yml'
      - 'research/v98_independent/ps_daily_inventory_*.py'
      - 'research/v98_independent/ps_daily_inventory_composed_prereg_20261101.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ps-full-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile and causal synthetic before any PnL
        run: |
          python -m py_compile research/v98_independent/ps_daily_inventory_composed.py research/v98_independent/ps_daily_inventory_oracle.py research/v98_independent/ps_daily_inventory_receipt_audit.py
          python research/v98_independent/ps_daily_inventory_composed.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected
      - name: Execute PS 30-cell exposed training with independent decisions, cash and fill oracles
        working-directory: research/v98_independent
        env:
          OLD_ROOT: ${{ runner.temp }}/old
          OLD_ENVELOPE: ${{ runner.temp }}/old-envelope/v98_official_mark_envelope_training.csv
          NEW_ROOT: ${{ runner.temp }}/new
          CORRECTED_ROOT: ${{ runner.temp }}/corrected
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from v98_2025_full_training_source_bridge import load as load_price
          from ps_daily_inventory_composed import run
          d=load_price(os.environ["OLD_ROOT"],os.environ["OLD_ENVELOPE"],
                       os.environ["NEW_ROOT"],os.environ["CORRECTED_ROOT"])
          out=run(d)
          Path("ps_full_training_result.json").write_text(
              json.dumps(out,indent=2,sort_keys=True,allow_nan=False)+"\n")
          print("PS_BINDING_TRAINING_DECISION",out["decision"],
                "FAILURES",len(out["gate_failures"]),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-ps-full-training-receipt
          path: research/v98_independent/ps_full_training_result.json
          retention-days: 30
          if-no-files-found: warn
  ps-independent-audit:
    needs: ps-full-physical
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v98-ps-full-training-receipt
          path: ps-receipt
      - name: Independently replay economics and four receipt tamper cases
        run: |
          python research/v98_independent/ps_daily_inventory_receipt_audit.py ps-receipt/ps_full_training_result.json | tee ps_independent_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-ps-independent-receipt-audit
          path: ps_independent_audit.json
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce PS economic gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("ps-receipt/ps_full_training_result.json").read_text())
          if r["decision"]!="PASS_PROVISIONAL_PS_TRAINING_NOT_VALIDATED":
              raise SystemExit("PS_PREREGISTERED_ECONOMIC_REJECTION_NOT_APPROVED")
          PY
