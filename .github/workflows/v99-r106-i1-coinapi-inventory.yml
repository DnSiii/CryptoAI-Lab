name: V99 I1 bounded CoinAPI TRAIN archive inventory (NO DOWNLOADS / NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_coinapi_inventory_probe.py
      - research/tests/test_v99_r106_i1_coinapi_inventory_probe.py
      - .github/workflows/v99-r106-i1-coinapi-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-provider-bounded-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise no-key, bounded dates and provider failure cases
        run: python -m unittest research.tests.test_v99_r106_i1_coinapi_inventory_probe -v
      - name: Ensure AWS CLI is available for authenticated listing only
        run: command -v aws >/dev/null || python -m pip install 'awscli>=1.36,<2'
      - name: Probe actual 2021-23 original QUOTES object inventory without downloading
        env:
          COINAPI_API_KEY: ${{ secrets.COINAPI_API_KEY }}
        run: |
          python -m research.tools.v99_r106_i1_coinapi_inventory_probe
          echo 'Listing is not BTC/ETH lifecycle, fill, fee, margin or ROI proof. NO PROMOTION / NO ORDERS.'
