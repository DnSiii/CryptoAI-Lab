name: V99 I1 bounded CoinAPI TRAIN archive inventory (NO DOWNLOADS / NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_coinapi_inventory_probe.py
      - research/tests/test_v99_r106_i1_coinapi_inventory_probe.py
      - .github/workflows/v99-r106-i1-coinapi-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-provider-bounded-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise no-key, bounded dates and provider failure cases
        run: python -m unittest research.tests.test_v99_r106_i1_coinapi_inventory_probe -v
      - name: Ensure AWS CLI is available for authenticated listing only
        run: command -v aws >/dev/null || python -m pip install 'awscli>=1.36,<2'
      - name: Probe fixed 2022-01-23 Deribit put inventory (LIST only, no download or purchase)
        env:
          COINAPI_API_KEY: ${{ secrets.COINAPI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from research.tools.v99_r106_i1_coinapi_inventory_probe import probe_target
          result = probe_target()
          assert result["target_utc_day"] == "2022-01-23"
          assert result["original_24h_bbo_and_size_certified"] is False
          assert result["economic_train_executed"] is False
          assert result["promotion_authorized"] is False
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Probe legacy bounded TRAIN date inventory without downloading
        env:
          COINAPI_API_KEY: ${{ secrets.COINAPI_API_KEY }}
        run: |
          python -m research.tools.v99_r106_i1_coinapi_inventory_probe
          echo 'Provider LIST alone is not original BBO coverage or economic TRAIN. NO PROMOTION / NO ORDERS.'
