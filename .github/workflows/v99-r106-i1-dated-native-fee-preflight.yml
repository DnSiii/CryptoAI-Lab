name: V99 I1 dated native fee preflight (uncertified; no orders)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_dated_native_fee_preflight.py
      - research/tools/v99_r106_i1_cost_bound_execution.py
      - research/tests/test_v99_r106_i1_signed_wallet_fee_binding.py
      - research/tests/test_v99_r106_i1_signed_native_event_replay.py
      - research/tests/test_v99_r106_i1_signed_event_source_gate.py
      - research/tests/test_v99_r106_i1_signed_cli.py
      - research/V99_R106_I1_SIGNED_WALLET_NATIVE_FEE_BINDING_PREREG_20261101.md
      - research/V99_R106_I1_SIGNED_NATIVE_FEE_PER_EVENT_INDEPENDENT_ORACLE_PREREG_20261101.md
      - research/V99_R106_I1_SIGNED_OPEN_IMMEDIATE_NATIVE_CLOSE_RESERVE_PREREG_20261101.md
      - research/verification/independent_v99_r106_i1_dated_native_fee_oracle.py
      - research/tests/test_v99_r106_i1_dated_native_fee_preflight.py
      - .github/workflows/v99-r106-i1-dated-native-fee-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-reexecute-native-fee-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require dated fee preregistration to predate code
        run: |
          git merge-base --is-ancestor 02a83f22977cf79c4f258c69a5c11a8d92a6b2b2 HEAD
          test -s research/V99_R106_I1_DATED_NATIVE_FEE_ARITHMETIC_PREREG_20261101.md
      - name: Run independent arithmetic and adversarial signed-source veto
        run: python -m unittest -v research.tests.test_v99_r106_i1_dated_native_fee_preflight
      - name: Confirm wallet binding preregistration predates code
        run: |
          git merge-base --is-ancestor 8dfb1d3fc98a0858848263a8c8391a70b93ed19f HEAD
          test -s research/V99_R106_I1_SIGNED_WALLET_NATIVE_FEE_BINDING_PREREG_20261101.md
          git merge-base --is-ancestor 857f55150abbacb0e285943abba5e649deca5570 HEAD
          test -s research/V99_R106_I1_SIGNED_NATIVE_FEE_PER_EVENT_INDEPENDENT_ORACLE_PREREG_20261101.md
          git merge-base --is-ancestor 46a2ba7581c2bffb98ecd35e71a895d7d5ebd9c6 HEAD
          test -s research/V99_R106_I1_SIGNED_OPEN_IMMEDIATE_NATIVE_CLOSE_RESERVE_PREREG_20261101.md
      - name: Execute real wallet binding path with synthetic negative controls
        run: |
          python -m unittest -v research.tests.test_v99_r106_i1_signed_wallet_fee_binding
          python -m unittest -v research.tests.test_v99_r106_i1_cost_bound_execution
          python -m unittest -v research.tests.test_v99_r106_i1_signed_native_event_replay
          python -m unittest -v research.tests.test_v99_r106_i1_signed_event_source_gate
          python -m unittest -v research.tests.test_v99_r106_i1_signed_cli
      - name: Explicitly preserve external historical provenance block
        run: |
          python - <<'PY'
          from research.tools.v99_r106_i1_dated_native_fee_preflight import SCHEMA
          assert SCHEMA == "V99_I1_HISTORICAL_NATIVE_OPTION_FEE_SCHEDULE_V1"
          print("SYNTHETIC_ARITHMETIC_ONLY; NO LICENSED ORIGINAL 661D TAPE")
          print("NO HISTORICAL ACCOUNT TIER CERTIFICATION; NO EXECUTION/FILLS")
          print("0/180 ECONOMICALLY CERTIFIED; NO TRAIN/ROI/PROMOTION/ORDERS")
          PY
