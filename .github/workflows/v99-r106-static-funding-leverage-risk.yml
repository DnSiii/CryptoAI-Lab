name: V99 R106 ORIGINAL static funding leverage risk sensitivity (NOT ROI)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_static_funding_leverage_feasibility.py'
      - 'research/verification/independent_v99_r106_static_funding_leverage_oracle.py'
      - 'research/tests/test_v99_r106_static_funding_leverage.py'
      - '.github/workflows/v99-r106-static-funding-leverage-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v99-r106-funding-leverage-risk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-nominal-risk-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original mechanism and fixed sensitivity prereg precede implementation
        run: |
          git merge-base --is-ancestor baaaf2daa0253d32270ddf2e92dcb2ae4cfa77cb HEAD
          git merge-base --is-ancestor 8d6aa536558dca3a86970b432dc2f3a7b8386b8b HEAD
          test -s research/V99_R106_STATIC_FUNDING_LEVERAGE_RISK_FEASIBILITY_PREREG_20261030.md
      - name: Synthetic adversarial fail-closed checks
        run: python -m unittest -v research.tests.test_v99_r106_static_funding_leverage
      - name: Recollect and SHA256 verify 44 original Binance ZIPs; original fivefold rates
        run: python -m research.tools.v99_r106_static_funding_budget research_evidence/funding_leverage
      - name: Independent original 44-ZIP byte replay and fivefold source oracle
        run: python -m research.verification.independent_v99_r106_static_funding_budget_oracle research_evidence/funding_leverage
      - name: Calculate fixed source-only leverage sensitivity
        run: python -m research.tools.v99_r106_static_funding_leverage_feasibility research_evidence/funding_leverage
      - name: Independent original-oracle-derived risk sensitivity verification
        run: python -m research.verification.independent_v99_r106_static_funding_leverage_oracle research_evidence/funding_leverage
      - name: Enforce no strategy or promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_evidence/funding_leverage')
          r=json.loads((p/'static_funding_leverage_source_only.json').read_text())
          v=json.loads((p/'static_funding_leverage_independent_oracle.json').read_text())
          assert v['status']=='INDEPENDENT_SOURCE_ORACLE_TO_NOTIONAL_RISK_ARITHMETIC_PASS'
          assert r['status']=='SOURCE_ONLY_NOTIONAL_RISK_SENSITIVITY_NOT_AN_ECONOMIC_ENGINE'
          assert not r['economic_train_executed'] and not r['promotion_authorized']
          assert not r['validation_opened'] and not r['holdout_opened']
          assert not r['paper_modified'] and not r['frozen_modified'] and not r['orders_enabled']
          print('SOURCE-ONLY NOMINAL RISK FEASIBILITY / NOT ROI / NO PROMOTION')
          PY
      - name: Delete original source ZIP bytes even on failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('research_evidence/funding_leverage/raw_ephemeral')
          if p.exists(): shutil.rmtree(p)
          print('ORIGINAL ZIP/CHECKSUM BYTES REMOVED')
          PY
      - name: Preserve only redacted source and independent non-ROI risk evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-static-funding-leverage-source-only-${{ github.run_id }}
          path: |
            research_evidence/funding_leverage/static_funding_budget_source_only.json
            research_evidence/funding_leverage/static_funding_budget_independent_oracle.json
            research_evidence/funding_leverage/static_funding_leverage_source_only.json
            research_evidence/funding_leverage/static_funding_leverage_independent_oracle.json
          retention-days: 30
          if-no-files-found: warn
