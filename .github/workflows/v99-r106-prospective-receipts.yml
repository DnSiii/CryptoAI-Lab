name: V99 R106 first-party prospective receipt (no trading)

on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/tools/v99_r106_live_first_party_receipt.py'
      - 'research/tests/test_v99_r106_live_first_party_receipt.py'
      - '.github/workflows/v99-r106-prospective-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v99-r106-prospective-firstparty-capture
  cancel-in-progress: false

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout isolated research branch without write token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 (standard library only)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify receipt safety on entirely synthetic data
        run: python -m unittest discover -s research/tests -p 'test_v99_r106_live_first_party_receipt.py' -v
      - name: Capture first-party exchangeInfo and five closed-bar receipts
        run: python -m research.tools.v99_r106_live_first_party_receipt --out research_evidence/live_receipt
      - name: Show acquisition hashes and quarantine status
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('research_evidence/live_receipt')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['mode']=='DATA_ONLY'
          assert manifest['paper_publication_authorized'] is False
          assert manifest['promotion_authorized'] is False
          assert manifest['independently_exchange_signed'] is False
          for file in root.glob('*.json'):
              digest=hashlib.sha256(file.read_bytes()).hexdigest()
              print(file.name, digest)
          print('PROSPECTIVE RECEIPT: provenance observed, NOT exchange-signed')
          PY
      - name: Store immutable raw bytes and receipt time manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-prospective-source-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: research_evidence/live_receipt
