name: V99 I1 CoinAPI alternative historical options source contract (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_coinapi_quote_intake.py
      - research/tests/test_v99_r106_i1_coinapi_quote_intake.py
      - .github/workflows/v99-r106-i1-coinapi-alternative-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject unlicensed, noncausal, or malformed alternative quotes
        run: python -m unittest research.tests.test_v99_r106_i1_coinapi_quote_intake -v
      - name: Declare actual archive dependency, never synthetic profit
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path("research/data/v99_r106_i1_licensed_coinapi_archive").exists()
          print("BLOCKED: NO LICENSED 2021-2023 DERIBIT BTC/ETH COINAPI ARCHIVE; FORMAT TESTS ONLY; NO ECONOMICS/NO PROMOTION/NO ORDERS")
          PY
