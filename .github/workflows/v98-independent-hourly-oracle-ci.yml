name: V98 Independent Hourly Settlement Oracle Synthetic Tamper CI
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-hourly-oracle-ci.yml'
      - 'research/v98_independent/v98_independent_hourly_settlement_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v98-independent-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Verify independent hourly accounting oracle rejects fee and position tampering
        run: python research/v98_independent/v98_independent_hourly_settlement_oracle.py
