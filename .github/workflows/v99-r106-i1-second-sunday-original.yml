name: V99 I1 final precommitted 2023-01-01 real fixed-entry source (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_second_sunday_probe.py
      - research/tests/test_v99_r106_i1_second_sunday_probe.py
      - .github/workflows/v99-r106-i1-second-sunday-original.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v99-i1-second-sunday-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  second-original-sunday:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 32
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preregistration precedes implementation
        run: |
          git merge-base --is-ancestor 5988174838324d386b514198612ef138cd42a5f3 HEAD
          test -s research/V99_R106_I1_SECOND_FIXED_MONDAY_PUBLIC_SOURCE_PREREG_20261028.md
      - name: Run adversarial offline controls, no synthetic performance
        run: python -m unittest -v research.tests.test_v99_r106_i1_second_sunday_probe
      - name: Restore ORIGINAL 182 TRAIN-only causal signals
        run: |
          mkdir -p research_evidence/i1_original_causal
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
          test -s research_evidence/i1_original_causal/i1_causal_signal.json
      - name: Real public 2023-01-01 original quotes and independent fixed-Monday replay
        run: |
          python -m research.tools.v99_r106_i1_second_sunday_probe \
            research_evidence/i1_original_causal/i1_causal_signal.json \
            | tee second_original_sunday_summary.json
      - name: Fail closed on missing source and all economic promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("second_original_sunday_summary.json").read_text())
          assert r["schema"]=="V99_I1_SECOND_ORIGINAL_SUNDAY_FIXED_MONDAY_SOURCE_ONLY_V1"
          assert r["source_day"]=="2023-01-01" and r["decision_day"]=="2023-01-02"
          assert r["fixture"] is False
          assert r["real_original_day_verified"] is True, r["status"]
          assert r["independent_original_byte_reexecution"] is True
          assert r["hourly_qualifying_put_coverage"]=={"BTC":24,"ETH":24}
          assert r["status"] in ("SECOND_SUNDAY_REAL_SOURCE_BOOKS_PRESENT",
                                 "SECOND_SUNDAY_REAL_SOURCE_NO_FIXED_BOOKS")
          assert r["historical_option_lifecycles_certified"]==0
          assert all(r[k] is False for k in ("economic_train_executed","roi_calculated",
                 "native_terms_authenticated","validation_opened","holdout_opened",
                 "promotion_authorized","orders_enabled"))
          print("REAL SECOND SUNDAY:",r["status"],r["original_books_by_asset"])
          print("SOURCE ONLY; 0/180 CERTIFIED ECONOMIC LIFECYCLES; NO PROMOTION")
          PY
      - name: Delete original signal after verification
        if: always()
        run: rm -rf research_evidence/i1_original_causal
      - name: Upload redacted aggregate only, no original market bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-i1-second-original-sunday-summary-${{ github.run_id }}
          path: second_original_sunday_summary.json
          if-no-files-found: warn
          retention-days: 14
