name: V98 Independent HQ Official Masked Spot Source Only
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-hq-masked-source.yml'
      - 'research/v98_independent/hq_gap_aware_spot_source.py'
      - 'research/v98_independent/hq_spot_masked_feature_gate.py'
      - 'research/v98_independent/hq_partial_close_provenance_addendum_20261026.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run authenticated 100-archive source-only masked canonicalization
        run: python research/v98_independent/hq_gap_aware_spot_source.py
      - name: Independently gate causal feature input and preserve four partials
        run: python research/v98_independent/hq_spot_masked_feature_gate.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v98-hq-spot-masked-training-2022-2024
          path: research/v98_independent/hq_gap_aware_spot_source_only/
          retention-days: 30
          if-no-files-found: error
