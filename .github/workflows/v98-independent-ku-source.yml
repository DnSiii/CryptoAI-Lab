name: V98 Independent KU InverseVol Pullback Funding Bear Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ku-source.yml'
      - 'research/v98_independent/ku_inversevol_pullback_funding_bear_sources.py'
      - 'research/v98_independent/ku_source_viability.py'
      - 'research/v98_independent/ku_real_causality_audit.py'
      - 'research/v98_independent/ku_inversevol_pullback_funding_bear_prereg_20261029.md'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage pinned Clean-4 and native signed funding
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: KU synthetic and pinned official source-only gate
        working-directory: research/v98_independent
        run: |
          python -m py_compile ku_inversevol_pullback_funding_bear_sources.py ku_source_viability.py
          python ku_inversevol_pullback_funding_bear_sources.py
          python ku_source_viability.py
          python ku_real_causality_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ku-source-only-gate
          path: |
            research/v98_independent/ku_source_viability.json
            research/v98_independent/ku_real_causality_audit.json
          retention-days: 30
          if-no-files-found: warn
