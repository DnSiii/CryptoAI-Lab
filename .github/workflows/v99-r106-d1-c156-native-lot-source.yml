name: V99 R106 D1 C156 native-lot gate (SOURCE ONLY; NO ECONOMICS)
on:
  push:
    branches:
      - research/v99-r106-native-all-regime-engine
    paths:
      - 'research/verification/independent_d1_c151_executable_lot_gate.py'
      - 'research/tests/test_v99_r106_d1_c156_native_lot_smoke.py'
      - '.github/workflows/v99-r106-d1-c156-native-lot-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native lot, preregistration, and sealed calendar regression
        run: |
          python -m unittest research.tests.test_v99_r106_d1_c156_native_lot_smoke research.tests.test_v99_r106_d1_c153_pair_lattice research.tests.test_v99_r106_d1_c155_prereg_source research.tests.test_v99_r106_d1_full_train_guard -v
      - name: Explicit NO PROMOTION assertion
        run: |
          python - <<'PY'
          from research.tools.v99_r106_d1_basis_carry_preregistered import report_permissions
          p = report_permissions()
          assert not any(p[k] for k in ('historical_train_economics_run',
              'validation_opened', 'final_holdout_opened', 'promotion_authorized',
              'real_orders_enabled', 'paper_publication_authorized'))
          print('DATA_ONLY/HOLD — NO PROMOTION; no exchange-authenticated economics')
          PY
