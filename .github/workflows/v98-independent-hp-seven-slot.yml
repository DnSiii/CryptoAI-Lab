name: V98 Independent HP 168h Compression Breakout Stress Cash Seven Slot 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-hp-seven-slot.yml'
      - 'research/v98_independent/hp_preregistration_20261026.md'
      - 'research/v98_independent/hp_sources.py'
      - 'research/v98_independent/hp_source_viability.py'
      - 'research/v98_independent/hp_30cell.py'
      - 'research/v98_independent/hp_reconcile_30cell.py'
      - 'research/v98_independent/hp_independent_ledger_replay.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned training data only (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact authenticated Clean-4 source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: HP causal range-compression breakout and cash-reserve source viability
        working-directory: research/v98_independent
        run: |
          python -m py_compile hp_sources.py hp_source_viability.py hp_30cell.py hp_reconcile_30cell.py
          python hp_sources.py
          python -c 'import hp_30cell, hp_reconcile_30cell, hp_independent_ledger_replay'
          python hp_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hp-source-viability
          path: research/v98_independent/hp_source_viability.json
          retention-days: 30
          if-no-files-found: warn
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [HP_core_only, HP_full, HP_minus_opportunity, HP_minus_RV, HP_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Run native 6-cell path USD10k, base/severe/supersevere and both funding orders
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python hp_30cell.py --path ${{ matrix.path }} --output ho30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s ho30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ho30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/ho30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ho30-ubuntu-*
          path: receipts
      - name: Independent artifact-only 30-cell cross-OS and marginal gate
        shell: bash
        run: python research/v98_independent/hp_reconcile_30cell.py --root receipts --output ho30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ho30-official-economic-summary
          path: ho30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [HP_core_only, HP_full, HP_minus_opportunity, HP_minus_RV, HP_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding, NAV, fee, slippage and 81-corner settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py hp_independent_ledger_replay.py
          python hp_independent_ledger_replay.py --path ${{ matrix.path }} --output hp_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hp-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/hp_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
