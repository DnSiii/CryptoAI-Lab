name: V98 Independent ES Immutable 30 Cell Receipt Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-es-receipt-audit.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original immutable ES 30-cell 2-OS receipts only
        uses: actions/download-artifact@v4
        with:
          pattern: es30-ubuntu-*
          run-id: 40256341448
          github-token: ${{ github.token }}
          path: receipts
      - name: Reconcile cross-OS, annual marginal and physical gates without running strategies
        run: python research/v98_independent/es_reconcile_30cell.py --root receipts --output es30_immutable_receipt_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es30-immutable-receipt-audit
          path: es30_immutable_receipt_audit.json
          retention-days: 30
