name: V99 R106 S2 ONE-SHOT joint capitulation original OKX spot TRAIN (MODEL ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_s2_joint_capitulation_train.py'
      - 'research/verification/independent_v99_r106_s2_joint_capitulation_train.py'
      - 'research/V99_R106_S2_JOINT_CAPITULATION_PREREG_20261029.md'
      - '.github/workflows/v99-r106-s2-one-shot-joint-capitulation-train.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preregistered-train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preregistration preceded economic runner
        run: |
          python - <<'PY'
          import subprocess
          prereg='16395ea2da828a29a5636e1c3855017513fd3f00'
          subprocess.run(['git','merge-base','--is-ancestor',prereg,'HEAD'],check=True)
          print('EX_ANTE_PREREG_ANCESTOR_CONFIRMED; TRAIN_ONLY')
          PY
      - name: Fetch already archived 2021-2023 ORIGINAL OKX four-leg TRAIN prices
        run: |
          gh run download 40019588739 --repo "$GITHUB_REPOSITORY" \
            --name d1-train-four-leg-backfill-40019588739 \
            --dir research_evidence/s2_original_train
      - name: Execute exact preregistered S2 complete TRAIN severe/supersevere
        run: |
          python -m research.tools.v99_r106_s2_joint_capitulation_train \
            research_evidence/s2_original_train research_evidence/s2_one_shot_result
      - name: Independently reparse originals and replay EVERY hourly decision/cash/fee/NAV
        run: |
          python -m research.verification.independent_v99_r106_s2_joint_capitulation_train \
            research_evidence/s2_original_train \
            research_evidence/s2_one_shot_result/s2_train_model_only.json
      - name: Enforce no promotion regardless of historical modeled ROI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_evidence/s2_one_shot_result/s2_train_model_only.json')
          r=json.loads(p.read_text())
          assert r['original_train_hours']==15864
          assert set(r['fixed_gates'])=={
              'positive_both','four_of_five_both','worst_fold_both',
              'maxdd_both','severe_beats_passive_envelope',
              'four_of_six_regimes','best_day_removed_positive',
              'source_and_accounting','native_fee_fill_provenance'}
          assert r['fixed_gates']['native_fee_fill_provenance'] is False
          assert r['status'] in ('S2_REJECTED_NO_RETUNE','MODEL_ONLY_HOLD_NATIVE_PROVENANCE')
          assert all(r[k] is False for k in (
              'historical_native_fills_authenticated','historical_native_fee_tier_authenticated',
              'promotion_authorized','validation_opened','final_holdout_opened',
              'orders_enabled','paper_publication_authorized'))
          print('S2 ONE-SHOT TRAIN VERIFIED / MODEL ONLY / NO PROMOTION')
          PY
      - name: Archive model-only full TRAIN result and independent decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-s2-one-shot-model-only-train-${{ github.run_id }}
          path: research_evidence/s2_one_shot_result/
          retention-days: 90
          if-no-files-found: warn
