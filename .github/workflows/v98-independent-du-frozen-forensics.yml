name: V98 Independent DU Frozen Artifact-Only Economic Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-du-frozen-forensics.yml'
      - 'research/v98_independent/du_frozen_forensics.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable DU audited summary only
        uses: actions/download-artifact@v4
        with:
          name: du30-official-economic-summary
          run-id: 40195296617
          github-token: ${{ github.token }}
          path: frozen-receipts/summary
      - name: Fetch immutable DU core-only 6-cell artifact only
        uses: actions/download-artifact@v4
        with:
          name: du30-ubuntu-24.04-DU_core_only
          run-id: 40195296617
          github-token: ${{ github.token }}
          path: frozen-receipts/core
      - name: Reconcile frozen core displacement and marginal evidence
        run: python research/v98_independent/du_frozen_forensics.py
      - uses: actions/upload-artifact@v4
        with:
          name: du-frozen-economic-forensics
          path: du_frozen_forensics.json
          retention-days: 30
