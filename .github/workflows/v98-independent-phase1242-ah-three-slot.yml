name: V98 Independent Phase1242 AH Three Slot Causal Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1240_ah_regime_router.py'
      - 'research/v98_independent/phase1241_ah_online_growth_allocator.py'
      - 'research/v98_independent/phase1242_ah_signed_governor.py'
      - 'research/v98_independent/test_phase1240_1242_ah_three_slots.py'
      - '.github/workflows/v98-independent-phase1242-ah-three-slot.yml'
  workflow_dispatch:
jobs:
  ah-three-slot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numpy
        run: python -m pip install numpy==1.26.4
      - name: Execute preregistered causal tests
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1240_1242_ah_three_slots
      - name: Crossrunner deterministic digest
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import hashlib,numpy as np
          from phase1240_ah_regime_router import ah_regime_router
          from phase1241_ah_online_growth_allocator import AHOnlineGrowthAllocator
          from phase1242_ah_signed_governor import ah_governor_target
          t=np.arange(200,dtype=float)
          c=100*np.exp(t[:,None]*np.array([.001,-.001,.0005,-.0003]))
          z=np.zeros_like(c)
          router=ah_regime_router(c,z,z)
          a=AHOnlineGrowthAllocator()
          s=np.zeros((4,4));s[0,0]=1.;s[1,1]=-1.
          rows=[]
          for k in range(200):
              a.observe(np.array([.001*np.sin(k),.002,0.,0.]),np.zeros(4),np.zeros(4))
              v=a.decide(s,str(router['state'][k]))
              rows.extend(v['sleeve_weights']);rows.append(v['growth_scale'])
          q=ah_governor_target(10000.,np.zeros(4),np.full(4,100.),
              np.full(4,100.),np.array([3.,-3.,0.,0.]),
              np.full(4,.45),np.full(4,.8),np.full(4,.0005),
              np.full(4,1e9),np.full(4,1e9))
          rows.extend(q['units']);rows.append(q['fraction'])
          digest=hashlib.sha256(np.asarray(rows,dtype='<f8').tobytes()).hexdigest()
          print('AH1242_SHA256',digest)
          print('AH1242_OBSERVATIONS',a.observations)
          print('AH1242_GOVERNOR_FRACTION',q['fraction'])
          PY
