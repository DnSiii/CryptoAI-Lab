name: V98 Independent Spot Full 100 Archive Gap Inventory Only
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-spot-full-gap-inventory.yml'
      - 'research/v98_independent/spot_perp_full_gap_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-gap-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only checksum-verified 100-archive UTC inventory; no source rescue or PnL
        run: python research/v98_independent/spot_perp_full_gap_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-spot-100-archive-gap-inventory
          path: research/v98_independent/spot_perp_full_gap_inventory.json
          retention-days: 30
          if-no-files-found: warn
