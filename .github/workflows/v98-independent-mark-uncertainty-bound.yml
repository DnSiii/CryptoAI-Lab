name: V98 Independent Native Funding Mark Envelope Uncertainty Source Audit No PnL
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mark-uncertainty-bound.yml'
      - 'research/v98_independent/v98_mark_uncertainty_bound.py'
      - 'research/v98_independent/v98_mark_uncertainty_oracle.py'
      - 'research/v98_independent/v98_mark_uncertainty_prereg_20261101.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mark-source-uncertainty:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile independent diagnostic and run synthetic local bound
        run: |
          python -m py_compile research/v98_independent/v98_mark_uncertainty_bound.py research/v98_independent/v98_mark_uncertainty_oracle.py
          python research/v98_independent/v98_mark_uncertainty_bound.py --self-test
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: source_old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: source_envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: source_new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: source_corrected
      - name: Compute preregistered mark envelope uncertainty from authenticated native rates
        run: |
          python research/v98_independent/v98_mark_uncertainty_bound.py \
            --old-root source_old --old-envelope source_envelope/v98_official_mark_envelope_training.csv \
            --new-root source_new --corrected-root source_corrected \
            --output-dir v98_mark_uncertainty | tee v98_mark_uncertainty_stdout.json
      - name: Independent Decimal source replay and four negative controls
        run: |
          python research/v98_independent/v98_mark_uncertainty_oracle.py \
            --old-root source_old --old-envelope source_envelope/v98_official_mark_envelope_training.csv \
            --new-root source_new --corrected-root source_corrected \
            --csv v98_mark_uncertainty/v98_mark_uncertainty_events.csv \
            --receipt v98_mark_uncertainty/v98_mark_uncertainty_receipt.json \
            | tee v98_mark_uncertainty_oracle_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-mark-uncertainty-source-only-no-pnl
          path: |
            v98_mark_uncertainty/
            v98_mark_uncertainty_stdout.json
            v98_mark_uncertainty_oracle_result.json
          retention-days: 30
          if-no-files-found: warn
