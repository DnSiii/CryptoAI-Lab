name: V98 Independent BV Periodic Momentum Reentry Seven Slot 90-Cell Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-bv-seven-slot-90cell.yml'
      - 'research/v98_independent/bv_sources.py'
      - 'research/v98_independent/bv_allocator.py'
      - 'research/v98_independent/bv_90cell.py'
      - 'research/v98_independent/bv_reconcile.py'
      - 'research/v98_independent/bv_independent_receipt_audit.py'
      - 'research/v98_independent/bv_priority_governor.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [BV_core_only, BV_full, BV_minus_opportunity, BV_minus_RV, BV_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: BV periodic core momentum reentry with BNB SOL satellite physical settlement
        working-directory: research/v98_independent
        run: |
          python -m py_compile bv_sources.py bv_allocator.py bv_priority_governor.py bv_90cell.py bv_reconcile.py
          python bv_sources.py
          python bv_allocator.py
          python bv_priority_governor.py
      - name: Retrieve PINNED vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute BV complete actual-open native-funded chronological path x18
        working-directory: research/v98_independent
        run: |
          python bv_90cell.py \
            --path ${{ matrix.path }} \
            --output bv90_${{ matrix.path }}.json || echo 'BV_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bv90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/bv90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify all 18 path cells recorded, never hide failure
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('bv90_BV_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('BV_PATH_SURVIVAL',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bv90-ubuntu-*
          path: receipts
      - name: Independent two-OS 90-cell economic, marginal and causal gate
        run: python research/v98_independent/bv_reconcile.py --root receipts --output bv90_official_economic_summary.json
      - name: Independent original-receipt accounting audit (no BV engine imports)
        run: python research/v98_independent/bv_independent_receipt_audit.py --root receipts --output bv90_independent_arithmetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bv90-independent-arithmetic
          path: bv90_independent_arithmetic.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bv90-official-economic-summary
          path: bv90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  native-event-replay:
    needs: train
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve same pinned original training inputs
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage source without reading 2025
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Independently reconstruct native funding and 81 intrabar corners
        working-directory: research/v98_independent
        run: python bv_event_replay_audit.py --output bv_event_replay_original.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bv-native-event-independent-replay
          path: research/v98_independent/bv_event_replay_original.json
          retention-days: 30
          if-no-files-found: warn
