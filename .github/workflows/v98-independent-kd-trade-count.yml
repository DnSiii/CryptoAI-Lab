name: V98 Independent KD Native Trade Count Source Integrity Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kd-trade-count.yml'
      - 'research/v98_independent/kd_*'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned Clean-4 2022-2024 and native funding only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original pinned 2022-2024 native source
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Syntax and causal source contract (no system PnL)
        working-directory: research/v98_independent
        run: |
          python -m py_compile kd_native_trade_count_source.py kd_trade_fragmentation_sources.py kd_source_viability.py
          python kd_trade_fragmentation_sources.py
      - name: Verify 100 original official USD-M publisher ZIP/CHECKSUM and reconstruct pinned OHLC
        working-directory: research/v98_independent
        run: python kd_native_trade_count_source.py
      - name: Source-only financed sleeve and native zero-trade quarantine
        working-directory: research/v98_independent
        run: python kd_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kd-native-trade-count-source-only
          path: |
            research/v98_independent/kd_trade_count_2022_2024_native.csv
            research/v98_independent/kd_trade_count_source_receipt.json
            research/v98_independent/kd_source_viability.json
          retention-days: 30
          if-no-files-found: warn
