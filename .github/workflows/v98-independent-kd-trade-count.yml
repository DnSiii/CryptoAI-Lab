name: V98 Independent KD Native Trade Count Seven Slot 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kd-trade-count.yml'
      - 'research/v98_independent/kd_*'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned Clean-4 2022-2024 and native funding only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original pinned 2022-2024 native source
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Syntax and causal source contract (no system PnL)
        working-directory: research/v98_independent
        run: |
          python -m py_compile kd_native_trade_count_source.py kd_trade_fragmentation_sources.py kd_source_viability.py kd_30cell.py kd_reconcile_30cell.py kd_original_artifact_independent_audit.py kd_independent_ledger_replay.py
          python kd_trade_fragmentation_sources.py
      - name: Verify 100 original official USD-M publisher ZIP/CHECKSUM and reconstruct pinned OHLC
        working-directory: research/v98_independent
        run: python kd_native_trade_count_source.py
      - name: Source-only financed sleeve and native zero-trade quarantine
        working-directory: research/v98_independent
        run: python kd_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kd-native-trade-count-source-only
          path: |
            research/v98_independent/kd_trade_count_2022_2024_native.csv
            research/v98_independent/kd_trade_count_source_receipt.json
            research/v98_independent/kd_source_viability.json
          retention-days: 30
          if-no-files-found: warn

  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [KD_core_only, KD_full, KD_minus_opportunity, KD_minus_RV, KD_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage pinned Clean-4 and native funding
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kd-native-trade-count-source-only
          path: native-input
      - name: Stage pinned original trade-count source receipt and CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('research/v98_independent')
          for name in ('kd_trade_count_2022_2024_native.csv','kd_trade_count_source_receipt.json'):
              found=list(Path('native-input').rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Native physical USD10k six-cell path
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python kd_30cell.py --path ${{ matrix.path }} --output kd30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s kd30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kd30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/kd30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kd30-ubuntu-*
          path: receipts
      - uses: actions/download-artifact@v4
        with:
          name: kd-native-trade-count-source-only
          path: native-input
      - name: Independent original receipt 30-cell economic gate
        run: python research/v98_independent/kd_reconcile_30cell.py --root receipts --source-receipt native-input/kd_trade_count_source_receipt.json --output kd30_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kd30-economic-summary
          path: kd30_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
  original_receipt_audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kd30-ubuntu-*
          path: original-receipts
      - uses: actions/download-artifact@v4
        with:
          name: kd-native-trade-count-source-only
          path: native-input
      - name: Independently recompute 60 original receipts, no engine import
        run: python research/v98_independent/kd_original_artifact_independent_audit.py --root original-receipts --source-receipt native-input/kd_trade_count_source_receipt.json --output kd_original_independent_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kd-original-independent-economic-audit
          path: kd_original_independent_audit.json
          retention-days: 30
          if-no-files-found: warn
  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [KD_core_only, KD_full, KD_minus_opportunity, KD_minus_RV, KD_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage pinned Clean-4 and native funding
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kd-native-trade-count-source-only
          path: native-input
      - name: Stage pinned original trade-count source receipt and CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('research/v98_independent')
          for name in ('kd_trade_count_2022_2024_native.csv','kd_trade_count_source_receipt.json'):
              found=list(Path('native-input').rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Verify every settled hour and native funding with independent 81-corner oracle
        working-directory: research/v98_independent
        run: python kd_independent_ledger_replay.py --path ${{ matrix.path }} --output kd_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kd-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/kd_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
