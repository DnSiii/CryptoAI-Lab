name: V98 Independent DJ Frozen Artifact Only Native Cost Attribution
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-dj-cost-forensics.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen DJ independent official economic summary
        uses: actions/download-artifact@v4
        with:
          name: dj20-official-economic-summary
          run-id: 40174247771
          github-token: ${{ github.token }}
          path: frozen
      - name: Cost attribution on frozen receipt only, no backtest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('frozen/dj20_official_economic_summary.json').read_text())
          assert d['decision']=='REJECT_DJ_HISTORICAL_GROWTH_OR_MARGINAL'
          assert d['cells_survived']==20 and d['cross_os_reproducible'] and not d['errors']
          a,b=d['full_10k_base'],d['full_10k_severe']
          def pick(x):
              return {k:x[k] for k in ('final_nav','two_year_cagr','turnover','fees','slippage','funding','max_drawdown')}
          out={'architecture':'DJ','frozen_run_id':40174247771,
               'decision':'DJ_REJECTED_ARTIFACT_ONLY_NO_RESCUE',
               'base':pick(a),'severe':pick(b),
               'fee_slippage_severe_minus_base':b['fees']+b['slippage']-a['fees']-a['slippage'],
               'turnover_severe_minus_base':b['turnover']-a['turnover'],
               'full_marginal_gates':d['marginal_gates_10k'],
               'marginal_log_growth':d['marginal_log_growth_10k'],
               'holdout_2025_read':False,'backtest_rerun':False}
          Path('dj_frozen_cost_forensics.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('DJ_FROZEN_COST_FORENSICS',json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dj-frozen-cost-forensics
          path: dj_frozen_cost_forensics.json
          retention-days: 30
