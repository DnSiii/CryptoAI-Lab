name: V98 Independent BZ Liquidity Confirmed Continuation Source
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-bz-liquidity-continuation.yml'
      - 'research/v98_independent/bz_liquidity_confirmed_continuation_source.py'
      - 'research/v98_independent/bz_liquidity_confirmed_continuation_independent_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve original pinned Clean4 2022-24 training-only source
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage authenticated original training-only bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Run preregistered BZ native-funded source economic falsification
        working-directory: research/v98_independent
        run: |
          python -m py_compile bz_liquidity_confirmed_continuation_source.py
          python bz_liquidity_confirmed_continuation_source.py --output bz_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bz-source-${{ matrix.os }}
          path: research/v98_independent/bz_source_receipt.json
          retention-days: 30
          if-no-files-found: error
  independent:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          pattern: bz-source-ubuntu-*
          path: receipts
      - name: Retrieve pinned original Clean4 for independent rederivation
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage authenticated original bytes for independent audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Independently reconstruct BZ decisions and native-funded economics
        working-directory: research/v98_independent
        run: |
          python -m py_compile bz_liquidity_confirmed_continuation_independent_audit.py
          python bz_liquidity_confirmed_continuation_independent_audit.py --root ../../receipts --output bz_independent_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bz-independent-economic-audit
          path: research/v98_independent/bz_independent_summary.json
          retention-days: 30
          if-no-files-found: warn
