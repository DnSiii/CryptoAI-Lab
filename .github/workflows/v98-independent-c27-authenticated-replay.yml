name: V98 Independent C27 Authenticated Training Replay
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-c27-authenticated-replay.yml'
      - 'research/v98_independent/v98_c27_two_clock_governor.py'
      - 'research/v98_independent/v98_c27_gap_envelope.py'
      - 'research/v98_independent/c27_two_clock_preregistration_20261120.md'
      - 'research/v98_independent/v98_c27_authenticated_runner.py'
      - 'research/v98_independent/v98_c27_causal_audit.py'
      - 'research/v98_independent/v98_c27_chronological_diagnostics.py'
      - 'research/v98_independent/v98_c27_exposure_forensics.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  c27-authenticated:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve pinned V98-only authenticated Clean-4 sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v98_independent/b0/sources
          python - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          repo=os.environ['GH_REPO']
          for label,artifact_id in {'prices':13444665313,'funding':13464271018}.items():
              a=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}'],text=True))
              name=a.get('name','').lower()
              if a.get('expired') or a.get('workflow_run',{}).get('head_branch')!='research/v98-independent-zero':
                  raise SystemExit(f'PINNED_SOURCE_UNAVAILABLE {label} {artifact_id}')
              if label=='prices' and not name.startswith('v98-independent-clean4-148-official-archives-'):
                  raise SystemExit('WRONG_PRICE_SOURCE')
              if label=='funding' and not ('native' in name and 'funding' in name):
                  raise SystemExit('WRONG_FUNDING_SOURCE')
              target=Path('/tmp/v98_independent/b0/sources')/label
              target.mkdir(parents=True,exist_ok=True)
              archive=target/'artifact.zip'
              with archive.open('wb') as stream:
                  subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],stdout=stream,check=True)
              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      if not (target/item.filename).resolve().is_relative_to(target.resolve()):
                          raise SystemExit('ZIP_PATH_TRAVERSAL')
                  z.extractall(target)
              print('PINNED_SOURCE',label,artifact_id)
          PY
      - name: Resolve manifests and validate native Clean-4 training history
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/v98_independent/b0/sources')
          prices=list((root/'prices').rglob('source_manifest.json'))
          funding=list((root/'funding').rglob('funding_manifest.json'))
          if len(prices)!=1 or len(funding)!=1:
              raise SystemExit(f'MISSING_OR_AMBIGUOUS_MANIFESTS {len(prices)} {len(funding)}')
          (root/'paths.env').write_text(f'PRICES={prices[0].parent}\nMANIFEST={prices[0]}\nFUNDING={funding[0].parent}\n')
          PY
          cat /tmp/v98_independent/b0/sources/paths.env >> "$GITHUB_ENV"
      - name: Run preregistered C27 full-history native-funding replay
        run: python -m research.v98_independent.v98_c27_authenticated_runner --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_composed_summary.json
      - name: Require complete C27 training replay
        run: |
          python - <<'PY'
          import json,math
          r=json.load(open('/tmp/v98_independent/b0/c27_composed_summary.json'))
          assert r['holdout_accessed'] is False and r['source']=='AUTHENTICATED_CLEAN4'
          assert set(r['results'])=={'1x','2x','4x'}
          for k,v in r['results'].items():
              assert v['hours']==27048,k
              assert all(math.isfinite(v[z]) for z in ('final_equity','max_drawdown','total_turnover','funding_return_sum'))
          # A complete zero-trade replay is not evidence of a functioning engine.
          # C23 previously passed structural checks while never opening a position.
          if any(r['results'][k]['total_turnover'] <= 1e-10 for k in ('1x','2x','4x')):
              raise SystemExit('C27_ZERO_TRADE_REPLAY_REJECT')
          print('C27_COMPLETE_TRAINING_REPLAY_NOT_VALIDATION')
          PY
      - name: Independent full-ledger C27 arithmetic audit
        run: python -m research.v98_independent.v98_c21_ledger_audit --summary /tmp/v98_independent/b0/c27_composed_summary.json > /tmp/v98_independent/b0/c27_independent_audit.json
      - name: Independent C27 chronological queue and clock audit
        run: python -m research.v98_independent.v98_c27_causal_audit --summary /tmp/v98_independent/b0/c27_composed_summary.json > /tmp/v98_independent/b0/c27_causal_audit.json
      - name: Independent chronological 2023/2024/2025 diagnostics (not a validation gate)
        run: python -m research.v98_independent.v98_c27_chronological_diagnostics --summary /tmp/v98_independent/b0/c27_composed_summary.json --output /tmp/v98_independent/b0/c27_chronological_diagnostics.json
      - name: Audit C27 gap exposure before and after queued fills
        run: python -m research.v98_independent.v98_c27_exposure_forensics --summary /tmp/v98_independent/b0/c27_composed_summary.json --output /tmp/v98_independent/b0/c27_exposure_forensics.json
      - name: Publish audited annual diagnostics in job log
        run: |
          python - <<'PY'
          import json
          p='/tmp/v98_independent/b0/c27_independent_audit.json'
          d=json.load(open(p))
          for scale in ('1x','2x','4x'):
              x=d[scale]
              print('C27_AUDITED',scale,'final_equity',round(x['final_equity'],2),
                    'positive_days',x['positive_days'],'total_days',x['total_days'],
                    'max_asset_weight',round(x['max_asset_weight'],6))
              for year,v in x['annual_training_only'].items():
                  print('C27_ANNUAL',scale,year,'return_pct',round(v['return']*100,4),
                        'hours',v['ledger_hours'])
          PY
      - name: C27 fail-closed training economic gate (no promotion)
        run: |
          python - <<'PY'
          import json, math
          p='/tmp/v98_independent/b0/c27_independent_audit.json'
          d=json.load(open(p))
          reasons=[]
          for scenario in ('1x','2x','4x'):
              x=d[scenario]
              if not x.get('arithmetic_reconciled'):
                  reasons.append(scenario+':ledger_not_reconciled')
              if not math.isfinite(x['final_equity']) or x['final_equity'] <= 10000:
                  reasons.append(scenario+':nonpositive_total_growth')
          annual=d['4x']['annual_training_only']
          for year in ('2023','2024','2025'):
              if year not in annual or not math.isfinite(annual[year]['return']) or annual[year]['return'] <= 0:
                  reasons.append('4x:'+year+':nonpositive_annual_return')
          if reasons:
              print('C27_TRAINING_GATE_REJECT',','.join(reasons))
              raise SystemExit(1)
          print('C27_TRAINING_GATE_PASS_ONLY_NOT_VALIDATION_NOT_PROMOTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-c27-unvalidated-${{ github.run_id }}
          path: |
            /tmp/v98_independent/b0/c27_composed_summary.json
            /tmp/v98_independent/b0/c27_independent_audit.json
            /tmp/v98_independent/b0/c27_causal_audit.json
            /tmp/v98_independent/b0/c27_chronological_diagnostics.json
            /tmp/v98_independent/b0/c27_exposure_forensics.json
            /tmp/v98_independent/b0/c27_composed_summary_*_ledger.jsonl
          retention-days: 30
          if-no-files-found: warn
