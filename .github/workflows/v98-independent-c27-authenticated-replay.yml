name: V98 Independent C27 Authenticated Training Replay
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-c27-authenticated-replay.yml'
      - 'research/v98_independent/v98_c27_two_clock_governor.py'
      - 'research/v98_independent/v98_c27_gap_envelope.py'
      - 'research/v98_independent/c27_two_clock_preregistration_20261120.md'
      - 'research/v98_independent/v98_c27_authenticated_runner.py'
      - 'research/v98_independent/v98_c27_checkpoint_ledger_audit.py'
      - 'research/v98_independent/v98_c27_split_continuation_audit.py'
      - 'research/v98_independent/v98_c27_cross_executor_continuation_audit.py'
      - 'research/v98_independent/v98_c27_causal_audit.py'
      - 'research/v98_independent/v98_c27_chronological_diagnostics.py'
      - 'research/v98_independent/v98_c27_exposure_forensics.py'
      - 'research/v98_independent/v98_c27_daily_risk_diagnostics.py'
      - 'research/v98_independent/v98_c21_ledger_audit.py'
      - 'research/v98_independent/v98_c27_native_source_audit.py'
      - 'research/v98_independent/v98_c27_sleeve_ablation.py'
      - 'research/v98_independent/v98_c27_governor_forensics.py'
      - 'research/v98_independent/v98_c27_supersevere_cost_stress.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  c27-authenticated:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve pinned V98-only authenticated Clean-4 sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v98_independent/b0/sources
          python - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          repo=os.environ['GH_REPO']
          for label,artifact_id in {'prices':13444665313,'funding':13464271018}.items():
              a=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}'],text=True))
              name=a.get('name','').lower()
              if a.get('expired') or a.get('workflow_run',{}).get('head_branch')!='research/v98-independent-zero':
                  raise SystemExit(f'PINNED_SOURCE_UNAVAILABLE {label} {artifact_id}')
              if label=='prices' and not name.startswith('v98-independent-clean4-148-official-archives-'):
                  raise SystemExit('WRONG_PRICE_SOURCE')
              if label=='funding' and not ('native' in name and 'funding' in name):
                  raise SystemExit('WRONG_FUNDING_SOURCE')
              target=Path('/tmp/v98_independent/b0/sources')/label
              target.mkdir(parents=True,exist_ok=True)
              archive=target/'artifact.zip'
              with archive.open('wb') as stream:
                  subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],stdout=stream,check=True)
              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      if not (target/item.filename).resolve().is_relative_to(target.resolve()):
                          raise SystemExit('ZIP_PATH_TRAVERSAL')
                  z.extractall(target)
              print('PINNED_SOURCE',label,artifact_id)
          PY
      - name: Resolve manifests and validate native Clean-4 training history
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/v98_independent/b0/sources')
          prices=list((root/'prices').rglob('source_manifest.json'))
          funding=list((root/'funding').rglob('funding_manifest.json'))
          if len(prices)!=1 or len(funding)!=1:
              raise SystemExit(f'MISSING_OR_AMBIGUOUS_MANIFESTS {len(prices)} {len(funding)}')
          (root/'paths.env').write_text(f'PRICES={prices[0].parent}\nMANIFEST={prices[0]}\nFUNDING={funding[0].parent}\n')
          PY
          cat /tmp/v98_independent/b0/sources/paths.env >> "$GITHUB_ENV"
      - name: Run preregistered C27 full-history native-funding replay
        run: python -m research.v98_independent.v98_c27_authenticated_runner --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_composed_summary.json --export-training-checkpoints
      - name: Repeat full C27 native replay and prove byte-identical economics
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c27_authenticated_runner --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_repro_summary.json --export-training-checkpoints
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('/tmp/v98_independent/b0')
          for suffix in ('.json','_1x_ledger.jsonl','_2x_ledger.jsonl','_4x_ledger.jsonl','_1x_checkpoint.json','_2x_checkpoint.json','_4x_checkpoint.json'):
              a=root/('c27_composed_summary'+suffix)
              b=root/('c27_repro_summary'+suffix)
              ah=hashlib.sha256(a.read_bytes()).hexdigest()
              bh=hashlib.sha256(b.read_bytes()).hexdigest()
              if ah!=bh:
                  raise SystemExit('C27_REPRODUCIBILITY_MISMATCH '+suffix+' '+ah+' '+bh)
              print('C27_REPRODUCIBLE',suffix,ah)
          PY
      - name: Independently reconcile exported C27 training checkpoint against full ledger
        run: python -m research.v98_independent.v98_c27_checkpoint_ledger_audit --summary /tmp/v98_independent/b0/c27_composed_summary.json --output /tmp/v98_independent/b0/c27_checkpoint_ledger_audit.json
      - name: Prove fixed 2024 training split reproduces full C27 economic ledger
        run: python -m research.v98_independent.v98_c27_split_continuation_audit --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_split_continuation_audit.json
      - name: Cross-check variable-horizon kernel against full historical C27 ledger
        run: python -m research.v98_independent.v98_c27_cross_executor_continuation_audit --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_cross_executor_continuation_audit.json
      - name: Require complete C27 training replay
        run: |
          python - <<'PY'
          import json,math
          r=json.load(open('/tmp/v98_independent/b0/c27_composed_summary.json'))
          assert r['holdout_accessed'] is False and r['source']=='AUTHENTICATED_CLEAN4'
          assert set(r['results'])=={'1x','2x','4x'}
          for k,v in r['results'].items():
              assert v['hours']==27048,k
              assert all(math.isfinite(v[z]) for z in ('final_equity','max_drawdown','total_turnover','funding_return_sum'))
          # A complete zero-trade replay is not evidence of a functioning engine.
          # C23 previously passed structural checks while never opening a position.
          if any(r['results'][k]['total_turnover'] <= 1e-10 for k in ('1x','2x','4x')):
              raise SystemExit('C27_ZERO_TRADE_REPLAY_REJECT')
          print('C27_COMPLETE_TRAINING_REPLAY_NOT_VALIDATION')
          PY
      - name: Independent full-ledger C27 arithmetic audit
        run: python -m research.v98_independent.v98_c21_ledger_audit --summary /tmp/v98_independent/b0/c27_composed_summary.json > /tmp/v98_independent/b0/c27_independent_audit.json
      - name: Independently reconcile C27 hourly prices and native funding to pinned Clean-4
        run: python -m research.v98_independent.v98_c27_native_source_audit --summary /tmp/v98_independent/b0/c27_composed_summary.json --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_native_source_audit.json
      - name: Independent C27 chronological queue and clock audit
        run: python -m research.v98_independent.v98_c27_causal_audit --summary /tmp/v98_independent/b0/c27_composed_summary.json > /tmp/v98_independent/b0/c27_causal_audit.json
      - name: Independent chronological 2023/2024/2025 diagnostics (not a validation gate)
        run: python -m research.v98_independent.v98_c27_chronological_diagnostics --summary /tmp/v98_independent/b0/c27_composed_summary.json --output /tmp/v98_independent/b0/c27_chronological_diagnostics.json
      - name: Audit C27 gap exposure before and after queued fills
        run: python -m research.v98_independent.v98_c27_exposure_forensics --summary /tmp/v98_independent/b0/c27_composed_summary.json --output /tmp/v98_independent/b0/c27_exposure_forensics.json
      - name: Independently audit C27 daily profit factor, payoff, and tails
        run: python -m research.v98_independent.v98_c27_daily_risk_diagnostics --summary /tmp/v98_independent/b0/c27_composed_summary.json --output /tmp/v98_independent/b0/c27_daily_risk_diagnostics.json
      - name: Publish audited annual diagnostics in job log
        run: |
          python - <<'PY'
          import json
          p='/tmp/v98_independent/b0/c27_independent_audit.json'
          d=json.load(open(p))
          for scale in ('1x','2x','4x'):
              x=d[scale]
              print('C27_AUDITED',scale,'final_equity',round(x['final_equity'],2),
                    'positive_days',x['positive_days'],'total_days',x['total_days'],
                    'max_asset_weight',round(x['max_asset_weight'],6))
              for year,v in x['annual_training_only'].items():
                  print('C27_ANNUAL',scale,year,'return_pct',round(v['return']*100,4),
                        'hours',v['ledger_hours'])
          PY
      - name: C27 fail-closed training economic gate (no promotion)
        run: |
          python - <<'PY'
          import json, math
          p='/tmp/v98_independent/b0/c27_independent_audit.json'
          d=json.load(open(p))
          reasons=[]
          for scenario in ('1x','2x','4x'):
              x=d[scenario]
              if not x.get('arithmetic_reconciled'):
                  reasons.append(scenario+':ledger_not_reconciled')
              if not math.isfinite(x['final_equity']) or x['final_equity'] <= 10000:
                  reasons.append(scenario+':nonpositive_total_growth')
          annual=d['4x']['annual_training_only']
          for year in ('2023','2024','2025'):
              if year not in annual or not math.isfinite(annual[year]['return']) or annual[year]['return'] <= 0:
                  reasons.append('4x:'+year+':nonpositive_annual_return')
          if reasons:
              print('C27_TRAINING_GATE_REJECT',','.join(reasons))
              raise SystemExit(1)
          print('C27_TRAINING_GATE_PASS_ONLY_NOT_VALIDATION_NOT_PROMOTION')
          PY
      - name: C27 seven-slot training diagnostics and allocator counterfactual
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c27_sleeve_ablation --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_sleeve_ablation.json
          python - <<'PY'
          import json,math
          p='/tmp/v98_independent/b0/c27_sleeve_ablation.json'
          d=json.load(open(p))
          if d['holdout_accessed'] is not False or set(d['scenarios'])!={'growth_core','opportunity','relative_value','stress_recovery'} or set(d['control_ablations'])!={'router','governor','allocator_equal_active'}:
              raise SystemExit('C27_ABLATION_INCOMPLETE')
          baseline=json.load(open('/tmp/v98_independent/b0/c27_composed_summary.json'))['results']['4x']['final_equity']
          if not math.isclose(baseline,d['baseline_final_equity'],rel_tol=1e-12):
              raise SystemExit('C27_ABLATION_BASELINE_MISMATCH')
          for slot,x in {**d['scenarios'],**d['control_ablations']}.items():
              annual=x.get('annual_marginal_log_wealth_training_only',{})
              if set(annual)!={'2023','2024','2025'} or not all(math.isfinite(v) for v in annual.values()):
                  raise SystemExit('C27_ANNUAL_MARGINAL_INCOMPLETE '+slot)
              print('C27_MARGINAL_TRAINING_ONLY',slot,'delta_log_wealth',round(x['full_minus_without_log_wealth'],8),'positive',x['marginal_positive'],
                    'annual_delta_log_wealth',annual,'positive_all_training_years',all(v>0 for v in annual.values()))
          print('C27_ABLATION_DIAGNOSTIC_ONLY_NOT_VALIDATION_NOT_PROMOTION')
          PY
      - name: Diagnose C27 governor opportunity cost versus survival on training only
        run: |
          python -m research.v98_independent.v98_c27_governor_forensics --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_governor_forensics.json
          python - <<'PY'
          import json,math
          d=json.load(open('/tmp/v98_independent/b0/c27_governor_forensics.json'))
          assert d['holdout_accessed'] is False and d['hours_compared']==27047
          assert all(math.isfinite(d[k]) for k in ('governor_marginal_log_wealth','drawdown_reduction','baseline_final_equity','governor_off_final_equity'))
          assert d['baseline_hard_cap_breach_hours']==0
          assert d['governor_off_hard_cap_breach_hours']==0
          assert all(isinstance(d[k],int) and 0<=d[k]<=d['hours_compared'] for k in ('baseline_pre_fill_hard_cap_pressure_hours','governor_off_pre_fill_hard_cap_pressure_hours','baseline_queued_safety_hours','governor_off_queued_safety_hours'))
          assert set(d['annual_governor_marginal_log_wealth_training_only'])=={'2023','2024','2025'}
          assert all(math.isfinite(x) for x in d['annual_governor_marginal_log_wealth_training_only'].values())
          print('C27_GOVERNOR_TRAINING_DIAGNOSTIC_NOT_VALIDATION',d)
          PY
      - name: Full-history C27 fixed supersevere 8x/12x cost stress (training only)
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c27_supersevere_cost_stress --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_supersevere_cost_stress.json
          python - <<'PY'
          import json, math
          base=json.load(open('/tmp/v98_independent/b0/c27_composed_summary.json'))
          stress=json.load(open('/tmp/v98_independent/b0/c27_supersevere_cost_stress.json'))
          assert stress['holdout_accessed'] is False and stress['source']==base['source']
          assert stress['price_manifest_sha256']==base['price_manifest_sha256']
          assert stress['funding_manifest_sha256']==base['funding_manifest_sha256']
          assert set(stress['results'])=={'8x','12x'}
          for key in ('8x','12x'):
              v=stress['results'][key]
              assert v['hours']==27048 and v['total_turnover']>0
              assert all(math.isfinite(v[k]) for k in ('final_equity','max_drawdown','total_turnover','funding_return_sum'))
              print('C27_SUPERSEVERE_TRAINING_ONLY',key,'final_equity',round(v['final_equity'],2),'max_drawdown',round(v['max_drawdown'],6),'turnover',round(v['total_turnover'],6))
          PY
      - name: Repeat 8x/12x supersevere replay and prove deterministic full ledgers
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c27_supersevere_cost_stress --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --output /tmp/v98_independent/b0/c27_supersevere_repro.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('/tmp/v98_independent/b0')
          pairs=[('c27_supersevere_cost_stress.json','c27_supersevere_repro.json')]
          for scenario in ('8x','12x'):
              pairs.append((f'c27_supersevere_cost_stress_{scenario}_ledger.jsonl',f'c27_supersevere_repro_{scenario}_ledger.jsonl'))
          for a,b in pairs:
              ha=hashlib.sha256((root/a).read_bytes()).hexdigest()
              hb=hashlib.sha256((root/b).read_bytes()).hexdigest()
              if ha!=hb:
                  raise SystemExit('C27_SUPERSEVERE_NONDETERMINISTIC '+a+' '+ha+' '+hb)
              print('C27_SUPERSEVERE_REPRODUCIBLE',a,ha)
          PY
      - name: Independently reconcile 8x/12x full ledgers before publishing stress results
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c21_ledger_audit --summary /tmp/v98_independent/b0/c27_supersevere_cost_stress.json --supersevere > /tmp/v98_independent/b0/c27_supersevere_independent_audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v98_independent/b0/c27_supersevere_independent_audit.json'))
          if set(d)!={'8x','12x'} or not all(x['arithmetic_reconciled'] and x['rows']==27047 for x in d.values()):
              raise SystemExit('C27_SUPERSEVERE_LEDGER_AUDIT_FAILED')
          for k,v in d.items():
              print('C27_SUPERSEVERE_AUDITED_TRAINING_ONLY',k,'equity',round(v['final_equity'],2),'drawdown',round(v['max_drawdown'],6))
          PY
      - name: Independently reconcile 8x/12x native price and funding cashflows
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c27_native_source_audit --summary /tmp/v98_independent/b0/c27_supersevere_cost_stress.json --prices "$PRICES" --manifest "$MANIFEST" --funding "$FUNDING" --supersevere --output /tmp/v98_independent/b0/c27_supersevere_native_source_audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v98_independent/b0/c27_supersevere_native_source_audit.json'))
          if set(d)!={'8x','12x'} or not all(v['native_price_funding_reconciled'] and v['final_close_reconciled'] and v['audited_hours']==27047 for v in d.values()):
              raise SystemExit('C27_SUPERSEVERE_NATIVE_SOURCE_AUDIT_FAILED')
          print('C27_SUPERSEVERE_NATIVE_SOURCE_AUDITED_TRAINING_ONLY',d)
          PY
      - name: Independently verify 8x/12x causal execution clocks and safety queues
        run: |
          set -euo pipefail
          python -m research.v98_independent.v98_c27_causal_audit --summary /tmp/v98_independent/b0/c27_supersevere_cost_stress.json --supersevere > /tmp/v98_independent/b0/c27_supersevere_causal_audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v98_independent/b0/c27_supersevere_causal_audit.json'))
          if set(d)!={'8x','12x'} or not all(v['causal_queue_reconciled'] and v['checked_hours']==27047 and v['strategic_rebalances']>0 for v in d.values()):
              raise SystemExit('C27_SUPERSEVERE_CAUSAL_GATE_FAILED')
          print('C27_SUPERSEVERE_CAUSAL_TRAINING_ONLY',d)
          PY
      - name: Fail-closed 8x/12x supersevere net-growth survival gate (training only)
        run: |
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/v98_independent/b0/c27_supersevere_independent_audit.json'))
          failures=[]
          for scale in ('8x','12x'):
              x=d.get(scale,{})
              if x.get('arithmetic_reconciled') is not True:
                  failures.append(scale+':ledger_not_reconciled')
              equity=x.get('final_equity')
              if not isinstance(equity,(int,float)) or not math.isfinite(equity) or equity<=10000:
                  failures.append(scale+':no_positive_net_growth')
              dd=x.get('max_drawdown')
              if not isinstance(dd,(int,float)) or not math.isfinite(dd) or not 0<=dd<1:
                  failures.append(scale+':invalid_drawdown')
          if failures:
              raise SystemExit('C27_SUPERSEVERE_TRAINING_GATE_REJECT '+','.join(failures))
          print('C27_SUPERSEVERE_TRAINING_GATE_PASS_ONLY_NOT_VALIDATION_NOT_PROMOTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-c27-unvalidated-${{ github.run_id }}
          path: |
            /tmp/v98_independent/b0/c27_composed_summary.json
            /tmp/v98_independent/b0/c27_checkpoint_ledger_audit.json
            /tmp/v98_independent/b0/c27_split_continuation_audit.json
            /tmp/v98_independent/b0/c27_cross_executor_continuation_audit.json
            /tmp/v98_independent/b0/c27_independent_audit.json
            /tmp/v98_independent/b0/c27_native_source_audit.json
            /tmp/v98_independent/b0/c27_causal_audit.json
            /tmp/v98_independent/b0/c27_chronological_diagnostics.json
            /tmp/v98_independent/b0/c27_exposure_forensics.json
            /tmp/v98_independent/b0/c27_daily_risk_diagnostics.json
            /tmp/v98_independent/b0/c27_sleeve_ablation.json
            /tmp/v98_independent/b0/c27_governor_forensics.json
            /tmp/v98_independent/b0/c27_supersevere_cost_stress.json
            /tmp/v98_independent/b0/c27_supersevere_independent_audit.json
            /tmp/v98_independent/b0/c27_supersevere_causal_audit.json
            /tmp/v98_independent/b0/c27_supersevere_native_source_audit.json
            /tmp/v98_independent/b0/c27_supersevere_cost_stress_*_ledger.jsonl
            /tmp/v98_independent/b0/c27_composed_summary_*_ledger.jsonl
            /tmp/v98_independent/b0/c27_composed_summary_*_checkpoint.json
          retention-days: 30
          if-no-files-found: warn
