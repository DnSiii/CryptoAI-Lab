name: V98 Independent KF Complete 2023-24 Native Positioning Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kf-full-history-source.yml'
      - 'research/v98_independent/kf_full_history_metrics_audit.py'
      - 'research/v98_independent/kf_full_history_metrics_prereg_20261028.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full_native_source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and immutable 2023-24 scope checks
        run: |
          python -m py_compile research/v98_independent/kf_crowding_metrics_source_gate.py research/v98_independent/kf_full_history_metrics_audit.py
      - name: Verify 2924 native publisher SHA and 5-minute days, no PnL
        run: python research/v98_independent/kf_full_history_metrics_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-kf-complete-2023-2024-source-only
          path: research/v98_independent/kf_full_history_metrics_audit.json
          retention-days: 30
          if-no-files-found: warn
