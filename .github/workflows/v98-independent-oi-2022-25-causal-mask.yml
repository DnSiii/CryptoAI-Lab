name: V98 Independent Native OI 2022-25 Causal Source Mask No PnL
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-oi-2022-25-causal-mask.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-history-source-mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only the source-mask numerical dependency
        run: python -m pip install numpy
      - name: Check preregistered 157 decision clocks and future mutation exclusion
        run: |
          python -m py_compile research/v98_independent/v98_oi_2022_2025_causal_mask.py
          python research/v98_independent/v98_oi_2022_2025_causal_mask.py --self-test
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: frozen-oi-2022-24
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-2025-native-oi-vendor-sha-source-only
          run-id: 41282113093
          github-token: ${{ github.token }}
          path: frozen-oi-2025
      - name: Independently audit both source artifacts and derive strict 2022-25 native OI causal mask
        run: |
          python research/v98_independent/v98_oi_2022_2025_causal_mask.py --old-root frozen-oi-2022-24 --new-root frozen-oi-2025 --output v98_oi_2022_2025_causal_mask_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-2022-25-oi-source-only-causal-mask
          path: v98_oi_2022_2025_causal_mask_receipt.json
          retention-days: 30
          if-no-files-found: warn
