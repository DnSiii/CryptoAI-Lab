name: V98 Independent Phase1051 Q Signed Economic Gate Contracts Only
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1051_q_training_gate.py'
      - 'research/v98_independent/test_phase1051_q_training_gate_contract.py'
      - 'research/v98_independent/phase1048_q_signed_funding_bounds.py'
      - 'research/v98_independent/test_phase1048_q_signed_funding_bounds.py'
      - '.github/workflows/v98-independent-phase1051-q-gate-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q-gate-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: Verify Q funding mark bounds and 90-cell gate WITHOUT economic execution
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1048_q_signed_funding_bounds.py test_phase1051_q_training_gate_contract.py
