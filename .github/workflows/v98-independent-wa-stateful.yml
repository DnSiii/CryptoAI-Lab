name: V98 Independent WA Stateful Breakout Full-History Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-wa-stateful.yml'
      - 'research/v98_independent/wa_stateful_breakout.py'
      - 'research/v98_independent/wa_stateful_physical.py'
      - 'research/v98_independent/wa_stateful_oracle.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wa-2023-25-physical:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Synthetic stateful future mutation test before historical data
        run: |
          set -euo pipefail
          python -m py_compile research/v98_independent/wa_stateful_breakout.py research/v98_independent/wa_stateful_physical.py research/v98_independent/wa_stateful_oracle.py
          python research/v98_independent/wa_stateful_breakout.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: corrected
      - name: Source incidence gate then full 30-cell historical physical training
        run: |
          set -euo pipefail
          python research/v98_independent/wa_stateful_physical.py \
            --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
            --new-root new --corrected-root corrected --out-dir wa-physical
      - name: Independent source-signal cash/funding audit and adversarial cash mutation
        run: |
          set -euo pipefail
          if [ -f wa-physical/wa_base_full_hourly_ledger.csv ]; then
            python research/v98_independent/wa_stateful_oracle.py \
              --old-root old --old-envelope old-envelope/v98_official_mark_envelope_training.csv \
              --new-root new --corrected-root corrected --out-dir wa-physical
          else
            echo 'WA_PREREG_SOURCE_INCIDENCE_REJECTED_NO_PNL'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-wa-stateful-2023-25-exposed-not-validated
          path: wa-physical/
          retention-days: 30
          if-no-files-found: warn
