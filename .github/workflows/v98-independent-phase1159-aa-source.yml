name: V98 Independent Phase1159 AA Authenticated 15-Hash Source Crossrunner
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase1159-aa-source.yml'
      - 'research/v98_independent/phase1159_aa_authenticated_source.py'
      - 'research/v98_independent/phase1157_aa_sevenslot_source.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aa-source-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        repeat: [a, b]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1'
      - name: AA causal synthetic source tests
        run: python -m unittest -q test_phase1157_aa_sevenslot_source.py
      - name: Fresh official Clean-4 and fifteen AA source-only hashes
        env:
          PYTHONUNBUFFERED: '1'
        run: python phase1159_aa_authenticated_source.py
      - name: Preserve source-only receipts on PASS or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-aa-1159-${{ matrix.os }}-${{ matrix.repeat }}
          path: |
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1000_four_asset_source_policy_receipt.json
            research/v98_independent/phase1159_aa_authenticated_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
  aa-crossrunner:
    needs: aa-source-runner
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v98-aa-1159-*
          path: /tmp/v98-aa-1159
          merge-multiple: false
      - name: Compare all four source-only receipts; fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v98-aa-1159')
          paths=[root/('v98-aa-1159-'+os+'-'+repeat)/'phase1159_aa_authenticated_source_receipt.json'
                 for os in ('ubuntu-22.04','ubuntu-24.04') for repeat in ('a','b')]
          if not all(p.is_file() for p in paths):
              raise SystemExit('AA_CROSSRUNNER_MISSING_RECEIPT')
          receipts=[json.loads(p.read_text()) for p in paths]
          for r in receipts:
              assert r['decision']=='PASS_AA_AUTHENTICATED_SOURCE_ONLY_NOT_FROZEN'
              assert r['historical_pnl_computed'] is False and r['validation_2025_read'] is False
              assert r['typed_mark_shape']==[18288,4,2] and r['native_funding_events']==9144
              assert len(r['canonical_sha256'])==15
          for key in ('canonical_sha256','typed_mark_csv_sha256','native_funding_events',
                      'official_hours','diagnostics','governor_calls'):
              assert all(r[key]==receipts[0][key] for r in receipts),'AA_CROSSRUNNER_DRIFT_'+key
          print(json.dumps({'decision':'PASS_AA_FOUR_FRESH_SOURCE_RECOMPOSITIONS_NOT_FROZEN',
                            'canonical_sha256':receipts[0]['canonical_sha256'],
                            'typed_mark_csv_sha256':receipts[0]['typed_mark_csv_sha256']},sort_keys=True))
          PY
