name: V99 I1 CoinAPI original 100ns event identity (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/V99_R106_I1_COINAPI_ORIGINAL_EVENT_IDENTITY_PREREG_20261102.md
      - research/tools/v99_r106_i1_coinapi_original_event_identity.py
      - research/tests/test_v99_r106_i1_coinapi_original_event_identity.py
      - .github/workflows/v99-r106-i1-coinapi-original-event-identity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coinapi-original-event-source-no-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg ancestor, immutable TRAIN partition and no protected changes
        run: |
          git merge-base --is-ancestor 9a570122c9fa1105c0509fe006e9df39e68b8ab3 HEAD
          python - <<'PY'
          from research.tools.v99_r106_i1_local_tape_import import FIRST,END,DAYS
          assert (FIRST.isoformat(),END.isoformat(),DAYS)==('2021-12-09','2023-10-01',661)
          print('TRAIN ONLY; SEALED VALIDATION/HOLDOUT UNTOUCHED')
          PY
      - name: Adversarial original-byte event asof source tests
        run: |
          python -m unittest -v research.tests.test_v99_r106_i1_coinapi_original_event_identity
      - name: Real missing licensed 661d archive must fail closed
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from research.tools.v99_r106_i1_coinapi_original_event_identity import audit
          with tempfile.TemporaryDirectory() as t:
              root=Path(t)
              for name in ('specs','original','derived'):
                  (root/name).mkdir()
              try:
                  audit(root/'specs',root/'original',root/'derived',{})
              except ValueError as e:
                  assert str(e)=='WRITTEN_COINAPI_CHAIN_LICENSE_REQUIRED',str(e)
                  print('SOURCE_HOLD: WRITTEN_COINAPI_CHAIN_LICENSE_REQUIRED')
                  print('NO ECONOMIC TRAIN / ROI / PROMOTION / ORDERS')
              else:
                  raise AssertionError('LICENSE_BYPASS')
          PY
