name: CryptoAI paper watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-watchdog.yml"
      - "scripts/recover_paper_runtime.py"

permissions:
  actions: write
  contents: read

concurrency:
  group: cryptoai-paper-recovery
  cancel-in-progress: false

jobs:
  recover-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out recovery monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cancel expired queues and recover stale official paper
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/recover_paper_runtime.py
