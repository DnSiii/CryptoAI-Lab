name: V98 Independent GH Frozen Economic Attribution
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-gh-forensics.yml'
permissions:
  actions: read
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gh30-official-economic-summary
          run-id: 40282974345
          github-token: ${{ github.token }}
          path: receipts
      - name: Inspect frozen GH 30-cell artifact without rerunning or changing candidate
        shell: bash
        run: |
          python - <<'PY'
          import json,glob
          fs=glob.glob('receipts/**/*.json',recursive=True)
          assert len(fs)==1,fs
          a=json.load(open(fs[0]))
          assert a['architecture']=='GH' and a['decision']=='REJECT_GH_HISTORICAL_GROWTH_OR_MARGINAL'
          assert a['cells_survived']==30 and a['cross_os_reproducible'] and not a['errors']
          print('GH_FROZEN_DECISION',a['decision'])
          print('GH_FULL_BASE',json.dumps({k:a['full_10k_base'][k] for k in ('two_year_cagr','max_drawdown','turnover','fees','slippage','funding','physical_fill_hours','max_gross_to_nav')},sort_keys=True))
          print('GH_FULL_SEVERE',json.dumps({k:a['full_10k_severe'][k] for k in ('two_year_cagr','max_drawdown','turnover','fees','slippage','funding','physical_fill_hours','max_gross_to_nav')},sort_keys=True))
          print('GH_ANNUAL_BASE',json.dumps({y:{k:a['full_10k_base']['annual'][y][k] for k in ('net_return','net_log_growth','max_drawdown')} for y in ('2023','2024')},sort_keys=True))
          print('GH_MARGINAL_ALL',json.dumps(a['marginal_log_growth_10k'],sort_keys=True))
          print('GH_MARGINAL_GATES',json.dumps(a['marginal_gates_10k'],sort_keys=True))
          print('GH_GATES',json.dumps({k:a[k] for k in ('growth_gates_10k','high_growth_gate_10k','severe_drawdown_gate_10k','turnover_gate_10k')},sort_keys=True))
          PY
