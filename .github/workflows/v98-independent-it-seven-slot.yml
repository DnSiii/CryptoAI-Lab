name: V98 Independent IT Intrabar Auction Seven Slot Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-it-seven-slot.yml'
      - 'research/v98_independent/it_close_location_prereg_20261027.md'
      - 'research/v98_independent/it_close_location_sources.py'
      - 'research/v98_independent/it_source_viability.py'
      - 'research/v98_independent/it_30cell.py'
      - 'research/v98_independent/it_reconcile_30cell.py'
      - 'research/v98_independent/it_independent_ledger_replay.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned Clean-4 2022-2024 only, never 2025
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact authenticated Clean-4 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: IT pre-economic native source, causality and financed epoch gate
        working-directory: research/v98_independent
        run: |
          python -m py_compile it_close_location_sources.py it_source_viability.py it_30cell.py it_reconcile_30cell.py it_independent_ledger_replay.py
          python it_close_location_sources.py
          python it_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: it-source-viability
          path: research/v98_independent/it_source_viability.json
          retention-days: 30
          if-no-files-found: warn
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [IT_core_only, IT_full, IT_minus_opportunity, IT_minus_RV, IT_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned Clean-4 bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Run actual-open physical six-cell independently funded IT book
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python it_30cell.py --path ${{ matrix.path }} --output it30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s it30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: it30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/it30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: it30-ubuntu-*
          path: receipts
      - name: Independent artifact-only physical, cross-OS and economic marginal gate
        run: python research/v98_independent/it_reconcile_30cell.py --root receipts --output it30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: it30-official-economic-summary
          path: it30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [IT_core_only, IT_full, IT_minus_opportunity, IT_minus_RV, IT_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned Clean-4 bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding and 81-corner physical settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py it_independent_ledger_replay.py
          python it_independent_ledger_replay.py --path ${{ matrix.path }} --output it_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: it-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/it_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
