name: V98 Independent BU Core Priority Nonoverlap Seven Slot 90-Cell Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-bu-seven-slot-90cell.yml'
      - 'research/v98_independent/bu_sources.py'
      - 'research/v98_independent/bu_allocator.py'
      - 'research/v98_independent/bu_90cell.py'
      - 'research/v98_independent/bu_reconcile.py'
      - 'research/v98_independent/bu_independent_receipt_audit.py'
      - 'research/v98_independent/bu_priority_governor.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [BU_core_only, BU_full, BU_minus_opportunity, BU_minus_RV, BU_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: BU core priority independent satellites seven-slot physical settlement
        working-directory: research/v98_independent
        run: |
          python -m py_compile bu_sources.py bu_allocator.py bu_priority_governor.py bu_90cell.py bu_reconcile.py
          python bu_sources.py
          python bu_allocator.py
          python bu_priority_governor.py
      - name: Retrieve PINNED vendor-attested 2023-24 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original Dec2022-Dec2024 training bytes ONLY
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Execute BU complete actual-open native-funded chronological path x18
        working-directory: research/v98_independent
        run: |
          python bu_90cell.py \
            --path ${{ matrix.path }} \
            --output bu90_${{ matrix.path }}.json || echo 'BU_REJECTION_OR_FAILURE_PRESERVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bu90-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/bu90_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify all 18 path cells recorded, never hide failure
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob('bu90_BU_*.json')
          assert len(files)==1,files
          a=json.load(open(files[0]))
          assert len(a['cells'])==18
          print('BU_PATH_SURVIVAL',a['path'],sum(c['passed'] for c in a['cells']),'/',len(a['cells']))
          PY
  reconcile:
    if: always()
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bu90-ubuntu-*
          path: receipts
      - name: Independent two-OS 90-cell economic, marginal and causal gate
        run: python research/v98_independent/bu_reconcile.py --root receipts --output bu90_official_economic_summary.json
      - name: Independent original-receipt accounting audit (no BU engine imports)
        run: python research/v98_independent/bu_independent_receipt_audit.py --root receipts --output bu90_independent_arithmetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bu90-independent-arithmetic
          path: bu90_independent_arithmetic.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bu90-official-economic-summary
          path: bu90_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  native-event-replay:
    needs: train
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve same pinned original training inputs
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage source without reading 2025
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Independently reconstruct native funding and 81 intrabar corners
        working-directory: research/v98_independent
        run: python bu_event_replay_audit.py --output bu_event_replay_original.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bu-native-event-independent-replay
          path: research/v98_independent/bu_event_replay_original.json
          retention-days: 30
          if-no-files-found: warn
