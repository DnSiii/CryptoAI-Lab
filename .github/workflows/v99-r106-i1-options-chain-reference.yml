name: V99 I1 options-chain offline controls; manual source only (HOLD)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_i1_options_chain_reference.py'
      - 'research/verification/independent_v99_r106_i1_options_chain_reference.py'
      - 'research/tests/test_v99_r106_i1_options_chain_reference.py'
      - '.github/workflows/v99-r106-i1-options-chain-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-same-row-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require immutable preregistration before source implementation
        run: |
          git merge-base --is-ancestor 950c02b34021426fa65d24357d57f2ec309d6ddc HEAD
          test -s research/V99_R106_I1_ORIGINAL_CHAIN_REFERENCE_SOURCE_PREREG_20261030.md
      - name: Independent adversarial offline tests (NOT market evidence)
        run: python -m unittest -v research.tests.test_v99_r106_i1_options_chain_reference
      - name: Explicit push CI source HOLD (not original data evidence)
        if: github.event_name == 'push'
        run: |
          echo 'OFFLINE CONTROLS ONLY: 1,517,089,304 declared compressed bytes exceed fixed 536,870,912 cap.'
          echo 'No source download, original-row verification, economics, validation, or promotion in push CI.'
      - name: Download EXACT fixed original 2022-06-01 Tardis options_chain sample (MANUAL ONLY)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p research_evidence/i1_chain
          python -m research.tools.v99_r106_i1_options_chain_reference download research_evidence/i1_chain/original.csv.gz
      - name: Scan original full-day source and native underlying reference labels
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m research.tools.v99_r106_i1_options_chain_reference scan research_evidence/i1_chain/original.csv.gz research_evidence/i1_chain/source_only.json
      - name: Independently reparse entire original gzip and veto forged certification
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m research.verification.independent_v99_r106_i1_options_chain_reference research_evidence/i1_chain/original.csv.gz research_evidence/i1_chain/source_only.json
      - name: Assert NO economics, no index/lot/fee certification, no promotion
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_evidence/i1_chain/source_only.json').read_text())
          assert r['day']=='2022-06-01'
          assert r['source_is_public_sample_not_complete_archive'] is True
          assert r['index_may_be_synthetic_forward_not_spot'] is True
          for flag in ('native_spot_index_authenticated','delivery_index_authenticated',
                       'native_lot_size_authenticated','native_fee_tier_authenticated',
                       'full_661d_archive_authenticated','economic_train_executed',
                       'roi_calculated','validation_opened','final_holdout_opened',
                       'freeze_authorized','promotion_authorized',
                       'paper_publication_authorized','orders_enabled'):
              assert r[flag] is False, flag
          print('SOURCE ONLY; SAME-ROW INDEX IS NOT SPOT/SETTLEMENT; NO PROMOTION')
          PY
      - name: Delete original vendor bytes before artifact upload
        if: github.event_name == 'workflow_dispatch' && always()
        run: rm -f research_evidence/i1_chain/original.csv.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: v99-i1-original-chain-reference-${{ github.run_id }}
          path: research_evidence/i1_chain/source_only.json
          retention-days: 30
          if-no-files-found: warn
