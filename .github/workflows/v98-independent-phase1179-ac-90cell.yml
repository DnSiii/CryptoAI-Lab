name: V98 Independent Phase1179 AC 90-Cell Synthetic Integration
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1179_ac_90cell_synthetic.py'
      - '.github/workflows/v98-independent-phase1179-ac-90cell.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ac-90cell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Execute all 90 AC synthetic cells, fail closed
        run: python phase1179_ac_90cell_synthetic.py
      - name: Preserve complete 90-cell synthetic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v98-ac-1179-90cell-${{ matrix.os }}
          path: research/v98_independent/phase1179_ac_90cell_synthetic_receipt.json
          retention-days: 30
          if-no-files-found: warn
