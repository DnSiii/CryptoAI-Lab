name: V98 Independent EU Frozen First Physical Fault
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-eu-first-fault.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  first_fault:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: eu30-ubuntu-24.04-EU_*
          run-id: 40261417533
          github-token: ${{ github.token }}
          path: receipts
      - name: Read immutable original physical rejection receipts without changing EU
        run: |
          python - <<'PY'
          import glob,json
          for name in ('EU_core_only','EU_full','EU_minus_opportunity','EU_minus_RV','EU_minus_stress'):
              files=glob.glob('receipts/eu30-ubuntu-24.04-'+name+'/*.json')
              assert len(files)==1,(name,files)
              d=json.load(open(files[0]))
              assert d['architecture']=='EU' and d['path']==name
              for c in d['cells']:
                  if not c['passed']:
                      print('EU_FROZEN_FIRST_FAULT',name,c['fee'],c['order'],c['reason'])
                  else:
                      print('EU_FROZEN_PASS',name,c['fee'],c['order'])
          PY
