name: V98 Independent KN Seven Slot Source and Event Latch Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kn-source.yml'
      - 'research/v98_independent/kn_event_latched_leadership_prereg_20261028.md'
      - 'research/v98_independent/kn_leadership_sources.py'
      - 'research/v98_independent/kn_source_viability.py'
      - 'research/v98_independent/kn_event_latch.py'
      - 'research/v98_independent/kn_latch_physical_integration.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned training data only (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact authenticated Clean-4 source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: KN authenticated 1h funding and causal source viability
        working-directory: research/v98_independent
        run: |
          python -m py_compile kn_leadership_sources.py kn_source_viability.py kn_event_latch.py kn_latch_physical_integration.py
          python kn_event_latch.py
          python kn_latch_physical_integration.py
          python kn_leadership_sources.py
          python kn_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kn-source-viability
          path: research/v98_independent/kn_source_viability.json
          retention-days: 30
          if-no-files-found: warn