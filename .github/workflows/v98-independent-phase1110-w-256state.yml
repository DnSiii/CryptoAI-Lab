name: V98 Independent Phase1110-1111 W 256-State Portfolio Synthetic
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1110-w-256state.yml'
      - 'research/v98_independent/phase1110_w_256state_governor.py'
      - 'research/v98_independent/test_phase1110_w_256state_governor.py'
      - 'research/v98_independent/phase1111_w_sevenslot_source.py'
      - 'research/v98_independent/test_phase1111_w_sevenslot_source.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w-256-state-and-seven-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
      - name: W 256-state governor, 3000 adversarial portfolios, seven-slot source, chronology
        run: python -m unittest -v test_phase1110_w_256state_governor.py test_phase1111_w_sevenslot_source.py
