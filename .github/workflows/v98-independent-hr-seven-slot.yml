name: V98 Independent HR Spot Demand Seven Slot 30 Cell Native Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-hr-seven-slot.yml'
      - 'research/v98_independent/hr_spot_participation_sevenslot_prereg_20261027.md'
      - 'research/v98_independent/hr_spot_participation_sources.py'
      - 'research/v98_independent/hr_source_viability.py'
      - 'research/v98_independent/hr_30cell.py'
      - 'research/v98_independent/hr_reconcile_30cell.py'
      - 'research/v98_independent/hr_independent_ledger_replay.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve exact pinned Clean-4 USD-M training source
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Retrieve independently accepted HQ 100-archive masked spot source
        uses: actions/download-artifact@v4
        with:
          name: v98-hq-spot-masked-training-2022-2024
          run-id: 40441987477
          github-token: ${{ github.token }}
          path: spot-input
      - name: Stage exact native and HQ canonical source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('research/v98_independent')
          native=Path('official-input')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(native.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          for name in ('hq_spot_calendar_masked.csv','hq_masked_source_receipt.json'):
              found=list(Path('spot-input').rglob(name));assert len(found)==1,(name,found)
              dest=target/'hq_gap_aware_spot_source_only'/name
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Fail closed before PnL on HR source/causality/financed epochs
        working-directory: research/v98_independent
        run: |
          python -m py_compile hr_spot_participation_sources.py hr_source_viability.py hr_30cell.py hr_reconcile_30cell.py hr_independent_ledger_replay.py
          python hr_spot_participation_sources.py
          python -c 'import hr_30cell,hr_reconcile_30cell,hr_independent_ledger_replay'
          python hr_source_viability.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hr-authenticated-training-source
          path: |
            research/v98_independent/phase243_clean4_canonical/
            research/v98_independent/hq_gap_aware_spot_source_only/
            research/v98_independent/phase803_official_training_ohlc_receipt.json
            research/v98_independent/phase1000_four_asset_source_policy_receipt.json
            research/v98_independent/phase1000_four_asset_conservative_bounds_source_only.csv
            research/v98_independent/hr_source_viability.json
          retention-days: 30
          if-no-files-found: error
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [HR_core_only, HR_full, HR_minus_opportunity, HR_minus_RV, HR_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: hr-authenticated-training-source
          path: research/v98_independent
      - name: Run HR six native fee/funding cells per physical book
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python hr_30cell.py --path ${{ matrix.path }} --output hr30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s hr30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/hr30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source,economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hr30-ubuntu-*
          path: receipts
      - name: Independent cross-OS 30-cell chronological/marginal economics
        run: python research/v98_independent/hr_reconcile_30cell.py --root receipts --output hr30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr30-official-economic-summary
          path: hr30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [HR_core_only, HR_full, HR_minus_opportunity, HR_minus_RV, HR_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: hr-authenticated-training-source
          path: research/v98_independent
      - name: Independent each-hour native settlement oracle
        working-directory: research/v98_independent
        run: python hr_independent_ledger_replay.py --path ${{ matrix.path }} --output hr_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/hr_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
