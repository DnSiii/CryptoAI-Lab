name: V98 Independent Phase249 Dynamic Allocator
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase249-dynamic-allocator.yml'
      - 'research/v98_independent/phase249_inverse_vol_allocator.py'
      - 'research/v98_independent/test_phase249_inverse_vol_allocator.py'
      - 'research/v98_independent/phase249_inverse_vol_allocator_prereg.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase249-dynamic-allocator
  cancel-in-progress: false
jobs:
  training:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Phase249 causality and invariant tests
        run: PYTHONPATH=src python -m pytest -q research/v98_independent/test_phase249_inverse_vol_allocator.py
      - name: Rebuild authenticated Clean-4 training source
        run: python research/v98_independent/phase243_clean4_source_pipeline.py --attempts 3
      - name: Execute frozen Phase249 twice
        run: |
          python research/v98_independent/phase249_inverse_vol_allocator.py --out /tmp/phase249_a.json
          python research/v98_independent/phase249_inverse_vol_allocator.py --out /tmp/phase249_b.json
          cmp /tmp/phase249_a.json /tmp/phase249_b.json
          cp /tmp/phase249_a.json research/v98_independent/phase249_inverse_vol_allocator_results.json
      - name: Enforce Phase249 firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase249_inverse_vol_allocator_results.json'))
          assert p['phase']==249
          assert p['training_only'] is True and p['validation'] is None
          assert p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert p['parameters']['volatility_hours']==720
          assert p['parameters']['max_asset_weight']==0.4
          assert p['parameters']['gross_target']==1.0
          assert p['gate']['decision'] in {'DYNAMIC_ALLOCATOR_CANDIDATE','REJECT_DYNAMIC_ALLOCATOR_NO_RESCUE'}
          assert p['allocator_diagnostics']['max_target_asset_weight']<=0.400000001
          assert p['diagnostics']['max_open_gross']<=1.000000001
          print('Phase249',p['gate']['decision'])
          PY
      - name: Commit Phase249 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase249_inverse_vol_allocator_results.json
          if git diff --cached --quiet; then
            echo no-result-change
          else
            git commit -m "v98 phase249: record Dynamic Allocator evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - name: Upload Phase249 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v98-phase249-dynamic-allocator-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: research/v98_independent/phase249_inverse_vol_allocator_results.json
