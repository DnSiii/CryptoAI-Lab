name: V98 Independent Phase1219 AF Robust Net Growth Allocator
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1219_af_robust_growth_allocator.py'
      - 'research/v98_independent/test_phase1219_af_robust_growth_allocator.py'
      - '.github/workflows/v98-independent-phase1219-af-allocator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  af-allocator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4
      - name: Validate robust 336h net-log-growth AF collateral allocator
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1219_af_robust_growth_allocator.py' -v
