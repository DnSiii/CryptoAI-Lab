name: V98 Independent Phase1182 AC Official Dispatcher Preflight
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1182_ac_official_training.py'
      - 'research/v98_independent/test_phase1182_ac_official_preflight.py'
      - '.github/workflows/v98-independent-phase1182-ac-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ac-official-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - name: Causal source and metric preflight without historical PnL
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1182_ac_official_preflight.py' -v
