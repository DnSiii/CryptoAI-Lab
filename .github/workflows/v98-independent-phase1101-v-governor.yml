name: V98 Independent Phase1101 V Portfolio Governor Synthetic
on:
  push:
    branches:
      - research/v98-independent-zero
    paths:
      - '.github/workflows/v98-independent-phase1101-v-governor.yml'
      - 'research/v98_independent/phase1101_v_robust_governor.py'
      - 'research/v98_independent/test_phase1101_v_robust_governor.py'
      - 'research/v98_independent/phase1103_v_sevenslot_source.py'
      - 'research/v98_independent/test_phase1103_v_sevenslot_source.py'
      - 'research/v98_independent/phase1105_v_linked_orders.py'
      - 'research/v98_independent/test_phase1105_v_linked_orders.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v-portfolio-first-governor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
      - name: Test V 16-corner maximal feasible growth and 3000 adversarial books
        run: python -m unittest -v test_phase1101_v_robust_governor.py test_phase1103_v_sevenslot_source.py test_phase1105_v_linked_orders.py
