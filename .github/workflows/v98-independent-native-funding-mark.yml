name: V98 Independent Native Funding Mark Attestation (Training Only)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-native-funding-mark.yml'
      - 'research/v98_independent/v98_native_funding_mark_attestation.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  native-mark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve pinned Clean4 2022-2024 original source only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Test pagination and fail-closed official mark parser
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          from v98_native_funding_mark_attestation import collect
          base=1670000000000
          rows=[{'fundingTime':base+8*3600000*i,'fundingRate':'0.00010000','markPrice':'100.0'} for i in range(1200)]
          def fetch(symbol,start,end):return [r for r in rows if start<=r['fundingTime']<=end][:1000]
          got,pages=collect('BTCUSDT',base,base+8*3600000*1199,fetch)
          assert len(got)==1200 and pages==2
          try:collect('BTCUSDT',base,base+8*3600000*1199,lambda s,f,l:[{'fundingTime':f,'fundingRate':'0.1','markPrice':'-2'}])
          except ValueError:pass
          else:raise AssertionError('INVALID_NATIVE_MARK_ACCEPTED')
          print('V98_NATIVE_MARK_PAGINATION_FAIL_CLOSED_PASS')
          PY
      - name: Independently attest official native funding rates and mark prices
        run: |
          python research/v98_independent/v98_native_funding_mark_attestation.py --root official-input --output v98_native_mark_training_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-native-mark-training-attestation-${{ github.run_id }}
          path: v98_native_mark_training_receipt.json
          retention-days: 30
          if-no-files-found: warn
