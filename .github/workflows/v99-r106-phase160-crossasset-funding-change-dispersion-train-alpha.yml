name: V99 R106 Phase160 Cross-Asset Funding Change Dispersion TRAIN Alpha
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - '.github/workflows/v99-r106-phase160-crossasset-funding-change-dispersion-train-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v99-r106-phase160-funding-change-train
  cancel-in-progress: false
jobs:
  train-alpha:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-
      - run: python -m pip install -e ".[dev]"
      - name: Restore canonical V15 state
        run: |
          set -euo pipefail
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v15.json; do
            git cat-file -e "FETCH_HEAD:$path"
            mkdir -p "$(dirname "$path")"
            git show "FETCH_HEAD:$path" > "$path"
          done
      - name: Prepare canonical V15 replay
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Assert frozen Phase160 contract and Phase159 rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path('research/v99_r106_phase160_crossasset_funding_change_dispersion_prereg.md').read_text()
          p=Path('scripts/run_v99_r106_phase160_crossasset_funding_change_dispersion_train_alpha.py').read_text()
          x=json.load(open('reports/candidate_v99_r106_phase159_crossasset_funding_dispersion_train_alpha.json'))
          assert x['status']=='TRAIN_ALPHA_REJECT'
          assert 'PREREGISTERED BEFORE ANY Phase160 PnL' in q and 'REVERSION only' in q
          assert "shift(1).fillna(0)" in p
          assert "holdout_rows_used_for_feature_construction':0" in p and "holdout_rows_used_for_selection':0" in p
          PY
      - name: Run frozen Phase160 TRAIN alpha
        run: python scripts/run_v99_r106_phase160_crossasset_funding_change_dispersion_train_alpha.py
      - name: Verify invariants
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/candidate_v99_r106_phase160_crossasset_funding_change_dispersion_train_alpha.json'))
          assert x['precommitment']['holdout_rows_used_for_feature_construction']==0
          assert x['precommitment']['holdout_rows_used_for_selection']==0
          assert x['frozen_assets_untouched']=={'v16':True,'v99_frozen':True}
          assert x['causality_invariants']['execution_lag_hours']==1
          assert x['causality_invariants']['previous_funding_strictly_prior'] is True
          assert x['causality_invariants']['max_l1']<=1.000000001
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/candidate_v99_r106_phase160_crossasset_funding_change_dispersion_train_alpha.json
          git diff --cached --quiet || git commit -m 'Record V99 R106 Phase160 funding-change TRAIN alpha'
          git pull --rebase origin research/v99-r106-native-all-regime-engine
          git push origin HEAD:research/v99-r106-native-all-regime-engine
