name: V99 R106 Phase180 Arrival Gate
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_r106_phase180_arrival_gate.py'
      - 'research/test_v99_r106_phase180_arrival_gate.py'
      - '.github/workflows/v99-r106-phase180-arrival-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run Phase180 arrival-gate invariants without third-party test dependencies
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('research/test_v99_r106_phase180_arrival_gate.py')
          s=importlib.util.spec_from_file_location('t',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          tests=sorted((n,f) for n,f in vars(m).items() if n.startswith('test_') and callable(f))
          for n,f in tests: f(); print('PASS',n)
          print(f'{len(tests)} invariants passed')
          PY
