name: V99 I1 severe-supersevere native cost binding x original source gate (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_cost_bound_execution.py
      - research/verification/independent_v99_r106_i1_cost_bound_oracle.py
      - research/tests/test_v99_r106_i1_cost_bound_execution.py
      - .github/workflows/v99-r106-i1-cost-bound-original-source-gate.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cost-bound-source-veto:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert cost protocol committed before implementation
        run: |
          git cat-file -e f38116b41e273fbc6efc8343bc706449ae98b24c^{commit}
          test -s research/V99_R106_I1_SCENARIO_COST_BINDING_PREREG_20261026.md
      - name: Independent Decimal severe and supersevere fee/slippage checks
        run: python -m unittest -v research.tests.test_v99_r106_i1_cost_bound_execution
      - name: Restore original source receipts (not synthetic economic TRAIN)
        run: |
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" --name v99-i1-original-causal-signal-40326586848 --dir research_evidence/i1_original_signal
          gh run download 40079775009 --repo "$GITHUB_REPOSITORY" --name v99-tardis-partial-quote-samples-not-train --dir research_evidence/i1_original_partial
      - name: Reexecute original option source gate and independent original-byte oracle
        run: |
          python -m research.tools.v99_r106_i1_original_signal_option_join research_evidence/i1_original_signal/i1_causal_signal.json research_evidence/i1_original_partial research_evidence/i1_original_join/i1_signal_option_join.json
          python -m research.verification.independent_v99_r106_i1_original_signal_option_oracle research_evidence/i1_original_signal/i1_causal_signal.json research_evidence/i1_original_partial research_evidence/i1_original_join/i1_signal_option_join.json
      - name: Assert actual source block and no synthetic promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research_evidence/i1_original_join/i1_signal_option_join.json").read_text())
          assert r["original_signal_observations"]==182
          assert r["original_source_ready_asset_weeks"]==0
          assert r["signal_source_intersections"]==0
          assert r["certified_complete_option_lifecycles"]==0
          assert not r["economic_train_executed"] and not r["promotion_authorized"]
          print("ORIGINAL SOURCE BLOCK 0/182; MODELLED COST FLOOR VERIFIED ONLY; NO ROI, NO ORDERS, NO PROMOTION")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v99-i1-cost-bound-original-source-${{ github.run_id }}
          path: research_evidence/i1_original_join/
          retention-days: 30
          if-no-files-found: warn
