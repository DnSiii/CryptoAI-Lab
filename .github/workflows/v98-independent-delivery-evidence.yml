name: V98 Independent Delivery-Critical Native Marks and Executable Costs Evidence Preflight
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-delivery-evidence.yml'
      - 'research/v98_independent/v98_delivery_*.py'
      - 'research/v98_independent/test_v98_delivery_evidence_gate.py'
      - 'research/v98_independent/v98_delivery_evidence_contract_20261102.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  expected-native-events-and-fail-closed-evidence:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source bridge dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile and run synthetic negative controls
        run: |
          python -m py_compile research/v98_independent/v98_delivery_evidence_gate.py research/v98_independent/v98_delivery_expected_funding_export.py
          python -m unittest discover -s research/v98_independent -p test_v98_delivery_evidence_gate.py -v
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old-envelope
      - uses: actions/download-artifact@v4
        with:
          name: v98-nh-2025-official-source-41076438477
          run-id: 41076438477
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/new
      - uses: actions/download-artifact@v4
        with:
          name: v98-2025-crossyear-source-41226345264
          run-id: 41226345264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected
      - name: Export exactly 13524 pinned native funding slots without PnL
        env:
          OLD_ROOT: ${{ runner.temp }}/old
          OLD_ENVELOPE: ${{ runner.temp }}/old-envelope/v98_official_mark_envelope_training.csv
          NEW_ROOT: ${{ runner.temp }}/new
          CORRECTED_ROOT: ${{ runner.temp }}/corrected
        run: |
          python research/v98_independent/v98_delivery_expected_funding_export.py \
            --old-root "$OLD_ROOT" --old-envelope "$OLD_ENVELOPE" \
            --new-root "$NEW_ROOT" --corrected-root "$CORRECTED_ROOT" \
            --output-dir v98-delivery-expected
      - name: Independently verify source export and enforce honest external HOLD
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path('v98-delivery-expected')
          r=json.loads((root/'v98_expected_native_funding_receipt.json').read_text())
          p=root/'v98_expected_native_funding_2022_2025.csv'
          assert r['event_count']==13524 and set(r['per_asset'].values())=={3381}
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['expected_csv_sha256']
          assert not r['2026_accessed'] and not r['holdout_accessed'] and not r['pnl_computed']
          args=[sys.executable,'research/v98_independent/v98_delivery_evidence_gate.py',
                '--evidence-dir','v98-delivery-external-absent',
                '--expected-funding-csv',str(p),'--expected-funding-sha256',r['expected_csv_sha256'],
                '--output',str(root/'v98_delivery_external_evidence_preflight.json')]
          q=subprocess.run(args,check=False)
          assert q.returncode==2, 'missing external evidence must fail closed'
          d=json.loads((root/'v98_delivery_external_evidence_preflight.json').read_text())
          assert d['decision']=='HOLD_MISSING_EXTERNAL_EVIDENCE'
          assert d['paper_or_live_authorized'] is False
          print('PASS_SOURCE_EXPORT_AND_HONEST_EXTERNAL_EVIDENCE_HOLD',r['expected_csv_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-independent-delivery-native-event-custody-preflight-not-engine
          path: v98-delivery-expected/
          retention-days: 30
          if-no-files-found: warn
