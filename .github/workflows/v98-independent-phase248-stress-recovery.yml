name: V98 Independent Phase248 Stress Recovery Sleeve
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase248-stress-recovery.yml'
      - 'research/v98_independent/phase248_stress_recovery.py'
      - 'research/v98_independent/test_phase248_stress_recovery.py'
      - 'research/v98_independent/phase248_stress_recovery_prereg.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase248-stress-recovery
  cancel-in-progress: false
jobs:
  training:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Phase248 causality and invariant tests
        run: PYTHONPATH=src python -m pytest -q research/v98_independent/test_phase248_stress_recovery.py
      - name: Rebuild authenticated Clean-4 training source
        run: python research/v98_independent/phase243_clean4_source_pipeline.py --attempts 3
      - name: Execute frozen Phase248 twice
        run: |
          python research/v98_independent/phase248_stress_recovery.py --out /tmp/phase248_a.json
          python research/v98_independent/phase248_stress_recovery.py --out /tmp/phase248_b.json
          cmp /tmp/phase248_a.json /tmp/phase248_b.json
          cp /tmp/phase248_a.json research/v98_independent/phase248_stress_recovery_results.json
      - name: Enforce Phase248 firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase248_stress_recovery_results.json'))
          assert p['phase']==248
          assert p['training_only'] is True and p['validation'] is None
          assert p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert p['parameters']['assets']==['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT']
          assert p['parameters']['downside_return_hours']==168
          assert p['parameters']['rv_hours']==24 and p['parameters']['reference_hours']==720
          assert p['parameters']['reference_quantile']==0.8 and p['parameters']['breadth_required']==3
          assert p['parameters']['sleeve_per_asset']==-0.125
          assert p['parameters']['system_gross_cap']==1.0
          assert p['gate']['decision'] in {'STRESS_RECOVERY_SLEEVE_CANDIDATE','REJECT_STRESS_RECOVERY_NO_RESCUE'}
          assert p['diagnostics']['max_open_gross']<=1.000000001
          print('Phase248',p['gate']['decision'])
          PY
      - name: Commit Phase248 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase248_stress_recovery_results.json
          if git diff --cached --quiet; then
            echo no-result-change
          else
            git commit -m "v98 phase248: record Stress Recovery Sleeve evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - name: Upload Phase248 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v98-phase248-stress-recovery-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: research/v98_independent/phase248_stress_recovery_results.json
