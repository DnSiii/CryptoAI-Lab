name: V98 Independent Phase1177 AC Actual Open Executor Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1177_ac_actual_open_executor.py'
      - 'research/v98_independent/test_phase1177_ac_actual_open_executor.py'
      - '.github/workflows/v98-independent-phase1177-ac-executor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ac-executor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC runtime
        run: python -m pip install numpy==1.26.4
      - name: Test AC t+1 actual-open self-financing signed native funding
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1177_ac_actual_open_executor.py' -v
