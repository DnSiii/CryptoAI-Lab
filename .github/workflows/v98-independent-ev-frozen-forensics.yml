name: V98 Independent EV Frozen Marginal and Native Cost Forensics
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ev-frozen-forensics.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ev30-ubuntu-24.04-EV_*
          run-id: 40266223579
          github-token: ${{ github.token }}
          path: receipts
      - name: Immutable EV five-book 2023/2024 economic and capital displacement attribution
        shell: bash
        run: |
          python - <<'PY'
          import glob,json
          names=['EV_full','EV_core_only','EV_minus_opportunity','EV_minus_RV','EV_minus_stress']
          books={}
          for name in names:
              files=glob.glob('receipts/ev30-ubuntu-24.04-'+name+'/*.json')
              assert len(files)==1,(name,files)
              raw=json.load(open(files[0]))
              assert raw['architecture']=='EV' and raw['path']==name
              assert raw['validation_2025_read'] is False
              assert len(raw['cells'])==6 and all(c['passed'] for c in raw['cells'])
              books[name]={(c['fee'],c['order']):c for c in raw['cells']}
          for fee in ('base','severe'):
              for order in ('carried_before_fill','new_after_fill'):
                  key=(fee,order);f=books['EV_full'][key]
                  print('EV_FROZEN_FULL',fee,order,'CAGR',round(f['two_year_cagr'],6),
                        'turnover',round(f['turnover'],2),'fees',round(f['fees'],2),
                        'slippage',round(f['slippage'],2),'funding',round(f['funding'],2),
                        'DD',round(f['max_drawdown'],6))
                  for other in names[1:]:
                      b=books[other][key]
                      economic={k:round(f[k]-b[k],4) for k in
                          ('final_nav','turnover','fees','slippage','funding')}
                      annual={y:round(f['annual'][y]['net_log_growth']-
                          b['annual'][y]['net_log_growth'],7) for y in ('2023','2024')}
                      print('EV_FROZEN_FULL_MINUS',other,fee,order,
                            'economic',economic,'annual_log',annual)
          PY
