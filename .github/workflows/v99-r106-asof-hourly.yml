name: V99 R106 hourly first-party OKX source-only receipts

on:
  schedule:
    - cron: '27 * * * *'
    - cron: '39 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v99-r106-asof-hourly.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: cryptoai-v99-r106-asof-dataonly-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  market-hourly:
    if: github.event_name != 'schedule' || github.event.schedule == '27 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research code without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify market source and continuity invariants
        run: |
          python -m unittest discover -s research/tests -p 'test_v99_r106_okx_prospective_receipt.py' -v
          python -m unittest discover -s research/tests -p 'test_v99_r106_okx_multihour_continuity.py' -v
      - name: Capture five first-party OKX swap market receipts
        run: python -m research.tools.v99_r106_okx_prospective_receipt --out research_evidence/okx_live_receipt
      - name: Retrieve last archived OKX market receipt and quarantine continuity
        id: continuity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, pathlib, time, urllib.error, urllib.parse, urllib.request, zipfile
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if redirected and urllib.parse.urlparse(newurl).hostname != urllib.request.urlparse(req.full_url).hostname:
                      redirected.remove_header('Authorization')
                      redirected.remove_header('X-GitHub-Api-Version')
                  return redirected
          opener=urllib.request.build_opener(SafeRedirect)
          def request(url):
              # Retry only transient transport/server failures; never accept missing history.
              for attempt in range(5):
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with opener.open(req,timeout=30) as response:
                          body=response.read()
                          if not body:
                              raise RuntimeError('empty GitHub API response')
                          return body
                  except urllib.error.HTTPError as exc:
                      retryable=exc.code in (429,500,502,503,504)
                      print(f'GitHub artifact API HTTP {exc.code}, attempt {attempt+1}/5, retryable={retryable}',flush=True)
                      if not retryable or attempt==4:
                          raise
                      retry_after=exc.headers.get('Retry-After')
                      delay=min(30,float(retry_after)) if retry_after and retry_after.isdigit() else min(20,2**attempt)
                  except (urllib.error.URLError,TimeoutError,ConnectionError) as exc:
                      print(f'GitHub artifact API transport error {type(exc).__name__}, attempt {attempt+1}/5',flush=True)
                      if attempt==4:
                          raise
                      delay=min(20,2**attempt)
                  time.sleep(delay)
              raise RuntimeError('GitHub artifact API retries exhausted')
          try:
              # Paginate; a busy repository can exceed 100 artifacts.
              artifacts=[]
              for page in range(1,11):
                  payload=json.loads(request(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'))
                  batch=payload.get('artifacts',[])
                  artifacts.extend(batch)
                  if len(batch)<100:
                      break
              candidates=sorted((a for a in artifacts if a.get('name','').startswith('v99-r106-okx-firstparty-') and not a.get('expired') and str(os.environ['GITHUB_RUN_ID']) not in a.get('name','')),key=lambda a:a['created_at'],reverse=True)
              if not candidates:
                  raise RuntimeError('no unexpired previous OKX artifact')
              previous=candidates[0]
              print('Continuity previous artifact id=',previous['id'],'name=',previous['name'],flush=True)
              archive=request(f'https://api.github.com/repos/{repo}/actions/artifacts/{previous["id"]}/zip')
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  names=z.namelist()
                  if any(pathlib.PurePosixPath(n).is_absolute() or '..' in pathlib.PurePosixPath(n).parts for n in names):
                      raise RuntimeError('unsafe artifact path')
                  z.extractall('research_evidence/previous_okx')
              print('Previous OKX files extracted:',len(names),flush=True)
          except Exception as exc:
              print('::error::Previous OKX artifact retrieval failed:',type(exc).__name__,str(exc),flush=True)
              raise
          PY
          python -m research.tools.v99_r106_okx_multihour_continuity \
            --previous research_evidence/previous_okx \
            --current research_evidence/okx_live_receipt \
            --out research_evidence/okx_live_receipt/continuity_witness.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_evidence/okx_live_receipt/continuity_witness.json').read_text())
          assert r['paper_publication_authorized'] is False
          assert r['promotion_authorized'] is False
          print('OKX HOURLY DATA_ONLY:',r['status'],r['issues'])
          PY
      - name: Record fail-closed continuity outcome even on retrieval failure
        if: always() && steps.continuity.outcome == 'failure'
        run: |
          mkdir -p research_evidence/okx_live_receipt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_evidence/okx_live_receipt/continuity_retrieval_failure.json')
          p.write_text(json.dumps({
            'status':'CONTINUITY_UNVERIFIED',
            'reason':'previous artifact retrieval or continuity verification failed; see workflow step logs',
            'paper_publication_authorized':False,
            'promotion_authorized':False
          },indent=2)+'\n')
          PY
      - name: Upload raw market source and continuity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-okx-firstparty-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: research_evidence/okx_live_receipt/
      - name: Fail closed if continuity could not be verified
        if: steps.continuity.outcome == 'failure'
        run: exit 1

  terms-hourly:
    if: github.event_name != 'schedule' || github.event.schedule == '39 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout R106 research read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify native terms and funding-notice invariants
        run: |
          python -m unittest discover -s research/tests -p 'test_v99_r106_okx_terms_asof.py' -v
          python -m unittest discover -s research/tests -p 'test_v99_r106_terms_append.py' -v
      - name: Capture first-party contract multipliers and projected funding notices
        run: python -m research.tools.v99_r106_okx_terms_asof --out research_evidence/okx_terms
      - name: Verify raw terms body digests and explicit research-only flags
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research_evidence/okx_terms')
          m=json.loads((root/'manifest.json').read_text())
          assert m['paper_publication_authorized'] is False
          assert m['promotion_authorized'] is False
          assert m['funding_cashflows_settled_and_pit_authenticated'] is False
          assert len(m['contracts'])==5
          for inst,info in m['contracts'].items():
              for typ,field in [('metadata','contract_raw_sha256'),('funding','funding_raw_sha256')]:
                  raw=(root/(typ+'_'+inst+'.raw.json')).read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==info[field]
          print('DATA_ONLY native OKX terms receipt; forecast funding is NOT cashflow')
          PY
      - name: Archive source contract and funding-notice receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-okx-terms-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: research_evidence/okx_terms/
