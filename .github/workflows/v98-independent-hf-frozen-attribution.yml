name: V98 Independent HF Frozen Economic Attribution
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-hd-frozen-attribution.yml'
      - 'research/v98_independent/hf_frozen_attribution.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frozen-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hf30-official-economic-summary
          run-id: 40389720461
          github-token: ${{ github.token }}
          path: frozen
      - name: Read-only frozen independent 30-cell marginal attribution
        run: |
          python research/v98_independent/hf_frozen_attribution.py --input frozen/hf30_official_economic_summary.json --output hf_frozen_attribution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hd-frozen-attribution
          path: hf_frozen_attribution.json
          retention-days: 30
          if-no-files-found: warn
