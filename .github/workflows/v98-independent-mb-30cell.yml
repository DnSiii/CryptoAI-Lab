name: V98 Independent MB 30-Cell Causal Atomic Signed Physical Training
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mb-30cell.yml'
      - 'research/v98_independent/mb_30cell_causal_atomic.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mb-30cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned original Clean4 2022-24 training only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download SHA-pinned official 9144-event mark OHLC worst envelope
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Recheck independent source gate and causal pretrade survival
        working-directory: research/v98_independent
        run: |
          python -m py_compile mb_sources.py mb_independent_source_gate.py mb_30cell_causal_atomic.py v98_pretrade_causal_atomic_planner.py
          python v98_pretrade_causal_atomic_planner.py
          python mb_independent_source_gate.py --root ../../official-input
      - name: Run full-hour 30 physical cells; fail closed on any invariant or economic rejection
        working-directory: research/v98_independent
        run: |
          python mb_30cell_causal_atomic.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output mb_30cell_training_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mb-30cell-${{ github.run_id }}
          path: research/v98_independent/mb_30cell_training_receipt.json
          retention-days: 30
          if-no-files-found: warn
