name: V98 Independent Phase1176 AC Discrete Governor Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1176_ac_discrete_allocator.py'
      - 'research/v98_independent/test_phase1176_ac_discrete_allocator.py'
      - '.github/workflows/v98-independent-phase1176-ac-governor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ac-governor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC numerical runtime
        run: python -m pip install numpy==1.26.4
      - name: Test AC signed actual-NAV 81-corner discrete governor
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1176_ac_discrete_allocator.py' -v
