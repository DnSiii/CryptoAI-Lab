name: V98 Independent Masked Native 5m Provenance Dual OS Source-Only
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-native-5m-masked-source.yml'
      - 'research/v98_independent/native_5m_masked_source_prereg_20261028.md'
      - 'research/v98_independent/native_5m_masked_source.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Deterministic native 5m parser tests and masked source syntax
        working-directory: research/v98_independent
        run: |
          python -m py_compile jq_native_5m_path_source.py native_5m_masked_source.py
          python -m unittest -v test_jq_native_5m_path_source.py
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned 1h Clean4 training source
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');dest=Path('research/v98_independent/phase243_clean4_canonical')
          dest.mkdir(parents=True,exist_ok=True)
          for asset in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT'):
              name=asset+'_1h.csv';found=list(root.rglob(name))
              assert len(found)==1
              shutil.copy2(found[0],dest/name)
          PY
      - name: Native vendor SHA full-month quarantine and full calendar feature mask (NO PNL)
        working-directory: research/v98_independent
        run: python native_5m_masked_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-native-5m-masked-${{ matrix.os }}
          path: |
            research/v98_independent/native_5m_masked_source_receipt.json
            research/v98_independent/native_5m_masked_verified_hourly_features.csv
          retention-days: 30
          if-no-files-found: warn
  independent:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v98-native-5m-masked-ubuntu-*
          path: receipts
      - name: Independent cross-OS byte-exact manifest and feature-mask audit
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=[];reports=[]
          for os in ('ubuntu-22.04','ubuntu-24.04'):
              p=Path('receipts')/('v98-native-5m-masked-'+os)
              r=json.loads((p/'native_5m_masked_source_receipt.json').read_text())
              raw=(p/'native_5m_masked_verified_hourly_features.csv').read_bytes()
              assert r['decision']=='MASKED_5M_SOURCE_ONLY_NO_ECONOMIC_AUTHORIZATION'
              assert r['asset_hours_expected']==73152
              assert r['archives_verified']+r['archives_quarantined']==100
              assert hashlib.sha256(raw).hexdigest()==r['feature_csv_sha256']
              reports.append(r);data.append(raw)
          assert reports[0]==reports[1],'MASKED_5M_MANIFEST_OS_DIVERGENCE'
          assert data[0]==data[1],'MASKED_5M_FEATURE_OS_DIVERGENCE'
          print('MASKED_NATIVE_5M_DUAL_OS_SOURCE_ONLY_PASS',
                'valid_hours',reports[0]['asset_hours_source_valid'],
                'quarantined_months',reports[0]['archives_quarantined'],
                'sha256',reports[0]['feature_csv_sha256'])
          PY
