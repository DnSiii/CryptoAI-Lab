name: V98 Independent Phase253 Relative Value Sleeve
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-phase253-relative-value.yml'
      - 'research/v98_independent/phase253_all_pairs_relative_value.py'
      - 'research/v98_independent/test_phase253_all_pairs_relative_value.py'
      - 'research/v98_independent/phase253_all_pairs_relative_value_prereg.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v98-independent-phase253-relative-value
  cancel-in-progress: false
jobs:
  training:
    if: github.ref == 'refs/heads/research/v98-independent-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v98-independent-zero
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Phase253 causality and invariant tests
        run: PYTHONPATH=src python -m pytest -q research/v98_independent/test_phase253_all_pairs_relative_value.py
      - name: Rebuild authenticated Clean-4 training source
        run: python research/v98_independent/phase243_clean4_source_pipeline.py --attempts 3
      - name: Execute frozen Phase253 twice
        run: |
          python research/v98_independent/phase253_all_pairs_relative_value.py --out /tmp/phase253_a.json
          python research/v98_independent/phase253_all_pairs_relative_value.py --out /tmp/phase253_b.json
          cmp /tmp/phase253_a.json /tmp/phase253_b.json
          cp /tmp/phase253_a.json research/v98_independent/phase253_all_pairs_relative_value_results.json
      - name: Enforce Phase253 firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v98_independent/phase253_all_pairs_relative_value_results.json'))
          assert p['phase']==253
          assert p['training_only'] is True and p['validation'] is None
          assert p['holdout_accessed'] is False
          assert p['v14_used'] is False and p['v15_used'] is False and p['v99_used'] is False
          assert len(p['parameters']['pairs'])==6
          assert p['parameters']['reference_hours']==720
          assert p['parameters']['entry_z']==2.0 and p['parameters']['exit_z']==0.5
          assert p['parameters']['rv_gross']==0.5
          assert p['parameters']['system_gross_cap']==1.25
          assert p['gate']['decision'] in {'RELATIVE_VALUE_SLEEVE_CANDIDATE','REJECT_RELATIVE_VALUE_NO_RESCUE'}
          assert p['rv_activity']['max_abs_overlay_net']<=1e-12
          assert p['rv_activity']['max_overlay_gross']<=0.500000001
          assert p['diagnostics']['max_open_gross']<=1.250000001
          print('Phase253',p['gate']['decision'])
          PY
      - name: Commit Phase253 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/v98_independent/phase253_all_pairs_relative_value_results.json
          if git diff --cached --quiet; then
            echo no-result-change
          else
            git commit -m "v98 phase253: record Relative Value Sleeve evidence"
            git pull --rebase --autostash origin research/v98-independent-zero
            git push origin HEAD:research/v98-independent-zero
          fi
      - name: Upload Phase253 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v98-phase253-relative-value-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: research/v98_independent/phase253_all_pairs_relative_value_results.json
