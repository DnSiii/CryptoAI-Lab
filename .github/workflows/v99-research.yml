name: CryptoAI V99 asymmetric research gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v99-research.yml"
      - "config/candidate_v99_asymmetric.json"
      - "src/cryptoai_v13/v99.py"
      - "scripts/paper_once_v99.py"
      - "scripts/run_candidate_v99.py"
      - "tests/test_v99_research.py"
      - "tests/test_v99_paper.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v99-research.yml"
      - "config/candidate_v99_asymmetric.json"
      - "src/cryptoai_v13/v99.py"
      - "scripts/paper_once_v99.py"
      - "scripts/run_candidate_v99.py"
      - "tests/test_v99_research.py"
      - "tests/test_v99_paper.py"

permissions:
  contents: read

jobs:
  research:
    name: Tail-loss and winner-capture validation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out V99 research code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run causal and no-real-order tests
        run: python -m pytest

      - name: Synchronize latest closed public candles
        run: python scripts/sync_paper_data_v13.py

      - name: Run the V99 strict gate
        shell: bash
        run: |
          python scripts/run_candidate_v99.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/candidate_v99_asymmetric_validation.json").read_text(
                  encoding="utf-8"
              )
          )
          if not report.get("strict_research_gate_passed"):
              failed = [name for name, passed in report["gate"].items() if not passed]
              raise SystemExit("V99 strict gate failed: " + ", ".join(failed))
          print("V99 strict research gate PASSED")
          PY

      - name: Upload complete V99 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v99-research-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/candidate_v99_asymmetric_validation.json
            reports/candidate_v99_asymmetric_diagnostics.csv
