name: V99 R106 Phase130 downside asymmetry train alpha
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths: ['scripts/run_v99_r106_phase130_downside_asymmetry_train_alpha.py','.github/workflows/v99-r106-phase130-downside-asymmetry-train-alpha.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: v99-r106-phase130-downside-asymmetry, cancel-in-progress: false}
jobs:
  train-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: {PYTHONUNBUFFERED: "1", PIP_DISABLE_PIP_VERSION_CHECK: "1", RESEARCH_BRANCH: research/v99-r106-native-all-regime-engine}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: research/v99-r106-native-all-regime-engine, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - id: cache_date
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: Linux-paper-v15-market-v1-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - run: python -m pip install -e ".[dev]"
      - name: Restore canonical V15 state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin paper-results
          for path in state/paper_v15_universe.json reports/paper_data_sync_v15.json; do git cat-file -e "FETCH_HEAD:$path"; mkdir -p "$(dirname "$path")"; git show "FETCH_HEAD:$path" > "$path"; done
      - name: Prepare canonical V15 replay
        run: python scripts/prepare_dashboard_v15_replay.py
      - name: Snapshot frozen assets
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          files=sorted({p for pat in ('*v16*frozen*','*v99*frozen*') for p in pathlib.Path('.').rglob(pat) if p.is_file() and '.git' not in p.parts});pathlib.Path('/tmp/frozen_before.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},sort_keys=True))
          PY
      - name: Run Phase130 train-only gate
        run: python scripts/run_v99_r106_phase130_downside_asymmetry_train_alpha.py
      - name: Verify frozen assets unchanged
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/frozen_before.json');assert p.exists();b=json.loads(p.read_text());a={x:hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest() for x in b};assert b==a,'Frozen asset mutation detected'
          PY
      - name: Persist evidence
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/candidate_v99_r106_phase130_downside_asymmetry_train_alpha.json').read_text());p=r['precommitment'];assert r['frozen_assets_untouched']['v16'] and r['frozen_assets_untouched']['v99_frozen'];assert p['holdout_not_parsed'] and p['single_hypothesis_no_grid'] and p['no_sign_flip'];assert r['causality_invariants']['post_train_targets_zero'] and r['causality_invariants']['full_score_shift_hours']==1;assert r['status'] in ('TRAIN_ALPHA_PASS_FREEZE_FOR_DOWNSTREAM','TRAIN_ALPHA_REJECT')
          PY
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com";git add reports/candidate_v99_r106_phase130_downside_asymmetry_train_alpha.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V99 R106 Phase130 downside asymmetry train gate";git fetch origin ${RESEARCH_BRANCH};git rebase origin/${RESEARCH_BRANCH};git push origin HEAD:${RESEARCH_BRANCH}
