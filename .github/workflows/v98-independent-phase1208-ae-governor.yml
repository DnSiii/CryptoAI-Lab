name: V98 Independent Phase1208 AE Cash Anchor Governor Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1208_ae_cash_anchor_governor.py'
      - 'research/v98_independent/test_phase1208_ae_cash_anchor_governor.py'
      - '.github/workflows/v98-independent-phase1208-ae-governor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ae-governor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4
      - name: Verify nine independent 81-corner growth and exit tests
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1208_ae_cash_anchor_governor.py' -v
