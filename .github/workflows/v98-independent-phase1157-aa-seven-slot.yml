name: V98 Independent Phase1157 AA Seven-Slot Structural Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1156_aa_exit_reserve_governor.py'
      - 'research/v98_independent/phase1157_aa_sevenslot_source.py'
      - 'research/v98_independent/test_phase1157_aa_sevenslot_source.py'
      - '.github/workflows/v98-independent-phase1157-aa-seven-slot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aa-seven-slot-source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: AA complete seven-slot source synthetic only
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1157_aa_sevenslot_source.py' -v
      - name: AA exit reserve independent oracle
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1156_aa_exit_reserve_governor.py' -v
      - name: Assert no historical PnL, future or external engine
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research/v98_independent/phase1157_aa_sevenslot_source.py').read_text()
          assert "def compose_aa(" in s and "'historical_pnl_computed':False" in s
          assert 'V99' not in s and 'V16' not in s
          print('AA_STRUCTURAL_ONLY_NOT_FROZEN')
          PY
