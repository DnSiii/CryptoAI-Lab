name: V98 Independent Phase1205 AE Causal Breakout Source Crossrunner
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1205_ae_breakout_source.py'
      - 'research/v98_independent/test_phase1205_ae_breakout_source.py'
      - '.github/workflows/v98-independent-phase1205-ae-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ae-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/v98_independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Test causal AE source without historical PnL
        run: python -m unittest -v test_phase1205_ae_breakout_source.py
      - name: Persist independent source-only synthetic digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from test_phase1205_ae_breakout_source import sample
          from phase1205_ae_breakout_source import ae_breakout_source,source_digest
          f=sample()
          out=ae_breakout_source(*f)
          r={'phase':1205,'source_only':True,'historical_system_pnl_computed':False,
             'validation_2025_read':False,'external_benchmarks_used':False,
             'synthetic_hours':len(f[0]),'digest':source_digest(f[0].index,out),
             'active_hours':[int(np.any(x!=0,axis=1).sum()) for x in out]}
          Path('phase1205_ae_source_receipt.json').write_text(
              json.dumps(r,sort_keys=True,indent=2)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Upload AE source digest
        uses: actions/upload-artifact@v4
        with:
          name: v98-ae-phase1205-${{ matrix.os }}
          path: research/v98_independent/phase1205_ae_source_receipt.json
          retention-days: 30
  ae-source-crossrunner:
    needs: ae-source
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v98-ae-phase1205-*
          path: /tmp/v98-ae-phase1205
      - name: Verify strict independent source digest equality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v98-ae-phase1205')
          paths=[root/('v98-ae-phase1205-'+os)/'phase1205_ae_source_receipt.json'
                 for os in ('ubuntu-22.04','ubuntu-24.04')]
          if not all(p.is_file() for p in paths):
              raise SystemExit('AE1205_MISSING_CROSSRUNNER')
          a,b=[json.loads(p.read_text()) for p in paths]
          assert a==b, 'AE1205_SOURCE_DRIFT'
          assert a['historical_system_pnl_computed'] is False
          assert a['synthetic_hours']==900 and len(a['digest'])==64
          assert all(x>0 for x in a['active_hours'])
          print(json.dumps({'decision':'PASS_AE_CAUSAL_SOURCE_CROSSRUNNER_SYNTHETIC_ONLY',
                            'digest':a['digest'],'active_hours':a['active_hours']},sort_keys=True))
          PY
