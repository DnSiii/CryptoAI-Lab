name: V99 Phase195-AN Immutable Research Paper Guards
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - 'research/tools/v99_phase195an_*.py'
      - 'research/tests/test_phase195an_*.py'
      - '.github/workflows/v99-r106-phase195an-guards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline fail-closed historical prefix invariants
        run: python research/tests/test_phase195an_guard_invariants.py
