name: V98 Independent MI Read-Only 17543-Hour Strategy Fill Audit
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mi-fill-oracle.yml'
      - 'research/v98_independent/mi_independent_fill_oracle.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mi-fill-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download immutable original MI physical ledger
        uses: actions/download-artifact@v4
        with:
          name: v98-mi-physical-40975970087
          run-id: 40975970087
          github-token: ${{ github.token }}
          path: original-mi
      - name: Download pinned Clean4 2022-24 TRAINING ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Independent source weights plus every original execution fill and tamper test
        working-directory: research/v98_independent
        run: |
          python -m py_compile mi_independent_fill_oracle.py
          python mi_independent_fill_oracle.py --root ../../official-input --ledger-jsonl ../../original-mi/mi_base_full_hourly_forensic.jsonl --output mi_independent_fill_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mi-fill-audit-${{ github.run_id }}
          path: research/v98_independent/mi_independent_fill_receipt.json
          retention-days: 30
          if-no-files-found: warn
