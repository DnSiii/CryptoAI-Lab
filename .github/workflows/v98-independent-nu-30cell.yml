name: V98 NU Low-Churn Carry Spread Seven-Slot 30-Cell Physical + Independent Gates
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-nu-30cell.yml'
      - 'research/v98_independent/nu_*.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  nu-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download pinned authenticated Clean-4 2022-24 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download pinned official worst-side hourly mark envelope (not exact event mark)
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Source-only and causal synthetic gates before PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile nu_sources.py nu_intents.py nu_source_gate.py nu_30cell_physical.py nu_hourly_oracle_gate.py nu_independenu_fill_oracle.py nu_independenu_receipt_arithmetic_audit.py nu_independenu_source_oracle.py
          python nu_sources.py
          python v98_future_net_growth_capital_competition.py
          python nu_intents.py
          python nu_source_gate.py --root ../../official-input --output nu_source_receipt.json
          python nu_independenu_source_oracle.py --root ../../official-input --output nu_independenu_source_receipt.json
      - name: Run original NU 30-cell signed physical training
        id: physical
        continue-on-error: true
        working-directory: research/v98_independent
        run: |
          python nu_30cell_physical.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output nu_30cell_receipt.json --ledger-output nu_base_full_hourly_forensic.jsonl
      - name: Independent all-hour signed settlement
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nu_30cell_receipt.json && test -s nu_base_full_hourly_forensic.jsonl; then
            python nu_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl nu_base_full_hourly_forensic.jsonl --receipt nu_30cell_receipt.json --output nu_independenu_hourly_receipt.json
          else
            echo "NO_COMPLETE_NU_LEDGER_FOR_INDEPENDENU_SETTLEMENU"
          fi
      - name: Independently reconstruct net physical fills and tamper detection
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nu_base_full_hourly_forensic.jsonl; then
            python nu_independenu_fill_oracle.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl nu_base_full_hourly_forensic.jsonl --output nu_independenu_fill_receipt.json
          else
            echo "NO_COMPLETE_NU_LEDGER_FOR_INDEPENDENU_FILLS"
          fi
      - name: Independent 30-cell arithmetic and economic gate
        if: always()
        working-directory: research/v98_independent
        run: |
          if test -s nu_30cell_receipt.json; then
            python nu_independenu_receipt_arithmetic_audit.py --receipt nu_30cell_receipt.json > nu_independenu_arithmetic_receipt.json
            cat nu_independenu_arithmetic_receipt.json
          else
            echo "NO_NU_RECEIPT_FOR_ARITHMETIC_AUDIT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-nu-original-${{ github.run_id }}
          path: |
            research/v98_independent/nu_source_receipt.json
            research/v98_independent/nu_independenu_source_receipt.json
            research/v98_independent/nu_30cell_receipt.json
            research/v98_independent/nu_independenu_hourly_receipt.json
            research/v98_independent/nu_independenu_fill_receipt.json
            research/v98_independent/nu_independenu_arithmetic_receipt.json
            research/v98_independent/nu_base_full_hourly_forensic.jsonl
          retention-days: 30
          if-no-files-found: warn
      - name: Economic gate is binding; no false completion
        if: always()
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('nu_30cell_receipt.json')
          if not p.exists():raise SystemExit('NU_MISSING_PHYSICAL_RECEIPT')
          r=json.loads(p.read_text())
          print('NU_ORIGINAL_DECISION',r['decision'])
          print('NU_GATE_FAILURES',r['gate_failures'])
          if r['decision']!='PASS_PROVISIONAL_TRAINING_NOT_VALIDATED':
              raise SystemExit('NU_REJECTED_NO_PROMOTION')
          if not Path('nu_independenu_source_receipt.json').exists() or not Path('nu_independenu_hourly_receipt.json').exists() or not Path('nu_independenu_fill_receipt.json').exists() or not Path('nu_independenu_arithmetic_receipt.json').exists():
              raise SystemExit('NU_MISSING_INDEPENDENU_EVIDENCE')
          print('NU_PROVISIONAL_TRAINING_ONLY_NOT_INDEPENDENU_VALIDATION')
          PY
