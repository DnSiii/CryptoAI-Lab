name: V98 Independent CC Native Funding and 81 Corner Replay
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-cc-native-replay.yml'
      - 'research/v98_independent/cc_event_replay_audit.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve pinned 2022-2024 Clean4 ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage immutable 2022-2024 OHLC and native funding
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input')
          target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json',
                 'phase1000_four_asset_source_policy_receipt.json',
                 'phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name))
              assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name
                    if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(found[0],dest)
          PY
      - name: Replay six original CC full-book fee/funding-order cases
        working-directory: research/v98_independent
        shell: bash
        run: |
          python -m py_compile cc_event_replay_audit.py
          set +e
          python cc_event_replay_audit.py --output cc_native_event_replay.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s cc_native_event_replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc-native-event-independent-replay
          path: research/v98_independent/cc_native_event_replay.json
          retention-days: 30
          if-no-files-found: warn
      - name: Check all six original cases and fail on independent mismatch
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import json
          a=json.load(open('cc_native_event_replay.json'))
          assert len(a['cases'])==6
          assert all(c['passed'] for c in a['cases']),a
          print('CC_INDEPENDENT_REPLAY_PASS',sum(c['settled_hours'] for c in a['cases']),
                'settlements',sum(c['actual_independent_81_corner_checks'] for c in a['cases']),
                'actually evaluated OHLC corners')
          PY
