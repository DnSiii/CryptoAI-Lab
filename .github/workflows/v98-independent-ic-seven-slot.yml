name: V98 Independent IC Native OI Crowding Seven Slot 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ic-seven-slot.yml'
      - 'research/v98_independent/ic_oi_crowding_prereg_20261027.md'
      - 'research/v98_independent/ic_oi_crowding_sources.py'
      - 'research/v98_independent/ic_source_viability.py'
      - 'research/v98_independent/ic_30cell.py'
      - 'research/v98_independent/ic_reconcile_30cell.py'
      - 'research/v98_independent/ic_independent_ledger_replay.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned training data only (no 2025)
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: oi-input
      - name: Stage exact independently audited OI v2 source (no missing-day fill)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('oi-input');target=Path('research/v98_independent')
          names=['v98_oi_full_history_source_v2_report_20261027.json','v98_oi_full_history_v2_verified_hourly_20261027.csv']
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Stage exact authenticated Clean-4 source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-v2-full-source-artifact-only-audit
          run-id: 40477926560
          github-token: ${{ github.token }}
          path: oi-audit
      - name: Require independent OI artifact-only integrity before any economic PnL
        run: |
          python - <<'PY'
          import glob,json
          p=glob.glob('oi-audit/**/*.json',recursive=True)
          assert len(p)==1,p
          x=json.load(open(p[0]))
          assert x['decision']=='PASS_OI_ARTIFACT_INTEGRITY_WITH_GAPS_NOT_TRAINING_APPROVAL'
          assert x['verified_days']==3011 and x['quarantined_days']==37
          assert x['verified_hourly_rows']==72264 and not x['pnl_computed']
          PY
      - name: IC native OI crowding source viability
        working-directory: research/v98_independent
        run: |
          python -m py_compile ic_oi_crowding_sources.py ic_source_viability.py ic_30cell.py ic_reconcile_30cell.py
          python ic_oi_crowding_sources.py
          python -c 'import ic_30cell, ic_reconcile_30cell, ic_independent_ledger_replay'
          python ic_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic-source-viability
          path: research/v98_independent/ic_source_viability.json
          retention-days: 30
          if-no-files-found: warn
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [IC_core_only, IC_full, IC_minus_opportunity, IC_minus_RV, IC_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: oi-input
      - name: Stage exact independently audited OI v2 source (no missing-day fill)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('oi-input');target=Path('research/v98_independent')
          names=['v98_oi_full_history_source_v2_report_20261027.json','v98_oi_full_history_v2_verified_hourly_20261027.csv']
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Run native 6-cell path USD10k, base/severe/supersevere and both funding orders
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python ic_30cell.py --path ${{ matrix.path }} --output ic30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s ic30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/ic30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ic30-ubuntu-*
          path: receipts
      - name: Independent artifact-only 30-cell cross-OS and marginal gate
        shell: bash
        run: python research/v98_independent/ic_reconcile_30cell.py --root receipts --output ic30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic30-official-economic-summary
          path: ic30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn

  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [IC_core_only, IC_full, IC_minus_opportunity, IC_minus_RV, IC_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Retrieve authenticated 2022-2024 Clean4 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-oi-clean4-2022-2024-v2-source-only
          run-id: 40477513000
          github-token: ${{ github.token }}
          path: oi-input
      - name: Stage exact independently audited OI v2 source (no missing-day fill)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('oi-input');target=Path('research/v98_independent')
          names=['v98_oi_full_history_source_v2_report_20261027.json','v98_oi_full_history_v2_verified_hourly_20261027.csv']
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              shutil.copy2(found[0],target/name)
          PY
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independent all-hour signed funding, NAV, fee, slippage and 81-corner settlement replay
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_independent_settlement_oracle.py ic_independent_ledger_replay.py
          python ic_independent_ledger_replay.py --path ${{ matrix.path }} --output ic_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/ic_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
