name: V98 Independent KB Native Return State Seven Slot 30 Cell Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-kb-seven-slot.yml'
      - 'research/v98_independent/kb_*'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download exact pinned 2022-2024 Clean-4, never 2025
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage original authenticated Clean-4 and native funding
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Pre-PnL causal state transition and financed activation gate
        working-directory: research/v98_independent
        run: |
          python -m py_compile kb_sign_transition_sources.py kb_source_viability.py kb_30cell.py kb_reconcile_30cell.py kb_original_artifact_independent_audit.py kb_independent_ledger_replay.py
          python kb_sign_transition_sources.py
          python kb_source_viability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb-source-viability
          path: research/v98_independent/kb_source_viability.json
          retention-days: 30
          if-no-files-found: warn
  economic:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        path: [KB_core_only, KB_full, KB_minus_opportunity, KB_minus_RV, KB_minus_stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Physical USD10k native signed funding six-cell path
        working-directory: research/v98_independent
        shell: bash
        run: |
          set +e
          python kb_30cell.py --path ${{ matrix.path }} --output kb30_${{ matrix.path }}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          test -s kb30_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb30-${{ matrix.os }}-${{ matrix.path }}
          path: research/v98_independent/kb30_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
  audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kb30-ubuntu-*
          path: receipts
      - name: Independent 30-cell original receipt cross-OS economic gate
        run: python research/v98_independent/kb_reconcile_30cell.py --root receipts --output kb30_official_economic_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb30-official-economic-summary
          path: kb30_official_economic_summary.json
          retention-days: 30
          if-no-files-found: warn
  original_receipt_audit:
    if: always() && needs.source.result == 'success'
    needs: [source, economic]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kb30-ubuntu-*
          path: original-receipts
      - name: Recompute 60 original receipts without engine or governor imports
        run: python research/v98_independent/kb_original_artifact_independent_audit.py --root original-receipts --output kb_original_independent_economic_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb-original-independent-economic-audit
          path: kb_original_independent_economic_audit.json
          retention-days: 30
          if-no-files-found: warn
  oracle:
    needs: audit
    if: needs.audit.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        path: [KB_core_only, KB_full, KB_minus_opportunity, KB_minus_RV, KB_minus_stress]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Stage exact pinned training bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('official-input');target=Path('research/v98_independent')
          names=['phase803_official_training_ohlc_receipt.json','phase1000_four_asset_source_policy_receipt.json','phase1000_four_asset_conservative_bounds_source_only.csv']
          names += [a+'_1h.csv' for a in ('BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT')]
          for name in names:
              found=list(root.rglob(name));assert len(found)==1,(name,found)
              dest=(target/'phase243_clean4_canonical'/name if name.endswith('_1h.csv') else target/name)
              dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(found[0],dest)
          PY
      - name: Independently verify all settled hours, native funding and 81-corner collateral
        working-directory: research/v98_independent
        run: python kb_independent_ledger_replay.py --path ${{ matrix.path }} --output kb_oracle_${{ matrix.path }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb-independent-ledger-${{ matrix.path }}
          path: research/v98_independent/kb_oracle_${{ matrix.path }}.json
          retention-days: 30
          if-no-files-found: warn
