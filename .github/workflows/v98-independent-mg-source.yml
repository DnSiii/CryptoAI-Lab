name: V98 Independent MG Signed BTC Beta Source-Only Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-mg-source.yml'
      - 'research/v98_independent/mg_sources.py'
      - 'research/v98_independent/mg_independent_source_gate.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mg-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download SHA-pinned Clean4 2022-24 training source
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Authenticate Clean4 OHLC and native signed funding
        run: python research/v98_independent/v98_clean4_training_reader.py --root official-input
      - name: Independently test MG calendars and causal future mutation before PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile mg_sources.py mg_independent_source_gate.py
          python mg_sources.py
          python mg_independent_source_gate.py --root ../../official-input --output mg_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-mg-source-${{ github.run_id }}
          path: research/v98_independent/mg_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
