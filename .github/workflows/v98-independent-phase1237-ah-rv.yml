name: V98 Independent Phase1237 AH Beta Neutral Relative Value
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1237_ah_beta_neutral_rv.py'
      - 'research/v98_independent/test_phase1237_ah_beta_neutral_rv.py'
      - '.github/workflows/v98-independent-phase1237-ah-rv.yml'
  workflow_dispatch:
jobs:
  ah-rv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numpy
        run: python -m pip install numpy==1.26.4
      - name: Test signed RV neutrality and causal source
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1237_ah_beta_neutral_rv
      - name: Emit deterministic RV source hash
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import hashlib,numpy as np
          from test_phase1237_ah_beta_neutral_rv import TestAHRV
          from phase1237_ah_beta_neutral_rv import ah_relative_value_source
          w,b=ah_relative_value_source(TestAHRV.fixture())
          raw=np.round(w,8).astype('<f8').tobytes()+np.round(b,8).astype('<f8').tobytes()
          print('AH1237_SHA256',hashlib.sha256(raw).hexdigest())
          print('AH1237_ACTIVE',int(np.count_nonzero(np.abs(w).sum(axis=1)>0)))
          PY
