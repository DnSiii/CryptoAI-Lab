name: Isolated horizon audit

on:
  push:
    branches: [research/isolated-horizon-audit]
    paths:
      - "scripts/run_isolated_horizon_audit.py"
      - ".github/workflows/isolated-horizon-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve UTC cache date
        id: utc
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore canonical market cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/canonical
          key: ${{ runner.os }}-paper-v15-market-v1-${{ steps.utc.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-paper-v15-market-v1-
            ${{ runner.os }}-paper-v13-market-

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Restore published replay state
        shell: bash
        run: |
          git fetch --no-tags origin paper-results
          for path in \
            state/paper_v15_universe.json \
            reports/paper_data_sync_v13.json \
            reports/paper_data_sync_v15.json; do
            if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "FETCH_HEAD:$path" > "$path"
            else
              echo "Missing required published replay artifact: $path"
              exit 1
            fi
          done

      - name: Prepare V15 cached replay runtime
        run: python scripts/prepare_dashboard_v15_replay.py

      - name: Run isolated-start audit
        run: python scripts/run_isolated_horizon_audit.py | tee isolated_horizon_audit.log

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-horizon-audit-${{ github.run_id }}
          retention-days: 30
          path: |
            reports/isolated_horizon_audit.json
            isolated_horizon_audit.log
