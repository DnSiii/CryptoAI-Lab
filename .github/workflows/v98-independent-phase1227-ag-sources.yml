name: V98 Independent Phase1227 AG Seven Slot Causal Sources
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1227_ag_seven_slot_sources.py'
      - 'research/v98_independent/test_phase1227_ag_seven_slot_sources.py'
      - '.github/workflows/v98-independent-phase1227-ag-sources.yml'
  workflow_dispatch:
jobs:
  ag-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Test AG causal source and seven slots
        working-directory: research/v98_independent
        run: python -m unittest -v test_phase1227_ag_seven_slot_sources
      - name: Independent causal source digest
        working-directory: research/v98_independent
        run: |
          python - <<'PY'
          import hashlib
          import numpy as np
          from test_phase1227_ag_seven_slot_sources import TestAGSources
          from phase1227_ag_seven_slot_sources import causal_sources
          c,q=TestAGSources.fixture(400)
          z=causal_sources(c,q)
          payload=b''.join(np.round(x,8).astype('<f8').tobytes() for x in z)
          print('AG1227_SHA256',hashlib.sha256(payload).hexdigest())
          print('AG1227_ACTIVITY',[int(np.count_nonzero(x)) for x in z])
          PY
