name: V99 I1 CoinAPI original-byte 661d source chain (NO ECONOMICS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/V99_R106_I1_COINAPI_661D_ORIGINAL_BYTE_CHAIN_PREREG_20261102.md
      - research/tools/v99_r106_i1_coinapi_661d_original_byte_chain.py
      - research/tests/test_v99_r106_i1_coinapi_661d_original_byte_chain.py
      - .github/workflows/v99-r106-i1-coinapi-661d-original-byte-chain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coinapi-original-byte-chain-no-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce prereg ancestor and sealed TRAIN-only dates
        run: |
          git merge-base --is-ancestor 6d46bc047bab0090b71d0d9c7d2e790dd3c33c7e HEAD
          python - <<'PY'
          from research.tools.v99_r106_i1_local_tape_import import FIRST,END,DAYS
          assert (FIRST.isoformat(),END.isoformat(),DAYS)==('2021-12-09','2023-10-01',661)
          print('SEALED VALIDATION/HOLDOUT UNTOUCHED')
          PY
      - name: Independently replay synthetic original bytes for 661 TRAIN days
        run: |
          python -m unittest -v research.tests.test_v99_r106_i1_coinapi_661d_original_byte_chain
      - name: Real absent licensed original source is a blocker, never fixture success
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from research.tools.v99_r106_i1_coinapi_661d_original_byte_chain import verify
          with tempfile.TemporaryDirectory() as t:
              root=Path(t)
              for name in ('specs','original','derived'):
                  (root/name).mkdir()
              try:
                  verify(root/'specs',root/'original',root/'derived',fixture=False)
              except ValueError as e:
                  assert str(e)=='WRITTEN_COINAPI_CHAIN_LICENSE_REQUIRED',str(e)
                  print('SOURCE_HOLD: WRITTEN_COINAPI_CHAIN_LICENSE_REQUIRED')
                  print('NO ORIGINAL 661D SOURCE; NO ECONOMIC TRAIN / ROI / PROMOTION / ORDERS')
              else:
                  raise AssertionError('MISSING_LICENSE_BYPASSED')
          PY
