name: V99 R106 Phase165 Open Interest DATA Audit
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - '.github/workflows/v99-r106-phase165-open-interest-data-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v99-r106-phase165-open-interest-data
  cancel-in-progress: false
jobs:
  data-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/v99-r106-native-all-regime-engine
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Assert Phase165 firewall and Phase164 rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path('research/v99_r106_phase165_open_interest_data_prereg.md').read_text()
          p=Path('scripts/run_v99_r106_phase165_open_interest_data_audit.py').read_text()
          x=json.load(open('reports/candidate_v99_r106_phase164_funding_breadth_crowding_train_alpha.json'))
          assert x['status']=='TRAIN_ALPHA_REJECT'
          assert 'BEFORE ANY Phase165 PnL' in q and 'DATA ONLY' in q
          assert "'pnl_computed':False" in p
          assert "'holdout_rows_used_for_feature_construction':0" in p
          assert '/daily/metrics' in p and '.CHECKSUM' in p
          assert "'sum_open_interest','sumopeninterest'" in p
          assert "'oi_field':'sum_open_interest'" in p
          PY
      - name: Run frozen Phase165 DATA-only audit
        run: python scripts/run_v99_r106_phase165_open_interest_data_audit.py
      - name: Verify no-PnL invariants
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/candidate_v99_r106_phase165_open_interest_data_audit.json'))
          assert x['pnl_computed'] is False
          assert x['holdout_rows_used_for_feature_construction']==0
          assert x['holdout_rows_used_for_selection']==0
          assert x['frozen_assets_untouched']=={'v16':True,'v99_frozen':True}
          assert all(a['oi_field']=='sum_open_interest' for a in x['assets'].values())
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/candidate_v99_r106_phase165_open_interest_data_audit.json
          git diff --cached --quiet || git commit -m 'Record corrected V99 R106 Phase165 native OI DATA audit'
          git pull --rebase origin research/v99-r106-native-all-regime-engine
          git push origin HEAD:research/v99-r106-native-all-regime-engine
