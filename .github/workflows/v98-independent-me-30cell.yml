name: V98 Independent ME 30-Cell Physical Plus Conditional Hourly Oracle
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-me-30cell.yml'
      - 'research/v98_independent/me_30cell_causal_atomic.py'
      - 'research/v98_independent/me_provisional_hourly_oracle_gate.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  me-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download SHA-authenticated Clean4 2022-24 TRAINING ONLY
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Download SHA-pinned official signed worst mark envelope
        uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Source recheck and causal atomic pretrade
        working-directory: research/v98_independent
        run: |
          python -m py_compile me_sources.py me_independent_source_gate.py me_30cell_causal_atomic.py me_provisional_hourly_oracle_gate.py
          python v98_pretrade_causal_atomic_planner.py
          python me_independent_source_gate.py --root ../../official-input
      - name: Run all 30 physical cells; reject with exit code 2 on failed economics
        working-directory: research/v98_independent
        run: |
          python me_30cell_causal_atomic.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --output me_30cell_training_receipt.json --ledger-output me_provisional_base_full_hourly.jsonl
      - name: Independent 17543-hour settlement oracle ONLY if economic training passed
        working-directory: research/v98_independent
        run: |
          python me_provisional_hourly_oracle_gate.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv --ledger-jsonl me_provisional_base_full_hourly.jsonl --receipt me_30cell_training_receipt.json --output me_independent_hourly_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-me-physical-${{ github.run_id }}
          path: |
            research/v98_independent/me_30cell_training_receipt.json
            research/v98_independent/me_provisional_base_full_hourly.jsonl
            research/v98_independent/me_independent_hourly_receipt.json
          retention-days: 30
          if-no-files-found: warn
