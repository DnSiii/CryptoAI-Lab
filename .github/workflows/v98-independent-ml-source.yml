name: V98 Independent ML Preregistered Source Gate
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-ml-source.yml'
      - 'research/v98_independent/ml_sources.py'
      - 'research/v98_independent/ml_independent_source_gate.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  ml-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Download immutable authenticated Clean4 training artifact 2022-2024 only
        uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - name: Independent full-hour source audit BEFORE economic PnL
        working-directory: research/v98_independent
        run: |
          python -m py_compile ml_sources.py ml_independent_source_gate.py
          python ml_sources.py
          python ml_independent_source_gate.py --root ../../official-input --output ml_source_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v98-ml-source-${{ github.run_id }}
          path: research/v98_independent/ml_source_receipt.json
          retention-days: 30
          if-no-files-found: warn
