name: V99 I1 free sample expiry-calendar bias audit (SOURCE ONLY)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_free_sample_calendar_bias.py
      - research/tests/test_v99_r106_i1_free_sample_calendar_bias.py
      - research/V99_R106_I1_FREE_SAMPLE_CALENDAR_BIAS_AUDIT_PREREG_20261029.md
      - .github/workflows/v99-r106-i1-free-sample-calendar-bias.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-calendar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert preregistration precedes audit implementation
        run: |
          git merge-base --is-ancestor 6c12e9ddc311e662fd59891d3c15788c4b35e206 HEAD
          test -s research/V99_R106_I1_FREE_SAMPLE_CALENDAR_BIAS_AUDIT_PREREG_20261029.md
      - name: Independently test original fixed TRAIN calendar (no market values)
        run: python -m unittest -v research.tests.test_v99_r106_i1_free_sample_calendar_bias
      - name: Run deterministic source-only calendar audit twice
        run: |
          python -m research.tools.v99_r106_i1_free_sample_calendar_bias > /tmp/v99_calendar_1.json
          python -m research.tools.v99_r106_i1_free_sample_calendar_bias > /tmp/v99_calendar_2.json
          cmp /tmp/v99_calendar_1.json /tmp/v99_calendar_2.json
          cp /tmp/v99_calendar_1.json v99_i1_free_sample_calendar_bias.json
      - name: Enforce no promotion and honest interpretation
        run: |
          python - <<'PY'
          import json
          r=json.load(open("v99_i1_free_sample_calendar_bias.json"))
          assert r["schema"]=="V99_I1_FREE_SAMPLE_MONTHLY_EXPIRY_CALENDAR_BIAS_V1"
          assert r["fixed_monday_decisions"]==90
          assert r["monthly_tenor_calendar_possible_mondays"]==21
          assert r["monthly_tenor_calendar_impossible_mondays"]==69
          assert r["both_negative_samples_calendar_ineligible"] is True
          assert r["historical_option_lifecycles_certified"]==0
          assert all(r[k] is False for k in (
              "historical_listings_authenticated", "historical_executable_books_authenticated",
              "economic_train_executed", "roi_calculated", "strategy_rules_modified",
              "validation_opened", "holdout_opened", "orders_enabled", "promotion_authorized"))
          print("CALENDAR BIAS VERIFIED; NO ECONOMIC TRIAL; NO PROMOTION")
          print("FIXED MONDAYS:",r["fixed_monday_decisions"],
                "MONTHLY CALENDAR POSSIBLE:",r["monthly_tenor_calendar_possible_mondays"])
          for s in r["samples"]:
              print("FREE SAMPLE",s["source_day"],"DECISION",s["decision_day"],
                    "NEXT MONTHLY DAYS",s["next_monthly_days"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-i1-source-calendar-bias-${{ github.run_id }}
          path: v99_i1_free_sample_calendar_bias.json
          if-no-files-found: error
          retention-days: 30
