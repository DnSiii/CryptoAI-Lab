name: V98 Independent Exact Funding Tick Import Contract (Synthetic Only)
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-exact-funding-import-contract.yml'
      - 'research/v98_independent/v98_exact_funding_event_ingest.py'
      - 'research/v98_independent/test_v98_exact_funding_event_ingest.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  strict-import-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: v98-independent-clean4-2022-2024-pinned-source
          run-id: 40064588623
          github-token: ${{ github.token }}
          path: official-input
      - uses: actions/download-artifact@v4
        with:
          name: v98-official-mark-envelope-40908310578
          run-id: 40908310578
          github-token: ${{ github.token }}
          path: envelope-input
      - name: Verify strict event import and tamper detection (NOT REAL EXACT FUNDING)
        working-directory: research/v98_independent
        run: |
          python -m py_compile v98_exact_funding_event_ingest.py test_v98_exact_funding_event_ingest.py
          python test_v98_exact_funding_event_ingest.py --root ../../official-input --envelope-csv ../../envelope-input/v98_official_mark_envelope_training.csv
