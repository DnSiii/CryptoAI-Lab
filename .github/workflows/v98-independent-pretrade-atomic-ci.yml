name: V98 Independent Pretrade Atomic Cash Funding Survival Tests
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - '.github/workflows/v98-independent-pretrade-atomic-ci.yml'
      - 'research/v98_independent/v98_pretrade_cash_funding_atomic_planner.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v98-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Pretrade no-hidden-leverage, close-first and signed funding reservation
        run: python research/v98_independent/v98_pretrade_cash_funding_atomic_planner.py
