name: V99 R106 C1 complete engine strict TRAIN gate
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_c1_core.py
      - research/tools/v99_r106_c1_accounting.py
      - research/tools/v99_r106_c1_train_gate.py
      - research/tests/test_v99_r106_c1_engine.py
      - .github/workflows/v99-r106-c1-complete-engine-train.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-one-shot-integrated-train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          test -s research/V99_R106_C1_TRAIN_ISOLATION_NOTE_20261016.md
          test -s research/V99_R106_C1_PRE_TRAIN_HANDOFF_20261016.md
          python -m unittest discover -s research/tests -p 'test_v99_r106_c1_engine.py' -v
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/canonical
          key: v99-r106-canonical-market
          restore-keys: |
            Linux-paper-v15-market-v1-
            Linux-paper-v13-market-
      - run: |
          test -s data/canonical/BTCUSDT_1h.csv
          test -s data/canonical/ETHUSDT_1h.csv
      - name: Reproduce complete C1 TRAIn economics byte-for-byte twice
        run: |
          python -m research.tools.v99_r106_c1_train_gate
          cp reports/candidate_v99_r106_c1_integrated_train.json /tmp/c1-first.json
          cp research_evidence/v99_r106_c1_severe.csv /tmp/c1-first.csv
          python -m research.tools.v99_r106_c1_train_gate
          cmp /tmp/c1-first.json reports/candidate_v99_r106_c1_integrated_train.json
          cmp /tmp/c1-first.csv research_evidence/v99_r106_c1_severe.csv
          python - <<'PY'
          import json
          r=json.load(open('/tmp/c1-first.json'))
          assert r['holdout_market_values_parsed'] is False and r['validation_market_values_parsed'] is False
          assert r['promotion_authorized'] is False and r['paper_publication_authorized'] is False
          assert r['economic_trials']==1 and r['preliminary_pre_funding'] is True
          print('FROZEN_C1',r['status'])
          print('SEVERE_FOLDS',r['severe']['fold_returns'])
          print('SUPERSEVERE_FOLDS',r['supersevere']['fold_returns'])
          print('FAILED', [k for k,v in r['gates'].items() if not v])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v99-r106-c1-engine-train-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            reports/candidate_v99_r106_c1_integrated_train.json
            research_evidence/v99_r106_c1_severe.csv
            research_evidence/v99_r106_c1_supersevere.csv
