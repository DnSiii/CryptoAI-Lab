name: V99 I1 original 91-week signal to fixed 90-week lifecycle handoff (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_fixed_train_handoff.py
      - research/tests/test_v99_r106_i1_fixed_train_handoff.py
      - .github/workflows/v99-r106-i1-fixed-train-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-source-economic-block:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ex-ante preregistration is an ancestor
        run: |
          git merge-base --is-ancestor 3719ec047fff58906685b0e05449c45d9450cf46 HEAD
          test -s research/V99_R106_I1_FIXED_90W_SIGNAL_TO_LIFECYCLE_HANDOFF_PREREG_20261027.md
      - name: Run ten adversarial integration tests; fixtures are NOT economics
        run: python -m unittest -v research.tests.test_v99_r106_i1_fixed_train_handoff
      - name: Restore archived ORIGINAL 182 signal decisions (not option books)
        run: |
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
      - name: Prove original 182 signals cannot bypass absent full original 661-day option archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.tools.v99_r106_i1_fixed_train_handoff import run
          from research.tools.v99_r106_i1_full_archive_intake import eligible
          p=Path('research_evidence/i1_original_causal/i1_causal_signal.json')
          s=json.loads(p.read_text())
          assert s['source_original'] is True and s['observations']==182
          assert len(eligible(False))==91 and len(eligible(True))==90
          root=Path('research_evidence/i1_missing_original_661_day_option_archive')
          assert not root.exists()
          try:
              run(str(p),str(root),'research_evidence/i1_fixed_handoff_result.json')
          except ValueError as exc:
              assert str(exc)=='BLOCKED_ORIGINAL_LIFECYCLE_ARCHIVE_MISSING',str(exc)
          else:
              raise AssertionError('ABSENT_LICENSED_SOURCE_FALSE_ECONOMIC_READINESS')
          print('ORIGINAL SIGNAL 182 -> FIXED 180; 2 RIGHT-CENSORED')
          print('BLOCKED_ORIGINAL_LIFECYCLE_ARCHIVE_MISSING; NO TRAIN, NO ROI, NO PROMOTION')
          PY
