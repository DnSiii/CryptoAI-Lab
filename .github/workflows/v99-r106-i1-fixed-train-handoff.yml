name: V99 I1 original 91-week signal to fixed 90-week lifecycle handoff (NO ORDERS)
on:
  push:
    branches: [research/v99-r106-native-all-regime-engine]
    paths:
      - research/tools/v99_r106_i1_fixed_train_handoff.py
      - research/tests/test_v99_r106_i1_fixed_train_handoff.py
      - .github/workflows/v99-r106-i1-fixed-train-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-source-economic-block:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ex-ante preregistration is an ancestor
        run: |
          git merge-base --is-ancestor 3719ec047fff58906685b0e05449c45d9450cf46 HEAD
          test -s research/V99_R106_I1_FIXED_90W_SIGNAL_TO_LIFECYCLE_HANDOFF_PREREG_20261027.md
      - name: Run ten adversarial integration tests; fixtures are NOT economics
        run: python -m unittest -v research.tests.test_v99_r106_i1_fixed_train_handoff
      - name: Restore archived ORIGINAL 182 signal decisions (not option books)
        run: |
          gh run download 40326586848 --repo "$GITHUB_REPOSITORY" \
            --name v99-i1-original-causal-signal-40326586848 \
            --dir research_evidence/i1_original_causal
      - name: Restore independently verified ORIGINAL TRAIN-only OKX spot receipts
        run: |
          gh run download 40019588739 --repo "$GITHUB_REPOSITORY" \
            --name d1-train-four-leg-backfill-40019588739 \
            --dir research_evidence/i1_original_okx
      - name: Restore independently verified ORIGINAL TRAIN-only Deribit DVOL receipts
        run: |
          gh run download 40072202459 --repo "$GITHUB_REPOSITORY" \
            --name v99-deribit-dvol-original-pit-train \
            --dir research_evidence/i1_original_dvol
      - name: Independently re-execute all 182 archived original signals from first-party receipts
        run: |
          python -m research.verification.independent_v99_r106_i1_causal_signal_oracle \
            research_evidence/i1_original_okx research_evidence/i1_original_dvol \
            research_evidence/i1_original_causal/i1_causal_signal.json
      - name: Falsify a forged signal that the structural handoff alone cannot detect
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.tools.v99_r106_e1_spot_engine import load_original_spot
          from research.tools.v99_r106_h1_dvol_spot_engine import load_original_dvol
          from research.verification.independent_v99_r106_i1_causal_signal_oracle import verify
          root=Path('research_evidence')
          signal_path=root/'i1_original_causal/i1_causal_signal.json'
          original=json.loads(signal_path.read_text())
          receipt=json.loads((signal_path.parent/'i1_causal_signal_independent_oracle.json').read_text())
          assert receipt['status']=='INDEPENDENT_ORIGINAL_T_MINUS_ONE_SIGNAL_MATCH'
          assert receipt['observations']==182 and receipt['tampered_report_rejected']
          assert receipt['future_price_mutation_invariant'] and receipt['prior_price_mutation_detected']
          prices=load_original_spot(root/'i1_original_okx')
          weekly=load_original_dvol(root/'i1_original_dvol')
          fake=json.loads(json.dumps(original))
          target=next(row for row in fake['rows'] if row['signal']=='NO_PREMIUM')
          target['signal']='POSITIVE_EX_ANTE_PREMIUM'
          try:
              verify(prices,weekly,fake)
          except AssertionError as exc:
              assert str(exc)=='FORGED_EX_ANTE_SIGNAL',str(exc)
          else:
              raise AssertionError('FORGED_SIGNAL_WOULD_PASS_ORIGINAL_SOURCE_ORACLE')
          print('ORIGINAL 182 SIGNALS REPLAYED; FORGED POSITIVE REJECTED; NO ECONOMICS')
          PY
      - name: Prove original 182 signals cannot bypass absent full original 661-day option archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.tools.v99_r106_i1_fixed_train_handoff import run
          from research.tools.v99_r106_i1_full_archive_intake import eligible
          p=Path('research_evidence/i1_original_causal/i1_causal_signal.json')
          s=json.loads(p.read_text())
          assert s['source_original'] is True and s['observations']==182
          assert len(eligible(False))==91 and len(eligible(True))==90
          root=Path('research_evidence/i1_missing_original_661_day_option_archive')
          assert not root.exists()
          try:
              run(str(p),str(root),'research_evidence/i1_fixed_handoff_result.json')
          except ValueError as exc:
              assert str(exc)=='BLOCKED_ORIGINAL_LIFECYCLE_ARCHIVE_MISSING',str(exc)
          else:
              raise AssertionError('ABSENT_LICENSED_SOURCE_FALSE_ECONOMIC_READINESS')
          print('ORIGINAL SIGNAL 182 -> FIXED 180; 2 RIGHT-CENSORED')
          print('BLOCKED_ORIGINAL_LIFECYCLE_ARCHIVE_MISSING; NO TRAIN, NO ROI, NO PROMOTION')
          PY
