name: V98 Independent Phase1170 AB Growth Metrics Synthetic
on:
  push:
    branches: [research/v98-independent-zero]
    paths:
      - 'research/v98_independent/phase1170_ab_growth_metrics.py'
      - 'research/v98_independent/test_phase1170_ab_growth_metrics.py'
      - '.github/workflows/v98-independent-phase1170-ab-metrics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab-metrics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Test AB daily economic metrics synthetic only
        run: python -m unittest discover -s research/v98_independent -p 'test_phase1170_ab_growth_metrics.py' -v
